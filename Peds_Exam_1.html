<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Static practice examination platform: study multiple-choice, select-all-that-apply and open-ended case questions from your course Word documents. No server, no accounts.">
<meta name="color-scheme" content="light dark">
<title>Practice Examination Platform</title>
<style>
/* ============================ design tokens ============================= */
:root {
  --paper: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --ink: #1c2430;
  --ink-soft: #4b5765;
  --ink-faint: #77808c;
  --line: #dfe3e8;
  --accent: #1f6f5c;
  --accent-soft: #e3f1ec;
  --accent-ink: #12463a;
  --ok: #1a7f4b;
  --ok-soft: #e5f4ea;
  --no: #b3261e;
  --no-soft: #fbeae9;
  --warn: #8a5a00;
  --warn-soft: #fff4d6;
  --info: #1f5c8a;
  --info-soft: #e7f0f8;
  --focus: #2f6fed;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 2px 8px rgba(16,24,40,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
html[data-theme="dark"] {
  --paper: #14181d;
  --surface: #1c2229;
  --surface-2: #232a32;
  --ink: #e8ecf1;
  --ink-soft: #b6c0cb;
  --ink-faint: #8b96a3;
  --line: #333c46;
  --accent: #58b89e;
  --accent-soft: #16302a;
  --accent-ink: #a9e2d1;
  --ok: #57c07f;
  --ok-soft: #14291c;
  --no: #e0837c;
  --no-soft: #331715;
  --warn: #d9a441;
  --warn-soft: #322610;
  --info: #7db4e0;
  --info-soft: #14222e;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font);
  font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* =============================== layout ================================= */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: .55rem 1rem;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; letter-spacing: .01em; }
.brand .icon { color: var(--accent); display: inline-flex; }
.topnav { display: flex; gap: .25rem; margin-left: auto; }
.topnav a {
  text-decoration: none; color: var(--ink-soft); font-weight: 600; font-size: .92rem;
  padding: .42rem .8rem; border-radius: 8px;
}
.topnav a:hover { background: var(--surface-2); color: var(--ink); }
.topnav a.active { background: var(--accent-soft); color: var(--accent-ink); }
.skip-link {
  position: absolute; left: -9999px; top: 0; background: var(--accent); color: #fff;
  padding: .5rem .9rem; border-radius: 0 0 8px 0; z-index: 100;
}
.skip-link:focus { left: 0; }
#main { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1rem 4rem; }
.view { animation: view-in .22s ease; }
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.view-head { margin-bottom: 1rem; }
.view-title { font-size: 1.55rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
.view-sub { margin: 0; color: var(--ink-soft); }

/* =============================== buttons ================================ */
.btn {
  display: inline-flex; align-items: center; gap: .45rem;
  border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  padding: .55rem 1rem; font-weight: 600; font-size: .95rem;
  background: var(--surface-2); color: var(--ink);
  transition: background .15s ease, box-shadow .15s ease, transform .05s ease;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.06); }
html[data-theme="dark"] .btn-primary { color: #08130f; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--no); color: #fff; }
.btn-small { padding: .35rem .7rem; font-size: .86rem; }
.btn-ok-active { background: var(--ok); color: #fff; }
.btn-no-active { background: var(--no); color: #fff; }
.icon { display: inline-flex; }

/* ============================== library ================================= */
.lib-controls { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.1rem; }
.search-wrap { position: relative; flex: 1 1 260px; max-width: 420px; }
.search-wrap .icon { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
.search-input { padding-left: 2.1rem !important; }
.text-input {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--ink); padding: .5rem .7rem; font: inherit;
}
.filter-chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: 999px; padding: .3rem .8rem; font-size: .85rem; font-weight: 600; cursor: pointer;
}
.chip:hover { background: var(--surface-2); }
.chip-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

.doc-group { margin-bottom: 1.6rem; }
.doc-group-title {
  font-size: 1.02rem; margin: 0 0 .6rem; color: var(--ink-soft);
  text-transform: none; letter-spacing: .01em;
  border-left: 4px solid var(--accent); padding-left: .55rem;
}
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .9rem; }
.set-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .95rem 1rem; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: .45rem;
}
.set-card[data-status="completed"] { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.set-card-top { display: flex; justify-content: space-between; gap: .6rem; align-items: flex-start; }
.set-title { font-size: 1.02rem; margin: 0; line-height: 1.35; }
.badge {
  flex: none; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  border-radius: 999px; padding: .18rem .55rem; white-space: nowrap;
}
.badge-untouched { background: var(--surface-2); color: var(--ink-faint); }
.badge-progress { background: var(--info-soft); color: var(--info); }
.badge-completed { background: var(--ok-soft); color: var(--ok); }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-review { background: var(--warn-soft); color: var(--warn); }
.set-meta { margin: 0; color: var(--ink-faint); font-size: .84rem; }
.set-desc {
  margin: 0; color: var(--ink-soft); font-size: .86rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pbar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.pbar-thin { height: 6px; flex: 1; }
.pbar-fill { height: 100%; background: var(--accent); transition: width .3s ease; }
.pbar-done { background: var(--ok); }
.set-nums { margin: 0; font-size: .86rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.set-actions { display: flex; gap: .5rem; margin-top: auto; padding-top: .3rem; }
.lib-note { color: var(--ink-faint); font-size: .84rem; margin-top: 1.4rem; }
.lib-empty { color: var(--ink-soft); padding: 1rem 0; }

.empty-state {
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 2rem 1.5rem; max-width: 640px; margin: 2rem auto; text-align: center;
}
.empty-state .icon { color: var(--accent); }
.empty-state .icon svg { width: 34px; height: 34px; }
.empty-steps { text-align: left; color: var(--ink-soft); font-size: .92rem; }
.empty-actions { display: flex; gap: .6rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }

.banner {
  display: flex; gap: .6rem; align-items: flex-start;
  border-radius: var(--radius); padding: .7rem .9rem; margin-bottom: 1rem; font-size: .92rem;
}
.banner p { margin: 0 0 .3rem; }
.banner-info { background: var(--info-soft); color: var(--info); }
.banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-ok { background: var(--ok-soft); color: var(--ok); }
.banner-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ================================ exam ================================== */
.exam-head { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.exam-head-left { display: flex; gap: .8rem; align-items: center; min-width: 0; }
.exam-titles { min-width: 0; }
.exam-doc { color: var(--ink-faint); font-size: .82rem; }
.exam-title { font-size: 1.15rem; margin: 0; line-height: 1.3; }
.exam-progress { display: flex; align-items: center; gap: .8rem; margin: .8rem 0 1rem; }
.exam-progress-text { font-size: .86rem; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.exam-body { display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: 1.2rem; align-items: start; }
.question-area { min-width: 0; }
.q-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 1rem;
}
.q-meta { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.q-number { font-weight: 700; font-size: .9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.q-srcnum { font-size: .78rem; color: var(--ink-faint); }
.type-badge {
  font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: .2rem .6rem;
}
.q-state-sub { font-size: .78rem; color: var(--info); font-weight: 600; }
.q-title { font-size: 1.05rem; margin: 0; }
.q-stem { font-size: 1.08rem; line-height: 1.62; }
.q-stem:focus { outline: none; }
.q-stem-p { margin: 0 0 .6rem; }
.q-stem-p:last-child { margin-bottom: 0; }

.q-img { margin: .2rem 0; }
.q-img-btn {
  position: relative; display: block; padding: 0; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface-2); cursor: zoom-in; overflow: hidden; max-width: 100%;
}
.q-img-el { display: block; max-width: 100%; height: auto; max-height: 420px; margin: 0 auto; }
.q-img-zoom {
  position: absolute; right: .45rem; bottom: .45rem; background: rgba(0,0,0,.55); color: #fff;
  border-radius: 6px; padding: .2rem .35rem; display: inline-flex;
}
.q-img-cap { font-size: .82rem; color: var(--ink-faint); margin-top: .35rem; }
.q-img-warn { font-size: .82rem; color: var(--warn); margin-top: .2rem; }
.q-img-missing { font-size: .9rem; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: .6rem .8rem; }

.opts { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .55rem; }
.opts-legend { font-weight: 600; font-size: .9rem; color: var(--ink-soft); padding: 0; margin-bottom: .35rem; }
.opt {
  display: flex; gap: .7rem; align-items: flex-start; position: relative;
  border: 1.5px solid var(--line); border-radius: 9px; padding: .7rem .85rem;
  background: var(--surface); cursor: pointer; transition: border-color .12s ease, background .12s ease;
}
.opt:hover { border-color: var(--accent); }
.opt input { margin: .22rem 0 0; accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.opt-key {
  flex: none; width: 1.6rem; height: 1.6rem; border-radius: 6px; background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem; color: var(--ink-soft); margin-top: .05rem;
}
.opt-text { flex: 1; min-width: 0; }
.opt-selected { border-color: var(--accent); background: var(--accent-soft); }
.opt-selected .opt-key { background: var(--accent); color: #fff; }
html[data-theme="dark"] .opt-selected .opt-key { color: #08130f; }
.opt-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt-incorrect { border-color: var(--no); background: var(--no-soft); }
.opt[disabled], .opt input:disabled { cursor: default; }
.opt:has(input:disabled) { cursor: default; }
.opt-mark { display: flex; gap: .35rem; align-items: center; font-size: .8rem; font-weight: 700; width: 100%; margin-top: .3rem; }
.opt { flex-wrap: wrap; }
.opt-mark-ok { color: var(--ok); }
.opt-mark-no { color: var(--no); }
.opt-mark-key { color: var(--ok); }

.q-actions { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
.q-actions-hint { font-size: .84rem; color: var(--ink-faint); }

.verdict {
  display: flex; gap: .7rem; align-items: flex-start; border-radius: 9px;
  padding: .8rem 1rem; font-weight: 600;
}
.verdict:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.verdict .icon { margin-top: .15rem; }
.verdict-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.verdict-no { background: var(--no-soft); color: var(--no); border: 1px solid color-mix(in srgb, var(--no) 40%, transparent); }
.verdict-open { background: var(--info-soft); color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 40%, transparent); }
.verdict-line { margin: 0; font-size: 1.02rem; }
.verdict-detail { margin: .15rem 0 0; font-weight: 500; font-size: .9rem; }

.rat-head { font-size: .95rem; margin: .3rem 0 0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.rat-list { display: flex; flex-direction: column; gap: .6rem; }
.rat-item {
  border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px;
  background: var(--surface-2); padding: .7rem .9rem;
}
.rat-item.reveal { animation: reveal-in .38s ease backwards; }
@keyframes reveal-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rat-item-head { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .25rem; }
.rat-key { font-weight: 800; font-size: .85rem; width: 1.5rem; height: 1.5rem; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
.rat-key-ok { background: var(--ok); color: #fff; }
.rat-key-no { background: var(--surface); color: var(--ink-faint); border: 1px solid var(--line); }
.rat-verdict { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.rat-verdict-ok { color: var(--ok); }
.rat-verdict-no { color: var(--ink-faint); }
.rat-picked { font-size: .76rem; font-weight: 700; background: var(--info-soft); color: var(--info); border-radius: 999px; padding: .1rem .5rem; }
.rat-opt-text { margin: 0 0 .3rem; font-weight: 600; font-size: .93rem; }
.rat-text { margin: 0; font-size: .92rem; color: var(--ink-soft); }
.rat-note { font-size: .9rem; color: var(--ink-soft); background: var(--surface-2); border-radius: 8px; padding: .5rem .7rem; margin: .2rem 0; }

.src-map { border: 1px solid var(--line); border-radius: 8px; padding: .45rem .8rem; background: var(--surface-2); }
.src-map summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--ink-soft); }
.src-map-text { margin: .4rem 0 .2rem; font-size: .86rem; color: var(--ink-faint); }

.open-note-label { display: block; font-size: .88rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .35rem; }
.open-note { min-height: 70px; resize: vertical; }
.self-grade { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.self-grade-label { font-size: .9rem; font-weight: 600; color: var(--ink-soft); margin-right: .2rem; }
.open-answer { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: .9rem 1rem; }
.open-line { margin: 0 0 .45rem; font-size: .95rem; }
.open-sub { margin: .7rem 0 .35rem; font-size: .95rem; color: var(--accent-ink); }
.open-bullet { padding-left: 1.1rem; position: relative; }
.open-bullet::before { content: ""; }

.q-nav { display: flex; justify-content: space-between; gap: .8rem; align-items: center; border-top: 1px solid var(--line); padding-top: .9rem; }
.q-nav-mid { flex: 1; display: flex; justify-content: center; }

/* question navigator drawer */
.qnav-drawer {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .8rem .9rem; position: sticky; top: 64px; max-height: calc(100vh - 90px); overflow: auto;
}
.qnav-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.qnav-title { font-size: .95rem; margin: 0; }
.qnav-legend { display: flex; gap: .55rem; flex-wrap: wrap; font-size: .72rem; color: var(--ink-faint); margin: .3rem 0 .6rem; }
.qnav-legend-item { display: inline-flex; gap: .25rem; align-items: center; }
.qnav-dot { width: .65rem; height: .65rem; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
.qnav-dot-un { background: var(--surface-2); }
.qnav-dot-ok { background: var(--ok); border-color: var(--ok); }
.qnav-dot-no { background: var(--no); border-color: var(--no); }
.qnav-dot-rv { background: var(--info); border-color: var(--info); }
.qnav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: .35rem; }
.qnav-btn {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
  border-radius: 7px; padding: .3rem 0; font-size: .82rem; font-weight: 700; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.qnav-btn:hover { border-color: var(--accent); color: var(--ink); }
.qnav-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.qnav-no { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.qnav-rv { background: var(--info-soft); border-color: var(--info); color: var(--info); }
.qnav-current { outline: 2.5px solid var(--focus); outline-offset: 1px; }
.qnav-foot { margin-top: .8rem; border-top: 1px solid var(--line); padding-top: .6rem; }

/* =============================== import ================================= */
.steps { display: flex; gap: 1.4rem; list-style: none; padding: 0; margin: 0 0 1.2rem; }
.step { display: flex; gap: .5rem; align-items: center; color: var(--ink-faint); font-weight: 600; font-size: .92rem; }
.step-num {
  width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center; font-size: .85rem; border: 1px solid var(--line);
}
.step-active { color: var(--ink); }
.step-active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step-done .step-num { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

.dropzone {
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 2.2rem 1rem; text-align: center; color: var(--ink-soft); cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.dropzone:hover, .drop-hover { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .icon svg { width: 30px; height: 30px; color: var(--accent); }
.drop-main { font-weight: 700; margin: .4rem 0 .1rem; color: var(--ink); }
.drop-sub { margin: 0 0 .7rem; color: var(--ink-faint); font-size: .9rem; }
.import-files { list-style: none; padding: 0; margin: .9rem 0 0; display: flex; flex-direction: column; gap: .35rem; }
.import-file { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; padding: .45rem .7rem; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.import-file-error { border-color: var(--no); background: var(--no-soft); }
.import-file-status { color: var(--ink-faint); }
.import-file-error .import-file-status { color: var(--no); }

.step-title { font-size: 1.15rem; margin: 1.4rem 0 .6rem; }
.set-panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: .7rem; }
.set-panel-review { border-color: var(--warn); }
.set-panel-sum {
  display: flex; gap: .7rem; align-items: center; cursor: pointer; padding: .7rem .9rem; flex-wrap: wrap;
}
.set-panel-count { color: var(--ink-faint); font-size: .86rem; }
.set-panel-titlelab { display: block; padding: 0 .9rem .5rem; font-size: .85rem; color: var(--ink-soft); font-weight: 600; }
.set-panel-titlelab .text-input { margin-top: .25rem; }
.set-panel-note { padding: 0 .9rem .5rem; margin: 0; font-size: .84rem; color: var(--warn); }
.set-panel-issues { margin: .2rem 0 .4rem; padding: 0 .9rem; font-size: .9rem; color: var(--warn); }
.set-panel-ok { padding: 0 .9rem .8rem; margin: 0; font-size: .88rem; color: var(--ok); }
.q-edit { border-top: 1px dashed var(--line); margin: 0 .9rem .6rem; padding: .6rem 0 .2rem; }
.q-edit-head { display: flex; gap: .6rem; align-items: baseline; }
.q-edit-num { font-weight: 800; font-size: .88rem; }
.q-edit-issues { color: var(--no); font-size: .8rem; font-weight: 600; }
.q-edit-stem { margin: .2rem 0 .5rem; font-size: .88rem; color: var(--ink-soft); }
.q-edit-row { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; padding-bottom: .5rem; }
.q-edit-lab { font-size: .86rem; font-weight: 600; color: var(--ink-soft); display: inline-flex; gap: .4rem; align-items: center; }
.q-edit-lab select { width: auto; }
.q-edit-key { display: inline-flex; gap: .3rem; align-items: center; font-size: .88rem; border: 1px solid var(--line); border-radius: 6px; padding: .15rem .45rem; cursor: pointer; }
.dup-box { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius); padding: .8rem 1rem; margin: 1rem 0; }
.dup-box h3 { margin: 0 0 .3rem; font-size: 1rem; }
.dup-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
.dup-name { font-weight: 700; font-size: .9rem; flex: 1 1 200px; }
.dup-opt { display: inline-flex; gap: .35rem; align-items: center; font-size: .88rem; cursor: pointer; }
.import-actions { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
.ack-label { display: flex; gap: .5rem; align-items: center; font-size: .9rem; color: var(--warn); max-width: 480px; cursor: pointer; }
.publish-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; }
.publish-steps { margin: .5rem 0 1rem; padding-left: 1.2rem; color: var(--ink-soft); font-size: .94rem; }
.publish-actions { display: flex; gap: .7rem; flex-wrap: wrap; }

/* ============================== settings ================================ */
.settings-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.2rem; margin-bottom: 1rem; box-shadow: var(--shadow);
}
.settings-card h2 { font-size: 1.08rem; margin: 0 0 .6rem; }
.settings-list { margin: 0 0 .7rem; padding-left: 1.1rem; color: var(--ink-soft); font-size: .92rem; }
.settings-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
.settings-lab { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-soft); }
.settings-lab select { width: auto; margin-top: .3rem; }

/* ========================== modal / toast / etc ========================= */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10, 14, 18, .5); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  animation: view-in .15s ease;
}
.modal {
  background: var(--surface); color: var(--ink); border-radius: 12px; max-width: 520px; width: 100%;
  padding: 1.2rem 1.3rem; box-shadow: 0 12px 40px rgba(0,0,0,.25);
}
.modal-title { margin: 0 0 .6rem; font-size: 1.12rem; }
.modal-body p { margin: 0 0 .5rem; color: var(--ink-soft); font-size: .95rem; }
.modal-require { display: block; margin: .6rem 0 0; font-size: .9rem; color: var(--ink-soft); }
.modal-require .text-input { margin-top: .3rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.1rem; }

.toast-host { position: fixed; bottom: 1rem; right: 1rem; z-index: 120; display: flex; flex-direction: column; gap: .5rem; max-width: min(420px, 90vw); }
.toast {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-left: 5px solid var(--info);
  border-radius: 9px; padding: .7rem .95rem; font-size: .92rem; box-shadow: var(--shadow);
  animation: view-in .2s ease;
}
.toast-warn { border-left-color: var(--warn); }
.toast-error { border-left-color: var(--no); }
.toast-out { opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease; }

.lightbox-overlay {
  position: fixed; inset: 0; z-index: 110; background: rgba(8, 10, 13, .88);
  display: flex; align-items: center; justify-content: center; padding: 2rem;
}
.lightbox-fig { margin: 0; max-width: 94vw; max-height: 88vh; display: flex; flex-direction: column; gap: .6rem; }
.lightbox-img { max-width: 94vw; max-height: 78vh; width: auto; height: auto; border-radius: 8px; background: #fff; }
.lightbox-cap { color: #dfe5ea; font-size: .88rem; text-align: center; }
.lightbox-close { position: absolute; top: 1rem; right: 1rem; }

/* ============================ responsive ================================ */
@media (max-width: 900px) {
  .exam-body { grid-template-columns: 1fr; }
  .qnav-drawer {
    position: static; max-height: none; display: none;
  }
  .qnav-drawer.qnav-open { display: block; }
  .qnav-grid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
}
@media (min-width: 901px) {
  .qnav-drawer { display: block !important; }
}
@media (max-width: 560px) {
  .topbar-inner { padding: .5rem .7rem; }
  #main { padding: 1rem .7rem 3rem; }
  .q-card { padding: 1rem .9rem; }
  .steps { gap: .8rem; }
}

/* ========================= reduced motion =============================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}
