A 16-year-old adolescent with moderate major depressive disorder is referred for Interpersonal Psychotherapy for Adolescents (IPT-A). What is the primary theoretical focus of IPT-A in the treatment of depression?
Choose the correct focus:
A. Uncovering unconscious conflicts and defense mechanisms from early childhood
B. Identifying and restructuring irrational thoughts and cognitive distortions
C. Addressing interpersonal problems and relationships that contribute to or result from depressed mood
D. Using graded exposure to overcome avoidance behaviors and phobias
 
 
 
Correct answer: C. Addressing interpersonal problems and relationships that contribute to or result from depressed mood
Rationale: Interpersonal Psychotherapy (IPT-A) is based on the theory that depression occurs in an interpersonal context. It targets interpersonal problems (e.g., grief, role disputes, role transitions, interpersonal deficits) that contribute to or result from the depressed mood, typically involving primary guardians in the treatment.
Why the other options are less appropriate:
●	A. Uncovering unconscious conflicts is the focus of psychoanalytic/psychodynamic therapy.
●	B. Identifying and restructuring irrational thoughts is the core component of Cognitive Behavioral Therapy (CBT).
●	C. Graded exposure is a behavioral technique used primarily in CBT for anxiety disorders and OCD.
Exam takeaway: IPT-A focuses on interpersonal relationships and social context; CBT focuses on cognitive restructuring and behavior.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Interpersonal Psychotherapy for Adolescents (IPT-A)).

Question 100
During a well-child visit, a mother expresses a vague but persistent concern that her 14-month-old infant "just doesn't seem to take notice of things" the way her older child did at the same age. The infant otherwise appears healthy and is meeting gross motor milestones. According to fundamental principles of developmental surveillance, what is the most appropriate response by the FNP?
Select the appropriate response:
A. Reassure the mother that children develop at different rates and wait for the 18-month visit
B. Take the caregiver's suspicion seriously and investigate appropriately with hearing and developmental screens
C. Explain that gross motor development is more important than social or language development at this age
D. Order an MRI of the brain to rule out structural neurologic anomalies immediately
 
 
 
Correct answer: B. Take the caregiver's suspicion seriously and investigate appropriately with hearing and developmental screens
Rationale: A fundamental principle of developmental surveillance is that a caregiver's suspicion that their child is not seeing, hearing, or taking notice like other children must be taken very seriously and investigated promptly. Standardized hearing and developmental screenings are the appropriate next steps.
Why the other options are less appropriate:
●	A. "Wait and see" is inappropriate when a parent raises a specific concern regarding hearing or social engagement.
●	B. All developmental domains (gross/fine motor, language, social/cognitive) are equally critical, and delays in one require investigation.
●	C. An MRI is an invasive, expensive, and premature step; the initial workup involves audiology and standardized developmental screening.
Exam takeaway: Always listen to caregiver concerns regarding developmental or sensory delays; investigate promptly with appropriate screening and referrals.
Source origin: 2 Growth and development Part 2.pdf, Page 3 (Most Important: Caregiver's suspicion).



Pediatric Primary Care Examination Review (Questions 1–50)

Question 1
A 7-year-old boy is brought to the clinic by his parents due to extreme distractibility, poor impulse control, and difficulty sitting still. These behaviors occur at home and school and have been present since age 5. The FNP suspects Attention-Deficit/Hyperactivity Disorder (ADHD).
Which condition must be met to formally apply the DSM-5-TR diagnostic criteria for ADHD?
A. Symptoms must be present in at least two different settings.
B. Symptoms must have emerged after the start of formal schooling.
C. The child must have a documented learning disability.
D. The Vanderbilt rating scale must yield a positive diagnostic score.
 
















 
Correct answer: A. Symptoms must be present in at least two different settings.
Rationale: DSM-5-TR criteria for ADHD require that several symptoms be present in two or more settings (e.g., home, school, social settings) and that there is clear evidence of functional impairment.
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. Symptoms must be present before age 12, but they do not have to emerge specifically after formal schooling begins; they often present earlier.
●	C. A learning disability is a common comorbidity and mimic, but it is not a diagnostic requirement for ADHD.
●	D. Rating scales (like the Vanderbilt) support the diagnosis by quantifying symptoms across settings, but they do not independently diagnose ADHD.
Exam takeaway: ADHD is a clinical diagnosis requiring symptom presence and functional impairment across multiple settings (e.g., home and school) before age 12.
Source origin: Attention Deficit Hyperactivity Disorder, Slides 8 & 10, "Diagnosis: DSM-5-TR Framework" and "Rating Scales".

Question 2
A 5-year-old girl is diagnosed with ADHD. Her symptoms are causing moderate functional impairment at home and in her preschool classroom.
According to American Academy of Pediatrics (AAP) guidelines, what is the recommended first-line treatment for this patient?
A. Methylphenidate immediate-release
B. Mixed amphetamine salts
C. Parent training in behavior management (PTBM)
D. Extended-release guanfacine
 
 
 
Correct answer: C. Parent training in behavior management (PTBM)
Rationale: For preschool-aged children (ages 4 to <6 years), the AAP recommends evidence-based parent training in behavior management (PTBM) and/or behavioral classroom interventions as the first-line treatment for ADHD.
Why the other options are less appropriate:
●	A. Methylphenidate may be considered for this age group only if behavioral interventions are insufficient and the impairment is persistent and moderate-to-severe.
●	B. Amphetamine-based stimulants are generally not considered first-line for preschool-aged children.
●	D. Nonstimulants like guanfacine are not first-line treatments for preschool-aged children with ADHD.
Exam takeaway: Behavioral interventions (PTBM) are the first-line treatment for ADHD in children aged 4 to under 6 years.
Source origin: Attention Deficit Hyperactivity Disorder, Slide 14, "Treatment by Age: AAP Framework".

Question 3
An 8-year-old boy is starting a stimulant medication for ADHD. His mother asks if he needs an electrocardiogram (EKG) before taking the first dose. His personal medical history is unremarkable.
Which family history finding would explicitly warrant a baseline EKG prior to stimulant initiation?
A. A maternal grandmother diagnosed with hypertension at age 60.
B. A paternal uncle who experienced an unexplained sudden death at age 35.
C. A father with a history of generalized anxiety disorder.
D. A maternal grandfather who required a coronary artery bypass graft at age 70.
 
 
 
Correct answer: B. A paternal uncle who experienced an unexplained sudden death at age 35.
Rationale: A baseline EKG is recommended before starting stimulant medications only for individuals with a positive personal cardiac history or a family history of unexplained death or myocardial infarction before age 50.
Why the other options are less appropriate:
●	A. Hypertension diagnosed at age 60 does not meet the criteria for pre-stimulant EKG screening.
●	B. This is the correct answer.
●	C. A family history of anxiety does not warrant cardiac screening.
●	D. Coronary disease requiring surgery at age 70 is outside the <50 years age threshold for high-risk cardiac screening.
Exam takeaway: Routine EKGs are not required before starting ADHD stimulants unless there is a personal cardiac history or a family history of sudden, unexplained cardiac death before age 50.
Source origin: Attention Deficit Hyperactivity Disorder, Slide 21, "Stimulant Monitoring & Adverse Effects".

Question 4
A 20-month-old child presents for a well-child visit. The parents report the child uses 5 single words, points to share interest, maintains good eye contact, and responds to his name. He has a history of recurrent otitis media.
What is the most appropriate next step in management?
A. Reassure the parents that boys frequently talk later than girls.
B. Perform an M-CHAT to definitively diagnose Autism Spectrum Disorder.
C. Order a formal hearing test and refer for an early intervention speech evaluation.
D. Wait until the 24-month visit to assess for expressive language progression.
 
 
 
Correct answer: C. Order a formal hearing test and refer for an early intervention speech evaluation.
Rationale: Using only 5 words at 20 months is an expressive language delay. Given the history of recurrent otitis media, hearing loss must be ruled out. Early intervention should be initiated promptly rather than using a "wait and see" approach.
Why the other options are less appropriate:
●	A. "Wait and see" or brushing off language delays based on gender is not appropriate care.
●	B. While an M-CHAT is indicated at 18 and 24 months, his intact joint attention and eye contact make ASD less strongly suspected here; furthermore, screening tools do not definitively diagnose ASD.
●	C. This is the correct answer.
●	D. Delaying intervention until the 2-year well-visit misses a critical window for early developmental support.
Exam takeaway: Expressive language delay coupled with recurrent otitis media requires immediate formal hearing evaluation and referral to early intervention/SLP.
Source origin: Atypical Development Cases, Slides 2-3, "Case 1: Expressive Language Delay or More?".

Question 5
An 18-month-old child presents for a well-child visit. The parents report the child rarely points, does not consistently respond to their name, and becomes highly distressed by minor routine changes. The FNP administers the M-CHAT, which indicates high risk.
What is the most appropriate management?
A. Refer immediately to Early Intervention and arrange a comprehensive ASD evaluation.
B. Wait for a definitive Autism Spectrum Disorder diagnosis before referring to Early Intervention.
C. Reassure the parents that toddlers frequently exhibit rigid behaviors and re-screen at 24 months.
D. Order a serum lead level as the primary diagnostic test for the child's behaviors.
 
 
 
Correct answer: A. Refer immediately to Early Intervention and arrange a comprehensive ASD evaluation.
Rationale: Deficits in social communication, limited pointing, and rigidity are red flags for ASD. The child should be referred for a comprehensive diagnostic evaluation and to Early Intervention immediately; services should not wait for a final diagnosis.
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. Waiting for a definitive diagnosis delays critical early intervention therapies.
●	C. Reassurance is inappropriate given the presence of established developmental red flags.
●	D. While a lead test may be part of routine care, it does not evaluate or explain the core social communication deficits raising suspicion for ASD.
Exam takeaway: Do not wait for a definitive ASD diagnosis to initiate Early Intervention services when developmental red flags are present.
Source origin: Atypical Development Cases, Slides 4-5, "Case 2: Social Communication Red Flags".

Question 6
A 3-year-old boy presents to the clinic. His mother reports he did not walk until 20 months, currently falls frequently, and struggles to climb stairs. On examination, he uses his hands to "climb up" his thighs to stand, and his calves appear hypertrophied.
Which initial laboratory test is most appropriate?
A. Complete Blood Count (CBC)
B. Thyroid Stimulating Hormone (TSH)
C. Serum Creatine Kinase (CK)
D. Basic Metabolic Panel (BMP)
 
 
 
Correct answer: C. Serum Creatine Kinase (CK)
Rationale: The child is demonstrating Gowers maneuver, calf hypertrophy, and proximal muscle weakness, which strongly suggest a dystrophinopathy (like Duchenne muscular dystrophy). A markedly elevated serum creatine kinase (CK) supports this diagnosis and warrants prompt neurology referral.
Why the other options are less appropriate:
●	A. A CBC will not evaluate for intrinsic muscle breakdown.
●	B. TSH evaluates thyroid function, which does not present primarily with Gowers sign and calf hypertrophy.
●	C. This is the correct answer.
●	D. A BMP assesses electrolytes and renal function, not skeletal muscle breakdown.
Exam takeaway: Motor delay, progressive weakness, Gowers maneuver, and calf hypertrophy strongly suggest muscular dystrophy, necessitating a serum CK level and pediatric neurology referral.
Source origin: Atypical Development Cases, Slides 6-7, "Case 3: 'Late Walker' or Neuromuscular Disease?".

Question 7
A 2-year-old child living in a home built in 1950 has a confirmed venous blood lead level (BLL) of 22 µg/dL. The child is asymptomatic.
According to CDC and AAP guidelines, what is the most appropriate management?
A. Initiate immediate outpatient oral chelation therapy.
B. Admit the child to the hospital for intravenous chelation therapy.
C. Complete a history and physical, assess iron status, and arrange environmental lead-hazard reduction.
D. Repeat the capillary lead screen in 12 months.
 
 
 
Correct answer: C. Complete a history and physical, assess iron status, and arrange environmental lead-hazard reduction.
Rationale: For a venous BLL of 20–44 µg/dL, management includes detailed physical assessment, optimizing iron and calcium intake, and arranging environmental investigation to remove the source. Chelation is not routinely recommended for levels <45 µg/dL.
Why the other options are less appropriate:
●	A. Chelation is not routinely recommended for BLLs in the 20–44 µg/dL range.
●	B. Hospitalization and urgent chelation are indicated for levels ≥45 µg/dL.
●	C. This is the correct answer.
●	D. An elevated venous BLL requires prompt intervention and follow-up (every 2 weeks to 1 month initially), not a 12-month delay.
Exam takeaway: Chelation therapy is generally reserved for pediatric blood lead levels ≥45 µg/dL; lower elevated levels are managed with environmental source control and nutritional support (iron/calcium).
Source origin: Growth and Development (Toddler-School Age), Slides 8-9, "Pediatric Lead Exposure: Management by Confirmed Venous BLL".

Question 8
At a 4-month well-child visit, the FNP is assessing a healthy infant's gross motor development. Based on expected cephalocaudal developmental patterns, which milestone should this infant consistently demonstrate?
Select the correct milestone:
A. Sitting independently in a tripod position
B. Rolling from front to back using arms
C. Crawling on hands and knees
D. Pulling up to a standing position
 
 
 
Correct answer: B. Rolling from front to back using arms
Rationale: Development progresses in a cephalocaudal (head-to-toe) direction. At 4 months, infants typically learn to roll over from front to back. Sitting occurs around 6 months, crawling around 9 months, and pulling to stand around 9 months.
Why the other options are less appropriate:
●	A. Sitting independently typically develops around 6 months of age.
●	B. This is the correct answer.
●	C. Crawling typically develops around 9 months of age.
●	D. Pulling to a stand (cruising) typically develops around 9 months of age.
Exam takeaway: A 4-month-old infant should be able to roll from front to back as part of normal gross motor progression.
Source origin: Assessing Growth and Development, Slides 6 & 31, "Pattern: Gross" and "Tips for remembering milestones".

Question 9
The FNP is examining a 2-day-old neonate who was delivered via vacuum extraction. There is a firm, fluctuant swelling over the right parietal bone that does not cross the sagittal suture line. The overlying skin appears normal.
What is the most likely diagnosis?
A. Caput succedaneum
B. Cephalohematoma
C. Subgaleal hemorrhage
D. Craniosynostosis
 
 
 
Correct answer: B. Cephalohematoma
Rationale: A cephalohematoma is a subperiosteal collection of blood that does not cross the suture lines. It is often associated with instrumental deliveries and appears as a firm, fluctuant swelling.
Why the other options are less appropriate:
●	A. Caput succedaneum is a superficial, boggy swelling of the scalp that does cross suture lines.
●	B. This is the correct answer.
●	C. A subgaleal hemorrhage is a dangerous, highly fluctuant mass that freely crosses suture lines and can cause systemic shock.
●	D. Craniosynostosis is the premature fusion of cranial sutures, presenting as abnormal head shape, not a fluctuant swelling.
Exam takeaway: Cephalohematomas are subperiosteal bleeds that do not cross cranial suture lines, differentiating them from caput succedaneum.
Source origin: Common Findings Neonatal/Infant period, Slide 31, "What is the difference? Caput Succedaneum and Cephalohematoma".

Question 10
During a newborn examination, the FNP notes a bluish, non-blanching discoloration on the infant's hands and feet. The infant's face and trunk are pink, and vital signs are normal.
This finding is most consistent with:
A. Central cyanosis
B. Acrocyanosis
C. Cold panniculitis
D. Transient neonatal pustular melanosis
 
 
 
Correct answer: B. Acrocyanosis
Rationale: Acrocyanosis is a benign, peripheral cyanosis of the hands and feet common in the first few hours to days of life due to immature blood vessels. It usually resolves spontaneously in 24-48 hours.
Why the other options are less appropriate:
●	A. Central cyanosis affects the core and mucous membranes and is a sign of hypoxia or congenital heart disease.
●	B. This is the correct answer.
●	C. Cold panniculitis is an inflammatory reaction of subcutaneous fat to cold exposure, not diffuse peripheral cyanosis.
●	D. Transient neonatal pustular melanosis presents as tiny pustules that leave hyperpigmented macules, not cyanosis.
Exam takeaway: Acrocyanosis is a benign, self-limiting bluish discoloration of the hands and feet common in healthy newborns.
Source origin: Common Findings Neonatal/Infant period, Slide 73, "Acrocyanosis".

Question 11
A 6-week-old formula-fed infant presents with increased fussiness and loose stools containing streaks of blood. The infant is afebrile and gaining weight normally. The physical exam is unremarkable except for mild perianal erythema.
What is the most likely diagnosis?
A. Viral gastroenteritis
B. Cow's milk protein sensitivity (Non-IgE mediated)
C. Intussusception
D. Necrotizing enterocolitis
 
 
 
Correct answer: B. Cow's milk protein sensitivity (Non-IgE mediated)
Rationale: Blood or mucus in the stool of an otherwise well, growing infant is a classic presentation of cow's milk protein allergy/sensitivity. It is treated by switching to an extensively hydrolyzed formula (eHF).
Why the other options are less appropriate:
●	A. Viral gastroenteritis typically presents with watery diarrhea and vomiting, and rarely isolated bloody streaks in an otherwise well infant.
●	B. This is the correct answer.
●	C. Intussusception presents with sudden, severe, episodic abdominal pain and "currant jelly" stools, usually in slightly older infants.
●	D. Necrotizing enterocolitis is a life-threatening emergency typically seen in premature, ill neonates, presenting with severe distention and toxicity.
Exam takeaway: Blood in the stool of an otherwise healthy, growing infant is highly suspicious for cow's milk protein sensitivity.
Source origin: Common Findings Neonatal/Infant period, Slide 92, "Cow's Milk Protein Sensitivity".

Question 12
A 9-month-old infant weighing 10 kg presents with acute watery diarrhea. The infant has had 4 wet diapers today, has normal tears, and capillary refill is less than 2 seconds. The FNP recommends oral rehydration therapy (ORT).
What is the most appropriate instruction for the parents?
A. Offer 500 mL of apple juice over the next 2 hours.
B. Give 50 to 100 mL/kg of a commercial oral rehydration solution rapidly via bottle.
C. Give 5 mL (1 tsp) of a commercial oral rehydration solution every 1 to 5 minutes by syringe or spoon.
D. Withhold breastfeeding until the diarrhea completely resolves.
 
 
 
Correct answer: C. Give 5 mL (1 tsp) of a commercial oral rehydration solution every 1 to 5 minutes by syringe or spoon.
Rationale: For mild-to-moderate dehydration, ORT works best when given in small, frequent amounts (e.g., 5 mL every few minutes) to prevent vomiting and ensure absorption.
Why the other options are less appropriate:
●	A. Plain water, soda, and undiluted juice should be avoided as they can worsen osmotic diarrhea.
●	B. Giving large amounts rapidly via a bottle often induces vomiting and limits successful rehydration.
●	C. This is the correct answer.
●	D. Breastfeeding should continue without interruption during oral rehydration therapy.
Exam takeaway: Oral rehydration therapy is most effective when administered in very small, frequent volumes (e.g., 5 mL every 1-5 minutes) rather than large boluses.
Source origin: Common Findings Neonatal/Infant period, Slide 91, "Oral Rehydration Therapy (ORT) — Infants".

Question 13
An FNP is performing a physical exam on a 2-month-old infant. To assess the presence of developmental dysplasia of the hip (DDH), which clinical maneuver is most appropriate at this age?
Select the correct clinical maneuver:
A. Galeazzi sign
B. Ortolani maneuver
C. Trendelenburg test
D. Forward bend test
 
 
 
Correct answer: B. Ortolani maneuver
Rationale: The Ortolani (and Barlow) maneuvers are the standard tests used to evaluate hip stability and detect DDH in infants under 3 months of age.
Why the other options are less appropriate:
●	A. The Galeazzi sign (uneven knee heights) is more reliable for detecting unilateral DDH in infants older than 3 months.
●	B. This is the correct answer.
●	C. The Trendelenburg test evaluates pelvic tilt and hip abductor strength in walking-aged children.
●	D. The forward bend test (Adams test) evaluates for scoliosis in older children and adolescents.
Exam takeaway: The Ortolani and Barlow maneuvers are used to assess for hip dysplasia in infants under 3 months of age.
Source origin: Common Findings Neonatal/Infant period, Slide 44-46, "Developmental Dysplasia of the Hip" and "Ortolani Test".

Question 14
A 3-week-old infant presents with multiple erythematous papules and pustules on the cheeks and forehead. There are no comedones. The infant is afebrile and feeding well.
What is the most appropriate FNP management?
A. Prescribe a topical retinoid and benzoyl peroxide wash.
B. Reassure the parents that this is a normal variant that will resolve spontaneously.
C. Perform a viral swab to rule out neonatal Herpes Simplex Virus.
D. Advise the parents to vigorously scrub the lesions with soap and water daily.
 
 
 
Correct answer: B. Reassure the parents that this is a normal variant that will resolve spontaneously.
Rationale: The presentation describes neonatal acne, an inflammatory papulopustular eruption without comedones caused by maternal androgens. It is benign, self-limiting, and requires no medical treatment.
Why the other options are less appropriate:
●	A. Topical acne medications are irritating and contraindicated for benign neonatal acne.
●	B. This is the correct answer.
●	C. HSV presents with grouped vesicles on an erythematous base and often systemic signs; this infant has classic neonatal acne and is well.
●	D. Scrubbing or squeezing the lesions can cause irritation, infection, or scarring and should be strictly avoided.
Exam takeaway: Neonatal acne is a benign, self-limiting condition that typically appears around 2-3 weeks of age and requires only parental reassurance.
Source origin: Common Findings Neonatal/Infant period, Slide 76, "Neonatal Acne".

Question 15
During a 9-month well-child visit, the FNP assesses an infant's gross motor skills. Which of the following milestones should an typically developing 9-month-old demonstrate?
Select the correct milestone:
A. Walking independently
B. Sitting with own support (tripod) only
C. Crawling and pulling up to a stand
D. Hopping on one foot
 
 
 
Correct answer: C. Crawling and pulling up to a stand
Rationale: By 9 months of age, infants typically develop the ability to crawl, pull themselves up to a standing position (cruising), and sit without support.
Why the other options are less appropriate:
●	A. Walking independently is the primary motor goal for a 12-month-old, not a 9-month-old.
●	B. Sitting with support (tripod) is a milestone typically achieved at 6 months; a 9-month-old should sit unsupported.
●	C. This is the correct answer.
●	D. Hopping on one foot is a 4-year-old gross motor milestone.
Exam takeaway: A 9-month-old infant should be able to crawl, pull to a stand, and sit without support.
Source origin: Assessing Growth and Development, Slides 9 & 31, "Key gross motor development milestones" and "Tips for remembering milestones".

Question 16
A 15-year-old girl reports feeling intensely afraid of speaking in class or eating in the cafeteria because she worries her peers are judging her. She has begun skipping school to avoid these situations, causing her grades to drop.
Which screening tool is most appropriate to specifically assess her symptoms?
A. Pediatric Symptom Checklist-17 (PSC-17)
B. Generalized Anxiety Disorder 7-item (GAD-7)
C. Screen for Child Anxiety Related Disorders (SCARED)
D. Vanderbilt Assessment Scale
 
 
 
Correct answer: C. Screen for Child Anxiety Related Disorders (SCARED)
Rationale: The SCARED tool is a validated screening instrument for children and adolescents (ages 8-18) that broadly assesses for various anxiety disorders, including social anxiety disorder (social phobia), which fits her fear of negative evaluation and avoidance.
Why the other options are less appropriate:
●	A. The PSC-17 is a broad behavioral screener, but the SCARED is more specific for deep-diving into anxiety subtypes.
●	B. The GAD-7 is validated for ages 11+ but specifically targets Generalized Anxiety Disorder, not the broad range of specific pediatric anxieties (like social phobia) covered by the SCARED.
●	C. This is the correct answer.
●	D. The Vanderbilt scale is used to screen for and monitor ADHD, not anxiety disorders.
Exam takeaway: The SCARED is a validated screening tool used to identify broad anxiety symptoms, including social phobia and generalized anxiety, in pediatric patients ages 8 to 18.
Source origin: Pediatric Anxiety & Depressive Disorders, Slides 10 & 17, "Current Screening Recommendations" and "2026 Screening".

Question 17
A 14-year-old boy screens positive for depression on the PHQ-9-A. The FNP follows up with the Ask Suicide-Screening Questions (ASQ) tool. The patient answers "Yes" to having thoughts of killing himself in the past week but "No" to having thoughts of doing it right now.
What is the mandated next step?
A. Call 911 for an immediate emergency room transfer.
B. Perform a Brief Suicide Safety Assessment to determine disposition.
C. Prescribe an SSRI and schedule a follow-up visit in 4 weeks.
D. Reassure the parents that passive suicidal thoughts are typical in depressed teens.
 
 
 
Correct answer: B. Perform a Brief Suicide Safety Assessment to determine disposition.
Rationale: A "Yes" to questions 1-4 on the ASQ (but "No" to question 5 regarding imminent intent) constitutes a non-acute positive screen. It requires the clinician to perform a Brief Suicide Safety Assessment to evaluate current thoughts, plan, intent, and access to lethal means to determine if a full mental health evaluation is needed.
Why the other options are less appropriate:
●	A. Calling 911 is reserved for acute positive screens (imminent risk, "Yes" to question 5) or when safety cannot be secured.
●	B. This is the correct answer.
●	C. Starting an SSRI without a thorough safety assessment and safety plan is contraindicated and dangerous.
●	D. Suicidal thoughts must never be dismissed as "typical"; they require formal safety assessment and protective action.
Exam takeaway: Any positive response on a suicide screening tool (like the ASQ) requires a secondary Brief Suicide Safety Assessment to determine the level of risk and appropriate intervention.
Source origin: Pediatric Anxiety & Depressive Disorders, Slides 22-23, "Suicide Risk: What Should the Clinician Look For?" and "ASQ".

Question 18
An FNP is considering prescribing an SSRI for a 16-year-old diagnosed with Major Depressive Disorder (MDD). According to 2026 FDA approvals, which of the following medications is officially approved for the treatment of MDD in an adolescent of this age?
Select the approved medication:
A. Escitalopram
B. Sertraline
C. Guanfacine
D. Paroxetine
 
 
 
Correct answer: A. Escitalopram
Rationale: Escitalopram is FDA-approved for the treatment of MDD in adolescents ages 12 and older (and GAD ages 7+). Fluoxetine is also approved for MDD (ages 8+).
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. Sertraline is FDA-approved in pediatrics for OCD (ages 6+), but its use for MDD and anxiety is off-label.
●	C. Guanfacine is an alpha-2 agonist used for ADHD, not an SSRI for depression.
●	D. Paroxetine is generally avoided in pediatrics due to a short half-life and higher risk of withdrawal and adverse effects.
Exam takeaway: Escitalopram (age 12+) and Fluoxetine (age 8+) are the FDA-approved SSRIs for treating Major Depressive Disorder in pediatric patients.
Source origin: Pediatric Anxiety & Depressive Disorders, Slides 49-50, "SSRIs for Depression & Anxiety Disorders" and "Know FDA status".

Question 19
When providing medication counseling to an adolescent and their parents regarding the initiation of an SSRI for depression, the FNP must thoroughly explain the FDA Black Box Warning.
What specific risk does this warning address?
A. A high likelihood of completed suicide during the first 6 months of therapy.
B. The potential emergence or worsening of suicidal ideation and behavior, especially early in treatment.
C. A high risk of permanent growth stunting and delayed puberty.
D. The risk of developing severe, irreversible tardive dyskinesia.
 
 
 
Correct answer: B. The potential emergence or worsening of suicidal ideation and behavior, especially early in treatment.
Rationale: The FDA Black Box Warning for SSRIs in pediatric patients highlights a 1-2% increased risk for the emergence of suicidal ideation and suicidal behavior, particularly during the first few weeks of treatment or after dose changes. It does not correlate with completed suicides.
Why the other options are less appropriate:
●	A. Studies have shown an increase in ideation/behavior, but not in completed suicides.
●	B. This is the correct answer.
●	C. SSRIs are not associated with permanent growth stunting. (Stimulants can affect appetite/weight).
●	D. Tardive dyskinesia is a risk associated with antipsychotics, not SSRIs.
Exam takeaway: Clinicians must educate families about the SSRI Black Box Warning regarding the potential for increased suicidal ideation early in treatment and monitor the patient closely.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 51, "SSRI Black Box Warning".

Question 20
A 6-year-old child presents for a well-child check. The parents report the child refuses to speak to the teacher or peers at school, communicating only by pointing. However, at home with immediate family, the child speaks in full sentences and is highly conversational. The child's hearing is normal.
What is the most likely diagnosis?
A. Autism Spectrum Disorder
B. Specific Phobia
C. Selective Mutism
D. Receptive Language Disorder
 
 
 
Correct answer: C. Selective Mutism
Rationale: Selective mutism is characterized by the absence of speech in specific social situations (e.g., school) where speaking is expected, despite having the ability to speak fluently in other settings (e.g., home). It typically becomes evident when the child starts school.
Why the other options are less appropriate:
●	A. While ASD can involve communication deficits, the child's fluent, normal speech at home makes selective mutism the much better fit for this context-specific behavior.
●	B. Specific phobia involves an irrational fear of an object or situation (e.g., dogs, needles), not a situational loss of speech.
●	C. This is the correct answer.
●	D. The child has fluent language at home, ruling out a primary underlying receptive or expressive language disorder.
Exam takeaway: Selective mutism presents as an inability to speak in certain settings (like school) despite normal speech and language abilities in comfortable environments (like home).
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 36, "Selective Mutism".

Question 21
The FNP is assessing a 6-month-old infant. Which fine motor milestone is expected at this developmental stage?
Select the correct fine motor milestone:
A. Reaching for objects with both hands simultaneously
B. Reaching for objects with one hand
C. Demonstrating a mature pincer grasp
D. Building a tower of two blocks
 
 
 
Correct answer: B. Reaching for objects with one hand
Rationale: At 6 months of age, an infant's fine motor skills have progressed from reaching with both hands (which occurs around 4 months) to successfully reaching for objects with one hand. They also begin to transfer objects between hands.
Why the other options are less appropriate:
●	A. Reaching with both hands is a 4-month fine motor milestone.
●	B. This is the correct answer.
●	C. A mature pincer grasp develops around 12 months.
●	D. Building a tower of 2 blocks occurs later, typically around 15 months.
Exam takeaway: A 6-month-old infant typically demonstrates the fine motor ability to reach for objects with a single hand and transfer objects from hand to hand.
Source origin: Assessing Growth and Development, Slide 13, "Key fine motor development milestone".

Question 22
During a 4-year-old's well-child visit, the FNP asks the child to draw a person. Based on expected fine motor and cognitive development, what is the minimum expectation for this drawing?
Choose the correct drawing milestone:
A. A simple circle with no distinct features
B. A person with at least 4 body parts
C. A person with at least 8 body parts and clothing
D. The ability to write their own first name legibly beneath the drawing
 
 
 
Correct answer: B. A person with at least 4 body parts
Rationale: At 4 years of age, a child should be able to draw a person with at least 4 body parts. At 5 years, the expectation increases to drawing a person with at least 5 body parts.
Why the other options are less appropriate:
●	A. Copying a simple circle is a 3-year-old milestone; drawing a person requires more detail by age 4.
●	B. This is the correct answer.
●	C. Drawing a highly detailed person with 8+ parts and clothing is beyond the baseline expectation for a 4-year-old.
●	D. Writing their name is typically assessed at the 5-year-old well-child visit.
Exam takeaway: As part of assessing school readiness, a 4-year-old should be able to draw a person with at least 4 distinct body parts.
Source origin: Growth and Development (Toddler-School Age), Slide 24, "Well Exam: 4 yr old".

Question 23
A 9-month-old infant presents for a routine visit. The parents report the infant has started crying intensely whenever the mother leaves the room and acts fearful when unfamiliar adults try to hold him. The FNP recognizes this behavior as:
Select the correct interpretation:
A. An early indication of Separation Anxiety Disorder.
B. Normal stranger anxiety, indicating the development of object permanence.
C. A red flag for a secure attachment deficit.
D. Developmentally inappropriate rigidity requiring an autism screening.
 
 
 
Correct answer: B. Normal stranger anxiety, indicating the development of object permanence.
Rationale: Stranger anxiety and separation anxiety typically emerge around 8 to 9 months of age. This represents a normal cognitive milestone driven by the development of object permanence (memory), where the baby recognizes their primary caregiver and rejects others.
Why the other options are less appropriate:
●	A. Separation Anxiety Disorder involves developmentally inappropriate, impairing fear. In a 9-month-old, this behavior is entirely normative.
●	B. This is the correct answer.
●	C. Stranger anxiety actually indicates the presence of a healthy, secure attachment to the primary caregiver, not a deficit.
●	D. This is a normal developmental stage, not an early sign of autism.
Exam takeaway: Stranger anxiety emerging around 8-9 months is a healthy sign of cognitive development (object permanence) and secure attachment.
Source origin: Common Findings Neonatal/Infant period, Slide 60, "Stranger anxiety".

Question 24
An infant born prematurely at 30 weeks gestation is currently 6 months old (chronological age). When plotting the infant's growth parameters and assessing developmental milestones, the FNP should use a corrected age of:
Choose the correct corrected age:
A. 2.5 months
B. 3.5 months
C. 4.5 months
D. 6 months
 
 
 
Correct answer: B. 3.5 months
Rationale: Corrected age is calculated by subtracting the number of weeks premature from the chronological age. Full term is 40 weeks. The infant was born at 30 weeks (10 weeks, or 2.5 months early). Chronological age (6 months) minus prematurity (2.5 months) equals a corrected age of 3.5 months.
Why the other options are less appropriate:
●	A. Mathematical error; 6 months minus 2.5 months is 3.5 months.
●	B. This is the correct answer.
●	C. Mathematical error.
●	D. Using chronological age (6 months) would inappropriately label the infant as developmentally delayed.
Exam takeaway: Developmental milestones for premature infants must be tracked using their corrected age (chronological age minus weeks of prematurity) until about 2 years of age.
Source origin: Assessing Growth and Development, Slide 27, "How to calculate corrected age".

Question 25
The parents of a 1-month-old infant bring her to the clinic with concerns about a rapidly growing, bright red, raised nodule on her right forearm that appeared two weeks after birth. The lesion is not ulcerated and does not affect the infant's mobility.
What is the most likely diagnosis?
A. Port Wine Stain (Nevus Flammeus)
B. Salmon Patch (Nevus Simplex)
C. Hemangioma
D. Erythema toxicum
 
 
 
Correct answer: C. Hemangioma
Rationale: Hemangiomas are common vascular tumors of infancy that typically appear in the first few weeks of life, undergo rapid growth during the first year, and then slowly involute. They present as red to purple vascular lesions that may be raised.
Why the other options are less appropriate:
●	A. A port wine stain is a flat, pink to red patch that is present at birth and persists/darkens with age; it is not a rapidly growing raised nodule.
●	B. A salmon patch is a flat, pink patch present at birth, commonly on the nape of the neck or glabella.
●	C. This is the correct answer.
●	D. Erythema toxicum is a benign neonatal rash with flea-bite-like macules and central pustules, not a solid vascular tumor.
Exam takeaway: Hemangiomas are raised, red vascular tumors that appear shortly after birth and grow rapidly during the first year of life before eventually involuting.
Source origin: Common Findings Neonatal/Infant period, Slide 78, "Hemangioma".

Question 26
During a routine physical examination of a 2-month-old infant, the FNP notes a positive Galeazzi sign.
What does this finding indicate?
A. A leg length discrepancy, raising suspicion for developmental dysplasia of the hip (DDH).
B. Normal closure of the posterior fontanel.
C. A neuromuscular disorder such as muscular dystrophy.
D. Intact corticospinal pathways.
 
 
 
Correct answer: A. A leg length discrepancy, raising suspicion for developmental dysplasia of the hip (DDH).
Rationale: The Galeazzi sign is positive when the knees are at unequal heights while the supine infant's feet are placed together on the examination table with the hips and knees flexed. It indicates a thigh length discrepancy, which is a sign of developmental dysplasia of the hip (DDH).
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. The Galeazzi sign assesses the lower extremities, not cranial fontanels.
●	C. Gowers maneuver assesses for muscular dystrophy, not the Galeazzi sign.
●	D. The Galeazzi sign evaluates anatomical hip stability, not deep tendon reflexes or corticospinal tracts.
Exam takeaway: A positive Galeazzi sign (uneven knee heights) in an infant suggests developmental dysplasia of the hip due to a dislocated or shortened femur.
Source origin: Common Findings Neonatal/Infant period, Slide 44, "Developmental Dysplasia of the Hip".

Question 27
An infant is brought to the clinic at 1 week of age. The mother reports the infant's skin appears yellow. The FNP notes jaundice extending to the infant's chest. The infant is exclusively breastfed, feeding vigorously 10 times a day, and producing 6 wet diapers and 4 mustard-colored stools daily. Birth weight was 3.5 kg, and current weight is 3.4 kg.
What is the most likely cause of this jaundice?
A. Breast milk jaundice
B. Suboptimal intake hyperbilirubinemia (Breastfeeding jaundice)
C. Physiologic jaundice
D. Biliary atresia
 
 
 
Correct answer: C. Physiologic jaundice
Rationale: Physiologic jaundice is common, peaks at days 3-5, and occurs in otherwise well infants. This infant is feeding well, has excellent urine/stool output, and has lost less than 5% of birth weight, ruling out suboptimal intake.
Why the other options are less appropriate:
●	A. Breast milk jaundice typically occurs later, usually after the first week of life.
●	B. Suboptimal intake jaundice is driven by poor feeding, dehydration, and delayed stooling. This infant has excellent intake and output.
●	C. This is the correct answer.
●	D. Biliary atresia presents with persistent jaundice, dark urine, and pale/acholic stools, none of which are present here.
Exam takeaway: Physiologic jaundice peaks around days 3-5 in an otherwise healthy, well-hydrated infant, whereas suboptimal intake jaundice is associated with poor feeding and excessive weight loss.
Source origin: Common Findings Neonatal/Infant period, Slide 67, "Hyperbilirubinemia in Infants — Quick Comparison".

Question 28
Which anticipatory guidance should the FNP provide to parents regarding the expected closure of an infant's anterior fontanel?
Select the correct time frame:
A. It typically closes by 2 months of age.
B. It typically closes between 6 and 9 months of age.
C. It typically closes between 12 and 18 months of age.
D. It typically closes by 24 months of age.
 
 
 
Correct answer: C. It typically closes between 12 and 18 months of age.
Rationale: The anterior fontanel is normally palpable at birth and typically closes between 12 and 18 months of age.
Why the other options are less appropriate:
●	A. The posterior fontanel closes at 2 months of age, not the anterior.
●	B. This is too early for normal anterior fontanel closure.
●	C. This is the correct answer.
●	D. While some references extend closure up to 2 years, 12-18 months is the standard normative window provided in the clinical tables.
Exam takeaway: The posterior fontanel closes at 2 months, while the anterior fontanel closes between 12 and 18 months of age.
Source origin: Common Findings Neonatal/Infant period, Slide 24, "Age of Fontanel Closure".

Question 29
A mother presents with her 3-week-old infant, complaining that the baby cries inconsolably for about 3 hours every evening, 4 days a week. The infant is gaining weight normally, feeds well, has normal stools, and the physical examination is entirely normal.
What is the most appropriate FNP action?
A. Switch the infant to an amino-acid based formula (AAF).
B. Order a stool test for occult blood and a specialized GI referral.
C. Diagnose infant colic, validate the parents' frustration, and provide reassurance.
D. Prescribe a short course of an infant-safe proton pump inhibitor.
 
 
 
Correct answer: C. Diagnose infant colic, validate the parents' frustration, and provide reassurance.
Rationale: Colic is defined by the Rule of 3s: inconsolable crying in an otherwise healthy infant for >3 hours per day, >3 days a week, for >3 weeks. It is a benign condition that requires parental reassurance and support.
Why the other options are less appropriate:
●	A. Formula switching is indicated for cow's milk protein allergy (which presents with bloody/mucus stools), not isolated colic.
●	B. Extensive GI workups are unnecessary in a thriving infant with a classic colic presentation and a normal exam.
●	C. This is the correct answer.
●	D. Acid suppression is not indicated for crying/fussiness without specific signs of pathologic GERD.
Exam takeaway: Colic follows the "Rule of 3s" and is managed with supportive counseling and reassurance, as it is benign and spontaneously resolves.
Source origin: Common Findings Neonatal/Infant period, Slide 85, "Colic".

Question 30
A 4-month-old infant is brought in for a well-child check. The parents report the infant frequently spits up after feedings but is otherwise a "happy spitter." The infant is tracking perfectly on the growth chart and is unbothered during regurgitation.
What is the appropriate initial management?
A. Prescribe a pediatric dose of ranitidine or omeprazole.
B. Refer to Pediatric Gastroenterology for a pH-impedance test.
C. Continue breastfeeding, avoid overfeeding, and provide parental reassurance.
D. Recommend transitioning to an extensively hydrolyzed formula.
 
 
 
Correct answer: C. Continue breastfeeding, avoid overfeeding, and provide parental reassurance.
Rationale: Uncomplicated gastroesophageal reflux (the "happy spitter") in an infant who is growing normally requires only conservative management, such as avoiding overfeeding, and reassurance.
Why the other options are less appropriate:
●	A. Acid suppression is not routine first-line treatment for uncomplicated infant reflux.
●	B. Specialized testing is reserved for persistent, severe, atypical, or alarm symptoms.
●	C. This is the correct answer.
●	D. Formula switching is reserved for suspected cow's milk protein allergy or GERD that fails conservative measures and exhibits troublesome symptoms.
Exam takeaway: A "happy spitter" with normal growth parameters has uncomplicated gastroesophageal reflux and requires only reassurance and basic feeding guidance.
Source origin: Common Findings Neonatal/Infant period, Slide 87, "Gastroesophageal Reflux Disease (GERD)".

Question 31
The FNP is screening an 8-year-old child for lead exposure. The child has no previously documented blood lead levels. The parent reports the family recently renovated a home built in 1968. What is the capillary blood lead reference value above which the CDC recommends prompt follow-up actions?
Select the correct threshold:
A. 1.0 µg/dL
B. 3.5 µg/dL
C. 10.0 µg/dL
D. 45.0 µg/dL
 
 
 
Correct answer: B. 3.5 µg/dL
Rationale: The CDC blood lead reference value (BLRV) is 3.5 µg/dL. Any level at or above this threshold warrants prompt follow-up, environmental source control, and nutritional assessment.
Why the other options are less appropriate:
●	A. There is no safe level of lead, but 3.5 is the specific CDC reference value for action.
●	B. This is the correct answer.
●	C. 10.0 was a historical threshold, but the current BLRV is 3.5 µg/dL.
●	D. 45.0 µg/dL is the threshold for urgent expert consultation and chelation therapy, not the initial reference value for basic follow-up actions.
Exam takeaway: The CDC blood lead reference value requiring intervention and follow-up is 3.5 µg/dL.
Source origin: Growth and Development (Toddler-School Age), Slide 8-9, "Lead: What to Do When Exposure Is Identified".

Question 32
A 15-month-old child presents for a well-child visit. Based on typical developmental milestones, which of the following gross motor skills should the FNP expect this child to have mastered?
Select the correct gross motor skill:
A. Walking alone
B. Walking up and down stairs
C. Jumping in place
D. Riding a tricycle
 
 
 
Correct answer: A. Walking alone
Rationale: Walking independently is the hallmark gross motor goal achieved around 12 to 15 months of age.
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. Walking up and down stairs (typically two feet per step) is a 2-year-old (24-month) milestone.
●	C. Jumping in place is typically a 3-year-old milestone.
●	D. Riding a tricycle requires coordination achieved at 3 years of age.
Exam takeaway: Independent walking is a primary gross motor milestone expected to be mastered by 12 to 15 months of age.
Source origin: Assessing Growth and Development, Slide 9 & 32, "Key gross motor development milestones" and "Tips for 15mth-5 yrs".

Question 33
A 6-year-old patient presents with symptoms of inattention, hyperactivity, and impulsivity. The parents requested Vanderbilt rating scales, which were completed by the parents and the child's teacher. Both scales show high scores for ADHD symptoms. What is the most important clinical principle for the FNP to remember regarding these scales?
Choose the correct principle:
A. The scales independently confirm the diagnosis of ADHD.
B. A high score must be integrated with DSM-5-TR criteria, history, and evaluation for mimics before diagnosing ADHD.
C. The scales are only validated for use in children aged 12 and older.
D. The scales can dictate whether a stimulant or nonstimulant should be prescribed first.
 
 
 
Correct answer: B. A high score must be integrated with DSM-5-TR criteria, history, and evaluation for mimics before diagnosing ADHD.
Rationale: Rating scales (such as the Vanderbilt) collect systematic information but do not independently diagnose ADHD. The results must be interpreted within the context of DSM criteria, detailed history, functional impairment, and the exclusion of medical/psychiatric mimics.
Why the other options are less appropriate:
●	A. Rating scales are supportive tools, not independent diagnostic tests.
●	B. This is the correct answer.
●	C. Vanderbilt scales are validated for use in school-aged children, well below age 12.
●	D. Medication selection is based on age guidelines, comorbidities, and patient specific factors, not purely on rating scale scores.
Exam takeaway: Validated rating scales support the diagnosis of ADHD but cannot replace a comprehensive clinical evaluation utilizing DSM-5-TR criteria and differential diagnosis.
Source origin: Attention Deficit Hyperactivity Disorder, Slide 10, "Rating Scales: Support the Diagnosis".

Question 34
An 11-year-old patient with Generalized Anxiety Disorder is being treated with cognitive behavioral therapy (CBT). The FNP explains the core premise of CBT to the patient's parents. Which three elements does the CBT triangle primarily focus on connecting?
Select the correct trio:
A. Past trauma, unconscious fears, and dreams
B. Thoughts, emotions, and behaviors
C. Family dynamics, peer relationships, and school performance
D. Diet, exercise, and sleep hygiene
 
 
 
Correct answer: B. Thoughts, emotions, and behaviors
Rationale: Cognitive Behavioral Therapy (CBT) operates on the core principle that a person's thoughts, emotions, and behaviors are interconnected, and altering negative thought patterns can positively change emotions and behaviors.
Why the other options are less appropriate:
●	A. This describes psychodynamic or psychoanalytic therapy.
●	B. This is the correct answer.
●	C. This describes the focus of Interpersonal Psychotherapy (IPT-A) or family systems therapy.
●	D. While lifestyle factors are important for overall mental health, they are not the core components of the CBT cognitive triangle.
Exam takeaway: Cognitive Behavioral Therapy (CBT) targets the interconnected relationship between a patient's thoughts, emotions, and behaviors.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 42, "Cognitive Behavioral Therapy".

Question 35
A 4-week-old infant is brought to the clinic because the umbilical cord stump fell off two weeks ago, but the umbilicus remains moist with a small, pink, non-tender nodule inside. There is no surrounding erythema, purulent drainage, or fever.
What is the most appropriate management?
A. Admit the infant for intravenous broad-spectrum antibiotics.
B. Apply silver nitrate to the tissue in the clinic.
C. Prescribe a topical antifungal cream to be applied twice daily.
D. Probe the area deeply to rule out a patent urachus.
 
 
 
Correct answer: B. Apply silver nitrate to the tissue in the clinic.
Rationale: The clinical presentation is classic for an umbilical granuloma—a small, pink, moist nodule of healing tissue without signs of infection. The typical management in primary care is the topical application of silver nitrate to cauterize the tissue.
Why the other options are less appropriate:
●	A. Intravenous antibiotics are indicated for omphalitis (which presents with redness, swelling, and purulence), not a benign granuloma.
●	B. This is the correct answer.
●	C. Fungal infection is not the cause of an umbilical granuloma.
●	D. Deep probing is unnecessary and contraindicated in a primary care setting for a simple granuloma.
Exam takeaway: An umbilical granuloma presents as a small, moist, pink nodule after the cord separates and is treated with topical silver nitrate.
Source origin: Common Findings Neonatal/Infant period, Slides 71-72, "Umbilical Granuloma vs Omphalitis".

Question 36
At what age does the American Academy of Pediatrics (AAP) recommend initiating routine, universal depression screening for pediatric patients at health maintenance visits?
Choose the correct age:
A. 8 years
B. 10 years
C. 12 years
D. 15 years
 
 
 
Correct answer: C. 12 years
Rationale: The AAP GLAD-PC guidelines recommend annual universal depression screening beginning at age 12. (Note: The USPSTF recommends anxiety screening starting at age 8, but depression screening at age 12).
Why the other options are less appropriate:
●	A. Age 8 is the starting age for universal anxiety screening per the USPSTF, not depression.
●	B. Age 10 is too early for universal, asymptomatic depression screening guidelines.
●	C. This is the correct answer.
●	D. Screening should begin earlier, at age 12.
Exam takeaway: Universal screening for adolescent depression should begin annually at age 12 during health maintenance visits.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 17, "2026 Screening: What FNP Students Should Remember".

Question 37
A 6-month-old infant is brought to the clinic for a well-child visit. The infant was born at full term without complications. When assessing the infant's reflexes, which primitive reflex should the FNP expect to have disappeared by this age?
Select the correct reflex:
A. Babinski reflex
B. Rooting reflex
C. Parachute reflex
D. Patellar reflex
 
 
 
Correct answer: B. Rooting reflex
Rationale: The rooting reflex (turning the head toward a cheek stimulus to suck) typically disappears by 3 to 4 months of age.
Why the other options are less appropriate:
●	A. The Babinski reflex typically remains positive (fanning out of toes) until 9 to 12 months of age.
●	B. This is the correct answer.
●	C. The parachute reflex appears around 8 to 9 months and persists throughout life as a protective mechanism.
●	D. The patellar reflex (deep tendon reflex) is present throughout life.
Exam takeaway: Primitive reflexes such as the rooting and Moro reflexes typically disappear by 3 to 4 months of age as the infant develops voluntary motor control.
Source origin: Common Findings Neonatal/Infant period, Slides 38-39, "Primitive Reflexes".

Question 38
An FNP is assessing a 5-year-old child's fine motor development. Which of the following tasks should a typically developing 5-year-old be able to accomplish?
Select the correct task:
A. Copy a cross
B. Copy a triangle
C. Build a tower of 6 blocks
D. Use a pincer grasp to pick up a small pellet
 
 
 
Correct answer: B. Copy a triangle
Rationale: Copying a triangle is a distinct 5-year-old fine motor/cognitive milestone.
Why the other options are less appropriate:
●	A. Copying a cross is a 4-year-old milestone.
●	B. This is the correct answer.
●	C. Building a tower of 6 blocks is a 2-year-old milestone.
●	D. The mature pincer grasp develops much earlier, at 12 months.
Exam takeaway: Fine motor milestones advance predictably: copying a circle at age 3, a cross at age 4, and a triangle at age 5.
Source origin: Assessing Growth and Development, Slide 13, "Key fine motor development milestone".

Question 39
During an infant's well-child exam, the FNP discovers a single, hyperpigmented, flat macule measuring 2 cm on the infant's torso. The parents ask what this is.
How should the FNP respond?
A. "This is a café-au-lait macule. Because he only has one, it is benign, but we will monitor it at his well exams."
B. "This is a port wine stain. We will need to refer him to dermatology for laser therapy."
C. "This is a salmon patch and will likely fade by his second birthday."
D. "This requires immediate genetic testing to rule out neurofibromatosis."
 
 
 
Correct answer: A. "This is a café-au-lait macule. Because he only has one, it is benign, but we will monitor it at his well exams."
Rationale: Café-au-lait macules are common, benign hyperpigmented patches. Having fewer than 6 is considered a normal variant. The management is to measure them at well exams and monitor for the appearance of more. Six or more would raise concern for neurofibromatosis.
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. A port wine stain is a pink/red vascular malformation, not a brown hyperpigmented macule.
●	C. A salmon patch is a pink/red vascular lesion, usually on the nape of the neck or eyelids.
●	D. Genetic testing is not indicated for a single café-au-lait macule; it is only a concern if there are 6 or more.
Exam takeaway: A few café-au-lait macules are benign; however, the presence of 6 or more requires evaluation for neurofibromatosis.
Source origin: Common Findings Neonatal/Infant period, Slide 83, "Café-Au-Lait Macules".

Question 40
The parents of a healthy 18-month-old child ask the FNP when they should begin toilet training. Which developmental theory provides the framework for understanding a toddler's drive for autonomy and control over bodily functions?
Select the correct developmental theory:
A. Piaget's Sensorimotor Stage
B. Erikson's Autonomy vs. Shame and Doubt
C. Bandura's Social Learning Theory
D. Freud's Latency Stage
 
 
 
Correct answer: B. Erikson's Autonomy vs. Shame and Doubt
Rationale: Erikson's stage of Autonomy vs. Shame and Doubt occurs during the toddler years (ages 1-3). It centers on the child's developing sense of personal control over physical skills and independence, with toilet training being a classic hallmark event of this stage.
Why the other options are less appropriate:
●	A. Piaget's Sensorimotor stage involves learning through senses and actions, focusing on object permanence, not psychosocial independence like toilet training.
●	B. This is the correct answer.
●	C. Social Learning Theory focuses on learning through observation and imitation, rather than the intrinsic psychosocial crisis of autonomy.
●	D. Freud's Latency stage occurs much later, during school-age years.
Exam takeaway: Toilet training and a toddler's desire for independence represent Erikson's psychosocial stage of Autonomy vs. Shame and Doubt.
Source origin: Growth and Development (Toddler-School Age), Slide 3, "Developmental Theories".

Question 41
A 3-day-old neonate presents with scattered, small, fluid-filled vesicles on an erythematous base located on the trunk. The mother had no active infections during pregnancy. The FNP suspects Transient Neonatal Pustular Melanosis (TNPM) versus a Herpes Simplex Virus (HSV) infection. Which characteristic most strongly supports a diagnosis of TNPM over HSV?
Select the supportive characteristic:
A. The lesions are clustered in a "dew drop on a rose petal" pattern.
B. The infant appears toxic and lethargic.
C. The pustules rupture easily, leaving a collarette of scale and a hyperpigmented macule.
D. The lesions primarily involve the mucous membranes of the mouth.
 
 
 
Correct answer: C. The pustules rupture easily, leaving a collarette of scale and a hyperpigmented macule.
Rationale: TNPM is a benign, self-limited rash present at birth or within the first few days of life. The vesicles rupture easily, leaving a distinct scale and hyperpigmented macules.
Why the other options are less appropriate:
●	A. "Dew drop on a rose petal" describes classic HSV lesions.
●	B. Lethargy and a toxic appearance indicate a serious systemic infection like HSV, whereas TNPM is benign and the infant is well-appearing.
●	C. This is the correct answer.
●	D. Mucous membrane involvement is characteristic of HSV, whereas TNPM spares the mucous membranes.
Exam takeaway: Transient Neonatal Pustular Melanosis (TNPM) is a benign rash that leaves hyperpigmented macules upon rupturing, while HSV presents with grouped vesicles, mucosal involvement, and systemic illness.
Source origin: Common Findings Neonatal/Infant period, Slide 82, "Distinguishing Neonatal Pustular Melanosis from Neonatal Herpes".

Question 42
An 11-year-old girl is brought to the clinic due to frequent somatic complaints, including headaches and stomachaches before school. The FNP suspects anxiety.
When interpreting anxiety symptoms in pediatric patients, what defines a "Specific Phobia"?
A. An excessive, irrational fear of a distinct object or situation resulting in avoidance.
B. A chronic feeling of dread regarding multiple, non-specific everyday situations.
C. Fear of negative evaluation or judgment by peers in social settings.
D. Recurrent, unexpected panic attacks leading to a fear of having another attack.
 
 
 
Correct answer: A. An excessive, irrational fear of a distinct object or situation resulting in avoidance.
Rationale: Specific phobia is defined as a persistent, irrational fear of a specific situation or object (e.g., dogs, needles, storms) that leads to avoidance and functional impairment.
Why the other options are less appropriate:
●	A. This is the correct answer.
●	B. This describes Generalized Anxiety Disorder (GAD).
●	C. This describes Social Anxiety Disorder (Social Phobia).
●	D. This describes Panic Disorder.
Exam takeaway: Specific phobia is isolated to a distinct trigger, whereas Generalized Anxiety Disorder involves excessive worry about multiple everyday situations.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 35, "Specific Phobia".

Question 43
The FNP is observing a 30-month-old (2.5 years) child during a well-child check. The child is playing near another child but is not interacting or sharing toys with them.
How should the FNP interpret this behavior?
A. It is a concerning red flag for Autism Spectrum Disorder.
B. It is typical parallel play, which is appropriate for this age.
C. It indicates delayed development of cooperative play, expected by 18 months.
D. It suggests the child is experiencing separation anxiety.
 
 
 
Correct answer: B. It is typical parallel play, which is appropriate for this age.
Rationale: Toddlers (typically between 2 and 3 years old) engage in parallel play, where they play adjacent to each other but do not try to influence one another's behavior. Cooperative play (sharing and interacting) develops later, typically around 3 to 4 years of age.
Why the other options are less appropriate:
●	A. Parallel play is a normal developmental stage, not an isolated red flag for ASD.
●	B. This is the correct answer.
●	C. Cooperative play is not expected at 18 months.
●	D. Playing independently near others does not indicate separation anxiety.
Exam takeaway: Parallel play—playing next to peers without direct interaction—is a normal and expected social milestone for 2-year-olds.
Source origin: Growth and Development (Toddler-School Age), Slide 14, "2 yr well exam".

Question 44
A 4-year-old child presents to the clinic with persistent anxiety surrounding nighttime and a fear of "monsters." The parents are frustrated and want a referral to a psychiatrist.
What is the FNP's best response?
A. Prescribe a low-dose SSRI to reduce the child's nighttime distress.
B. Explain that fears of imaginary creatures and the dark are developmentally normative at this age.
C. Screen the child for early-onset schizophrenia due to the presence of hallucinations.
D. Advise the parents to force the child to sleep in total darkness to quickly desensitize the fear.
 
 
 
Correct answer: B. Explain that fears of imaginary creatures and the dark are developmentally normative at this age.
Rationale: In preschool-aged children, fears of the dark, animals, and imaginary creatures ("monsters") are entirely developmentally typical and normative. They do not represent an anxiety disorder requiring medication or psychiatric referral unless they cause extreme, pervasive functional impairment.
Why the other options are less appropriate:
●	A. Pharmacotherapy is completely inappropriate for normative childhood fears.
●	B. This is the correct answer.
●	C. Fearing monsters is a product of preschool imagination, not psychosis.
●	D. "Flooding" or forcing exposure in a harsh manner is inappropriate parenting guidance and can exacerbate fear.
Exam takeaway: Fears of the dark and imaginary creatures are developmentally normative in preschool-aged children and should be managed with reassurance and supportive parenting.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 28, "Developmentally Typical Fears/Worries".

Question 45
A 7-month-old infant is brought to the clinic for a routine check-up. The infant's growth parameters reveal that the weight has dropped from the 50th percentile to the 10th percentile over the last three months, while length and head circumference remain at the 50th percentile.
What is the most likely initial etiology for this specific growth pattern?
A. Genetic short stature
B. Endocrine growth failure
C. Inadequate caloric intake
D. Congenital microcephaly
 
 
 
Correct answer: C. Inadequate caloric intake
Rationale: When caloric intake is inadequate, the classic pattern of growth faltering occurs sequentially: weight percentile drops first, followed by length, and finally head circumference is affected last (brain sparing).
Why the other options are less appropriate:
●	A. Familial short stature typically presents with length and weight consistently in the lower percentiles, not an acute drop in weight alone.
●	B. Endocrine growth failure usually affects length/height percentiles first or concurrently with weight.
●	C. This is the correct answer.
●	D. Microcephaly involves a small head circumference, which is unaffected in this scenario.
Exam takeaway: Inadequate nutrition first causes a drop in weight percentiles, followed by length, with head circumference preserved until malnutrition is severe.
Source origin: Common Findings Neonatal/Infant period, Slide 21, "Important concepts".

Question 46
A 16-year-old girl is diagnosed with moderate Major Depressive Disorder (MDD). The FNP recommends a combination of an SSRI and evidence-based psychotherapy. Which psychotherapeutic modality specifically targets the connection between the patient's mood and her peer/family relationship conflicts?
Select the correct psychotherapeutic modality:
A. Exposure and Response Prevention (ERP)
B. Cognitive Restructuring
C. Interpersonal Psychotherapy for Adolescents (IPT-A)
D. Play Therapy
 
 
 
Correct answer: C. Interpersonal Psychotherapy for Adolescents (IPT-A)
Rationale: Interpersonal Psychotherapy (IPT-A) is based on the theory that depression occurs in an interpersonal context, meaning relationships impact mood and mood impacts relationships. It specifically targets interpersonal problems contributing to depression.
Why the other options are less appropriate:
●	A. ERP is a specific type of CBT used primarily for Obsessive-Compulsive Disorder (OCD) and phobias.
●	B. Cognitive restructuring is a component of CBT that focuses on changing negative thought patterns, not primarily interpersonal relationships.
●	C. This is the correct answer.
●	D. Play therapy is used for younger children, not adolescents.
Exam takeaway: IPT-A is an evidence-based therapy for adolescent depression that focuses on how relationship conflicts and interpersonal dynamics affect mood.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 43, "Interpersonal Psychotherapy for Adolescents (IPT-A)".

Question 47
A new mother is preparing to introduce solid foods to her 6-month-old infant. She asks the FNP which foods are best to start with and how to introduce them.
What is the best advice based on pediatric nutrition guidelines?
A. Introduce three new fruits simultaneously to identify food preferences quickly.
B. Start with a single-ingredient, iron-fortified cereal and wait 3 to 4 days before introducing another new food.
C. Begin with egg whites and peanut butter to prevent future allergies.
D. Offer pureed meats first, followed by fruit juices in a bottle.
 
 
 
Correct answer: B. Start with a single-ingredient, iron-fortified cereal and wait 3 to 4 days before introducing another new food.
Rationale: Iron-fortified rice or oat cereal is typically recommended as the first solid food because it provides necessary iron and is least allergenic. New foods should be introduced one at a time, every 3 to 4 days, to easily identify any allergic reactions.
Why the other options are less appropriate:
●	A. Introducing multiple foods at once makes it impossible to pinpoint the cause if an allergic reaction occurs.
●	B. This is the correct answer.
●	C. While early introduction of allergens is now supported for some infants, egg whites are highly allergenic and generally introduced after less allergenic foods are tolerated.
●	D. Fruit juices lack nutritional density, contribute to obesity and caries, and should not be given via bottle; meats are typically introduced after cereals, vegetables, and fruits.
Exam takeaway: Solid foods should be introduced one at a time every 3 to 4 days to monitor for allergies, typically beginning with an iron-fortified infant cereal.
Source origin: Common Findings Neonatal/Infant period, Slide 60-61, "6mth Well Exam - Intro to solids".

Question 48
An FNP is examining the male genitalia of a newborn infant. The FNP notes that the urethral meatus is located on the ventral surface of the penile shaft rather than at the tip of the glans.
What is the correct medical term for this finding?
A. Epispadias
B. Hypospadias
C. Chordee
D. Cryptorchidism
 
 
 
Correct answer: B. Hypospadias
Rationale: Hypospadias is a congenital defect in which the urethral opening is located on the ventral (under) side of the penis.
Why the other options are less appropriate:
●	A. Epispadias is when the urethral opening is located on the dorsal (top) aspect of the penis.
●	B. This is the correct answer.
●	C. Chordee is a congenital condition resulting in a downward curvature of the penis, often associated with hypospadias, but it refers to the curvature, not the urethral opening itself.
●	D. Cryptorchidism refers to undescended testicles.
Exam takeaway: Hypospadias is characterized by a ventrally displaced urethral meatus and is an important finding during the newborn genitourinary examination.
Source origin: Common Findings Neonatal/Infant period, Slide 42, "Hypospadias".

Question 49
During a 12-month well-child check, the FNP is reviewing injury prevention and anticipatory guidance with the parents. Which developmental milestone, typically achieved by this age, introduces new safety risks that must be addressed?
Select the correct milestone:
A. Riding a tricycle
B. Walking independently
C. Opening doorknobs with a mature grasp
D. Climbing over tall playground structures
 
 
 
Correct answer: B. Walking independently
Rationale: Independent walking is the hallmark gross motor milestone of the 12-month-old infant. This newly acquired mobility significantly increases the risk for falls, pulling hot items off tables, and accessing hazards, requiring updated childproofing guidance.
Why the other options are less appropriate:
●	A. Tricycle riding is a 3-year-old milestone.
●	B. This is the correct answer.
●	C. Opening doorknobs requires complex twisting motions generally acquired in the toddler/preschool years (around 2-3 years).
●	D. Advanced climbing is a skill developed later in the toddler and preschool years.
Exam takeaway: The 12-month well-child visit must heavily emphasize home safety and childproofing, as the infant is typically beginning to walk independently.
Source origin: Assessing Growth and Development, Slide 31, "Tips for remembering milestones".

Question 50
A 16-year-old boy has been prescribed sertraline for severe Generalized Anxiety Disorder (GAD). He returns for a 2-week follow-up visit. The mother reports that while his anxiety seems slightly better, he has been extremely restless, unable to sit still in his chair, pacing the house, and having trouble falling asleep.
What is the most likely cause of these new symptoms?
A. Serotonin Syndrome
B. Activation Syndrome
C. Worsening of the underlying anxiety disorder
D. Bipolar mania induced by the SSRI
 
 
 
Correct answer: B. Activation Syndrome
Rationale: Activation syndrome is a known side effect of initiating SSRIs in pediatric patients, characterized by restlessness, impulsivity, agitation, akathisia, and insomnia. It is managed by reducing the dose or discontinuing the medication.
Why the other options are less appropriate:
●	A. Serotonin syndrome is a rare, life-threatening medical emergency presenting with autonomic instability, hyperthermia, and clonus, not just restlessness and insomnia.
●	B. This is the correct answer.
●	C. While worsening anxiety is possible, pacing and akathisia shortly after SSRI initiation are classic signs of activation.
●	D. While SSRIs can induce mania in patients with bipolar disorder, activation syndrome is far more common; mania would present with grandiosity, hypersexuality, and flight of ideas.
Exam takeaway: Activation syndrome (agitation, restlessness, insomnia) is a common adverse effect early in pediatric SSRI treatment and typically requires a dose reduction.
Source origin: Pediatric Anxiety & Depressive Disorders, Slide 48, "Selective Serotonin Reuptake Inhibitors (SSRIs) Basics".


    </script>

    <script>
        // State Variables
        let parsedSets = [];
        let activeSetId = null;
        let activeQuestionIndex = 0;
        let userProgress = JSON.parse(localStorage.getItem('pediatricExamProgress')) || {};

        // Parse the Raw Text into JSON Objects securely
        function parseRawText() {
            const rawText = document.getElementById('raw-data').textContent;
            
            const setsData = [
                { id: 'set1', title: 'Combined Case Studies Set 1', questions: [] },
                { id: 'set2', title: 'Combined Case Studies Set 2', questions: [] },
                { id: 'set3', title: 'Pediatric Primary Care Examination Review', questions: [] }
            ];
            
            let currentSetIndex = 0;
            
            // Split text blocks roughly by "Question X"
            const chunks = rawText.split(/(?=Question \d+)/i);
            
            chunks.forEach(chunk => {
                // Determine the current set context
                if (chunk.includes("Combined Case Studies Set 1")) currentSetIndex = 0;
                else if (chunk.includes("Combined Case Studies Set 2")) currentSetIndex = 1;
                else if (chunk.includes("Pediatric Primary Care Examination Review")) currentSetIndex = 2;
                
                // If it doesn't actually contain a question, skip
                if (!/^Question \d+/i.test(chunk.trim())) return;
                
                // Extraction helper function
                const extract = (regex) => {
                    const match = chunk.match(regex);
                    return match ? match[1].trim() : "";
                };

                const qMatch = chunk.match(/Question \d+\s*([\s\S]*?)(?=\nA\.)/i);
                const prompt = qMatch ? qMatch[1].trim() : "";
                
                const optA = extract(/\nA\.\s*([\s\S]*?)(?=\nB\.)/i);
                const optB = extract(/\nB\.\s*([\s\S]*?)(?=\nC\.)/i);
                const optC = extract(/\nC\.\s*([\s\S]*?)(?=\nD\.)/i);
                const optD = extract(/\nD\.\s*([\s\S]*?)(?=\n\s*Correct answer:)/i);
                
                const correct = extract(/Correct answer:\s*([A-D])/i);
                const rationale = extract(/Rationale:\s*([\s\S]*?)(?=\nWhy the other|\nExam takeaway:)/i);
                const whyOther = extract(/Why the other options are less appropriate:\s*([\s\S]*?)(?=\nExam takeaway:)/i);
                const takeaway = extract(/Exam takeaway:\s*([\s\S]*?)(?=\nSource origin:)/i);
                const source = extract(/Source origin:\s*([\s\S]*?)(?=\nQuestion \d+|$)/i);
                
                if (prompt && correct) {
                    setsData[currentSetIndex].questions.push({
                        prompt, options: { A: optA, B: optB, C: optC, D: optD },
                        correct: correct.toUpperCase(), rationale, whyOther, takeaway, source
                    });
                }
            });
            parsedSets = setsData;
        }

        // Render the Home Screen List
        function renderHome() {
            const list = document.getElementById('set-list');
            list.innerHTML = '';
            
            parsedSets.forEach((set) => {
                if(set.questions.length === 0) return; // Skip if no questions parsed for a set
                
                const progress = userProgress[set.id] || {};
                const answeredCount = Object.keys(progress).length;
                const totalCount = set.questions.length;
                
                list.innerHTML += `
                    <li class="set-item">
                        <div class="set-info">
                            <h3>${set.title}</h3>
                            <p>Progress: ${answeredCount} / ${totalCount} questions answered</p>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="startQuiz('${set.id}')">
                                ${answeredCount > 0 && answeredCount < totalCount ? 'Continue' : 'Start'}
                            </button>
                            <button class="btn btn-danger" onclick="resetQuiz('${set.id}')" ${answeredCount === 0 ? 'disabled' : ''}>Reset</button>
                        </div>
                    </li>
                `;
            });
        }

        // Initialize and Open a specific Quiz Set
        function startQuiz(setId) {
            activeSetId = setId;
            const progress = userProgress[activeSetId] || {};
            
            // Find first unanswered question, or start at 0
            const set = parsedSets.find(s => s.id === activeSetId);
            activeQuestionIndex = 0;
            for(let i=0; i < set.questions.length; i++) {
                if(!progress[i]) {
                    activeQuestionIndex = i;
                    break;
                }
            }
