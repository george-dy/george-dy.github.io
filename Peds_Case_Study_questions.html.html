Combined Case Studies Set 1
Question 1
A 4-day-old newborn, born at 39 weeks gestation, is evaluated in the clinic for yellowing of the skin. The infant is exclusively breastfed, nursing 8 times per day, and has had two wet diapers and one small stool in the past 24 hours. Birth weight was 3200 g; current weight is 2950 g. The infant is alert, and vital signs are stable. Total serum bilirubin is 15.5 mg/dL.
What is the most likely etiology of this infant's hyperbilirubinemia?
A. Breast milk jaundice due to factors in mature breast milk
B. Suboptimal intake hyperbilirubinemia secondary to dehydration
C. Hemolytic disease of the newborn causing rapid red cell breakdown
D. Physiologic neonatal jaundice from immature hepatic conjugation
 
 
 
Correct answer: B. Suboptimal intake hyperbilirubinemia secondary to dehydration
Rationale: This infant is exhibiting signs of suboptimal intake (breastfeeding) jaundice, which typically occurs in the first week of life. The clinical picture includes inadequate stooling, decreased urine output, and excessive weight loss (approximately 8% in this case), leading to increased enterohepatic circulation of bilirubin.
Why the other options are less appropriate:
●	A. Breast milk jaundice typically presents after the first week of life in infants who are feeding well, gaining weight appropriately, and have normal stool/urine output.
●	C. Hemolytic disease usually presents with jaundice within the first 24 hours of life and a rapid rise in bilirubin, which is not described here.
●	D. While physiologic jaundice is common, the excessive weight loss and decreased output point specifically to a caloric and fluid intake deficit exacerbating the hyperbilirubinemia.
Exam takeaway: Differentiate suboptimal intake jaundice (first week, weight loss, low output) from breast milk jaundice (after first week, thriving infant).
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 3 (Hyperbilirubinemia in Infants — Quick Comparison).

Question 2
A 3-week-old infant is brought to the clinic because the umbilical stump fell off a week ago, but the area remains moist. On examination, there is a small, soft, pink nodule at the base of the umbilicus with a small amount of clear, yellowish drainage. The surrounding skin is normal in color, and the infant is afebrile and feeding well.
What is the most appropriate next step in management?
A. Initiate oral broad-spectrum antibiotics and monitor closely
B. Apply silver nitrate to the granulation tissue
C. Obtain an ultrasound of the umbilicus to rule out a patent urachus
D. Reassure the parents that this is a normal finding that will resolve spontaneously
 
 
 
Correct answer: B. Apply silver nitrate to the granulation tissue
Rationale: The presentation is classic for an umbilical granuloma, which is persistent granulation tissue after cord separation. It is characterized by a small, moist, pink/red nodule with clear or yellow serous drainage, lacking surrounding erythema or systemic signs of infection. Silver nitrate application is the standard first-line treatment.
Why the other options are less appropriate:
●	A. Oral antibiotics are indicated for omphalitis, which would present with surrounding erythema, purulent/foul-smelling drainage, and potential systemic signs (fever, lethargy).
●	C. Ultrasound is not routinely indicated for a classic, uncomplicated granuloma unless there is suspicion for an underlying anatomical anomaly (e.g., patent omphalomesenteric duct or urachus) that fails to respond to standard therapy.
●	D. While small granulomas may occasionally resolve, standard management involves chemical cauterization with silver nitrate to prevent prolonged drainage and secondary infection.
Exam takeaway: Distinguish umbilical granuloma (pink nodule, clear drainage, no erythema) from omphalitis (spreading erythema, purulence, systemic illness).
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 8 (Umbilical Granuloma vs Omphalitis).

Question 3
During a routine newborn examination, the FNP notes a sacral dimple. Which of the following findings would classify this dimple as high risk for occult spinal dysraphism, necessitating further imaging?
Select the correct high-risk finding:
A. The dimple is located less than 2.5 cm above the anus and the base is visible.
B. The dimple is accompanied by a small, midline skin tag and a tuft of hair.
C. The dimple is isolated, shallow, and the base is easily visualized.
D. The dimple is located in the gluteal cleft without any surrounding discoloration.
 
 
 
Correct answer: B. The dimple is accompanied by a small, midline skin tag and a tuft of hair.
Rationale: Simple sacral dimples are common and usually benign. However, high-risk features for occult spinal dysraphism include a dimple located >2.5 cm above the anus, an inability to see the base of the dimple, or the presence of associated cutaneous abnormalities such as midline masses, skin tags, hemangiomas, or hair tufts.
Why the other options are less appropriate:
●	A. A dimple <2.5 cm from the anus with a visible base is considered low risk and typically requires no further imaging.
●	C. An isolated, shallow dimple with a visible base is a normal variant.
●	D. Location within the gluteal cleft without other cutaneous markers is characteristic of a benign, simple dimple.
Exam takeaway: High-risk sacral dimples require imaging (ultrasound <6 months or MRI >6 months); risk factors include distance >2.5 cm from the anus, hidden base, or associated cutaneous stigmata.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 11 (Sacral Dimples).

Question 4
A 3-month-old infant is evaluated for frequent regurgitation after feeds. The mother reports that the infant spits up 3-4 times a day but is gaining weight appropriately along the 50th percentile, seems happy, and has normal stooling patterns. The infant is exclusively breastfed.
What is the most appropriate initial management for this patient?
A. Initiate a 4-week trial of an extensively hydrolyzed formula.
B. Prescribe a short course of a proton pump inhibitor for acid suppression.
C. Provide reassurance and continue current breastfeeding practices.
D. Order an upper gastrointestinal series to rule out anatomic abnormalities.
 
 
 
Correct answer: C. Provide reassurance and continue current breastfeeding practices.
Rationale: This infant is a "happy spitter" with uncomplicated gastroesophageal reflux and normal weight gain. Uncomplicated infant reflux requires no laboratory, imaging, or pharmacologic intervention; management consists of reassurance, avoiding overfeeding, and continuing breastfeeding.
Why the other options are less appropriate:
●	A. A trial of an extensively hydrolyzed formula or maternal dairy elimination is indicated if there is suspicion of cow's milk protein allergy (e.g., bloody stools, eczema, severe irritability), which is absent here.
●	B. Acid suppression is not a routine first-line treatment for infant reflux and is reserved for established acid-mediated GERD or erosive esophagitis.
●	D. An upper GI series is not used to diagnose GERD; it is reserved for evaluating suspected anatomic abnormalities (e.g., malrotation) when alarm features like bilious vomiting are present.
Exam takeaway: "Happy spitters" with normal growth require only reassurance and conservative feeding modifications, not medications or imaging.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 23 (Gastroesophageal Reflux Disease).

Question 5
A 10-month-old infant presents with a 2-day history of watery diarrhea and vomiting. The infant is alert but irritable. Physical examination reveals sunken eyes, dry mucous membranes, and a capillary refill time of 3 seconds. The infant has had only two wet diapers in the past 12 hours. Weight is down 6% from the last well-child visit.
What is the most appropriate initial rehydration strategy for this patient?
A. Administer 20 mL/kg of normal saline as an intravenous bolus.
B. Provide 50-100 mL/kg of oral rehydration solution over 2-4 hours.
C. Encourage the mother to offer plain water and diluted apple juice frequently.
D. Administer 10 mL/kg of oral rehydration solution after each subsequent diarrheal stool.
 
 
 
Correct answer: B. Provide 50-100 mL/kg of oral rehydration solution over 2-4 hours.
Rationale: This infant exhibits signs of moderate dehydration (6% weight loss, irritability, sunken eyes, dry mucous membranes, delayed capillary refill). The standard initial treatment for mild-to-moderate dehydration is oral rehydration therapy (ORT) with a commercial ORS at 50-100 mL/kg over 2-4 hours.
Why the other options are less appropriate:
●	A. Intravenous fluid resuscitation is indicated for severe dehydration or shock (e.g., lethargy, hypotension, absent tears, anuria), which this infant does not currently exhibit.
●	C. Plain water, soda, and undiluted juices lack the appropriate sodium-glucose ratio for rehydration and can worsen electrolyte imbalances or diarrhea.
●	D. Replacing ongoing losses (10 mL/kg after each stool) is the correct strategy after the initial rehydration deficit has been corrected.
Exam takeaway: Mild-to-moderate dehydration is managed with ORT (50-100 mL/kg over 2-4 hours); severe dehydration requires IV fluid resuscitation.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide (Oral Rehydration Therapy — Infants).

Question 6
A 14-year-old adolescent presents for an annual health maintenance visit. The patient denies any physical complaints but appears withdrawn. According to current USPSTF and AAP GLAD-PC guidelines, what is the most appropriate screening approach for this patient?
Choose the correct screening approach:
A. Screen for depression using a validated tool, as universal screening is recommended for this age group.
B. Screen for anxiety only if the patient reports specific somatic symptoms or school avoidance.
C. Delay depression screening until the patient is at least 16 years old unless warning signs are present.
D. Administer the Pediatric Symptom Checklist, as it is the only validated tool for patients over age 12.
 
 
 
Correct answer: A. Screen for depression using a validated tool, as universal screening is recommended for this age group.
Rationale: Both the USPSTF and the AAP GLAD-PC guidelines recommend annual universal screening for depression in adolescents aged 12 and older during health maintenance visits. Validated tools such as the PHQ-9-A or Columbia Depression Scale are appropriate.
Why the other options are less appropriate:
●	B. The USPSTF also recommends anxiety screening for youth ages 8-18; screening should not be delayed until somatic symptoms appear.
●	C. Universal depression screening begins at age 12, not 16.
●	D. The Pediatric Symptom Checklist is a general psychosocial screen, but specific tools like the PHQ-9-A are preferred and validated for adolescent depression screening.
Exam takeaway: Universal depression screening is recommended annually for all adolescents aged 12-18.
Source origin: Mental Health Fall 2026 s.pdf, Slide (2026 Screening: What FNP Students Should Remember).

Question 7
A 16-year-old is diagnosed with moderate major depressive disorder, and cognitive behavioral therapy is initiated. After four weeks, the patient's symptoms have not significantly improved, and the FNP decides to initiate fluoxetine.
What essential counseling must the FNP provide to the patient and their caregivers regarding this medication?
A. The medication carries a risk of serotonin syndrome, which requires immediate emergency department evaluation if muscle rigidity occurs.
B. There is a small increased risk of suicidal thinking and behavior, particularly during the initial weeks of treatment.
C. The medication may cause permanent growth suppression, requiring annual endocrinology evaluations.
D. The patient must avoid all tyramine-rich foods to prevent a life-threatening hypertensive crisis.
 
 
 
Correct answer: B. There is a small increased risk of suicidal thinking and behavior, particularly during the initial weeks of treatment.
Rationale: SSRIs carry an FDA black box warning regarding the potential emergence of suicidal thinking and behavior (suicidality) in children, adolescents, and young adults. The risk is highest during the initial weeks of treatment or following dose changes, requiring close monitoring.
Why the other options are less appropriate:
●	A. While serotonin syndrome is a rare but serious risk, it is typically associated with polypharmacy (e.g., combining SSRIs with MAOIs), not monotherapy initiation.
●	C. SSRIs do not cause permanent growth suppression; however, weight and growth should be monitored as appetite changes can occur.
●	D. Dietary tyramine restrictions are required for Monoamine Oxidase Inhibitors (MAOIs), not SSRIs.
Exam takeaway: Always counsel families on the SSRI black box warning for suicidality and schedule close follow-up during the first few weeks of treatment.
Source origin: Mental Health Fall 2026 s.pdf, Slide (SSRI Black Box Warning).

Question 8
A 4-year-old boy is brought to the clinic for a well-child visit. The mother reports that he frequently falls when running and has difficulty climbing stairs. On examination, the FNP notes enlarged calf muscles. When asked to stand up from a seated position on the floor, the child uses his hands to "walk" up his thighs.
What is the most appropriate initial diagnostic test to order based on these findings?
A. Electromyography and nerve conduction studies
B. Serum creatine kinase level
C. Magnetic resonance imaging of the lower extremities
D. Karyotype analysis to evaluate for chromosomal abnormalities
 
 
 
Correct answer: B. Serum creatine kinase level
Rationale: The clinical presentation of proximal muscle weakness, calf pseudohypertrophy, and a positive Gowers sign is highly suspicious for Duchenne muscular dystrophy. The most appropriate initial screening test is a serum creatine kinase (CK) level, which will be markedly elevated in dystrophinopathies.
Why the other options are less appropriate:
●	A. EMG and nerve conduction studies are invasive and not the first-line screening test for suspected muscular dystrophy.
●	C. MRI is not indicated for the initial diagnosis of neuromuscular weakness.
●	D. Karyotype analysis evaluates for chromosomal aneuploidies (e.g., Down syndrome), whereas Duchenne is an X-linked recessive single-gene mutation diagnosed via genetic testing after an elevated CK prompts suspicion.
Exam takeaway: Motor delay + weakness + Gowers sign + calf hypertrophy = check CK immediately and refer to pediatric neurology.
Source origin: Atypical Development Cases.pptx, Slide 23 (Case 3: 'Late Walker' or Neuromuscular Disease?).

Question 9
A 2-year-old child has a capillary blood lead level of 18 µg/dL obtained during a routine screening. A confirmatory venous blood lead level is drawn and results at 22 µg/dL. According to current CDC and AAP guidelines, what is the most appropriate next step in management?
Select the correct management step:
A. Initiate oral chelation therapy immediately and admit to the hospital.
B. Repeat the venous blood lead level in 1 to 3 months and assess for iron deficiency.
C. Provide anticipatory guidance, arrange an environmental investigation, and repeat the venous level in 2 weeks to 1 month.
D. Reassure the parents that this level is below the toxicity threshold and requires no further action.
 
 
 
Correct answer: C. Provide anticipatory guidance, arrange an environmental investigation, and repeat the venous level in 2 weeks to 1 month.
Rationale: For a confirmed venous blood lead level (BLL) of 20-44 µg/dL, management requires a complete history and physical, environmental investigation/hazard reduction, and repeating the venous BLL in 2 weeks to 1 month. Chelation is not routinely recommended in this range.
Why the other options are less appropriate:
●	A. Chelation and hospitalization are reserved for BLL ≥45 µg/dL or symptomatic patients.
●	B. A repeat interval of 1-3 months is appropriate for confirmed BLLs of 10-19 µg/dL, not 20-44 µg/dL.
●	D. The CDC reference value is 3.5 µg/dL; there is no safe blood lead level, and a level of 22 µg/dL requires active intervention and close monitoring.
Exam takeaway: Match the follow-up interval to the confirmed venous BLL: 3.5-9 (3 mos), 10-19 (1-3 mos), 20-44 (2 wks-1 mo), ≥45 (urgent/expert).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide (Pediatric Lead Exposure: Management by Confirmed Venous BLL).

Question 10
A 5-year-old child is evaluated for behavioral concerns in kindergarten. The teacher reports that the child cannot stay seated, frequently interrupts others, and struggles to follow multi-step instructions. The parents report similar behaviors at home. The child is diagnosed with attention-deficit/hyperactivity disorder (ADHD).
What is the recommended first-line treatment for this patient according to AAP guidelines?
A. Initiation of a long-acting stimulant medication combined with classroom accommodations.
B. Referral for evidence-based parent training in behavior management.
C. Prescription of a non-stimulant medication such as atomoxetine to avoid stimulant side effects.
D. Placement in a specialized educational program with an individualized education plan (IEP).
 
 
 
Correct answer: B. Referral for evidence-based parent training in behavior management.
Rationale: For preschool-aged children (ages 4 to <6 years) with ADHD, the AAP recommends evidence-based parent training in behavior management (PTBM) and/or behavioral classroom interventions as the first-line treatment. Medication is only considered if behavioral interventions fail to provide significant improvement and the child continues to have moderate-to-severe impairment.
Why the other options are less appropriate:
●	A. Stimulant medications are first-line for school-aged children (6-11 years), not preschoolers.
●	C. Non-stimulants are not first-line for any age group and are reserved for patients who cannot tolerate stimulants or have specific comorbidities.
●	D. An IEP is an educational support mechanism, not a primary medical/behavioral treatment for ADHD, and not every child with ADHD qualifies for specialized instruction under IDEA.
Exam takeaway: Preschool ADHD (4-5 years) = Behavior therapy first; School-age ADHD (6-11 years) = FDA-approved medication + behavior therapy.
Source origin: ADHD.pptx, Slide (Treatment by Age: AAP Framework).

Question 11
A 2-year-old toddler is brought to the clinic for a well-child visit. The parent expresses frustration that the child constantly says "no," insists on choosing their own clothes, and refuses help when trying to put on shoes. According to Erikson’s stages of psychosocial development, which developmental task is this child currently navigating?
Choose the correct stage:
A. Basic trust versus mistrust
B. Initiative versus guilt
C. Autonomy versus shame and doubt
D. Industry versus inferiority
 
 
 
Correct answer: C. Autonomy versus shame and doubt
Rationale: Toddlers (ages 1-3 years) are in Erikson's stage of Autonomy vs. Shame and Doubt. They strive for independence, want to control their physical environment, and frequently assert their will (e.g., saying "no," insisting on doing tasks themselves). Success leads to a sense of will and autonomy.
Why the other options are less appropriate:
●	A. Trust vs. Mistrust is the task of infancy (birth to 1 year), centered around consistent caregiving and feeding.
●	B. Initiative vs. Guilt is the task of the preschool years (ages 3-6), centered around exploration and asserting power in a social context.
●	D. Industry vs. Inferiority is the task of school-age children (ages 6-11), focused on mastering academic and social skills.
Exam takeaway: Toddlerhood = Autonomy vs. Shame/Doubt (toilet training, independence); Preschool = Initiative vs. Guilt (exploration).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 3 (Developmental Theories).

Question 12
A 7-year-old child presents for a well-child visit. The child’s body mass index (BMI) is at the 92nd percentile. The family history is notable for a paternal grandfather who suffered a myocardial infarction at age 68. The parents ask if the child should have a lipid panel drawn today.
What is the most appropriate response based on current pediatric cholesterol screening guidelines?
A. Universal screening is recommended today because the child is between the ages of 6 and 8.
B. Screening is indicated today because the child’s BMI is at or above the 85th percentile.
C. Screening should be deferred until the child is between 9 and 11 years old, as there are no current risk factors.
D. Screening is only recommended if the child’s BMI exceeds the 97th percentile or if diabetes is present.
 
 
 
Correct answer: B. Screening is indicated today because the child’s BMI is at or above the 85th percentile.
Rationale: While universal cholesterol screening is recommended between ages 9-11, targeted screening is indicated before age 9 if the child has risk factors. A BMI ≥85th percentile (overweight) is a recognized cardiovascular risk factor that warrants early lipid screening, regardless of the family history provided.
Why the other options are less appropriate:
●	A. Universal screening does not begin until age 9.
●	C. The child has a clear risk factor (BMI ≥85th percentile), so screening should not be deferred.
●	D. A BMI ≥85th percentile is sufficient to warrant screening; waiting for the 97th percentile or a diabetes diagnosis misses the window for early intervention in overweight children.
Exam takeaway: Screen universally at 9-11 years; screen earlier if BMI ≥85th percentile or there is a family history of premature CVD.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 28 (Cholesterol Screening).

Question 13
A 20-month-old child is evaluated for speech delay. The child uses five single words and follows simple commands. The parent reports that the child frequently points to objects to share interest, maintains good eye contact, and responds consistently to their name. The child has a history of recurrent otitis media.
What is the most appropriate next step in the evaluation of this child?
A. Reassure the parents that the child's social skills indicate typical development and schedule a follow-up in six months.
B. Administer an autism-specific screening tool and refer for a comprehensive developmental evaluation.
C. Obtain a formal audiology evaluation and refer for early intervention speech-language services.
D. Initiate a trial of broad-spectrum antibiotics to treat potential chronic middle ear effusion.
 
 
 
Correct answer: C. Obtain a formal audiology evaluation and refer for early intervention speech-language services.
Rationale: The child presents with an expressive language delay but intact social communication (joint attention, eye contact, response to name), making Autism Spectrum Disorder less likely. However, the history of recurrent otitis media strongly suggests a potential hearing impairment contributing to the delay. A formal hearing test and referral for Early Intervention / speech-language pathology are the essential next steps.
Why the other options are less appropriate:
●	A. A language delay is never "wait and see," even if social skills are intact; early intervention is critical.
●	B. While autism screening is routinely done at 18 and 24 months, the immediate clinical priority based on the history of otitis media is ruling out hearing loss and addressing the language delay.
●	D. Antibiotics are not indicated without evidence of acute otitis media or chronic effusion confirmed by tympanometry/otoscopy; hearing evaluation is the priority.
Exam takeaway: Intact joint attention + language delay + recurrent OM = suspect hearing loss; order audiology and refer to Early Intervention immediately.
Source origin: Atypical Development Cases.pptx, Slide 21 (Case 1: Expressive Language Delay or More?).

Question 14
A 6-week-old infant is evaluated for a 24-hour history of loose, yellow stools. The mother reports the infant is breastfeeding every 2 hours and has had five wet diapers today. The infant is alert, smiling, and has moist mucous membranes.
Which of the following additional findings would be considered a "red flag" requiring urgent evaluation and potential emergency referral?
A. The infant has a rectal temperature of 100.5°F (38.1°C).
B. The infant's stool contains small, yellow, seedy particles.
C. The infant spits up a small amount of milk after most feeds.
D. The infant has had four bowel movements in the past 12 hours.
 
 
 
Correct answer: A. The infant has a rectal temperature of 100.5°F (38.1°C).
Rationale: In an infant under 60-90 days of age, a rectal temperature of ≥100.4°F (38.0°C) is a major red flag indicating potential severe bacterial illness or sepsis. This requires an immediate, urgent evaluation, often including a full sepsis workup and emergency referral, regardless of the presence of mild diarrhea.
Why the other options are less appropriate:
●	B. Yellow, seedy stools are a normal finding in breastfed infants.
●	C. Spitting up small amounts of milk is normal physiologic reflux in a thriving, well-hydrated infant.
●	D. Frequent bowel movements are common in breastfed neonates and young infants and do not constitute a red flag in the absence of dehydration or systemic illness.
Exam takeaway: Fever (≥100.4°F) in an infant <60 days is an automatic red flag requiring urgent sepsis evaluation, superseding mild gastrointestinal symptoms.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide (Infant Diarrhea: Assessment & Red Flags).

Question 15
A mother brings her infant to the clinic for a 6-month well-child visit. The infant was born at 32 weeks gestation (8 weeks premature). The mother is concerned because the infant is not yet sitting independently, which she notes is a typical 6-month milestone. Based on the concept of corrected age, how should the FNP evaluate this infant's gross motor development?
Select the correct evaluation approach:
A. Evaluate the infant against 4-month developmental milestones.
B. Evaluate the infant against 6-month milestones but allow a 2-month grace period.
C. Evaluate the infant against 8-month milestones due to the prematurity.
D. Disregard the gestational age, as corrected age is only used until 3 months of chronological age.
 
 
 
Correct answer: A. Evaluate the infant against 4-month developmental milestones.
Rationale: Corrected age is calculated by subtracting the weeks or months of prematurity from the chronological age. For an infant who is 6 months chronological age and 2 months (8 weeks) premature, the corrected age is 4 months. Developmental milestones should be evaluated against this corrected age until the child catches up (usually by age 2 to 2.5 years).
Why the other options are less appropriate:
●	B. A "grace period" is not a standardized clinical method; the exact corrected age must be used for accurate milestone tracking.
●	C. Evaluating against an older age (8 months) would inappropriately raise false concerns for severe developmental delay.
●	D. Corrected age is utilized well beyond 3 months, typically until 24 months of age or until the child's development catches up to peers.
Exam takeaway: Corrected Age = Chronological Age - Weeks/Months Premature. Always use corrected age for developmental milestone assessment in premature infants.
Source origin: 2 Growth and development Part 2.pdf, Page 27-29 (Premature Infants).

Question 16
A 5-year-old boy is diagnosed with attention-deficit/hyperactivity disorder (ADHD) after a comprehensive evaluation confirms symptoms and functional impairment across home and preschool settings. His parents are eager to start medication to help him focus. According to current AAP guidelines, what is the most appropriate first-line treatment for this patient?
Choose the correct treatment:
A. Initiation of a long-acting stimulant medication combined with classroom accommodations
B. Referral for evidence-based parent training in behavior management
C. Prescription of a non-stimulant medication such as atomoxetine to avoid stimulant side effects
D. Placement in a specialized educational program with an individualized education plan (IEP)
 
 
 
Correct answer: B. Referral for evidence-based parent training in behavior management
Rationale: For preschool-aged children (ages 4 to <6 years) with ADHD, the AAP recommends evidence-based parent training in behavior management (PTBM) and/or behavioral classroom interventions as the first-line treatment. Medication is only considered if behavioral interventions fail to provide significant improvement and the child continues to have moderate-to-severe impairment.
Why the other options are less appropriate:
●	A. Stimulant medications are first-line for school-aged children (6-11 years), not preschoolers.
●	C. Non-stimulants are not first-line for any age group and are reserved for patients who cannot tolerate stimulants or have specific comorbidities.
●	D. An IEP is an educational support mechanism, not a primary medical/behavioral treatment for ADHD, and not every child with ADHD qualifies for specialized instruction under IDEA.
Exam takeaway: Preschool ADHD (4-5 years) = Behavior therapy first; School-age ADHD (6-11 years) = FDA-approved medication + behavior therapy.
Source origin: ADHD.pptx, Slide (Treatment by Age: AAP Framework).

Question 17
A 9-year-old girl with ADHD has been taking immediate-release methylphenidate for three months. Her parents report improved focus at school but note she has difficulty falling asleep and has lost her appetite at lunchtime.
What is the most appropriate next step in managing this patient’s treatment?
A. Discontinue the methylphenidate immediately and switch to a non-stimulant medication
B. Reassure the parents that these are transient side effects that will resolve without intervention
C. Adjust the timing of the medication dose and monitor her growth trajectory and sleep hygiene
D. Order a baseline electrocardiogram (EKG) to evaluate for stimulant-induced cardiac arrhythmias
 
 
 
Correct answer: C. Adjust the timing of the medication dose and monitor her growth trajectory and sleep hygiene
Rationale: Appetite suppression and insomnia are common adverse effects of stimulant medications. Management includes adjusting the timing of the dose (e.g., giving it earlier in the day), encouraging a large breakfast, and monitoring height/weight trajectories and blood pressure/heart rate.
Why the other options are less appropriate:
●	A. Discontinuation is premature; side effects can often be managed with dose timing adjustments or formulation changes before abandoning a highly effective medication class.
●	B. While some side effects improve, appetite suppression and sleep disruption require active monitoring and management to prevent growth faltering and daytime fatigue.
●	D. A baseline EKG is only recommended for individuals with a positive cardiac history or a family history of unexplained sudden death/MI before age 50, not as a routine response to common side effects.
Exam takeaway: Manage common stimulant side effects (appetite, sleep) with dose timing and hygiene adjustments; monitor growth and cardiovascular parameters routinely.
Source origin: ADHD.pptx, Slide (Stimulant Monitoring & Adverse Effects).

Question 18
An 8-year-old boy is evaluated for poor academic performance and inattention. His teacher reports he frequently stares off into space and fails to complete assignments. The parents note he snores loudly, breathes through his mouth, and is restless at night.
What is the most appropriate next step in the evaluation of this patient?
A. Administer the Vanderbilt ADHD Diagnostic Rating Scale to confirm an ADHD diagnosis
B. Refer for a sleep study to evaluate for obstructive sleep apnea
C. Initiate a trial of a long-acting stimulant medication to improve daytime alertness
D. Order an electroencephalogram (EEG) to rule out absence seizures
 
 
 
Correct answer: B. Refer for a sleep study to evaluate for obstructive sleep apnea
Rationale: Insufficient sleep and sleep-disordered breathing (such as obstructive sleep apnea) are common mimics of ADHD. Symptoms like inattention, hyperactivity, and daytime sleepiness can be entirely secondary to poor sleep quality. Evaluating and treating the underlying sleep disorder is the priority before diagnosing ADHD.
Why the other options are less appropriate:
●	A. While rating scales are useful, diagnosing ADHD without first ruling out a clear medical mimic (like sleep apnea suggested by snoring and mouth breathing) is inappropriate.
●	C. Stimulants are contraindicated as a first-line treatment for inattention secondary to an untreated sleep disorder.
●	D. While absence seizures can cause staring spells, the prominent history of snoring and restless sleep strongly points toward a sleep-disordered breathing etiology as the primary differential.
Exam takeaway: Always rule out mimics like sleep apnea, vision/hearing impairment, and anxiety before diagnosing ADHD, especially when specific clues (e.g., snoring) are present.
Source origin: ADHD.pptx, Slide (ADHD or Something Else? Common Mimics).

Question 19
An 18-month-old toddler is brought to the clinic for a well-child visit. The mother reports he has a few words but rarely points to objects to share interest, does not consistently respond to his name, and becomes extremely distressed if his daily routine is altered. He spends most of his playtime spinning the wheels of a toy car.
What is the most appropriate next step in management?
A. Reassure the mother that boys often develop language later and schedule a follow-up in six months
B. Administer an autism-specific screening tool and refer immediately for Early Intervention services
C. Diagnose Autism Spectrum Disorder (ASD) based on the clinical presentation and start behavioral therapy
D. Order a comprehensive metabolic panel and genetic testing to rule out inborn errors of metabolism
 
 
 
Correct answer: B. Administer an autism-specific screening tool and refer immediately for Early Intervention services
Rationale: The child exhibits core red flags for ASD: deficits in social communication (lack of joint attention/pointing, poor response to name) and restricted/repetitive behaviors (spinning wheels, rigidity). The FNP should administer an autism-specific screen (e.g., M-CHAT) and refer to Early Intervention immediately; services should not wait for a definitive diagnostic evaluation.
Why the other options are less appropriate:
●	A. "Wait and see" is inappropriate for developmental red flags, particularly those suggestive of ASD or significant communication delays.
●	C. Primary care providers screen and refer; a definitive ASD diagnosis typically requires a comprehensive multidisciplinary evaluation using tools like the ADOS-2, though Early Intervention should begin concurrently.
●	D. While genetic or metabolic testing may be part of a comprehensive neurodevelopmental workup, the immediate primary care step is screening and securing Early Intervention services.
Exam takeaway: Social communication deficits + repetitive behaviors = high ASD risk. Screen, refer for comprehensive evaluation, and initiate Early Intervention immediately.
Source origin: Atypical Development Cases.pptx, Slide 22 (Case 2: Social Communication Red Flags).

Question 20
A mother brings her 24-month-old child to the clinic, expressing concern that the child used to say "mama" and "dada" and wave bye-bye at 12 months, but has since stopped using words and no longer makes eye contact. How should the FNP interpret this developmental history?
Select the correct interpretation:
A. This represents a normal developmental plateau that frequently occurs between 18 and 24 months of age
B. This is a major red flag indicating developmental regression that requires urgent comprehensive evaluation
C. This is likely secondary to a recent mild viral illness and will resolve with time and reassurance
D. This indicates a primary expressive language delay that can be managed with routine outpatient speech therapy
 
 
 
Correct answer: B. This is a major red flag indicating developmental regression that requires urgent comprehensive evaluation
Rationale: The loss of previously acquired milestones (language or social skills) at any age is a significant red flag. It warrants urgent and comprehensive evaluation for neurologic, metabolic, or severe neurodevelopmental conditions, including Autism Spectrum Disorder or childhood disintegrative disorder.
Why the other options are less appropriate:
●	A. Developmental plateaus may occur, but the actual loss of previously established skills (regression) is never considered normal.
●	C. While severe illness can temporarily delay progress, true regression of language and social skills is not a typical post-viral sequela and requires immediate investigation.
●	D. A primary expressive language delay involves a failure to acquire new words, not the loss of previously acquired words and social engagement.
Exam takeaway: Any loss of previously acquired developmental milestones (regression) is an absolute red flag requiring urgent, comprehensive medical and neurodevelopmental evaluation.
Source origin: 2 Growth and development Part 2.pdf, Page 31 (Key Points: Anytime a milestone is met and then lost is a reason for further evaluation).

Question 21
During a newborn examination, the father asks the FNP when the "soft spot" on the back of the baby's head will close.
What is the most accurate response regarding the closure of the posterior fontanel?
A. It typically closes by two months of age
B. It typically closes by six months of age
C. It typically closes by twelve months of age
D. It typically closes by twenty-four months of age
 
 
 
Correct answer: A. It typically closes by two months of age
Rationale: The posterior fontanel is small and typically closes early, usually by two months of age. The anterior fontanel, which is much larger, typically closes later, between 12 and 24 months of age.
Why the other options are less appropriate:
●	B. Six months is incorrect for the posterior fontanel; it may be relevant for some suture lines but not the posterior fontanel.
●	C. Twelve months is the approximate time frame for the closure of the posterior lateral (mastoid) fontanel or early closure of the anterior fontanel.
●	D. Twenty-four months is the upper limit for the closure of the anterior fontanel, not the posterior.
Exam takeaway: Posterior fontanel closes by 2 months; Anterior fontanel closes by 12-24 months.
Source origin: 2 Growth and development Part 2.pdf, Page 41 (Age of Fontanel Closure).

Question 22
A mother of a healthy newborn weighing 3200 grams at birth asks the FNP about expected weight gain patterns during the first year of life. According to standard pediatric growth parameters, at what age should this infant approximately triple their birth weight?
Choose the correct age:
A. 4 to 5 months of age
B. 6 to 7 months of age
C. 12 months of age
D. 24 months of age
 
 
 
Correct answer: C. 12 months of age
Rationale: A general rule of thumb for infant growth is that birth weight doubles by 4 to 5 months of age and triples by 12 months (1 year) of age.
Why the other options are less appropriate:
●	A. Birth weight typically doubles (not triples) by 4 to 5 months of age.
●	B. Six to seven months does not correspond to a standard birth weight multiplier milestone.
●	D. By 24 months, a child typically quadruples their birth weight.
Exam takeaway: Birth weight doubles by 4-5 months, triples by 1 year, and quadruples by 2 years.
Source origin: 2 Growth and development Part 2.pdf, Page 35 (Weight).

Question 23
A 2-year-old child is brought to the clinic for a well-child visit. The parents report frequent temper tantrums, a strong desire to dress themselves, and frequent use of the word "no." According to Erikson’s psychosocial theory, which developmental conflict is this child currently navigating?
Select the correct stage:
A. Basic trust versus mistrust
B. Autonomy versus shame and doubt
C. Initiative versus guilt
D. Industry versus inferiority
 
 
 
Correct answer: B. Autonomy versus shame and doubt
Rationale: Toddlers (ages 1-3 years) are in Erikson's stage of Autonomy vs. Shame and Doubt. They strive for independence, want to control their physical environment, and frequently assert their will (e.g., saying "no," insisting on doing tasks themselves). Success leads to a sense of will and autonomy.
Why the other options are less appropriate:
●	A. Trust vs. Mistrust is the task of infancy (birth to 1 year), centered around consistent caregiving and feeding.
●	C. Initiative vs. Guilt is the task of the preschool years (ages 3-6), centered around exploration and asserting power in a social context.
●	D. Industry vs. Inferiority is the task of school-age children (ages 6-11), focused on mastering academic and social skills.
Exam takeaway: Toddlerhood = Autonomy vs. Shame/Doubt (toilet training, independence); Preschool = Initiative vs. Guilt (exploration).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 3 (Developmental Theories).

Question 24
A 4-year-old child is observed engaging in highly imaginative pretend play, believing that the moon follows them when they walk, and struggling to understand that other people have different perspectives. According to Piaget’s cognitive development theory, which stage best describes this child's thinking?
Choose the correct stage:
A. Sensorimotor stage
B. Preoperational stage
C. Concrete operational stage
D. Formal operational stage
 
 
 
Correct answer: B. Preoperational stage
Rationale: The preoperational stage (ages 2-7 years) is characterized by symbolic and imaginative play, egocentrism (difficulty seeing others' perspectives), and magical thinking (e.g., believing the moon follows them).
Why the other options are less appropriate:
●	A. The sensorimotor stage (birth to 2 years) focuses on coordinating senses and motor actions, and developing object permanence.
●	C. The concrete operational stage (ages 7-11 years) involves logical thinking, sequential arrangement, and understanding conservation.
●	D. The formal operational stage (adolescence and beyond) involves abstract, hypothetical, and deductive reasoning.
Exam takeaway: Preschoolers (Preoperational) = Egocentric, imaginative play, magical thinking. School-age (Concrete) = Logical, conservation.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 18 (Piaget Pre-Operational Stage).

Question 25
A 9-year-old girl proudly shows the FNP a complex model airplane she built and expresses a strong desire to join a local science club to learn more with her peers. According to Erikson’s psychosocial theory, which developmental task is this child primarily focused on?
Select the correct stage:
A. Autonomy versus shame and doubt
B. Initiative versus guilt
C. Industry versus inferiority
D. Identity versus role confusion
 
 
 
Correct answer: C. Industry versus inferiority
Rationale: School-age children (ages 6-11 years) are in the Industry vs. Inferiority stage. They focus on building, creating, accomplishing tasks, mastering academic/social skills, and participating in team or group activities. Success leads to a sense of competence.
Why the other options are less appropriate:
●	A. Autonomy vs. Shame and Doubt is the task of toddlerhood (1-3 years).
●	B. Initiative vs. Guilt is the task of the preschool years (3-6 years).
●	D. Identity vs. Role Confusion is the task of adolescence (12-20 years).
Exam takeaway: School-age = Industry vs. Inferiority (building, creating, school, peers). Adolescence = Identity vs. Role Confusion.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 23 (Erikson Industry vs. Inferiority).

Question 26
During a well-child visit, an 8-year-old boy demonstrates that he understands the volume of water remains the same whether it is poured into a tall, thin glass or a short, wide glass. Which cognitive milestone has this child achieved?
Choose the correct milestone:
A. Object permanence
B. Egocentrism
C. Conservation
D. Abstract reasoning
 
 
 
Correct answer: C. Conservation
Rationale: Conservation is the understanding that quantity remains the same despite changes in shape or appearance. This is a hallmark achievement of Piaget's Concrete Operational stage, which typically occurs between ages 7 and 11.
Why the other options are less appropriate:
●	A. Object permanence (understanding objects exist when out of sight) is achieved during the Sensorimotor stage (infancy).
●	B. Egocentrism (inability to see others' perspectives) is characteristic of the Preoperational stage (preschool) and is overcome as children enter the concrete operational stage.
●	D. Abstract reasoning is the hallmark of the Formal Operational stage (adolescence).
Exam takeaway: Conservation (mass/volume remains the same despite form changes) = Concrete Operational stage (School-age).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 23 (Piaget Concrete Operational Stage).

Question 27
A 3-year-old child is found to have an elevated blood lead level. The family recently moved into a renovated apartment building constructed in 1925.
What is the most likely primary source of this child's lead exposure?
A. Contaminated drinking water from modern plastic plumbing fixtures
B. Deteriorating lead-based paint and renovation dust in older housing
C. Consumption of imported traditional spices and cosmetics
D. Take-home exposure from a parent working in a modern battery recycling plant
 
 
 
Correct answer: B. Deteriorating lead-based paint and renovation dust in older housing
Rationale: In the United States, the most common source of significant lead exposure in young children is deteriorating lead-based paint and the resulting dust in homes built before 1978, particularly during renovation activities that disturb the paint.
Why the other options are less appropriate:
●	A. Modern plastic plumbing does not contain lead; lead in water typically comes from older lead service lines or brass fixtures with lead solder.
●	C. While imported spices/cosmetics can contain lead, the history of a 1925 renovated building makes lead paint/dust the overwhelmingly most likely primary source.
●	D. Take-home exposure is a valid risk, but the specific history of a pre-1978 renovated home points directly to the environment as the primary source.
Exam takeaway: Homes built before 1978 + renovation/toddler hand-to-mouth behavior = high risk for lead-based paint and dust exposure.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 30 (Lead Exposure in Children).

Question 28
A 2-year-old child has a confirmatory venous blood lead level (BLL) of 14 µg/dL. The environmental source of lead has been identified and remediated. According to current CDC guidelines, what is the most appropriate follow-up testing interval for this patient?
Select the correct follow-up interval:
A. Repeat venous BLL in 2 weeks to 1 month
B. Repeat venous BLL in 1 to 3 months
C. Repeat venous BLL in 3 to 6 months
D. Repeat venous BLL in 6 to 9 months
 
 
 
Correct answer: B. Repeat venous BLL in 1 to 3 months
Rationale: For a confirmed venous BLL of 10-19 µg/dL, guidelines recommend repeating the venous BLL in 1 to 3 months initially, and then every 3-6 months as the level declines, ensuring the exposure source is controlled.
Why the other options are less appropriate:
●	A. A 2-week to 1-month interval is indicated for higher confirmed levels (20-44 µg/dL).
●	C. A 3-6 month interval is used for subsequent follow-up after the initial 1-3 month recheck, or for lower initial levels.
●	D. A 6-9 month interval is appropriate for confirmed levels of 3.5-9 µg/dL after the initial 3-month recheck.
Exam takeaway: Match follow-up intervals to confirmed venous BLL: 3.5-9 (3 mos), 10-19 (1-3 mos), 20-44 (2 wks-1 mo), ≥45 (urgent).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide (Lead Exposure: Testing & Follow-up).

Question 29
A 10-year-old girl presents with excessive worry about her parents getting into a car accident. She refuses to sleep in her own bed and frequently complains of stomach aches on school mornings, leading to school refusal. Her symptoms have persisted for eight months and are impairing her academic functioning.
Which diagnosis best fits this clinical presentation?
A. Generalized Anxiety Disorder (GAD)
B. Separation Anxiety Disorder
C. Specific Phobia
D. Normative developmental worry
 
 
 
Correct answer: B. Separation Anxiety Disorder
Rationale: Separation Anxiety Disorder is characterized by developmentally inappropriate, excessive anxiety concerning separation from primary attachment figures, including persistent worry about harm befalling them, reluctance to sleep alone, and somatic complaints (stomach aches) when separation is anticipated.
Why the other options are less appropriate:
●	A. GAD involves excessive worry about multiple everyday domains (school performance, competence, world events), not specifically focused on separation from caregivers.
●	C. Specific phobia is an irrational fear of a specific object or situation (e.g., dogs, heights), not separation.
●	D. Normative worry is temporary, situation-specific, and does not cause significant functional impairment (like 8 months of school refusal).
Exam takeaway: Somatic symptoms (stomach aches) + school refusal + fear of harm to caregivers = Separation Anxiety Disorder.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Separation Anxiety Disorder).

Question 30
A 15-year-old adolescent screens positive for suicidal ideation on the Ask Suicide-Screening Questions (ASQ) tool during a routine well-child visit. The patient admits to thinking about suicide but denies having a specific plan or intent.
What is the most critical next step in the FNP's management?
A. Reassure the patient that these thoughts are common and schedule a follow-up in one month
B. Conduct a brief suicide safety assessment, counsel on lethal means restriction, and involve caregivers
C. Immediately prescribe an SSRI and refer to outpatient cognitive behavioral therapy
D. Discharge the patient with a crisis hotline number and instruct them to call if symptoms worsen
 
 
 
Correct answer: B. Conduct a brief suicide safety assessment, counsel on lethal means restriction, and involve caregivers
Rationale: A positive suicide screen requires an immediate Brief Suicide Safety Assessment to determine the level of risk (thoughts, plan, intent, past behavior). Crucial steps include developing a safety plan, involving caregivers, and counseling on restricting access to lethal means (e.g., firearms, medications).
Why the other options are less appropriate:
●	A. Suicidal ideation is never dismissed as "common" without a thorough safety assessment and safety planning.
●	C. Medication initiation does not replace the immediate need for a safety assessment, means restriction, and acute safety planning.
●	D. Discharging an at-risk youth without a safety plan, means restriction counseling, and caregiver involvement is unsafe and violates standard suicide prevention protocols.
Exam takeaway: Positive suicide screen → Assess safety/plan → Restrict lethal means → Involve caregivers/supports.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Suicide Risk: What Should the Clinician Look For?).

Question 31
A 14-year-old with major depressive disorder is started on fluoxetine. The FNP provides anticipatory guidance to the patient and their parents regarding the FDA black box warning for SSRIs. Which statement accurately reflects the counseling that must be provided?
Choose the correct counseling statement:
A. The medication carries a high risk of completed suicide, requiring inpatient admission for initiation
B. There is a small increased risk of suicidal thinking and behavior, particularly during the initial weeks of treatment
C. The medication may cause permanent growth suppression, requiring annual endocrinology evaluations
D. The patient must avoid all tyramine-rich foods to prevent a life-threatening hypertensive crisis
 
 
 
Correct answer: B. There is a small increased risk of suicidal thinking and behavior, particularly during the initial weeks of treatment
Rationale: SSRIs carry an FDA black box warning regarding the potential emergence of suicidal thinking and behavior (suicidality) in children, adolescents, and young adults. The risk is highest during the initial weeks of treatment or following dose changes, requiring close monitoring.
Why the other options are less appropriate:
●	A. The warning is for suicidal ideation/behavior, not completed suicide (which was not increased in trials), and inpatient admission is not required for routine initiation.
●	C. SSRIs do not cause permanent growth suppression, though weight and appetite should be monitored.
●	D. Dietary tyramine restrictions are required for Monoamine Oxidase Inhibitors (MAOIs), not SSRIs.
Exam takeaway: Always counsel families on the SSRI black box warning for suicidality and schedule close follow-up during the first few weeks of treatment.
Source origin: Mental Health Fall 2026 s.pdf, Slide (SSRI Black Box Warning).

Question 32
A 4-month-old infant is brought to the emergency department with a 2-day history of severe vomiting and diarrhea. On examination, the infant is lethargic, has sunken eyes, absent tears, dry mucous membranes, and mottled, cool extremities with a capillary refill time of 5 seconds.
What is the most appropriate immediate management for this patient?
A. Administer 50-100 mL/kg of oral rehydration solution over 2-4 hours
B. Encourage the mother to breastfeed frequently and monitor wet diapers
C. Initiate emergency evaluation and intravenous (IV) fluid resuscitation
D. Administer a bolus of oral ondansetron and reattempt oral rehydration
 
 
 
Correct answer: C. Initiate emergency evaluation and intravenous (IV) fluid resuscitation
Rationale: This infant exhibits signs of severe dehydration and impending shock (lethargy, absent tears, mottled/cool extremities, prolonged capillary refill). Severe dehydration requires immediate emergency evaluation and IV/IO fluid resuscitation; oral rehydration is contraindicated in patients with altered mental status or shock.
Why the other options are less appropriate:
●	A. Oral rehydration therapy (ORT) is appropriate for mild-to-moderate dehydration in an alert infant who can safely drink, not for severe dehydration/shock.
●	B. Breastfeeding alone is insufficient and unsafe for an infant in shock with severe dehydration.
●	D. Antiemetics do not replace the urgent need for volume resuscitation in a patient with signs of poor perfusion and shock.
Exam takeaway: Severe dehydration (lethargy, mottled skin, prolonged cap refill, absent tears) = IV fluids and emergency care. Mild/Moderate = ORT.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide (Severe Dehydration in Infants).

Question 33
A 3-month-old infant is evaluated for frequent regurgitation. The mother reports the infant spits up after most feeds but is gaining weight well and appears happy. Which of the following findings would be considered an "alarm feature" requiring prompt diagnostic evaluation for conditions other than uncomplicated GERD?
Select the alarm feature:
A. Spitting up small amounts of breast milk 30 minutes after feeding
B. Occasional fussiness that resolves after being burped and held upright
C. Forceful, bilious (green) vomiting accompanied by poor weight gain
D. Passing frequent, seedy, yellow stools throughout the day
 
 
 
Correct answer: C. Forceful, bilious (green) vomiting accompanied by poor weight gain
Rationale: Alarm features for infant reflux include bilious (green) or forceful vomiting, GI bleeding, systemic illness, or poor weight gain. Bilious vomiting is a medical emergency that requires immediate evaluation for anatomic abnormalities such as malrotation with volvulus.
Why the other options are less appropriate:
●	A. Spitting up small amounts of milk in a thriving, happy infant is normal physiologic reflux ("happy spitter").
●	B. Occasional fussiness relieved by burping is common and does not suggest a pathologic condition.
●	D. Frequent, seedy, yellow stools are a normal finding in breastfed infants.
Exam takeaway: "Happy spitter" = reassure. Bilious vomiting, hematemesis, or poor weight gain = urgent evaluation for anatomic or severe pathology.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 23 (Gastroesophageal Reflux Disease).

Question 34
A 6-month-old infant's growth chart reveals weight at the 3rd percentile, length at the 3rd percentile, but head circumference at the 50th percentile. The parents are of average height and weight.
What does this pattern of discrepant growth percentiles most strongly suggest?
A. Familial short stature
B. Constitutional delay of growth and puberty
C. Caloric insufficiency or endocrine growth failure
D. Normal genetic variation
 
 
 
Correct answer: C. Caloric insufficiency or endocrine growth failure
Rationale: Discrepant percentiles (e.g., weight and length <5th percentile, but head circumference 50th percentile) suggest an acquired or systemic issue such as caloric insufficiency, malabsorption, or endocrine failure. In contrast, familial short stature typically presents with all parameters (weight, length, HC) tracking proportionately along a lower percentile curve.
Why the other options are less appropriate:
●	A. Familial short stature presents with proportionate short stature (all parameters <5th percentile) and normal growth velocity, matching the midparental height.
●	B. Constitutional delay involves a temporary slowdown in growth but maintains proportionate parameters and is usually identified later in childhood/adolescence.
●	D. Normal genetic variation would not typically cause such a severe discrepancy between somatic growth (weight/length) and brain growth (head circumference).
Exam takeaway: Proportionate small size = consider genetic/familial. Discrepant percentiles (e.g., normal HC, low weight/length) = suspect caloric insufficiency or systemic disease.
Source origin: 2 Growth and development Part 2.pdf, Page 44 (Pattern Representative Diagnoses).

Question 35
During a well-child visit, a child is observed riding a tricycle, jumping in place, and walking up and down stairs with one foot on each step (not alternating feet). The child speaks in three-word sentences and engages in interactive play.
What is the most likely chronological age of this child?
A. 18 months
B. 24 months (2 years)
C. 36 months (3 years)
D. 48 months (4 years)
 
 
 
Correct answer: C. 36 months (3 years)
Rationale: A 3-year-old child typically rides a tricycle, jumps in place, walks up and down stairs with one foot on each step (alternating feet develops around age 4), uses three-word sentences, and engages in interactive/cooperative play.
Why the other options are less appropriate:
●	A. An 18-month-old runs clumsily, walks up stairs with hand held, and uses 10-25 single words.
●	B. A 2-year-old runs well, goes up and down stairs one foot at a time (two feet per step), uses 2-word sentences, and engages in parallel play.
●	D. A 4-year-old hops on one foot, goes up and down stairs alternating feet, and tells elaborate stories.
Exam takeaway: 3 years = Tricycle, 3-word sentences, jumps, stairs (one foot per step). 4 years = Alternates feet on stairs, hops.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 33 (Tips for 15mth-5 yrs) & Slide 19 (36 mth).

Question 36
A 16-month-old toddler is evaluated for a well-child visit. The FNP notes that the child is unable to pick up small raisins using a thumb-and-finger pincer grasp, continuing to use a clumsy raking motion instead. How should the FNP interpret this physical examination finding?
Select the correct interpretation:
A. This is a normal developmental variation for a 16-month-old child
B. This represents an abnormal fine motor finding that requires further developmental evaluation
C. This is expected if the child was born 4 weeks premature and corrected age is applied
D. This indicates a gross motor delay rather than a fine motor delay
 
 
 
Correct answer: B. This represents an abnormal fine motor finding that requires further developmental evaluation
Rationale: A neat pincer grasp is typically mastered by 9 to 12 months of age. The inability to use a pincer grasp by 15 months is explicitly identified as an abnormal fine motor milestone and a red flag requiring further neurodevelopmental evaluation.
Why the other options are less appropriate:
●	A. A raking grasp at 16 months is significantly delayed; the pincer grasp should be well-established.
●	C. Even applying a 1-month prematurity correction (making the child 15 months corrected), the lack of a pincer grasp remains an abnormal finding.
●	D. Pincer grasp involves eye-hand coordination and small muscle control, which defines fine motor skills, not gross motor skills.
Exam takeaway: Abnormal fine motor red flags include persistently fisted hands at 3 months, failure to transfer objects by 1 year, and abnormal/absent pincer grasp by 15 months.
Source origin: 2 Growth and development Part 2.pdf, Page 17 (Abnormal Fine Motor).

Question 37
A 24-month-old child is evaluated for speech and language development. The child uses approximately 60 words, puts two words together to form sentences (e.g., "want milk"), and is understood by unfamiliar listeners about 50% of the time.
How should the FNP interpret this language development?
A. The child has a significant expressive language delay requiring immediate referral
B. The child has a receptive language delay but normal expressive language
C. The child's language development is appropriate for their chronological age
D. The child's development is advanced and suggests a high likelihood of giftedness
 
 
 
Correct answer: C. The child's language development is appropriate for their chronological age
Rationale: By 24 months (2 years), a typically developing child should have a vocabulary of about 50 words, use 2-word sentences, and be approximately 50% intelligible to strangers. This child is meeting these milestones perfectly.
Why the other options are less appropriate:
●	A. The child is meeting all expected expressive language milestones for 24 months; there is no delay.
●	B. There is no information suggesting a receptive language deficit, and the expressive language is entirely normal.
●	D. While the child is doing well, these are standard, expected milestones for a 2-year-old, not necessarily indicative of "giftedness."
Exam takeaway: 2 years = 50 words, 2-word sentences, 50% intelligible. 3 years = 3-word sentences, 75% intelligible.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 16 (2 yr well exam) & 2 Growth and development Part 2.pdf, Page 20.

Question 38
During a well-baby check, the FNP observes that a 6-week-old infant smiles back responsively when the mother smiles and talks to her. What specific developmental milestone does this represent?
Choose the correct milestone:
A. Reflexive smiling
B. Social smile
C. anticipatory smiling
D. Reciprocal play
 
 
 
Correct answer: B. Social smile
Rationale: A true "social smile" (smiling responsively to a caregiver's face or voice) typically emerges around 6 weeks of age. This is a critical early social/emotional milestone indicating normal visual and neurological development.
Why the other options are less appropriate:
●	A. Reflexive smiling occurs in utero or during the first few weeks of life (often during sleep) and is not triggered by external social stimuli.
●	C. Anticipatory smiling and more complex reciprocal interactions develop later in infancy (around 6-9 months).
●	D. Reciprocal play (like peekaboo) develops later, typically around 9 months of age.
Exam takeaway: Social smile emerges at 6 weeks. Lack of a social smile by 2 months is a red flag for visual or neurodevelopmental impairment.
Source origin: 2 Growth and development Part 2.pdf, Page 24 (Social/Emotional).

Question 39
A 10-year-old boy with ADHD and a comorbid tic disorder has not responded well to stimulant therapy due to exacerbation of his tics and severe rebound irritability. The FNP decides to switch to a non-stimulant medication. Which of the following medications is an alpha-2 adrenergic agonist that may be particularly useful for this patient's symptom profile?
Select the correct medication:
A. Atomoxetine
B. Viloxazine
C. Guanfacine extended-release
D. Bupropion
 
 
 
Correct answer: C. Guanfacine extended-release
Rationale: Guanfacine ER (Intuniv) and clonidine (Kapvay) are alpha-2 adrenergic agonists. They are non-stimulant options for ADHD that can be particularly beneficial when hyperactivity, impulsivity, sleep difficulties, or comorbid tic disorders are present, as they do not exacerbate tics like stimulants sometimes can.
Why the other options are less appropriate:
●	A. Atomoxetine is a selective norepinephrine reuptake inhibitor (SNRI), not an alpha-2 agonist.
●	B. Viloxazine is also a selective norepinephrine reuptake inhibitor, not an alpha-2 agonist.
●	D. Bupropion is an atypical antidepressant (NDRI) sometimes used off-label for ADHD, but it is not an alpha-2 agonist and lowers the seizure threshold.
Exam takeaway: Alpha-2 agonists (guanfacine, clonidine) are useful non-stimulants for ADHD, especially when tics, severe hyperactivity, or insomnia are comorbid.
Source origin: ADHD.pptx, Slide (Nonstimulants: When and Why?).

Question 40
A 9-year-old girl presents with recurrent abdominal pain and nausea that only occur on school mornings. She frequently asks to stay home, and her symptoms resolve completely on weekends and holidays. A thorough medical workup for gastrointestinal pathology is negative.
What is the most likely underlying etiology of this patient's somatic symptoms?
A. Factitious disorder imposed on self
B. Oppositional defiant disorder (ODD)
C. Pediatric anxiety disorder
D. Irritable bowel syndrome (IBS)
 
 
 
Correct answer: C. Pediatric anxiety disorder
Rationale: Somatic symptoms (headaches, stomach aches, nausea) are extremely common physical presentations of pediatric anxiety disorders. The pattern of symptoms occurring exclusively around a specific stressor (school) and resolving on weekends strongly suggests anxiety-related school refusal rather than a primary GI or behavioral disorder.
Why the other options are less appropriate:
●	A. Factitious disorder involves intentional falsification of symptoms for the "sick role," which is rare in this age group and less likely than anxiety.
●	B. ODD involves a pattern of angry/irritable mood, argumentative/defiant behavior, and vindictiveness, not primarily somatic complaints.
●	D. While IBS causes abdominal pain, the strict correlation with school days and negative workup strongly points to a psychosomatic etiology driven by anxiety.
Exam takeaway: Recurrent somatic complaints (stomach aches, headaches) tied to specific stressors (school) with negative medical workups are classic presentations of pediatric anxiety.
Source origin: Mental Health Fall 2026 s.pdf, Slide (How Anxiety Presents: Physical Symptoms).

Question 41
A newborn develops visible jaundice at 18 hours of life. The mother's blood type is O positive, and the infant's blood type is A positive. The direct antiglobulin test (DAT) is weakly positive.
What is the most likely cause of this infant's hyperbilirubinemia?
A. Physiologic neonatal jaundice
B. Breast milk jaundice
C. ABO incompatibility
D. Rh(D) alloimmunization
 
 
 
Correct answer: C. ABO incompatibility
Rationale: Jaundice appearing within the first 24 hours of life is pathologic and often due to hemolysis. ABO incompatibility typically occurs when a mother with type O blood carries a fetus with type A or B blood. Maternal anti-A or anti-B IgG antibodies cross the placenta, causing hemolysis. It can affect the first pregnancy and often yields a weakly positive DAT.
Why the other options are less appropriate:
●	A. Physiologic jaundice typically appears after the first 24 hours of life (peaking days 3-5).
●	B. Breast milk jaundice typically presents after the first week of life in a thriving, well-fed infant.
●	D. Rh(D) alloimmunization requires an Rh-negative mother and an Rh-positive fetus, which is not the case here (mother is O positive).
Exam takeaway: Jaundice <24 hours = pathologic (hemolysis). Mother O, Baby A/B = ABO incompatibility.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 6 (Hemolytic Disease & Neonatal Jaundice).

Question 42
A 2-year-old child has a capillary blood lead screening level of 12 µg/dL obtained via a finger stick.
What is the mandatory next step in the management of this patient?
A. Initiate oral chelation therapy immediately
B. Obtain a confirmatory venous blood lead level within 1 month
C. Reassure the parents and repeat the capillary screen in 6 months
D. Order an abdominal radiograph to look for ingested lead paint chips
 
 
 
Correct answer: B. Obtain a confirmatory venous blood lead level within 1 month
Rationale: Capillary lead screens are prone to environmental contamination from the skin. Any elevated capillary result must be confirmed with a venous blood draw. For a capillary level of 10-19 µg/dL, the confirmatory venous test should be obtained within 1 month.
Why the other options are less appropriate:
●	A. Chelation is never initiated based on a capillary screen and is not routinely recommended for levels <45 µg/dL.
●	C. An elevated capillary screen cannot be ignored; it requires venous confirmation to guide appropriate environmental and medical follow-up.
●	D. Abdominal radiographs are only indicated if there is a history or high suspicion of recent ingestion of radiopaque lead objects (e.g., paint chips), not as a routine follow-up for an elevated screen.
Exam takeaway: Always confirm elevated capillary lead screens with a venous draw. Timing depends on the capillary level (e.g., 10-19 µg/dL = within 1 month).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide (Lead Exposure: Testing & Follow-up).

Question 43
An 8-year-old boy presents for a well-child visit. His BMI is at the 96th percentile. He has no known family history of premature cardiovascular disease or dyslipidemia. According to NHLBI and AAP guidelines, what is the most appropriate action regarding cholesterol screening for this patient?
Choose the correct action:
A. Defer screening until the universal screening window of 9 to 11 years of age
B. Order a fasting lipid panel today due to his BMI being at or above the 95th percentile
C. Screen only if his blood pressure is also found to be elevated during today's visit
D. Order a random total cholesterol level and defer a full lipid panel until adolescence
 
 
 
Correct answer: B. Order a fasting lipid panel today due to his BMI being at or above the 95th percentile
Rationale: While universal screening occurs between ages 9-11, targeted screening is indicated before age 9 for children with specific risk factors. Obesity (BMI ≥95th percentile) is a major cardiovascular risk factor that warrants early lipid screening, regardless of family history.
Why the other options are less appropriate:
●	A. Deferring is incorrect because the child has a clear, guideline-supported risk factor (obesity) that mandates early screening.
●	C. Hypertension is another independent risk factor, but obesity alone is sufficient to trigger early screening.
●	D. A full fasting lipid panel is required to accurately assess LDL, HDL, and triglycerides; random total cholesterol is insufficient for risk stratification.
Exam takeaway: Universal lipid screen at 9-11 years. Screen earlier if BMI ≥85th percentile, hypertension, or strong family history of premature CVD.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 28 (Cholesterol Screening).

Question 44
A 12-hour-old term newborn is noted to have blue-tinged hands and feet, while the trunk, face, and mucous membranes remain pink. The infant is crying vigorously and feeding well.
What is the most appropriate clinical interpretation and management of this finding?
A. This represents central cyanosis and requires immediate cardiac evaluation
B. This is acrocyanosis, a benign and common finding in the first 24-48 hours of life
C. This indicates severe hypothermia and requires placement in an incubator
D. This suggests methemoglobinemia and requires administration of methylene blue
 
 
 
Correct answer: B. This is acrocyanosis, a benign and common finding in the first 24-48 hours of life
Rationale: Acrocyanosis is a benign, peripheral cyanosis of the hands and feet (and sometimes face) caused by immature peripheral vascular circulation and vasoconstriction. It is extremely common in the first few hours to days of life and resolves spontaneously, provided the central circulation (trunk, mucous membranes) remains pink.
Why the other options are less appropriate:
●	A. Central cyanosis involves the trunk, tongue, and mucous membranes and indicates severe hypoxemia or cardiac disease; this infant's trunk is pink.
●	C. While cold stress can exacerbate peripheral vasoconstriction, acrocyanosis itself is a normal physiologic response in a well-appearing, feeding term infant.
●	D. Methemoglobinemia presents with central, "chocolate brown" cyanosis and respiratory distress, not isolated peripheral blueness in a vigorous infant.
Exam takeaway: Acrocyanosis (blue hands/feet, pink trunk) in a newborn = benign, reassure. Central cyanosis (blue trunk/lips) = emergency.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 10 (Acrocyanosis).

Question 45
A 3-year-old child presents for a routine health maintenance visit. Which of the following is a new, age-specific physical examination component that should be initiated at this visit?
Select the correct component:
A. Measurement of head circumference
B. Assessment of the parachute reflex
C. Measurement of blood pressure
D. Screening for lead exposure
 
 
 
Correct answer: C. Measurement of blood pressure
Rationale: According to standard pediatric well-child care guidelines (and specifically noted in the provided course materials), routine annual blood pressure measurement begins at 3 years of age for children without specific underlying risk factors.
Why the other options are less appropriate:
●	A. Head circumference is measured routinely until 2 years of age (or 36 months depending on specific chart, but BP is the new milestone explicitly taught at 36 months). Self-correction: The slide explicitly states "36 mth Full exam first blood pressure".
●	B. The parachute reflex is a protective response that appears around 8-9 months of age and persists; it is not a new assessment at 3 years.
●	D. Lead screening is typically performed at 12 months and 24 months, or based on risk assessment, not specifically initiated as a new routine at 36 months.
Exam takeaway: 3-year well-child visit = First routine blood pressure measurement, vision/hearing screening, and 3-word sentences.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 19 (36 mth Well Exam).

Question 46
A mother expresses concern that her 14-month-old infant does not seem to "take notice" of things or respond to sounds the way her older child did at the same age. The infant otherwise appears healthy and is meeting gross motor milestones.
What is the most appropriate response by the FNP?
A. Reassure the mother that children develop at different rates and wait for the 18-month visit
B. Take the caregiver's suspicion seriously and investigate appropriately with hearing and developmental screens
C. Explain that gross motor development is more important than social or language development at this age
D. Order an MRI of the brain to rule out structural neurologic anomalies immediately
 
 
 
Correct answer: B. Take the caregiver's suspicion seriously and investigate appropriately with hearing and developmental screens
Rationale: A fundamental principle of developmental surveillance is that a caregiver's suspicion that their child is not seeing, hearing, or taking notice like other children must be taken very seriously and investigated promptly. Standardized hearing and developmental screenings are the appropriate next steps.
Why the other options are less appropriate:
●	A. "Wait and see" is inappropriate when a parent raises a specific concern regarding hearing or social engagement.
●	C. All developmental domains (gross/fine motor, language, social/cognitive) are equally critical, and delays in one require investigation.
●	D. An MRI is an invasive, expensive, and premature step; the initial workup involves audiology and standardized developmental screening.
Exam takeaway: Always listen to caregiver concerns regarding developmental or sensory delays; investigate promptly with appropriate screening and referrals.
Source origin: 2 Growth and development Part 2.pdf, Page 3 (Most Important: Caregiver's suspicion).

Question 47
The FNP is utilizing the Vanderbilt ADHD Diagnostic Rating Scale to evaluate an 8-year-old for ADHD. The parent and teacher forms have been returned. What is the primary clinical utility of this rating scale in the diagnostic process?
Choose the correct clinical utility:
A. It provides a definitive, standalone diagnosis of ADHD if the score exceeds the cutoff
B. It quantifies symptom severity, functional impairment, and screens for common comorbidities
C. It rules out learning disabilities and autism spectrum disorder with high sensitivity
D. It determines the exact stimulant medication and starting dose required for the patient
 
 
 
Correct answer: B. It quantifies symptom severity, functional impairment, and screens for common comorbidities
Rationale: Validated rating scales like the Vanderbilt are essential tools for collecting systematic information from multiple settings, quantifying symptom frequency, assessing functional impairment, and screening for common comorbidities (e.g., ODD, anxiety, depression). They support, but do not replace, the clinical diagnosis.
Why the other options are less appropriate:
●	A. Rating scales do NOT independently diagnose ADHD; results must be integrated with DSM-5-TR criteria, clinical history, and a thorough evaluation.
●	C. While they may flag concerns, they are not definitive diagnostic tools for learning disabilities or ASD, which require specialized psychoeducational or neurodevelopmental testing.
●	D. Rating scales assess symptoms and impairment; they do not dictate specific pharmacologic prescribing decisions or dosages.
Exam takeaway: Rating scales (Vanderbilt, Conners) support the diagnosis by quantifying symptoms and impairment across settings, but clinical integration is required for the final diagnosis.
Source origin: ADHD.pptx, Slide (Rating Scales: Support the Diagnosis).

Question 48
During a well-child visit, an 8-month-old infant watches the FNP hide a small toy under a blanket and immediately reaches for the blanket to uncover the toy. Which cognitive milestone has this infant demonstrated?
Select the correct milestone:
A. Conservation
B. Egocentrism
C. Object permanence
D. Abstract reasoning
 
 
 
Correct answer: C. Object permanence
Rationale: Object permanence is the understanding that objects continue to exist even when they cannot be seen. This is a hallmark cognitive achievement of Piaget's Sensorimotor stage, typically developing between 6 and 9 months of age.
Why the other options are less appropriate:
●	A. Conservation (understanding quantity remains the same despite shape changes) is achieved in the Concrete Operational stage (school-age).
●	B. Egocentrism (inability to see others' perspectives) is characteristic of the Preoperational stage (preschool).
