            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            renderQuestion();
        }

        // Render the Current Question
        function renderQuestion() {
            const set = parsedSets.find(s => s.id === activeSetId);
            const q = set.questions[activeQuestionIndex];
            const progress = userProgress[activeSetId] || {};
            const savedAnswer = progress[activeQuestionIndex];
            
            document.getElementById('progress-indicator').innerText = `Question ${activeQuestionIndex + 1} of ${set.questions.length}`;
            document.getElementById('question-text').innerText = q.prompt;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Generate Radio Buttons
            ['A', 'B', 'C', 'D'].forEach(letter => {
                if (!q.options[letter]) return;
                
                const isChecked = savedAnswer === letter ? 'checked' : '';
                const isDisabled = savedAnswer ? 'disabled' : '';
                
                let extraClass = '';
                if (savedAnswer) {
                    if (letter === q.correct) extraClass = 'correct-option';
                    else if (letter === savedAnswer) extraClass = 'incorrect-option';
                }

                optionsContainer.innerHTML += `
                    <label class="option-label ${isDisabled} ${extraClass}">
                        <input type="radio" name="option" value="${letter}" ${isChecked} ${isDisabled} onchange="enableSubmit()">
                        <span><strong>${letter}.</strong> ${q.options[letter]}</span>
                    </label>
                `;
            });
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = !savedAnswer; // Disable if hasn't selected yet
            submitBtn.style.display = savedAnswer ? 'none' : 'inline-block';
            
            if (savedAnswer) showFeedback(savedAnswer, q);
            else document.getElementById('feedback-container').style.display = 'none';
            
            // Toggle Navigation Buttons
            document.getElementById('prev-btn').disabled = activeQuestionIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (activeQuestionIndex === set.questions.length - 1) {
                nextBtn.innerText = "Finish Set";
            } else {
                nextBtn.innerText = "Next Question";
            }
        }

        function enableSubmit() {
            document.getElementById('submit-btn').disabled = false;
        }

        // Handle User Answer Submission
        function submitAnswer() {
            const selected = document.querySelector('input[name="option"]:checked');
            if (!selected) return;
            
            const answer = selected.value;
            if (!userProgress[activeSetId]) userProgress[activeSetId] = {};
            userProgress[activeSetId][activeQuestionIndex] = answer;
            
            // Save to localStorage
            localStorage.setItem('pediatricExamProgress', JSON.stringify(userProgress));
            
            const set = parsedSets.find(s => s.id === activeSetId);
            const q = set.questions[activeQuestionIndex];
            
            renderQuestion(); // Re-render to show correct/incorrect CSS classes
            showFeedback(answer, q);
        }

        // Display the Rationale Box
        function showFeedback(selected, q) {
            const fbContainer = document.getElementById('feedback-container');
            const fbTitle = document.getElementById('feedback-title');
            
            fbContainer.style.display = 'block';
            fbContainer.className = 'feedback ' + (selected === q.correct ? 'correct' : 'incorrect');
            fbTitle.innerText = selected === q.correct ? 'Correct!' : 'Incorrect';
            
            document.getElementById('fb-correct-letter').innerText = `${q.correct}. ${q.options[q.correct]}`;
            document.getElementById('fb-rationale').innerText = q.rationale;
            
            if (q.whyOther) {
                document.getElementById('fb-why-other-container').style.display = 'block';
                document.getElementById('fb-why-other').innerText = q.whyOther;
            } else {
                document.getElementById('fb-why-other-container').style.display = 'none';
            }
            
            document.getElementById('fb-takeaway').innerText = q.takeaway;
            document.getElementById('fb-source').innerText = q.source;
        }

        // Forward & Back controls
        function navigate(direction) {
            const set = parsedSets.find(s => s.id === activeSetId);
            if (activeQuestionIndex + direction >= set.questions.length) {
                goHome(); // Finish the set
                return;
            }
            activeQuestionIndex += direction;
            renderQuestion();
        }

        // Return to Home Menu
        function goHome() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
            renderHome();
        }

        // Clear local storage for a specific set
        function resetQuiz(setId) {
            if(confirm('Are you sure you want to reset your progress for this set? All saved answers will be erased.')) {
                userProgress[setId] = {};
                localStorage.setItem('pediatricExamProgress', JSON.stringify(userProgress));
                renderHome();
            }
        }

        // Initialize App on Load
        window.onload = () => {
            parseRawText();
            renderHome();
        };
    </script>
</body>
