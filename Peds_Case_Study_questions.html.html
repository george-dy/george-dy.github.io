●	D. Abstract reasoning is the hallmark of the Formal Operational stage (adolescence).
Exam takeaway: Looking for hidden objects = Object permanence (Sensorimotor stage, infancy).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 3 (Piaget Sensorimotor Stage).

Question 49
A 13-year-old adolescent with Generalized Anxiety Disorder (GAD) is referred for Cognitive Behavioral Therapy (CBT). Which of the following is a core component of CBT that the FNP should explain to the patient and family?
Choose the correct component:
A. Uncovering unconscious conflicts from early childhood experiences
B. Cognitive restructuring and graded exposure to feared situations
C. Free association and dream analysis to resolve internal guilt
D. Strict behavioral modification using only punitive consequences
 
 
 
Correct answer: B. Cognitive restructuring and graded exposure to feared situations
Rationale: CBT focuses on the connection between thoughts, emotions, and behaviors. Core components include psychoeducation, somatic management (relaxation), cognitive restructuring (identifying and challenging negative thought patterns), and graded exposure (gradually facing feared situations to reduce avoidance).
Why the other options are less appropriate:
●	A. Uncovering unconscious childhood conflicts is the focus of psychoanalytic/psychodynamic therapy, not CBT.
●	C. Free association and dream analysis are psychoanalytic techniques, not evidence-based CBT components for pediatric anxiety.
●	D. CBT relies on positive reinforcement, skill-building, and coping strategies, not punitive behavioral modification.
Exam takeaway: CBT = Cognitive restructuring (changing thoughts) + Behavior activation/exposure (changing actions).
Source origin: Mental Health Fall 2026 s.pdf, Slide (Cognitive Behavioral Therapy).

Question 50
A mother brings her 12-month-old infant to the clinic. The infant was born at 28 weeks gestation (12 weeks/3 months premature). The mother is concerned because the infant is not yet walking independently, which she notes is a typical 12-month milestone. Based on the concept of corrected age, how should the FNP evaluate this infant's gross motor development?
Select the correct evaluation approach:
A. Evaluate the infant against 6-month developmental milestones
B. Evaluate the infant against 9-month developmental milestones
C. Evaluate the infant against 12-month milestones but allow a 1-month grace period
D. Disregard the gestational age, as corrected age is only used until 6 months of chronological age
 
 
 
Correct answer: B. Evaluate the infant against 9-month developmental milestones
Rationale: Corrected age is calculated by subtracting the weeks or months of prematurity from the chronological age. For an infant who is 12 months chronological age and 3 months (12 weeks) premature, the corrected age is 9 months (12 - 3 = 9). Developmental milestones should be evaluated against this corrected age.
Why the other options are less appropriate:
●	A. Subtracting 6 months is mathematically incorrect for an infant born 3 months premature.
●	C. A "grace period" is not a standardized clinical method; the exact corrected age must be used for accurate milestone tracking.
●	D. Corrected age is utilized well beyond 6 months, typically until 24 months of age or until the child's development catches up to peers.
Exam takeaway: Corrected Age = Chronological Age - Weeks/Months Premature. Always use corrected age for developmental milestone assessment in premature infants.
Source origin: 2 Growth and development Part 2.pdf, Page 28 (How to calculate corrected age).

Question 51
A mother brings her 3-week-old breastfed infant to the clinic for a weight check. The infant is gaining weight appropriately, has normal stool and urine output, and appears well. However, the mother notes the infant’s skin still has a yellowish tint. Total serum bilirubin is elevated, predominantly unconjugated.
Which of the following best characterizes this infant’s condition?
A. Suboptimal intake hyperbilirubinemia requiring lactation support and supplementation
B. Breast milk jaundice, which is typically benign and may persist for several weeks
C. Pathologic hemolytic jaundice requiring an immediate direct antiglobulin test
D. Biliary atresia requiring urgent pediatric gastroenterology referral and imaging
 
 
 
Correct answer: B. Breast milk jaundice, which is typically benign and may persist for several weeks
Rationale: Breast milk jaundice typically presents after the first week of life in an infant who is feeding well, gaining weight appropriately, and has normal output. It is characterized by unconjugated hyperbilirubinemia and is generally benign, though persistent jaundice should be evaluated to rule out other causes.
Why the other options are less appropriate:
●	A. Suboptimal intake jaundice occurs in the first week of life and is associated with poor feeding, excessive weight loss, and decreased output.
●	C. Hemolytic jaundice typically presents within the first 24 hours of life and is associated with a rapid rise in bilirubin and anemia.
●	D. Biliary atresia presents with conjugated (direct) hyperbilirubinemia, acholic stools, and dark urine, which does not match this unconjugated presentation.
Exam takeaway: Breast milk jaundice occurs after the first week in a thriving infant; breastfeeding jaundice (suboptimal intake) occurs in the first week in a dehydrated infant.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 4 (Hyperbilirubinemia in Infants — Quick Comparison).

Question 52
A 4-week-old infant is evaluated for frequent spitting up. The parents report the infant arches his back and cries during feeds but is gaining weight along the 50th percentile. Which of the following findings would be considered an "alarm feature" necessitating prompt diagnostic evaluation for conditions other than uncomplicated GERD?
Select the alarm feature:
A. Regurgitation of small amounts of formula 20 minutes after feeding
B. Forceful, bilious (green) vomiting accompanied by poor weight gain
C. Occasional fussiness that resolves after being burped and held upright
D. Passing frequent, seedy, yellow stools throughout the day
 
 
 
Correct answer: B. Forceful, bilious (green) vomiting accompanied by poor weight gain
Rationale: Alarm features for infant reflux include bilious or forceful vomiting, GI bleeding, systemic illness, or poor weight gain. Bilious vomiting is a medical emergency requiring immediate evaluation for anatomic abnormalities such as malrotation with volvulus.
Why the other options are less appropriate:
●	A. Spitting up small amounts of milk in a thriving infant is normal physiologic reflux.
●	B. Occasional fussiness relieved by burping is common and does not suggest a pathologic condition.
●	D. Frequent, seedy, yellow stools are a normal finding in infants and do not indicate an alarm feature for GERD.
Exam takeaway: "Happy spitter" = reassure. Bilious vomiting, hematemesis, or poor weight gain = urgent evaluation for anatomic or severe pathology.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 23 (Gastroesophageal Reflux Disease).

Question 53
A 10-month-old infant presents with mild-to-moderate dehydration secondary to acute viral gastroenteritis. The FNP prescribes oral rehydration therapy (ORT) using a commercial oral rehydration solution (ORS).
What is the most appropriate instruction for administering the ORS to this infant?
A. Administer 50-100 mL/kg of ORS as a single large bolus over 30 minutes
B. Provide plain water alternating with undiluted apple juice to encourage intake
C. Administer 5 mL (1 tsp) by syringe or spoon every 1–5 minutes, gradually increasing as tolerated
D. Dilute the commercial ORS with equal parts water to reduce the osmotic load on the gut
 
 
 
Correct answer: C. Administer 5 mL (1 tsp) by syringe or spoon every 1–5 minutes, gradually increasing as tolerated
Rationale: ORT works best when given in small, frequent amounts. Starting with 5 mL every 1-5 minutes minimizes gastric distention and reduces the likelihood of vomiting, allowing for gradual rehydration.
Why the other options are less appropriate:
●	A. Large, rapid boluses of fluid often trigger the gag reflex and lead to vomiting, worsening dehydration.
●	B. Plain water and undiluted juices lack the appropriate sodium-glucose ratio for rehydration and can worsen electrolyte imbalances or osmotic diarrhea.
●	D. Commercial ORS should never be diluted unless the product specifically requires mixing, as this alters the precise electrolyte composition necessary for rehydration.
Exam takeaway: ORT works best when given SMALL amounts FREQUENTLY — do not give a large bottle all at once.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide (Oral Rehydration Therapy (ORT) — Infants).

Question 54
A 2-week-old newborn is brought to the clinic because the umbilical cord stump fell off three days ago, but the area looks "angry." On examination, the umbilicus is red, swollen, and warm to the touch, with purulent drainage. The surrounding skin of the abdomen is erythematous, and the infant is lethargic and feeding poorly.
What is the most appropriate next step in management?
A. Apply silver nitrate to the granulation tissue and reassure the parents
B. Obtain a swab for culture and prescribe topical antibiotic ointment
C. Refer immediately to the emergency department for hospital evaluation and IV antibiotics
D. Instruct the parents to clean the area with rubbing alcohol and fold the diaper down
 
 
 
Correct answer: C. Refer immediately to the emergency department for hospital evaluation and IV antibiotics
Rationale: This presentation is classic for omphalitis, a bacterial infection of the umbilicus and surrounding tissues. The presence of spreading erythema, purulent drainage, and systemic signs (lethargy, poor feeding) constitutes a medical emergency requiring urgent hospital evaluation and IV broad-spectrum antibiotics.
Why the other options are less appropriate:
●	A. Silver nitrate is the treatment for an umbilical granuloma, which presents as a painless, moist pink nodule without surrounding erythema or systemic illness.
●	B. Topical antibiotics are insufficient for omphalitis, which can rapidly progress to necrotizing fasciitis or sepsis.
●	D. Cleaning with alcohol is inadequate for an active, spreading bacterial infection with systemic toxicity.
Exam takeaway: Distinguish umbilical granuloma (pink nodule, clear drainage, no erythema) from omphalitis (spreading erythema, purulence, systemic illness = emergency).
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 8 (Umbilical Granuloma vs Omphalitis).

Question 55
During a routine newborn examination, the FNP notes a small sacral dimple. The dimple is located 1 cm above the anus, and the base of the dimple is easily visualized. There are no surrounding skin tags, hair tufts, or discolorations.
What is the most appropriate management for this finding?
A. Order an immediate ultrasound of the lumbosacral spine
B. Reassure the parents that this is a common, benign finding requiring no further imaging
C. Refer to pediatric neurosurgery for evaluation of occult spinal dysraphism
D. Schedule an MRI of the spine to be performed when the infant is 6 months old
 
 
 
Correct answer: B. Reassure the parents that this is a common, benign finding requiring no further imaging
Rationale: Simple sacral dimples are common and usually benign. Low-risk features include a dimple located <2.5 cm above the anus, a visible base, and the absence of associated cutaneous abnormalities. No further imaging or intervention is required.
Why the other options are less appropriate:
●	A. Ultrasound is indicated for high-risk dimples (e.g., >2.5 cm from anus, hidden base, or associated cutaneous stigmata).
●	C. Neurosurgery referral is premature and unnecessary for a simple, low-risk dimple.
●	D. MRI is not indicated for low-risk dimples; it is reserved for high-risk cases or when ultrasound (if <6 months) is inconclusive.
Exam takeaway: Low-risk sacral dimples (<2.5 cm from anus, visible base, no skin stigmata) require no imaging. High-risk features warrant ultrasound (<6 months) or MRI.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 11 (Sacral Dimples- Risk for Occult Spinal Dysraphism).

Question 56
A 4-month-old infant presents with a 3-day history of watery diarrhea. The infant is alert, has moist mucous membranes, and a normal capillary refill time. Which of the following findings in the history or physical examination would be considered a "red flag" requiring broader differential diagnosis and potential urgent evaluation?
Select the red flag:
A. The infant has had 6 watery stools per day but continues to breastfeed eagerly
B. The infant’s stool contains visible streaks of blood and mucus
C. The infant has a mild diaper rash with sparing of the skin folds
D. The infant recently completed a course of amoxicillin for acute otitis media
 
 
 
Correct answer: B. The infant’s stool contains visible streaks of blood and mucus
Rationale: Red flags in infant diarrhea include blood or mucus in the stool, bilious/forceful vomiting, dehydration, toxic/lethargic appearance, and fever in a young infant. Blood and mucus suggest invasive bacterial disease or food-protein-induced allergic proctocolitis, requiring further evaluation.
Why the other options are less appropriate:
●	A. Frequent watery stools with good oral intake and normal hydration are typical of uncomplicated viral gastroenteritis.
●	C. Mild diaper dermatitis is a common complication of frequent stooling and not a red flag for systemic or severe intestinal disease.
●	D. Recent antibiotic use is a common cause of transient, uncomplicated medication-associated diarrhea.
Exam takeaway: Red flags in infant diarrhea include blood/mucus in stool, bilious vomiting, toxic appearance, and severe dehydration.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide (Infant Diarrhea: Assessment & Red Flags).

Question 57
A mother asks the FNP why her infant was able to lift his head before he was able to sit up, and why he could sit up before he could walk. Which principle of growth and development best explains this sequential pattern?
Choose the correct principle:
A. Proximodistal direction
B. Cephalocaudal direction
C. General to specific direction
D. Continuous maturation process
 
 
 
Correct answer: B. Cephalocaudal direction
Rationale: The cephalocaudal principle states that development proceeds from the head to the toe. This occurs because myelination of the nervous system follows this downward trajectory, allowing infants to gain head control before truncal control (sitting), and truncal control before lower extremity control (walking).
Why the other options are less appropriate:
●	A. Proximodistal direction refers to development proceeding from the center of the body outward to the extremities (e.g., shoulder control before fine finger control).
●	C. General to specific refers to movements starting broad and becoming refined (e.g., raking grasp before pincer grasp).
●	D. Continuous maturation is a general principle but does not specifically explain the head-to-toe sequence.
Exam takeaway: Cephalocaudal = head to toe (gross motor). Proximodistal = center to periphery (fine motor).
Source origin: 1 Growth and development Part 1.pdf, Page 6 (Principles of Growth and Development).

Question 58
During a well-child visit, the FNP palpates the fontanels of a healthy 14-month-old infant. The posterior fontanel is closed, and the anterior fontanel is still open but small. According to standard developmental parameters, by what age should the anterior fontanel typically close?
Select the correct age:
A. Two months of age
B. Six months of age
C. Twelve months of age
D. Twenty-four months of age
 
 
 
Correct answer: D. Twenty-four months of age
Rationale: The anterior fontanel typically closes between 12 and 24 months of age (often cited as up to 2 years). The posterior fontanel closes much earlier, typically by 2 months of age.
Why the other options are less appropriate:
●	A. Two months is the typical closure time for the posterior fontanel.
●	B. Six months is incorrect for the anterior fontanel; it may be relevant for some suture lines but not the anterior fontanel.
●	C. Twelve months is the lower limit or approximate time for early closure, but 24 months is the standard upper limit for normal closure.
Exam takeaway: Posterior fontanel closes by 2 months; Anterior fontanel closes by 12-24 months (2 years).
Source origin: 2 Growth and development Part 2.pdf, Page 41 (Age of Fontanel Closure).

Question 59
A mother of a healthy newborn weighing 3500 grams at birth asks the FNP about expected weight gain patterns during the first year of life. According to standard pediatric growth parameters, at what age should this infant approximately triple their birth weight?
Choose the correct age:
A. 4 to 5 months of age
B. 6 to 7 months of age
C. 12 months of age
D. 24 months of age
 
 
 
Correct answer: C. 12 months of age
Rationale: A general rule of thumb for infant growth is that birth weight doubles by 4 to 5 months of age and triples by 12 months (1 year) of age.
Why the other options are less appropriate:
●	A. Birth weight typically doubles (not triples) by 4 to 5 months of age.
●	B. Six to seven months does not correspond to a standard birth weight multiplier milestone.
●	D. By 24 months, a child typically quadruples their birth weight.
Exam takeaway: Birth weight doubles by 4-5 months, triples by 1 year, and quadruples by 2 years.
Source origin: 2 Growth and development Part 2.pdf, Page 35 (Weight).

Question 60
During a 15-month well-child visit, the FNP observes the child’s fine motor skills. The child uses a clumsy raking motion to pick up small blocks and has not yet developed a neat pincer grasp. How should the FNP interpret this physical examination finding?
Select the correct interpretation:
A. This is a normal developmental variation for a 15-month-old child
B. This represents an abnormal fine motor finding that requires further developmental evaluation
C. This is expected if the child was born 2 weeks premature and corrected age is applied
D. This indicates a gross motor delay rather than a fine motor delay
 
 
 
Correct answer: B. This represents an abnormal fine motor finding that requires further developmental evaluation
Rationale: A neat pincer grasp is typically mastered by 9 to 12 months of age. The inability to use a pincer grasp by 15 months is explicitly identified as an abnormal fine motor milestone and a red flag requiring further neurodevelopmental evaluation.
Why the other options are less appropriate:
●	A. A raking grasp at 15 months is significantly delayed; the pincer grasp should be well-established.
●	C. Even applying a 2-week prematurity correction, the lack of a pincer grasp at 14.5 months remains an abnormal finding.
●	D. Pincer grasp involves eye-hand coordination and small muscle control, which defines fine motor skills, not gross motor skills.
Exam takeaway: Abnormal fine motor red flags include persistently fisted hands at 3 months, failure to transfer objects by 1 year, and abnormal/absent pincer grasp by 15 months.
Source origin: 2 Growth and development Part 2.pdf, Page 17 (Abnormal Fine Motor).

Question 61
A 4-year-old child is evaluated for a well-child visit. The parents report that the child walks exclusively on their toes and refuses to place their heels on the ground. The child has been doing this since they began walking at 13 months of age. How should the FNP interpret this gross motor finding?
Choose the correct interpretation:
A. This is a normal variant of gait development that typically resolves by age 5
B. This represents an abnormal gross motor finding requiring further neurologic evaluation
C. This is expected in children who spend excessive time in walkers or jumpers
D. This indicates a fine motor delay rather than a gross motor delay
 
 
 
Correct answer: B. This represents an abnormal gross motor finding requiring further neurologic evaluation
Rationale: While transient toe walking can occur when children first learn to walk, persistent toe walking after the age of 3 is considered an abnormal gross motor finding and a red flag that warrants further neurologic and musculoskeletal evaluation (e.g., for cerebral palsy, tethered cord, or muscular dystrophy).
Why the other options are less appropriate:
●	A. Persistent toe walking beyond age 3 is not a normal variant and requires investigation.
●	B. While equipment use can influence development, persistent toe walking at age 4 is a clinical red flag regardless of the etiology.
●	D. Walking and gait involve large muscle groups and are classified as gross motor skills.
Exam takeaway: Gross motor red flags include poor head control at 5 months, unable to sit by 9 months, unable to walk by 18 months, and persistent toe walking after age 3.
Source origin: 2 Growth and development Part 2.pdf, Page 11 (Abnormal Gross Motor).

Question 62
A 2-year-old child is evaluated for speech delay. The child uses approximately 10 words but does not consistently follow simple one-step commands (e.g., "give me the ball") without a visual gesture. Which type of language deficit is more concerning for an underlying cognitive problem?
Select the more concerning deficit:
A. Expressive language deficit
B. Receptive language deficit
C. Articulation disorder
D. Pragmatic language deficit
 
 
 
Correct answer: B. Receptive language deficit
Rationale: Receptive language involves the child's ability to understand what is being said (Wernicke's area). Receptive deficits are generally more concerning than isolated expressive delays because they often imply a broader cognitive or neurodevelopmental problem, whereas expressive delays can sometimes be related to mechanical or isolated speech issues.
Why the other options are less appropriate:
●	A. Expressive language deficits (Broca's area) involve word production and speech; while concerning, they are less specifically tied to global cognitive impairment than receptive deficits.
●	C. Articulation disorders involve the mechanical production of speech sounds and do not typically indicate cognitive impairment.
●	D. Pragmatic language deficits involve the social use of language and are more closely associated with Autism Spectrum Disorder than global cognitive impairment.
Exam takeaway: Receptive language deficits (failure to understand) are more concerning for cognitive problems than expressive language deficits (failure to speak).
Source origin: 2 Growth and development Part 2.pdf, Page 19 (Language).

Question 63
A mother brings her 10-month-old infant to the clinic. The infant was born at 32 weeks gestation (8 weeks premature). The mother is concerned because the infant is not yet crawling, which she notes is a typical 9-month milestone. Based on the concept of corrected age and the "multiply by 10" rule for catch-up, until what chronological age should the FNP use corrected age to evaluate this infant's milestones?
Choose the correct chronological age limit:
A. 12 months of age
B. 15 months of age
C. 20 months of age
D. 24 months of age
 
 
 
Correct answer: C. 20 months of age
Rationale: Corrected age is used to evaluate premature infants. A common rule of thumb for determining when an infant should "catch up" and no longer need corrected age is to multiply the weeks of prematurity by 10. For an infant born 8 weeks premature, 8 weeks x 10 = 80 weeks, which is approximately 20 months of chronological age.
Why the other options are less appropriate:
●	A. 12 months is too early; the infant still requires corrected age assessment.
●	B. 15 months would be the catch-up age for an infant born 6 weeks premature (6 x 10 = 60 weeks).
●	D. While 2-2.5 years is a general upper limit for catch-up, the specific "multiply by 10" calculation for this infant yields 20 months.
Exam takeaway: Corrected Age = Chronological Age - Weeks/Months Premature. Catch-up timeline can be estimated by multiplying weeks premature by 10.
Source origin: 2 Growth and development Part 2.pdf, Page 30 (How long is corrected age used?).

Question 64
A 4-year-old child is observed engaging in highly imaginative pretend play, believing that the moon follows them when they walk, and struggling to understand that other people have different perspectives. According to Piaget’s cognitive development theory, which stage best describes this child's thinking?
Select the correct stage:
A. Sensorimotor stage
B. Preoperational stage
C. Concrete operational stage
D. Formal operational stage
 
 
 
Correct answer: B. Preoperational stage
Rationale: The preoperational stage (ages 2-7 years) is characterized by symbolic and imaginative play, egocentrism (difficulty seeing others' perspectives), and magical thinking (e.g., believing the moon follows them).
Why the other options are less appropriate:
●	A. The sensorimotor stage (birth to 2 years) focuses on coordinating senses and motor actions, and developing object permanence.
●	C. The concrete operational stage (ages 7-11 years) involves logical thinking, sequential arrangement, and understanding conservation.
●	D. The formal operational stage (adolescence and beyond) involves abstract, hypothetical, and deductive reasoning.
Exam takeaway: Preschoolers (Preoperational) = Egocentric, imaginative play, magical thinking. School-age (Concrete) = Logical, conservation.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 18 (Piaget Pre-Operational Stage).

Question 65
A 5-year-old child proudly shows the FNP a complex block tower they built and expresses a strong desire to help the teacher clean up the classroom to be a "good helper." According to Erikson’s psychosocial theory, which developmental conflict is this child currently navigating?
Choose the correct stage:
A. Autonomy versus shame and doubt
B. Initiative versus guilt
C. Industry versus inferiority
D. Identity versus role confusion
 
 
 
Correct answer: B. Initiative versus guilt
Rationale: Preschoolers (ages 3-6 years) are in Erikson's stage of Initiative vs. Guilt. They strive to assert control over their environment through exploration, play, and taking on tasks (like being a "helper"). Success leads to a sense of purpose, while excessive criticism or restriction can lead to guilt.
Why the other options are less appropriate:
●	A. Autonomy vs. Shame and Doubt is the task of toddlerhood (1-3 years), centered around toilet training and basic independence.
●	C. Industry vs. Inferiority is the task of school-age children (6-11 years), focused on mastering academic and social skills.
●	D. Identity vs. Role Confusion is the task of adolescence (12-20 years).
Exam takeaway: Preschool = Initiative vs. Guilt (exploration, purpose). School-age = Industry vs. Inferiority (building, creating, competence).
Source origin: 1 Growth and development Part 1.pdf, Page 19 (Erikson Initiative vs Guilt).

Question 66
During an 18-month well-child visit, the FNP reviews the child's developmental milestones. Which of the following gross motor milestones is expected to be achieved by this age?
Select the correct milestone:
A. Riding a tricycle
B. Throwing objects overhand
C. Alternating feet when walking up stairs
D. Hopping on one foot
 
 
 
Correct answer: B. Throwing objects overhand
Rationale: By 18 months of age, a typically developing child should be able to throw objects overhand. This is a key gross motor milestone for this age group, alongside walking independently and climbing onto furniture.
Why the other options are less appropriate:
●	A. Riding a tricycle is a 3-year-old milestone (3 wheels for 3 years).
●	C. Alternating feet when walking up stairs is a 4-year-old milestone.
●	D. Hopping on one foot is a 4-year-old milestone.
Exam takeaway: 18 months = throws overhand. 2 years = runs, stairs (two feet per step). 3 years = tricycle, jumps. 4 years = hops, alternates feet on stairs.
Source origin: 2 Growth and development Part 2.pdf, Page 33 (Tips for 15mth-5 yrs).

Question 67
A 2-year-old child is found to have an elevated blood lead level. The family lives in a house built in 1985, and the parents do not work in high-risk occupations. The child frequently plays in the soil near an older, heavily trafficked roadway.
What is the most likely primary source of this child's lead exposure?
A. Deteriorating lead-based paint and renovation dust in older housing
B. Contaminated soil and household dust from historical leaded gasoline emissions
C. Consumption of imported traditional spices and cosmetics
D. Drinking water from modern plastic plumbing fixtures
 
 
 
Correct answer: B. Contaminated soil and household dust from historical leaded gasoline emissions
Rationale: While lead-based paint is the most common source in pre-1978 homes, contaminated soil (especially near older roadways or industrial sites) and household dust are major sources of lead exposure. Leaded gasoline historically deposited lead in soil, which persists in the environment.
Why the other options are less appropriate:
●	A. The home was built in 1985; lead-based paint was banned in the US in 1978, making this an unlikely primary source.
●	C. While imported spices can contain lead, the history of playing in soil near a roadway points directly to environmental soil contamination.
●	D. Modern plastic plumbing does not contain lead; lead in water typically comes from older lead service lines or brass fixtures with lead solder.
Exam takeaway: Pre-1978 homes = lead paint. Pre-1978 soil near roadways = historical leaded gasoline.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 30 (Lead Exposure in Children).

Question 68
A 4-year-old child has a confirmatory venous blood lead level (BLL) of 52 µg/dL. The environmental source of lead has been identified as deteriorating paint in the home, and the family is being relocated to a lead-safe environment. According to current CDC and AAP guidelines, what is the most appropriate next step in medical management?
Choose the correct medical management:
A. Repeat the venous BLL in 1 to 3 months and monitor closely
B. Initiate oral chelation therapy in the outpatient setting
C. Consult an expert and initiate chelation therapy, considering hospitalization
D. Order an abdominal radiograph and administer bowel decontamination only
 
 
 
Correct answer: C. Consult an expert and initiate chelation therapy, considering hospitalization
Rationale: For a confirmed venous BLL ≥45 µg/dL, guidelines mandate urgent expert consultation (medical toxicology/experienced pediatric clinician) and initiation of chelation therapy. Hospitalization is often required, especially if the child is symptomatic, if a lead-safe environment cannot be immediately assured, or to manage the chelation process safely.
Why the other options are less appropriate:
●	A. A 1-3 month follow-up is appropriate for confirmed levels of 10-19 µg/dL, not severe toxicity.
●	B. While oral chelation may be used for levels 45-69 µg/dL in asymptomatic children in a guaranteed lead-safe environment, expert consultation and potential hospitalization are the standard of care for levels >50 µg/dL or when environmental control is uncertain.
●	D. Abdominal radiographs and bowel decontamination are only indicated if there is evidence of recent ingestion of radiopaque lead objects; they do not replace systemic chelation for severe blood toxicity.
Exam takeaway: BLL ≥45 µg/dL = urgent expert consultation and chelation. Do not chelate routinely for levels 20-44 µg/dL.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide (Pediatric Lead Exposure: Management by Confirmed Venous BLL).

Question 69
An 8-year-old boy presents for a well-child visit. His BMI is at the 75th percentile, and his blood pressure is normal. He has no known family history of premature cardiovascular disease or dyslipidemia. According to NHLBI and AAP guidelines, what is the most appropriate action regarding cholesterol screening for this patient?
Select the appropriate action:
A. Order a fasting lipid panel today due to his age
B. Defer screening until the universal screening window of 9 to 11 years of age
C. Screen only if his BMI exceeds the 95th percentile
D. Order a random total cholesterol level and defer a full lipid panel until adolescence
 
 
 
Correct answer: B. Defer screening until the universal screening window of 9 to 11 years of age
Rationale: Universal cholesterol screening is recommended between the ages of 9 and 11. Targeted screening before age 9 is only indicated if the child has specific risk factors, such as a BMI ≥85th percentile, hypertension, or a family history of premature CVD/dyslipidemia. This child has no risk factors, so screening should be deferred.
Why the other options are less appropriate:
●	A. Universal screening does not begin until age 9.
●	C. A BMI ≥85th percentile (overweight) is the threshold for early targeted screening, not 95th percentile.
●	D. A full fasting lipid panel is required when screening is indicated; random total cholesterol is insufficient.
Exam takeaway: Universal lipid screen at 9-11 years. Screen earlier if BMI ≥85th percentile, hypertension, or strong family history of premature CVD.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 28 (Cholesterol Screening).

Question 70
During a 4-year well-child visit, the FNP asks the child to draw a picture of a person. According to standard developmental milestones, how many body parts should a typically developing 4-year-old be able to draw?
Choose the correct number of body parts:
A. Two body parts
B. Three body parts
C. Four body parts
D. Six body parts
 
 
 
Correct answer: C. Four body parts
Rationale: A typically developing 4-year-old should be able to draw a person with at least 4 body parts (e.g., head, eyes, mouth, arms, or legs). This assesses fine motor skills and cognitive development.
Why the other options are less appropriate:
●	A. Two body parts is typical for a younger child (around 3 years).
●	B. Three body parts is also below the expected milestone for a 4-year-old.
●	D. Six body parts is typically expected by age 5 or 6.
Exam takeaway: 4 years = draws person with 4 parts. 5 years = draws person with 5+ parts, writes name.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 24 (Well Exam 4 yr old).

Question 71
A mother brings her 18-month-old child to the clinic for a well-child visit. The child has a limited vocabulary and rarely points to objects to share interest. Which of the following screening tools is specifically indicated at this visit to evaluate for Autism Spectrum Disorder (ASD)?
Select the correct screening tool:
A. Pediatric Symptom Checklist (PSC)
B. Modified Checklist for Autism in Toddlers (M-CHAT)
C. Vanderbilt ADHD Diagnostic Rating Scale
D. Screen for Child Anxiety Related Disorders (SCARED)
 
 
 
Correct answer: B. Modified Checklist for Autism in Toddlers (M-CHAT)
Rationale: The M-CHAT is a validated, autism-specific screening tool that should be administered at the 18-month and 24-month well-child visits to identify children at risk for ASD who require further comprehensive evaluation.
Why the other options are less appropriate:
●	A. The PSC is a general psychosocial screen for children 4 and older, not specific for ASD in toddlers.
●	C. The Vanderbilt is used for ADHD evaluation, typically in school-aged children.
●	D. The SCARED is used to screen for anxiety disorders in children 8 and older.
Exam takeaway: ASD-specific screening (M-CHAT) is recommended at 18 and 24 months.
Source origin: Atypical Development Cases.pptx, Slide 22 (Case 2: Social Communication Red Flags).

Question 72
A 3-year-old boy is evaluated for frequent falls and difficulty climbing stairs. The FNP notes enlarged calf muscles and a positive Gowers sign. A basic metabolic panel is ordered, which reveals significantly elevated AST and ALT levels. How should the FNP interpret these elevated transaminase levels in this clinical context?
Choose the correct interpretation:
A. They indicate concurrent acute viral hepatitis requiring isolation
B. They are likely originating from skeletal muscle breakdown rather than liver pathology
C. They suggest a primary metabolic liver disease causing secondary myopathy
D. They are a common side effect of undiagnosed hypothyroidism
 
 
 
Correct answer: B. They are likely originating from skeletal muscle breakdown rather than liver pathology
Rationale: AST and ALT are present in high concentrations in skeletal muscle as well as the liver. In the context of suspected Duchenne muscular dystrophy (Gowers sign, calf hypertrophy, proximal weakness), elevated transaminases often originate from muscle breakdown, not primary liver disease.
Why the other options are less appropriate:
●	A. While hepatitis causes elevated transaminases, the clinical picture strongly points to a neuromuscular etiology.
●	C. Primary metabolic liver diseases do not typically present with this specific pattern of proximal weakness and calf pseudohypertrophy.
●	D. Hypothyroidism can cause myopathy and mild CK/transaminase elevation, but the classic presentation described is highly specific for a dystrophinopathy.
Exam takeaway: MOTOR DELAY + WEAKNESS / GOWERS / CALF HYPERTROPHY → CHECK CK & REFER. AST/ALT may be elevated due to muscle breakdown.
Source origin: Atypical Development Cases.pptx, Slide 23 (Case 3: 'Late Walker' or Neuromuscular Disease?).

Question 73
A mother is concerned that her 24-month-old child is not speaking as much as her older sibling did at this age. The FNP assesses the child's language development. Which of the following findings would be considered a normal language milestone for a 24-month-old child?
Select the normal milestone:
A. Uses 10 single words and points to desired objects
B. Uses approximately 50 words and puts two words together to form sentences
C. Speaks in three-word sentences and is 75% intelligible to strangers
D. Tells elaborate stories and uses complex grammar
 
 
 
Correct answer: B. Uses approximately 50 words and puts two words together to form sentences
Rationale: By 24 months (2 years), a typically developing child should have a vocabulary of about 50 words, use 2-word sentences (e.g., "want milk"), and be approximately 50% intelligible to strangers.
Why the other options are less appropriate:
●	A. Using 10 single words is typical for a 15- to 18-month-old, indicating a delay in a 24-month-old.
●	C. Three-word sentences and 75% intelligibility are milestones for a 3-year-old.
●	D. Elaborate stories and complex grammar are expected in older preschool or school-age children.
Exam takeaway: 2 years = 50 words, 2-word sentences, 50% intelligible. 3 years = 3-word sentences, 75% intelligible.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 16 (2 yr well exam).

Question 74
An 8-year-old boy is being evaluated for ADHD. The parents report that his teachers have noticed significant inattention and hyperactivity in the classroom over the past 6 months. The parents note similar behaviors at home. According to DSM-5-TR criteria, which of the following is a required criterion for the diagnosis of ADHD?
Choose the correct DSM-5-TR criterion:
A. Symptoms must have been present before the age of 7 years
B. Symptoms must have been present before the age of 12 years
C. Symptoms must be present in at least three different settings
D. Symptoms must cause severe impairment in academic functioning only
 
 
 
Correct answer: B. Symptoms must have been present before the age of 12 years
Rationale: The DSM-5-TR requires that several inattentive or hyperactive-impulsive symptoms were present prior to age 12 years. (Note: DSM-IV previously required onset before age 7, but this was updated to age 12 in DSM-5).
Why the other options are less appropriate:
●	A. The age of onset criterion was changed from 7 to 12 years in the DSM-5 to better capture adolescents and older children whose symptoms become impairing as academic demands increase.
●	C. Symptoms must be present in at least two settings (e.g., home and school), not three.
●	D. Symptoms must interfere with or reduce the quality of functioning in multiple areas (social, academic, occupational), not just academic.
Exam takeaway: DSM-5-TR ADHD criteria: onset before age 12, present in ≥2 settings, causes functional impairment.
Source origin: ADHD.pptx, Slide (Diagnosis: DSM-5-TR Framework).

Question 75
A 9-year-old girl is evaluated for poor academic performance and inattention. Her teacher reports she frequently stares off into space and fails to complete assignments. The parents note she snores loudly, breathes through her mouth, and is restless at night.
What is the most appropriate next step in the evaluation of this patient?
A. Administer the Vanderbilt ADHD Diagnostic Rating Scale to confirm an ADHD diagnosis
B. Refer for a sleep study to evaluate for obstructive sleep apnea
C. Initiate a trial of a long-acting stimulant medication to improve daytime alertness
D. Order an electroencephalogram (EEG) to rule out absence seizures
 
 
 
Correct answer: B. Refer for a sleep study to evaluate for obstructive sleep apnea
Rationale: Insufficient sleep and sleep-disordered breathing (such as obstructive sleep apnea) are common mimics of ADHD. Symptoms like inattention, hyperactivity, and daytime sleepiness can be entirely secondary to poor sleep quality. Evaluating and treating the underlying sleep disorder is the priority before diagnosing ADHD.
Why the other options are less appropriate:
●	A. While rating scales are useful, diagnosing ADHD without first ruling out a clear medical mimic (like sleep apnea suggested by snoring and mouth breathing) is inappropriate.
●	C. Stimulants are contraindicated as a first-line treatment for inattention secondary to an untreated sleep disorder.
●	D. While absence seizures can cause staring spells, the prominent history of snoring and restless sleep strongly points toward a sleep-disordered breathing etiology as the primary differential.
Exam takeaway: Always rule out mimics like sleep apnea, vision/hearing impairment, and anxiety before diagnosing ADHD, especially when specific clues (e.g., snoring) are present.
Source origin: ADHD.pptx, Slide (ADHD or Something Else? Common Mimics).

Question 76
A 7-year-old boy is diagnosed with ADHD after a comprehensive evaluation confirms symptoms and functional impairment across home and school settings. His parents are eager to start treatment. According to current AAP guidelines, what is the most appropriate first-line treatment for this patient?
Select the correct treatment:
A. Referral for evidence-based parent training in behavior management only
B. Initiation of a non-stimulant medication such as atomoxetine
C. FDA-approved ADHD medication combined with parent training in behavior management
D. Placement in a specialized educational program with an individualized education plan (IEP)
 
 
 
Correct answer: C. FDA-approved ADHD medication combined with parent training in behavior management
Rationale: For school-aged children (ages 6 to <12 years) with ADHD, the AAP recommends a combination of FDA-approved ADHD medication and evidence-based parent training in behavior management (PTBM) and/or behavioral classroom interventions as the first-line treatment.
Why the other options are less appropriate:
●	A. Behavior management alone is first-line for preschool-aged children (4 to <6 years), not school-aged children.
●	B. Non-stimulants are not first-line for any age group and are reserved for patients who cannot tolerate stimulants or have specific comorbidities.
●	D. An IEP is an educational support mechanism, not a primary medical/behavioral treatment for ADHD, and not every child with ADHD qualifies for specialized instruction under IDEA.
Exam takeaway: Preschool ADHD (4-5 years) = Behavior therapy first; School-age ADHD (6-11 years) = FDA-approved medication + behavior therapy.
Source origin: ADHD.pptx, Slide (Treatment by Age: AAP Framework).

Question 77
An 8-year-old boy with ADHD and a comorbid tic disorder has not responded well to stimulant therapy due to exacerbation of his tics and severe rebound irritability. The FNP decides to switch to a non-stimulant medication. Which of the following medications is an alpha-2 adrenergic agonist that may be particularly useful for this patient's symptom profile?
Choose the correct medication:
A. Atomoxetine
B. Viloxazine
C. Guanfacine extended-release
D. Bupropion
 
 
 
Correct answer: C. Guanfacine extended-release
Rationale: Guanfacine ER (Intuniv) and clonidine (Kapvay) are alpha-2 adrenergic agonists. They are non-stimulant options for ADHD that can be particularly beneficial when hyperactivity, impulsivity, sleep difficulties, or comorbid tic disorders are present, as they do not exacerbate tics like stimulants sometimes can.
Why the other options are less appropriate:
●	A. Atomoxetine is a selective norepinephrine reuptake inhibitor (SNRI), not an alpha-2 agonist.
●	B. Viloxazine is also a selective norepinephrine reuptake inhibitor, not an alpha-2 agonist.
●	D. Bupropion is an atypical antidepressant (NDRI) sometimes used off-label for ADHD, but it is not an alpha-2 agonist and lowers the seizure threshold.
Exam takeaway: Alpha-2 agonists (guanfacine, clonidine) are useful non-stimulants for ADHD, especially when tics, severe hyperactivity, or insomnia are comorbid.
Source origin: ADHD.pptx, Slide (Nonstimulants: When and Why?).

Question 78
A 10-year-old girl is diagnosed with ADHD and the FNP is considering initiating a stimulant medication. The patient's medical history is unremarkable, but her father reports that his brother died suddenly at age 42 from an unknown cardiac event.
What is the most appropriate next step regarding cardiovascular screening before starting the stimulant?
A. Proceed with the prescription as sudden cardiac death in a second-degree relative is not a contraindication
B. Order a baseline electrocardiogram (EKG) and consider pediatric cardiology consultation
C. Obtain a 24-hour Holter monitor to evaluate for asymptomatic arrhythmias
D. Prescribe a non-stimulant medication instead to avoid any cardiovascular risk
 
 
 
Correct answer: B. Order a baseline electrocardiogram (EKG) and consider pediatric cardiology consultation
Rationale: A baseline EKG is recommended for individuals with a positive cardiac history or a family history of unexplained sudden death or myocardial infarction before the age of 50 in a first- or second-degree relative prior to starting stimulants.
Why the other options are less appropriate:
●	A. Sudden cardiac death in a close relative <50 years old is a significant red flag that requires investigation before initiating stimulants.
●	C. A Holter monitor is not a routine first-line screening tool for asymptomatic patients; an EKG is the standard initial step.
●	D. While non-stimulants may have different side effect profiles, atomoxetine also carries cardiovascular warnings; the underlying cardiac risk must be evaluated first regardless of the medication class.
Exam takeaway: Baseline EKG is indicated if there is a personal cardiac history or family history of sudden unexplained death/MI <50 years old.
Source origin: ADHD.pptx, Slide (Stimulant Monitoring & Adverse Effects).

Question 79
A 7-year-old boy with ADHD is struggling with reading comprehension and requires extra time to complete tests. The school suggests he might need a 504 Plan or an IEP. What is the primary distinction between a 504 Plan and an Individualized Education Program (IEP)?
Select the correct distinction:
A. A 504 Plan provides specialized instruction, while an IEP provides only environmental accommodations
B. A 504 Plan provides accommodations for equal access, while an IEP provides specialized instruction under IDEA
C. A 504 Plan is only for students with physical disabilities, while an IEP is for learning disabilities
D. A 504 Plan requires a medical diagnosis, while an IEP does not require any formal evaluation
 
 
 
Correct answer: B. A 504 Plan provides accommodations for equal access, while an IEP provides specialized instruction under IDEA
Rationale: A 504 Plan provides accommodations (e.g., preferential seating, extended time) that ensure equal access to education for students with disabilities. An IEP (under the Individuals with Disabilities Education Act, IDEA) provides specialized instruction and related services for students who meet specific eligibility criteria and require individualized educational modifications.
Why the other options are less appropriate:
●	A. The definitions are reversed; 504 provides accommodations, IEP provides specialized instruction.
●	C. Both 504 Plans and IEPs can cover a wide range of physical, cognitive, and mental health disabilities, including ADHD.
●	D. Both require formal evaluation and documentation of impairment; an IEP requires a comprehensive psychoeducational evaluation to determine eligibility under specific IDEA categories.
Exam takeaway: 504 = accommodations for equal access. IEP = specialized instruction/services under IDEA.
Source origin: ADHD.pptx, Slide (School Supports: 504 Plan vs IEP).

Question 80
A 10-year-old girl presents with excessive worry about her parents getting into a car accident. She refuses to sleep in her own bed and frequently complains of stomach aches on school mornings, leading to school refusal. Her symptoms have persisted for eight months and are impairing her academic functioning.
Which diagnosis best fits this clinical presentation?
A. Generalized Anxiety Disorder (GAD)
B. Separation Anxiety Disorder
C. Specific Phobia
D. Normative developmental worry
 
 
 
Correct answer: B. Separation Anxiety Disorder
Rationale: Separation Anxiety Disorder is characterized by developmentally inappropriate, excessive anxiety concerning separation from primary attachment figures, including persistent worry about harm befalling them, reluctance to sleep alone, and somatic complaints (stomach aches) when separation is anticipated.
Why the other options are less appropriate:
●	A. GAD involves excessive worry about multiple everyday domains (school performance, competence, world events), not specifically focused on separation from caregivers.
●	C. Specific phobia is an irrational fear of a specific object or situation (e.g., dogs, heights), not separation.
●	D. Normative worry is temporary, situation-specific, and does not cause significant functional impairment (like 8 months of school refusal).
Exam takeaway: Somatic symptoms (stomach aches) + school refusal + fear of harm to caregivers = Separation Anxiety Disorder.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Separation Anxiety Disorder).

Question 81
A 7-year-old boy is brought to the clinic by his mother, who reports that he speaks fluently and normally at home but has not spoken a single word to his teacher or classmates since starting first grade three months ago. He communicates at school by nodding or pointing. Which of the following diagnoses best describes this presentation?
Choose the correct diagnosis:
A. Social Anxiety Disorder (Social Phobia)
B. Autism Spectrum Disorder (ASD)
C. Selective Mutism
D. Oppositional Defiant Disorder (ODD)
 
 
 
Correct answer: C. Selective Mutism
Rationale: Selective Mutism is characterized by a consistent failure to speak in specific social situations where there is an expectation for speaking (e.g., school), despite speaking in other situations (e.g., home). It is typically first evident at the start of school and is closely related to anxiety disorders.
Why the other options are less appropriate:
●	A. While Social Anxiety Disorder involves fear of negative evaluation, Selective Mutism is the specific diagnosis for the complete absence of speech in specific settings despite normal language abilities elsewhere.
●	B. Children with ASD typically have broader social communication deficits and restricted/repetitive behaviors, and their language delays or abnormalities are pervasive across settings, not strictly situational.
●	C. ODD involves a pattern of angry/irritable mood, argumentative/defiant behavior, and vindictiveness, not specifically situational mutism.
Exam takeaway: Selective Mutism = speaks at home, mute in specific social settings (e.g., school). Do not pressure the child to speak during the visit.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Selective Mutism).

Question 82
A 12-year-old girl presents with chronic "over-thinking," muscle tension, and difficulty relaxing. She worries excessively about her grades, her performance in sports, and global events, despite having no specific stressors. Her symptoms cause significant distress and impair her sleep. How should the FNP differentiate this presentation from normative worry?
Select the correct differentiation:
A. Normative worry is typically situation-specific and temporary, whereas this presentation is excessive, persistent, and impairing
B. Normative worry only occurs in adolescents, whereas this presentation is typical for younger children
C. Normative worry always presents with somatic symptoms, whereas this presentation is purely cognitive
D. Normative worry requires pharmacologic treatment, whereas this presentation can be managed with reassurance
 
 
 
Correct answer: A. Normative worry is typically situation-specific and temporary, whereas this presentation is excessive, persistent, and impairing
Rationale: The clinical question in differentiating normative worry from Generalized Anxiety Disorder (GAD) is whether the worry has become excessive, persistent, difficult to control, or impairing. Normative worry is developmentally appropriate, situation-specific, and decreases when the stressor resolves. GAD involves chronic, pervasive worry across multiple domains with associated physical symptoms and functional impairment.
Why the other options are less appropriate:
●	B. Normative worry occurs across all developmental stages, with topics changing by age (e.g., monsters in preschool, school performance in older children).
●	C. Normative worry does not typically present with severe, chronic somatic symptoms like muscle tension and sleep disturbance; these are hallmarks of an anxiety disorder.
●	D. Normative worry responds to reassurance and does not require pharmacologic treatment; GAD often requires CBT and/or medication.
Exam takeaway: Normative worry = temporary, situation-specific, responsive to reassurance. Anxiety disorder = excessive, persistent, impairing, somatic symptoms.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Normative Worry vs. Anxiety Disorder).

Question 83
A 14-year-old adolescent screens positive for depression. During the clinical interview, the patient reports feeling "angry all the time," snapping at friends, and losing interest in playing video games. They deny feeling "sad." According to DSM-5-TR criteria, how should the FNP interpret the patient's irritability?
Choose the correct interpretation:
A. Irritability is not a valid symptom of depression in adolescents and suggests a bipolar disorder
B. Irritability can serve as a core mood symptom (replacing depressed mood) in children and adolescents
C. Irritability is only considered a symptom of depression if it is accompanied by psychotic features
D. Irritability indicates Oppositional Defiant Disorder (ODD) rather than a depressive episode
 
 
 
Correct answer: B. Irritability can serve as a core mood symptom (replacing depressed mood) in children and adolescents
Rationale: In children and adolescents, the DSM-5-TR allows for irritable mood to be used as a core symptom in place of depressed mood for the diagnosis of Major Depressive Disorder. Adolescents often present with irritability, anger, and anhedonia rather than classic sadness.
Why the other options are less appropriate:
●	A. Irritability is a well-recognized core symptom of pediatric depression; it does not automatically indicate bipolar disorder.
●	B. Psychotic features are not required for irritability to count as a core mood symptom.
●	C. While irritability is seen in ODD, the presence of anhedonia (loss of interest) and the context of a depressive episode point to MDD.
Exam takeaway: Pediatric depression often presents with irritability and anhedonia rather than classic "sadness."
Source origin: Mental Health Fall 2026 s.pdf, Slide (Major Depressive Disorder (MDD) SIGECAPS).

Question 84
A 15-year-old adolescent screens positive for suicidal ideation on the Ask Suicide-Screening Questions (ASQ) tool during a routine well-child visit. The patient admits to thinking about suicide but denies having a specific plan or intent.
What is the most critical next step in the FNP's management?
A. Reassure the patient that these thoughts are common and schedule a follow-up in one month
B. Conduct a brief suicide safety assessment, counsel on lethal means restriction, and involve caregivers
C. Immediately prescribe an SSRI and refer to outpatient cognitive behavioral therapy
D. Discharge the patient with a crisis hotline number and instruct them to call if symptoms worsen
 
 
 
Correct answer: B. Conduct a brief suicide safety assessment, counsel on lethal means restriction, and involve caregivers
Rationale: A positive suicide screen requires an immediate Brief Suicide Safety Assessment to determine the level of risk (thoughts, plan, intent, past behavior). Crucial steps include developing a safety plan, involving caregivers, and counseling on restricting access to lethal means (e.g., firearms, medications).
Why the other options are less appropriate:
●	A. Suicidal ideation is never dismissed as "common" without a thorough safety assessment and safety planning.
●	C. Medication initiation does not replace the immediate need for a safety assessment, means restriction, and acute safety planning.
●	D. Discharging an at-risk youth without a safety plan, means restriction counseling, and caregiver involvement is unsafe and violates standard suicide prevention protocols.
Exam takeaway: Positive suicide screen → Assess safety/plan → Restrict lethal means → Involve caregivers/supports.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Suicide Risk: What Should the Clinician Look For?).

Question 85
A 10-year-old boy is diagnosed with Major Depressive Disorder (MDD). The FNP decides to initiate pharmacotherapy after a trial of CBT yielded partial response. According to current FDA approvals, which of the following SSRIs is approved for the treatment of MDD in children aged 8 and older?
Select the correct SSRI:
A. Sertraline
B. Escitalopram
C. Fluoxetine
D. Citalopram
 
 
 
Correct answer: C. Fluoxetine
Rationale: Fluoxetine is FDA-approved for the treatment of Major Depressive Disorder (MDD) in children aged 8 and older, and for OCD in children aged 7 and older. It is often considered the first-line SSRI for pediatric depression due to its robust evidence base and long half-life.
Why the other options are less appropriate:
●	A. Sertraline is FDA-approved for pediatric OCD (age 6+), but its use for MDD and anxiety in pediatrics is off-label.
●	B. Escitalopram is FDA-approved for MDD in adolescents aged 12 and older, and GAD in children aged 7 and older.
●	D. Citalopram is not FDA-approved for pediatric MDD and carries specific QTc prolongation warnings.
Exam takeaway: Fluoxetine = FDA approved for MDD (8+) and OCD (7+). Escitalopram = MDD (12+).
Source origin: Mental Health Fall 2026 s.pdf, Slide (SSRIs for Depression & Anxiety Disorders).

Question 86
A 9-year-old girl is started on sertraline for severe anxiety. Two weeks later, her mother calls the clinic reporting that the child has become unusually impulsive, agitated, and is having severe difficulty sleeping.
What is the most likely explanation for these new symptoms?
A. The child is experiencing activation syndrome, a known adverse effect of SSRIs in youth
B. The child has developed serotonin syndrome and requires immediate emergency department evaluation
C. The medication dose is subtherapeutic and needs to be increased immediately to achieve efficacy
D. The child is experiencing a manic switch, indicating an underlying bipolar disorder
 
 
 
Correct answer: A. The child is experiencing activation syndrome, a known adverse effect of SSRIs in youth
Rationale: Activation syndrome (disinhibition, impulsivity, agitation, akathisia, insomnia) is a known adverse effect of SSRIs, particularly in younger children and those with ASD. It typically occurs early in treatment or after dose increases. Management involves reducing the dose or discontinuing the medication.
Why the other options are less appropriate:
●	A. Serotonin syndrome is a rare, life-threatening medical emergency characterized by autonomic instability, hyperthermia, and clonus, usually associated with polypharmacy, not just agitation and insomnia.
●	B. These symptoms indicate adverse effects (activation), not a lack of efficacy; increasing the dose would worsen the activation.
●	C. While a manic switch is possible, activation syndrome is much more common and must be managed first; a thorough psychiatric evaluation is needed to differentiate the two.
Exam takeaway: Monitor for activation syndrome (agitation, impulsivity, insomnia) when initiating SSRIs in youth; start low and go slow.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Selective Serotonin Reuptake Inhibitors (SSRIs) Basics).

Question 87
A 14-year-old adolescent with Generalized Anxiety Disorder (GAD) is referred for Cognitive Behavioral Therapy (CBT). Which of the following is a core component of CBT that the FNP should explain to the patient and family?
Select the core component:
A. Uncovering unconscious conflicts from early childhood experiences
B. Cognitive restructuring and graded exposure to feared situations
C. Free association and dream analysis to resolve internal guilt
D. Strict behavioral modification using only punitive consequences
 
 
 
Correct answer: B. Cognitive restructuring and graded exposure to feared situations
Rationale: CBT focuses on the connection between thoughts, emotions, and behaviors. Core components include psychoeducation, somatic management (relaxation), cognitive restructuring (identifying and challenging negative thought patterns), and graded exposure (gradually facing feared situations to reduce avoidance).
Why the other options are less appropriate:
●	A. Uncovering unconscious childhood conflicts is the focus of psychoanalytic/psychodynamic therapy, not CBT.
●	B. Free association and dream analysis are psychoanalytic techniques, not evidence-based CBT components for pediatric anxiety.
●	C. CBT relies on positive reinforcement, skill-building, and coping strategies, not punitive behavioral modification.
Exam takeaway: CBT = Cognitive restructuring (changing thoughts) + Behavior activation/exposure (changing actions).
Source origin: Mental Health Fall 2026 s.pdf, Slide (Cognitive Behavioral Therapy).

Question 88
A mother brings her 6-week-old infant to the clinic, reporting that the baby cries for 3 hours every evening and is difficult to soothe. The infant is gaining weight well and has a normal physical examination. According to the concept of PURPLE crying, how should the FNP counsel the mother?
Choose the correct counseling:
A. This pattern of crying is abnormal and requires an immediate gastrointestinal workup
B. Crying typically peaks around 2 months of age and is a normal developmental phase
C. The infant is likely experiencing cow's milk protein allergy and requires a formula change
D. The mother should let the infant cry it out to establish a healthy sleep routine
 
 
 
Correct answer: B. Crying typically peaks around 2 months of age and is a normal developmental phase
Rationale: The Period of PURPLE Crying describes a normal developmental phase in which infants cry more, often in the evening, and are difficult to soothe. Crying typically peaks around 2 months of age and resolves by 3-5 months. Education and reassurance are key, along with counseling on the dangers of shaken baby syndrome.
Why the other options are less appropriate:
●	A. Evening crying in a thriving infant with a normal exam is typical of PURPLE crying, not a pathologic GI condition.
●	B. While cow's milk protein allergy can cause fussiness, it typically presents with other signs like bloody stools, eczema, or poor weight gain.
●	C. "Crying it out" is inappropriate and unsafe for a 6-week-old infant; caregivers must be counseled on safe soothing and the dangers of shaking.
Exam takeaway: PURPLE crying = normal developmental peak of crying at 2 months. Counsel on soothing and shaken baby syndrome prevention.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 23 (The Period of PURPLE Crying).

Question 89
During a well-baby check, the FNP observes that a 6-week-old infant smiles back responsively when the mother smiles and talks to her. What specific developmental milestone does this represent?
Select the correct milestone:
A. Reflexive smiling
B. Social smile
C. anticipatory smiling
D. Reciprocal play
 
 
 
Correct answer: B. Social smile
Rationale: A true "social smile" (smiling responsively to a caregiver's face or voice) typically emerges around 6 weeks of age. This is a critical early social/emotional milestone indicating normal visual and neurological development.
Why the other options are less appropriate:
●	A. Reflexive smiling occurs in utero or during the first few weeks of life (often during sleep) and is not triggered by external social stimuli.
●	B. Anticipatory smiling and more complex reciprocal interactions develop later in infancy (around 6-9 months).
●	C. Reciprocal play (like peekaboo) develops later, typically around 9 months of age.
Exam takeaway: Social smile emerges at 6 weeks. Lack of a social smile by 2 months is a red flag for visual or neurodevelopmental impairment.
Source origin: 2 Growth and development Part 2.pdf, Page 24 (Social/Emotional).

Question 90
A mother asks the FNP when her infant will be able to roll over. According to standard developmental milestones, at what age should an infant typically roll over from front to back?
Choose the correct age:
A. 2 months of age
B. 4 months of age
C. 6 months of age
D. 9 months of age
 
 
 
Correct answer: B. 4 months of age
Rationale: Infants typically learn to roll over from front to back first, usually around 4 months of age, as they gain the ability to push off with their hands. Rolling from back to front typically follows slightly later.
Why the other options are less appropriate:
●	A. At 2 months, infants are just learning to lift their head 45 degrees; they lack the truncal strength to roll.
●	C. By 6 months, infants should be able to sit with support and roll both ways; rolling only at 6 months would be delayed.
●	D. At 9 months, infants are typically crawling or cruising; rolling is a much earlier milestone.
Exam takeaway: 2 months = lift head. 4 months = roll over (front to back). 6 months = sit. 9 months = crawl/cruise.
Source origin: 2 Growth and development Part 2.pdf, Page 32 (Tips for remembering milestones).

Question 91
During a 12-month well-child visit, the FNP discusses nutrition with the parents. The infant has been exclusively breastfed and is now transitioning to table foods. What is the most appropriate recommendation regarding milk intake for this child?
Select the correct recommendation:
A. Continue exclusive breastfeeding until 24 months of age without introducing cow's milk
B. Introduce whole cow's milk, limiting intake to no more than 16 ounces per day
C. Switch to skim or 1% milk to prevent childhood obesity
D. Introduce soy milk as the primary beverage to ensure adequate protein intake
 
 
 
Correct answer: B. Introduce whole cow's milk, limiting intake to no more than 16 ounces per day
Rationale: At 12 months of age, infants can transition from breast milk or formula to whole cow's milk. Intake should be limited to 16-24 ounces per day to prevent iron deficiency anemia (milk is low in iron and can inhibit iron absorption) and to ensure the child has an appetite for iron-rich table foods.
Why the other options are less appropriate:
●	A. While continued breastfeeding is encouraged, complementary foods and eventually cow's milk (or appropriate alternatives) are necessary to meet the nutritional demands of a 1-year-old.
●	B. Skim or low-fat milk is not recommended before age 2 because infants require the high fat content for normal brain and neurological development.
●	C. Soy milk is not recommended as a primary beverage unless there is a specific medical indication (e.g., severe allergy), and it lacks the natural fat profile of whole cow's milk.
Exam takeaway: 12 months = introduce whole milk, max 16-24 oz/day to prevent iron deficiency anemia.
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 4 (12-15 mth Well Exam Nutrition).

Question 92
An 8-year-old boy demonstrates that he understands the volume of water remains the same whether it is poured into a tall, thin glass or a short, wide glass. Which cognitive milestone has this child achieved?
Choose the correct milestone:
A. Object permanence
B. Egocentrism
C. Conservation
D. Abstract reasoning
 
 
 
Correct answer: C. Conservation
Rationale: Conservation is the understanding that quantity remains the same despite changes in shape or appearance. This is a hallmark achievement of Piaget's Concrete Operational stage, which typically occurs between ages 7 and 11.
Why the other options are less appropriate:
●	A. Object permanence (understanding objects exist when out of sight) is achieved during the Sensorimotor stage (infancy).
●	B. Egocentrism (inability to see others' perspectives) is characteristic of the Preoperational stage (preschool) and is overcome as children enter the concrete operational stage.
●	D. Abstract reasoning is the hallmark of the Formal Operational stage (adolescence).
Exam takeaway: Conservation (mass/volume remains the same despite form changes) = Concrete Operational stage (School-age).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide 23 (Piaget Concrete Operational Stage).

Question 93
A mother brings her 24-month-old child to the clinic, expressing concern that the child used to say "mama" and "dada" and wave bye-bye at 12 months, but has since stopped using words and no longer makes eye contact. How should the FNP interpret this developmental history?
Select the correct interpretation:
A. This represents a normal developmental plateau that frequently occurs between 18 and 24 months of age
B. This is a major red flag indicating developmental regression that requires urgent comprehensive evaluation
C. This is likely secondary to a recent mild viral illness and will resolve with time and reassurance
D. This indicates a primary expressive language delay that can be managed with routine outpatient speech therapy
 
 
 
Correct answer: B. This is a major red flag indicating developmental regression that requires urgent comprehensive evaluation
Rationale: The loss of previously acquired milestones (language or social skills) at any age is a significant red flag. It warrants urgent and comprehensive evaluation for neurologic, metabolic, or severe neurodevelopmental conditions, including Autism Spectrum Disorder or childhood disintegrative disorder.
Why the other options are less appropriate:
●	A. Developmental plateaus may occur, but the actual loss of previously established skills (regression) is never considered normal.
●	B. While severe illness can temporarily delay progress, true regression of language and social skills is not a typical post-viral sequela and requires immediate investigation.
●	C. A primary expressive language delay involves a failure to acquire new words, not the loss of previously acquired words and social engagement.
Exam takeaway: Any loss of previously acquired developmental milestones (regression) is an absolute red flag requiring urgent, comprehensive medical and neurodevelopmental evaluation.
Source origin: 2 Growth and development Part 2.pdf, Page 31 (Key Points: Anytime a milestone is met and then lost is a reason for further evaluation).

Question 94
A 10-year-old boy with ADHD is started on atomoxetine after failing to tolerate stimulant medications. Which of the following is a key pharmacological characteristic of atomoxetine that the FNP must consider?
Choose the correct characteristic:
A. It is a central nervous system stimulant with a high potential for abuse and diversion
B. It is a selective norepinephrine reuptake inhibitor (SNRI) with a slower onset of action than stimulants
C. It is an alpha-2 adrenergic agonist that causes significant sedation and hypotension
D. It is a dopamine agonist that requires once-daily morning dosing
 
 
 
Correct answer: B. It is a selective norepinephrine reuptake inhibitor (SNRI) with a slower onset of action than stimulants
Rationale: Atomoxetine (Strattera) is a selective norepinephrine reuptake inhibitor (SNRI). Unlike stimulants, it is not a controlled substance and has no abuse potential, but it typically takes several weeks (up to 4-6 weeks) to achieve full clinical efficacy. It also carries a black box warning for suicidal ideation in youth.
Why the other options are less appropriate:
●	A. Atomoxetine is a non-stimulant and is not a controlled substance; it has no abuse or diversion potential.
●	B. Alpha-2 adrenergic agonists include guanfacine and clonidine, not atomoxetine.
●	C. Atomoxetine is an SNRI, not a dopamine agonist.
Exam takeaway: Atomoxetine = SNRI, non-stimulant, slower onset (weeks), no abuse potential, black box warning for SI.
Source origin: ADHD.pptx, Slide (Nonstimulants: When and Why?).

Question 95
A 15-year-old girl presents with an intense fear of negative evaluation in social settings. She avoids speaking in class, eating in the cafeteria, and attending parties because she is terrified that others will judge her or notice her blushing. Which of the following diagnoses best fits this clinical presentation?
Select the correct diagnosis:
A. Generalized Anxiety Disorder (GAD)
B. Social Anxiety Disorder (Social Phobia)
C. Panic Disorder
D. Agoraphobia
 
 
 
Correct answer: B. Social Anxiety Disorder (Social Phobia)
Rationale: Social Anxiety Disorder is characterized by an excessive fear of negative evaluation in social settings. Patients often avoid or endure social situations with significant distress, fearing they will act in a way that will be humiliating or embarrassing (e.g., blushing, stuttering).
Why the other options are less appropriate:
●	A. GAD involves excessive worry about multiple everyday domains, not specifically fear of social scrutiny or negative evaluation.
●	B. Panic Disorder involves recurrent, unexpected panic attacks and fear of having another attack, not specifically tied to social evaluation.
●	C. Agoraphobia is the fear of situations where escape might be difficult or help unavailable (e.g., public transit, open spaces), not specifically social evaluation.
Exam takeaway: Social Phobia = excessive fear of negative evaluation/judgment in social settings.
Source origin: Mental Health Fall 2026 s.pdf, Slide (Social Phobia / Social Anxiety Disorder).

Question 96
A newborn develops visible jaundice at 12 hours of life. The mother's blood type is O positive, and the infant's blood type is A positive. What is the most appropriate clinical interpretation of this finding?
Choose the correct interpretation:
A. This represents physiologic neonatal jaundice and requires only routine monitoring
B. This is pathologic jaundice requiring immediate bilirubin measurement and evaluation for hemolysis
C. This is breast milk jaundice and the mother should be instructed to stop breastfeeding
D. This indicates biliary atresia and requires an urgent ultrasound of the biliary tree
 
 
 
Correct answer: B. This is pathologic jaundice requiring immediate bilirubin measurement and evaluation for hemolysis
Rationale: Jaundice appearing within the first 24 hours of life is always considered pathologic until proven otherwise. It is most commonly due to hemolysis (e.g., ABO incompatibility, Rh disease) and requires immediate bilirubin measurement and evaluation.
Why the other options are less appropriate:
●	A. Physiologic jaundice typically appears after the first 24 hours of life (peaking days 3-5).
●	B. Breast milk jaundice typically presents after the first week of life in a thriving, well-fed infant.
●	C. Biliary atresia presents with conjugated (direct) hyperbilirubinemia, acholic stools, and usually presents later (after 2 weeks of life).
Exam takeaway: Jaundice <24 hours = pathologic (hemolysis). Always measure bilirubin and evaluate for hemolysis immediately.
Source origin: 4 - 2nd Half of Infant Lecture.pptx, Slide 6 (Hemolytic Disease & Neonatal Jaundice).

Question 97
A 2-year-old child has a capillary blood lead screening level of 18 µg/dL obtained via a finger stick.
What is the mandatory next step in the management of this patient?
A. Initiate oral chelation therapy immediately
B. Obtain a confirmatory venous blood lead level within 1 month
C. Reassure the parents and repeat the capillary screen in 6 months
D. Order an abdominal radiograph to look for ingested lead paint chips
 
 
 
Correct answer: B. Obtain a confirmatory venous blood lead level within 1 month
Rationale: Capillary lead screens are prone to environmental contamination from the skin. Any elevated capillary result must be confirmed with a venous blood draw. For a capillary level of 10-19 µg/dL, the confirmatory venous test should be obtained within 1 month.
Why the other options are less appropriate:
●	A. Chelation is never initiated based on a capillary screen and is not routinely recommended for levels <45 µg/dL.
●	B. An elevated capillary screen cannot be ignored; it requires venous confirmation to guide appropriate environmental and medical follow-up.
●	C. Abdominal radiographs are only indicated if there is a history or high suspicion of recent ingestion of radiopaque lead objects (e.g., paint chips), not as a routine follow-up for an elevated screen.
Exam takeaway: Always confirm elevated capillary lead screens with a venous draw. Timing depends on the capillary level (e.g., 10-19 µg/dL = within 1 month).
Source origin: Toddler-Pre-School-School Age s.pptx, Slide (Lead Exposure: Testing & Follow-up).

Question 98
A student asks the FNP preceptor to explain the theoretical basis for using positive reinforcement and reward charts to manage a child's ADHD-related behavioral challenges. Which behavioral theorist is most closely associated with the concept of operant conditioning and the use of immediate rewards to stimulate learning?
Select the correct theorist:
A. Jean Piaget
B. Erik Erikson
C. B.F. Skinner
D. Lev Vygotsky
 
 
 
Correct answer: C. B.F. Skinner
Rationale: B.F. Skinner proposed the theory of operant conditioning, suggesting that children "operate" on their environment and that learning can be broken down into smaller tasks, with immediate rewards (positive reinforcement) stimulating further learning and desired behaviors.
Why the other options are less appropriate:
●	A. Jean Piaget is known for his theory of cognitive development (sensorimotor, preoperational, etc.).
●	B. Erik Erikson is known for his psychosocial stages of development (trust vs. mistrust, etc.).
●	C. Lev Vygotsky is known for social learning theory and the zone of proximal development.
Exam takeaway: Skinner = Operant conditioning, rewards, behaviorism. Piaget = Cognitive. Erikson = Psychosocial.
Source origin: 1 Growth and development Part 1.pdf, Page 24 (B. F. Skinner).

Question 99
