n potential.", "More permeable to potassium ions."], "correct": "A", "rationale": {"A": "An EPSP is a local depolarization, typically caused by the influx of positive ions like Na+. This makes the inside of the cell less negative (e.g., from -65mV to -60mV), moving it closer to the threshold for firing an action potential.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 159, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the critical event that occurs when a neuron's membrane potential reaches the threshold value (around -55 mV)?", "options": ["Voltage-gated potassium channels open rapidly.", "Ligand-gated channels close and inactivate.", "The sodium-potassium pump doubles its activity.", "Voltage-gated sodium channels open, causing rapid depolarization."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The threshold potential is the specific voltage that triggers the opening of a large number of voltage-gated Na+ channels. The resulting massive influx of Na+ causes the rapid depolarization phase of the action potential."}}, {"id": 160, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The absolute refractory period is caused by:", "options": ["The inactivation of voltage-gated sodium channels.", "The slow closing of voltage-gated potassium channels.", "The neuron being in a hyperpolarized state.", "Insufficient neurotransmitter available in the synapse."], "correct": "A", "rationale": {"A": "During the absolute refractory period, the voltage-gated Na+ channels are in an inactivated state (blocked by the inactivation gate) and cannot be opened again, regardless of the stimulus strength.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 161, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The \"jumping\" of an action potential from one node of Ranvier to the next is known as:", "options": ["Continuous conduction", "Synaptic transmission", "Saltatory conduction", "Graded potential"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Saltatory conduction is the process by which an action potential propagates in myelinated axons, appearing to jump from one node of Ranvier to the next, which is much faster than conduction in unmyelinated axons.", "D": "This option is incorrect."}}, {"id": 162, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the direct trigger for the release of neurotransmitters from the presynaptic axon terminal?", "options": ["The influx of sodium ions into the terminal.", "The binding of acetylcholine to the terminal.", "The influx of calcium ions into the terminal.", "The action of the sodium-potassium pump."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The arrival of an action potential at the axon terminal depolarizes the membrane, which opens voltage-gated Ca2+ channels. The subsequent influx of Ca2+ is the direct signal that triggers the exocytosis of neurotransmitter-filled vesicles.", "D": "This option is incorrect."}}, {"id": 163, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The primary inhibitory neurotransmitter in the central nervous system is:", "options": ["Glutamate", "Acetylcholine", "GABA", "Dopamine"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Gamma-aminobutyric acid (GABA) is described in the lectures as the \"generic inhibitory neurotransmitter\" and is the most common inhibitory neurotransmitter in the CNS.", "D": "This option is incorrect."}}, {"id": 164, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the defining role of neuroactive peptides when co-released with neurotransmitters?", "options": ["They directly cause depolarization of the postsynaptic cell.", "They act as the primary signal for neurotransmitter release.", "They are broken down to provide energy for the synapse.", "They modulate the response of the postsynaptic cell to the neurotransmitter."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "Neuroactive peptides are not primary neurotransmitters but act as modulators. They can alter the postsynaptic cell's sensitivity or response to the primary neurotransmitter, for example, by changing the number of receptors."}}, {"id": 165, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Dopamine, norepinephrine, and epinephrine belong to which class of neurotransmitters derived from tyrosine?", "options": ["Amino acids", "Neuroactive peptides", "Catecholamines", "Indoleamines"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture and slides show that dopamine, norepinephrine, and epinephrine are all derived from the amino acid tyrosine and are classified as catecholamines."}}, {"id": 166, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "In the context of acid-base balance, how is an acid defined?", "options": ["A compound that absorbs a hydrogen ion from a solution.", "A compound that donates a hydrogen ion to a solution.", "A compound with a pH greater than 7.0.", "A compound that buffers against changes in pH."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "This is the fundamental definition of an acid provided in the lecture. An acid increases the concentration of free hydrogen ions (H+) in a solution.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 167, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A patient's arterial blood gas (ABG) results are: pH 7.31, pCO2 52 mmHg, HCO3 24 mEq/L. How would you interpret these results? (Normal ranges: pH 7.35-7.45, pCO2 35-45, HCO3 21-28)", "options": ["Uncompensated respiratory acidosis", "Uncompensated metabolic acidosis", "Partially compensated respiratory acidosis", "Fully compensated metabolic acidosis"], "correct": "A", "rationale": {"A": "The pH (7.31) is low (acidosis). The pCO2 (52 mmHg) is high, which is an acidic change that matches the pH, indicating a respiratory cause. The HCO3 (24 mEq/L) is within the normal range, indicating that no renal compensation has occurred yet.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 168, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which organ system provides the most rapid compensation for an acid-base imbalance?", "options": ["The renal system, by altering H+ secretion.", "The respiratory system, by altering CO2 elimination.", "The hepatic system, by metabolizing acids.", "The cardiovascular system, by altering blood flow."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture states that the respiratory response is very fast, occurring within minutes to hours, by changing the breathing rate to either blow off or retain CO2.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 169, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A patient with chronic, severe diarrhea is at risk for which acid-base imbalance?", "options": ["Metabolic alkalosis due to bicarbonate gain.", "Respiratory acidosis due to hypoventilation.", "Metabolic acidosis due to bicarbonate loss.", "Respiratory alkalosis due to hyperventilation."], "correct": "A", "rationale": {"A": "Diarrhea involves the loss of intestinal fluid, which is rich in bicarbonate. The significant loss of this base (HCO3) leads to a state of metabolic acidosis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 170, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the primary purpose of oxygen in cellular metabolism?", "options": ["It is required to initiate the process of glycolysis.", "It combines with glucose to form pyruvate.", "It acts as the final electron acceptor in oxidative phosphorylation.", "It directly powers the sodium-potassium pump."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture emphasizes that the sole purpose of oxygen in the body is to be the final electron acceptor in the electron transport chain, which allows the process of oxidative phosphorylation to occur and produce a large amount of ATP.", "D": "This option is incorrect."}}, {"id": 171, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A cell is deprived of oxygen. Which step of energy metabolism is most directly impaired, leading to the largest drop in ATP production?", "options": ["Glycolysis", "Krebs Cycle", "Oxidative phosphorylation", "Gluconeogenesis"], "correct": "A", "rationale": {"A": "Oxidative phosphorylation is the only step that directly requires oxygen. It is also the step that produces the vast majority of ATP (around 32 ATP). Without oxygen, this process halts, causing the most significant drop in energy production.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 172, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which of the following is the most common cause of cell injury?", "options": ["Exposure to foreign chemicals and extreme temperatures.", "Hypoxia and reactive oxygen species.", "Physical crushing or mechanical injury.", "Altered intracellular storage."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture explicitly states, \"Those are the two most common sources of cell injury: hypoxia and reactive oxygen species.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 173, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "During hypoxic injury, a cell begins to swell. This is a direct consequence of:", "options": ["Increased ATP production leading to excess water synthesis.", "Failure of the sodium-potassium pumps, causing an influx of sodium and water.", "Lysosomal rupture and autodigestion of the cell membrane.", "The cell adapting by increasing its size to store more oxygen."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "Hypoxia leads to a drop in ATP. Without ATP, the sodium-potassium pumps fail. Sodium accumulates inside the cell, and since \"where sodium goes, water follows,\" the cell swells with water."}}, {"id": 174, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The swelling and damage of which organelle is considered the \"point of no return,\" leading to irreversible cell injury and death during hypoxia?", "options": ["Endoplasmic reticulum", "Nucleus", "Golgi apparatus", "Mitochondria"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states that swelling of the mitochondria damages them permanently so they can never produce ATP again, and that \"mitochondrial swelling is cell death.\" This is the point of irreversible injury."}}, {"id": 175, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Reactive oxygen species (ROS) cause cellular injury primarily by:", "options": ["Inhibiting glycolysis and ATP production.", "Damaging DNA, proteins, and cell membranes.", "Causing the nucleus to shrink and condense.", "Triggering an adaptive hypertrophic response."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "Reactive oxygen species have an unpaired electron, making them highly reactive. They steal electrons from other molecules, causing lipid peroxidation (membrane damage), protein damage, and DNA damage.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 176, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A patient with chronic hypertension develops an enlarged heart. This is an example of which cellular adaptation?", "options": ["Hyperplasia", "Metaplasia", "Hypertrophy", "Dysplasia"], "correct": "A", "rationale": {"A": "Hypertrophy is an increase in cell size in response to increased functional demand. In the heart, chronic hypertension forces the cardiac muscle cells to work harder, and they respond by getting bigger.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 177, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Cardiac muscle is unable to undergo hyperplasia in response to increased workload because:", "options": ["It has a very poor blood supply.", "It is not under hormonal control.", "The cells are terminally differentiated and cannot divide.", "It is constantly contracting and has no time for cell division."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture states that some tissues, like cardiac muscle, can't divide. Therefore, they can only cope with increased functional demand through hypertrophy (increasing cell size), not hyperplasia (increasing cell number).", "D": "This option is incorrect."}}, {"id": 178, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A long-term smoker develops a \"smoker's cough\" because the normal ciliated columnar cells in the airways have been replaced by simple squamous cells. This change is called:", "options": ["Dysplasia", "Atrophy", "Anaplasia", "Metaplasia"], "correct": "A", "rationale": {"A": "Metaplasia is the replacement of one mature cell type (ciliated columnar) with another, less mature but more resilient cell type (squamous) in response to chronic injury or irritation, such as smoking. This new cell type lacks the function (cilia) of the original cells.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 179, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which of the following cellular adaptations is always pathological and is considered precancerous?", "options": ["Metaplasia", "Hyperplasia", "Dysplasia", "Atrophy"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture states, \"Dysplasia is never adaptive. It's always a consequence of cell injury\" and is considered \"precancerous because it's a complete derangement of cell control.\"", "D": "This option is incorrect."}}, {"id": 180, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Disuse atrophy, such as that seen in a limb immobilized in a cast, is characterized by:", "options": ["An increase in the number of cells.", "A decrease in the size and intracellular content of cells.", "The replacement of muscle cells with fat cells.", "The swelling of cells due to water accumulation."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture defines atrophy as a proportional decrease in both cell size and intracellular content due to decreased functional demand (disuse)."}}, {"id": 181, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The development of fatty liver disease in a person with chronic heavy alcohol consumption is an example of which manifestation of cell injury?", "options": ["Atrophy", "Hypertrophy", "Altered intracellular storage", "Metaplasia"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Fatty liver disease is a prime example of altered intracellular storage, specifically an accumulation (or infiltration) of lipids within hepatocytes because the cell's ability to digest the fat is impaired or overwhelmed.", "D": "This option is incorrect."}}, {"id": 182, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "How does acetaldehyde, a byproduct of ethanol metabolism, contribute to fatty liver disease?", "options": ["It stimulates the liver to produce excess fat.", "It blocks the liver cell's ability to digest fat.", "It causes liver cells to swell with water, displacing fat.", "It damages mitochondria, forcing the cell to use fat for energy."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture specifies that acetaldehyde, a byproduct of ethanol metabolism, \"blocks the liver cell's ability to digest fat,\" leading to its accumulation.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 183, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which form of necrosis is characterized by the tissue turning into a liquid mass and is commonly seen in the brain?", "options": ["Coagulative necrosis", "Caseous necrosis", "Fat necrosis", "Liquefactive necrosis"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states that when necrosis occurs in tissue with little connective tissue, like the brain, it can progress to liquefactive necrosis, where the tissue literally looks like it's liquefied."}}, {"id": 184, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Caseous necrosis, which has a \"cottage cheese\" appearance, is most characteristically associated with:", "options": ["Myocardial infarction", "Tuberculosis infection", "Pancreatitis", "Cerebral stroke"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture explicitly states, \"One place that we reliably see caseous necrosis is in lymph nodes that have been attacked and die as a result of tuberculosis infection in the lungs.\"", "D": "This option is incorrect."}}, {"id": 185, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "How does apoptosis fundamentally differ from necrosis?", "options": ["Apoptosis is a pathological process, while necrosis is a normal physiological process.", "Apoptosis involves cell swelling and explosion, while necrosis involves cell shrinkage.", "Apoptosis is a programmed, controlled process, while necrosis is an uncontrolled result of injury.", "Apoptosis triggers a strong inflammatory response, while necrosis does not."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Apoptosis is described as \"programmed cell death,\" an orderly process where the cell implodes. Necrosis is a messy, uncontrolled death resulting from injury, where the cell swells and explodes.", "D": "This option is incorrect."}}, {"id": 186, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The primary protective role of apoptosis for the whole organism is to:", "options": ["Promote tissue growth and repair after injury.", "Eliminate cells that are old or have significant DNA errors, preventing cancer.", "Store energy in the form of apoptotic bodies.", "Increase the number of cells in response to increased functional demand."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture states that apoptosis is \"designed to be a protection for the organism as a whole from cells that are vulnerable to becoming cancer cells\" by getting triggered when a cell notices lots of DNA errors.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 187, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A patient is in a state of respiratory alkalosis. What is the expected initial state of their ABG values before compensation?", "options": ["High pH, low pCO2, normal HCO3", "High pH, high pCO2, normal HCO3", "Low pH, low pCO2, normal HCO3", "High pH, normal pCO2, high HCO3"], "correct": "A", "rationale": {"A": "Respiratory alkalosis is caused by hyperventilation, which blows off too much CO2. Therefore, pCO2 is low. Less CO2 means less carbonic acid, so the pH is high (alkalotic). Before the kidneys compensate, the HCO3 level will be normal.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 188, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "In a compensated metabolic acidosis, what changes would be expected in the respiratory system?", "options": ["Respiratory rate would decrease to conserve CO2.", "Gas exchange in the lungs would become less efficient.", "Respiratory rate would increase to blow off more CO2.", "The depth of breathing would decrease."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "To compensate for a metabolic acidosis (excess acid), the respiratory system will try to make the blood more alkaline. It does this by increasing the rate and depth of breathing (hyperventilation) to eliminate CO2, which reduces the amount of carbonic acid in the blood.", "D": "This option is incorrect."}}, {"id": 189, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "An increase in functional demand on a tissue that can divide will most likely result in:", "options": ["Atrophy only", "Hypertrophy only", "Hypertrophy and hyperplasia", "Metaplasia and dysplasia"], "correct": "A", "rationale": {"A": "The lecture states that \"Hypertrophy and hyperplasia tend to happen together because they are frequently a result of increased functional demand\" in tissues where cells are capable of dividing.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 190, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Following a heart attack, a biopsy of the cardiac muscle shows cells that are bloated, have lost their regular shape, and have shrunken nuclei. This is characteristic of:", "options": ["Apoptosis", "Atrophy", "Necrotic cell death", "Hypertrophy"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The description matches the characteristics of necrosis given in the lecture: the cell swells/bloats, loses its shape, and undergoes nuclear changes like pyknosis (shrinking).", "D": "This option is incorrect."}}, {"id": 191, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the relationship between metaplasia and chronic injury?", "options": ["Metaplasia is a cause of chronic injury.", "Metaplasia is a reversible, adaptive response to chronic injury.", "Metaplasia is an irreversible consequence of a single acute injury.", "Chronic injury prevents metaplasia from occurring."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "Metaplasia is an adaptation where a tissue replaces its normal cells with a more resilient type to cope with chronic injury (like smoking). The lecture notes that if the injury is removed, the tissue can revert to normal.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 192, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Fat necrosis is unique because the released intracellular contents react with fatty deposits to form:", "options": ["Liquefied tissue", "Soapy deposits", "Fibrous scar tissue", "Gas bubbles"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture explains that in fat necrosis, released intracellular contents react with fatty deposits and \"undergo something called saponification. You get these soapy deposits in the tissue.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 193, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which statement accurately describes the somatic nervous system?", "options": ["It controls involuntary visceral functions like heart rate and digestion.", "It is composed of motor neurons that stimulate skeletal muscle for voluntary movements.", "It is the sensory arm of the peripheral nervous system.", "It is divided into sympathetic and parasympathetic branches."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The somatic nervous system is the branch of the efferent division that controls voluntary actions by innervating skeletal muscle.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 194, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The repolarization phase of an action potential is primarily caused by:", "options": ["The opening of voltage-gated sodium channels.", "The closing of all ion channels.", "The efflux of potassium ions through voltage-gated channels.", "The influx of chloride ions into the cell."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "After depolarization, the slower voltage-gated K+ channels open. The movement of positive potassium ions out of the cell removes positive charge from the interior, causing the membrane potential to become more negative and return toward rest (repolarize).", "D": "This option is incorrect."}}, {"id": 195, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "If a cell's resting membrane potential is -70mV and the equilibrium potential for K+ is -92mV, which way will K+ ions move if only potassium channels are open?", "options": ["Into the cell, driven by the electrostatic gradient.", "Out of the cell, driven by the concentration gradient.", "There will be no net movement of K+.", "Out of the cell, driven by the electrostatic gradient."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The concentration of K+ is much higher inside the cell. This strong concentration gradient pushes K+ out. Although the negative charge inside the cell (-70mV) pulls K+ in, it is not as strong as the K+ equilibrium potential (-92mV), so the net force is still directed outward.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 196, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "At the neuromuscular junction, acetylcholine binds to its receptor on the muscle cell membrane, which directly causes:", "options": ["The opening of a channel that allows positive ions to enter the muscle cell.", "The release of more acetylcholine from the axon terminal.", "The muscle cell to hyperpolarize, preventing contraction.", "The breakdown of calcium in the synaptic cleft."], "correct": "A", "rationale": {"A": "At the neuromuscular junction, acetylcholine binds to its receptor, which is a cationic channel. This channel opens, allowing positive ions (mainly Na+) to rush into the muscle cell, causing a depolarization that leads to contraction.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 197, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A patient has a pH of 7.50 and a pCO2 of 30 mmHg. The kidneys begin to compensate. What renal action would be expected?", "options": ["Increased excretion of bicarbonate (HCO3).", "Increased reabsorption of bicarbonate (HCO3).", "Increased secretion of hydrogen ions (H+).", "Decreased excretion of chloride ions (Cl-)."], "correct": "A", "rationale": {"A": "The patient is in a respiratory alkalosis (high pH, low pCO2). To compensate, the kidneys need to make the blood more acidic. They do this by excreting more bicarbonate (a base), which effectively removes base from the body and helps lower the pH.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 198, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Why is dysplasia considered a more serious condition than metaplasia?", "options": ["Dysplasia is a normal aging process, while metaplasia is always from injury.", "Dysplasia is reversible with removal of the stressor, while metaplasia is not.", "Dysplasia involves a derangement of cell control and is a precursor to cancer.", "Metaplasia causes a loss of function, while dysplasia enhances tissue function."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Dysplasia is a \"complete derangement of cell control over the tissue\" and is considered precancerous. Metaplasia is an orderly, adaptive change, while dysplasia is disorderly and can progress to a tumor.", "D": "This option is incorrect."}}, {"id": 199, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A cell is exposed to a chemical that blocks the voltage-gated calcium channels in the axon terminal. What would be the most immediate effect on synaptic transmission?", "options": ["The action potential would fail to reach the axon terminal.", "The neuron would be unable to repolarize after an action potential.", "The resting membrane potential would become more positive.", "Neurotransmitter release into the synaptic cleft would be prevented."], "correct": "A", "rationale": {"A": "The influx of calcium through voltage-gated calcium channels is the essential trigger for the exocytosis of neurotransmitter vesicles. If these channels are blocked, the presynaptic terminal cannot release its neurotransmitter, and synaptic transmission will fail.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 200, "category": ["Week 3 Questions Only"], "stem": "A patient is unable to form new short-term memories after a head injury. This deficit is most likely associated with damage to which brain structure?", "options": ["Basal ganglia", "Cerebellum", "Hippocampus", "Brain stem"], "correct": "A", "rationale": {"A": "A) The basal ganglia help regulate and smooth motor movements.", "B": "B) The cerebellum stores learned motor patterns.", "C": "This option is incorrect.", "D": "D) The brain stem controls baseline vegetative functions."}}, {"id": 201, "category": ["Week 3 Questions Only"], "stem": "A patient who has suffered a stroke can understand verbal commands but struggles to produce intelligible speech. Their speech is slow and effortful. This condition is known as expressive aphasia and is caused by damage to:", "options": ["Wernicke's area", "The angular gyrus", "The occipital lobe", "Broca's area"], "correct": "A", "rationale": {"A": "A) The substantia nigra is the origin of the motor dopamine circuit.", "B": "B) The locus coeruleus is the origin of the norepinephrine system.", "C": "C) Ventral tegmental area (VTA)", "D": "D) The raphe nuclei are the origin of the serotonin system."}}, {"id": 202, "category": ["Week 3 Questions Only"], "stem": "Which of the following best describes the primary function of the cerebellum?", "options": ["Maintaining baseline vegetative functions like heart rate and respiration.", "Housing and updating learned motor patterns for coordinated movement.", "Acting as the primary relay station for sensory information.", "Generating emotional responses like fear and alerting the body to danger."], "correct": "B", "rationale": {"A": "A) Baseline vegetative functions are the role of the brain stem.", "B": "The professor explicitly states that the cerebellum is extremely important in learned motor movements and stores motor patterns, using the example of a signature and referring to it as the location of \"muscle memory.\"", "C": "C) The thalamus is the primary relay station.", "D": "D) The amygdala is responsible for alerting the body to danger, and other parts of the limbic system and cortex generate emotional responses."}}, {"id": 203, "category": ["Week 3 Questions Only"], "stem": "The composition of cerebrospinal fluid (CSF) differs significantly from plasma to maintain a stable environment for central nervous system neurons. A key difference is that CSF has a much lower concentration of which ion to reduce neuronal excitability?", "options": ["Sodium", "Potassium", "Magnesium", "Chloride"], "correct": "B", "rationale": {"A": "A) Sodium concentration is slightly lower, but the effect of the large change in potassium is more significant for reducing excitability.", "B": "The lecture heavily emphasizes this point. Lowering extracellular potassium increases its concentration gradient, encouraging K+ to leave the neuron. This makes the neuron's membrane potential more negative (hyperpolarized) and thus less excitable, which helps prevent seizures.", "C": "C) Magnesium concentration is higher in CSF to reduce excitability.", "D": "D) Chloride concentration is slightly higher in CSF."}}, {"id": 204, "category": ["Week 3 Questions Only"], "stem": "What is the primary purpose of the widely divergent pattern of synaptic connectivity seen in modulatory neurotransmitter systems?", "options": ["To execute specific, task-oriented motor commands.", "To process sensory information from a single source.", "To control the overall excitability of large areas or multiple regions of the brain.", "To create a rapid, one-to-one transmission of information for reflexes."], "correct": "C", "rationale": {"A": "A) Task-oriented commands are characteristic of spatially focused systems.", "B": "B) Sensory processing is typically more focused, not widely divergent.", "C": "The transcript defines widely divergent systems as having a few cells sending widespread projections to multiple regions of the brain to modulate the level of excitability for complex behaviors like sleep-wake cycles or attention.", "D": "D) Rapid one-to-one transmission is more characteristic of a simple reflex arc or a spatially focused system."}}, {"id": 205, "category": ["Week 3 Questions Only"], "stem": "The neurotransmitter system originating in the locus coeruleus is crucial for regulating attention, sleep-wake cycles, and mood. This system uses which neurotransmitter?", "options": ["Serotonin", "Dopamine", "Acetylcholine", "Norepinephrine"], "correct": "D", "rationale": {"A": "A) The serotonin system originates in the raphe nuclei.", "B": "B) The dopamine system originates in the substantia nigra and VTA.", "C": "C) The acetylcholine system originates from several smaller nuclei in the brainstem and forebrain.", "D": "The lecture clearly states that the norepinephrine system originates in the locus coeruleus and is involved in regulating sleep-wake cycles, attention, and mood."}}, {"id": 206, "category": ["Week 3 Questions Only"], "stem": "The rewarding and pleasurable feelings associated with activities like eating delicious food or listening to music are driven by the release of dopamine from which brain region?", "options": ["Substantia nigra", "Locus coeruleus", "Ventral tegmental area (VTA)", "Raphe nuclei"], "correct": "C", "rationale": {"A": "A) The substantia nigra is the origin of the motor dopamine circuit.", "B": "B) The locus coeruleus is the origin of the norepinephrine system.", "C": "The professor identifies the reward pathway as starting with dopaminergic cells in the ventral tegmental area (VTA), stating it is stimulated by anything that brings pleasure and makes you want to do it again.", "D": "D) The raphe nuclei are the origin of the serotonin system."}}, {"id": 207, "category": ["Week 3 Questions Only"], "stem": "A patient taking MDMA (Ecstasy) experiences euphoria, motor restlessness, and hyperthermia. These effects are a direct result of the drug flooding the synapses with which neurotransmitter?", "options": ["Norepinephrine", "Serotonin", "Dopamine", "Acetylcholine"], "correct": "A", "rationale": {"A": "A) Mood is primarily serotonin and norepinephrine; appetite is hypothalamic.", "B": "B) Motor control is the other dopamine circuit; reward is the primary dopamine circuit.", "C": "C) Sleep-wake cycles and cognitive processing", "D": "D) Attention is primarily norepinephrine; fear response involves the amygdala."}}, {"id": 208, "category": ["Week 3 Questions Only"], "stem": "Which statement accurately describes the two key circuits of the dopamine system?", "options": ["One circuit controls sleep-wake cycles, and the other regulates mood.", "One circuit begins in the substantia nigra for motor control, and the other begins in the VTA for reward and motivation.", "Both circuits originate in the VTA, with one projecting to the neocortex for attention and the other to the limbic system for emotion.", "Both circuits are involved in cognitive processing, originating in the raphe nuclei and projecting widely throughout the brain."], "correct": "B", "rationale": {"A": "A) These are functions of the norepinephrine and serotonin systems.", "B": "The lecture explicitly divides the dopamine system this way. The first circuit from the substantia nigra to the basal ganglia is motor-related. The second, from the VTA to the prefrontal cortex and limbic system, is the reward pathway.", "C": "C) The origins are distinct (substantia nigra and VTA), not both from the VTA.", "D": "D) The raphe nuclei are associated with serotonin, not dopamine."}}, {"id": 209, "category": ["Week 3 Questions Only"], "stem": "While the central acetylcholine system's functions are not fully understood, it is known to play a reliable role in which two processes?", "options": ["Mood and appetite", "Motor control and reward", "Sleep-wake cycles and cognitive processing", "Attention and fear response"], "correct": "C", "rationale": {"A": "A) Mood is primarily serotonin and norepinephrine; appetite is hypothalamic.", "B": "B) Motor control is the other dopamine circuit; reward is the primary dopamine circuit.", "C": "The lecture states that while much is unknown about the acetylcholine system, it reliably interacts with sleep-wake cycles. It also plays a role in cognitive processing and perception, as evidenced by the delirium (\"mad as a hatter\") that occurs when it is blocked.", "D": "D) Attention is primarily norepinephrine; fear response involves the amygdala."}}, {"id": 210, "category": ["Week 3 Questions Only"], "stem": "All sensory information enters the spinal cord through the dorsal roots, while motor commands exit through the ventral roots. What is the structure that contains the cell bodies of the sensory neurons?", "options": ["The lateral horn", "The sympathetic chain ganglion", "The ventral horn", "The dorsal root ganglion"], "correct": "A", "rationale": {"A": "A) The lateral horn contains cell bodies of autonomic efferent neurons.", "B": "B) The sympathetic chain ganglion is a site of synapses for the sympathetic nervous system, not the location of sensory neuron cell bodies.", "C": "C) The ventral horn contains cell bodies of somatic motor neurons.", "D": "This option is incorrect."}}, {"id": 211, "category": ["Week 3 Questions Only"], "stem": "A patient develops a painful, blistering rash that follows a distinct line across one side of their chest, not crossing the midline. This presentation is characteristic of shingles, which emerges from the spinal cord along a specific:", "options": ["Myotome", "Sclerotome", "Dermatome", "Viscerotome"], "correct": "A", "rationale": {"A": "A) Myelinated axons; neuronal cell bodies and synapses", "B": "B) This reverses the definitions.", "C": "C & D) These describe components or functions within the matter types but are not the primary definitions of what they are composed of.", "D": "C & D) These describe components or functions within the matter types but are not the primary definitions of what they are composed of."}}, {"id": 212, "category": ["Week 3 Questions Only"], "stem": "In the spinal cord, white matter is primarily composed of _____, while gray matter is primarily composed of _____.", "options": ["Myelinated axons; neuronal cell bodies and synapses", "Neuronal cell bodies; myelinated axons", "Interneurons; motor neurons", "Ascending tracts; descending tracts"], "correct": "A", "rationale": {"A": "The lecture explains that white matter appears white due to the myelination of axons that are traveling vertically up or down the cord. Gray matter appears darker because it is where the neuronal cell bodies and synapses are concentrated for horizontal processing.", "B": "B) This reverses the definitions.", "C": "C & D) These describe components or functions within the matter types but are not the primary definitions of what they are composed of.", "D": "C & D) These describe components or functions within the matter types but are not the primary definitions of what they are composed of."}}, {"id": 213, "category": ["Week 3 Questions Only"], "stem": "During the patellar reflex, tapping the patellar ligament causes a rapid stretch of the quadriceps muscle. What is the immediate response of the spinal cord circuitry?", "options": ["Inhibition of the quadriceps motor neuron and stimulation of the hamstring motor neuron.", "Stimulation of the quadriceps motor neuron and inhibition of the hamstring motor neuron.", "Sending a signal to the brain to request a voluntary motor command.", "Stimulation of both the quadriceps and hamstring motor neurons for stabilization."], "correct": "D", "rationale": {"A": "A) This reverses the correct actions.", "B": "This option is incorrect.", "C": "C) The patellar reflex is a purely spinal reflex and does not require input from the brain.", "D": "D) The hamstring must relax for the quadriceps to contract effectively; stimulating both would prevent the kick."}}, {"id": 214, "category": ["Week 3 Questions Only"], "stem": "A patient has a complete spinal cord transection at the T6 level. Which of the following would be true regarding their patellar reflex?", "options": ["The reflex would be absent because no motor commands can descend from the brain.", "The reflex would be intact, but the patient would not feel the tap or the subsequent kick.", "The reflex would be hyperactive because descending inhibition from the brain is lost.", "The reflex would be absent because sensory information cannot ascend to the lumbar spine."], "correct": "A", "rationale": {"A": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "B": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "C": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "D": "D) Vagus nerve (X)  D. Vagus nerve (X) Rationale for Correct Answer: The lecture emphasizes this fact twice, stating that the vagus nerve conveys about 70% of the parasympathetic nervous system's output to the entire body. Rationale for Incorrect Answers:"}}, {"id": 215, "category": ["Week 3 Questions Only"], "stem": "The autonomic nervous system is characterized by a two-neuron chain. The first neuron, whose cell body is in the central nervous system, is called the:", "options": ["Postganglionic neuron", "Afferent neuron", "Preganglionic neuron", "Interneuron"], "correct": "C", "rationale": {"A": "A) The postganglionic neuron is the second neuron in the chain.", "B": "B) An afferent neuron carries sensory information to the CNS.", "C": "The lecture defines the basic two-cell organization of the ANS efferent arm. The first cell, with its cell body in the CNS, is the preganglionic neuron. It synapses on the second cell, the postganglionic neuron.", "D": "D) An interneuron is a neuron that connects other neurons, typically within the CNS."}}, {"id": 216, "category": ["Week 3 Questions Only"], "stem": "The preganglionic neurons of the sympathetic nervous system originate in which region of the spinal cord?", "options": ["The lateral horn of the craniosacral regions.", "The ventral horn of the cervical region.", "The dorsal horn of the lumbar region.", "The lateral horn of the thoracolumbar region (T1-L3)."], "correct": "D", "rationale": {"A": "A) Craniosacral origins are characteristic of the parasympathetic nervous system.", "B": "B) The ventral horn contains somatic motor neurons.", "C": "C) The dorsal horn receives sensory neurons.", "D": "The transcript clearly states that for the sympathetic nervous system, the cell bodies of the preganglionic neurons are located in the lateral horn of the spinal cord between levels T1 and L3."}}, {"id": 217, "category": ["Week 3 Questions Only"], "stem": "In the parasympathetic nervous system, the preganglionic fibers are typically _____, and the postganglionic fibers are _____.", "options": ["Long; short", "Short; long", "Myelinated; unmyelinated", "Unmyelinated; myelinated"], "correct": "A", "rationale": {"A": "In the parasympathetic division, preganglionic neurons travel a long distance from the CNS to ganglia located very close to or on the target organ. Therefore, the postganglionic fiber only needs to travel a very short distance.", "B": "B) Short preganglionic and long postganglionic fibers are characteristic of the sympathetic nervous system.", "C": "C & D) While myelination is relevant, the defining structural difference in fiber length is a key distinction between the two divisions.", "D": "C & D) While myelination is relevant, the defining structural difference in fiber length is a key distinction between the two divisions."}}, {"id": 218, "category": ["Week 3 Questions Only"], "stem": "Which cranial nerve is responsible for carrying approximately 70% of all parasympathetic nervous system output to the body's viscera?", "options": ["Oculomotor nerve (III)", "Facial nerve (VII)", "Glossopharyngeal nerve (IX)", "Vagus nerve (X)"], "correct": "D", "rationale": {"A": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "B": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "C": "A, B, C) Cranial nerves III, VII, and IX are part of the parasympathetic system's cranial outflow, but their projections are more localized (to the eyes, salivary glands, etc.) compared to the widespread visceral innervation of the vagus nerve.", "D": "The lecture emphasizes this fact twice, stating that the vagus nerve conveys about 70% of the parasympathetic nervous system's output to the entire body."}}, {"id": 219, "category": ["Week 3 Questions Only"], "stem": "A unique feature of the sympathetic nervous system is its endocrine arm, where a preganglionic neuron directly synapses on the adrenal medulla, causing the release of what substance into the bloodstream?", "options": ["Norepinephrine", "Acetylcholine", "Epinephrine", "Cortisol"], "correct": "A", "rationale": {"A": "A) Muscarinic receptors are found on the target organs of the parasympathetic system.", "B": "B) Nicotinic acetylcholine receptors", "C": "C & D) Adrenergic receptors are found on the target organs of the sympathetic system.", "D": "C & D) Adrenergic receptors are found on the target organs of the sympathetic system."}}, {"id": 220, "category": ["Week 3 Questions Only"], "stem": "What neurotransmitter is released by ALL preganglionic neurons in both the sympathetic and parasympathetic nervous systems?", "options": ["Norepinephrine", "Epinephrine", "Dopamine", "Acetylcholine"], "correct": "D", "rationale": {"A": "A & B) Norepinephrine and epinephrine are the primary chemical messengers at the end of the sympathetic pathway (postganglionic neuron or adrenal medulla).", "B": "A & B) Norepinephrine and epinephrine are the primary chemical messengers at the end of the sympathetic pathway (postganglionic neuron or adrenal medulla).", "C": "C) Dopamine is a central neurotransmitter not primarily used in the peripheral ANS synapses.", "D": "This is a crucial rule of the ANS articulated in the lecture. Preganglionic neurons of both the sympathetic and parasympathetic systems release acetylcholine (ACh)."}}, {"id": 221, "category": ["Week 3 Questions Only"], "stem": "The receptors on the postganglionic neurons that bind the neurotransmitter released from preganglionic neurons are of what type?", "options": ["Muscarinic acetylcholine receptors", "Nicotinic acetylcholine receptors", "Alpha-adrenergic receptors", "Beta-adrenergic receptors"], "correct": "B", "rationale": {"A": "A) Muscarinic receptors are found on the target organs of the parasympathetic system.", "B": "The lecture and slides show that the acetylcholine released from preganglionic neurons (both sympathetic and parasympathetic) binds to nicotinic acetylcholine receptors on the cell body of the postganglionic neuron.", "C": "C & D) Adrenergic receptors are found on the target organs of the sympathetic system.", "D": "C & D) Adrenergic receptors are found on the target organs of the sympathetic system."}}, {"id": 222, "category": ["Week 3 Questions Only"], "stem": "A medication that blocks muscarinic acetylcholine receptors would primarily interfere with which part of the nervous system?", "options": ["The synapse between sympathetic preganglionic and postganglionic neurons.", "The synapse between parasympathetic postganglionic neurons and target organs.", "The neuromuscular junction of skeletal muscle.", "The synapse between sympathetic postganglionic neurons and target organs."], "correct": "A", "rationale": {"A": "A & C) These synapses use nicotinic acetylcholine receptors.", "B": "This option is incorrect.", "C": "A & C) These synapses use nicotinic acetylcholine receptors.", "D": "D) This synapse uses adrenergic receptors for norepinephrine."}}, {"id": 223, "category": ["Week 3 Questions Only"], "stem": "During a \"fight-or-flight\" response, blood flow is shunted away from the viscera and towards skeletal muscle. This is accomplished because norepinephrine causes vasoconstriction in visceral blood vessels via _____ receptors, while epinephrine causes vasodilation in skeletal muscle blood vessels via _____ receptors.", "options": ["Beta-1; Alpha-1", "Beta-2; Beta-1", "Alpha-1; Beta-2", "Nicotinic; Muscarinic"], "correct": "D", "rationale": {"A": "A) Ependymal cells line the ventricles, separating CSF from brain tissue, but are not the BBB.", "B": "B) Tight junctions between capillary endothelial cells and astrocyte end-feet.", "C": "C) The meninges are protective outer coverings of the brain.", "D": "D) Oligodendrocytes provide myelin for axons, not the BBB."}}, {"id": 224, "category": ["Week 3 Questions Only"], "stem": "The brain's central control centers for the autonomic nervous system, which integrate visceral sensory information and issue efferent commands, are located in the:", "options": ["Cerebellum and basal ganglia", "Frontal lobe and motor cortex", "Thalamus and hippocampus", "Hypothalamus and brain stem"], "correct": "D", "rationale": {"A": "A) These are primarily involved in motor control.", "B": "B) These are involved in motor control and executive function.", "C": "C) These are involved in sensory relay and memory/emotion.", "D": "The lecture concludes by identifying the hypothalamus and brain stem as the two parts of the brain that control autonomic function by monitoring sensory input and controlling efferent output."}}, {"id": 225, "category": ["Week 3 Questions Only"], "stem": "The blood-brain barrier is a highly selective barrier that protects the brain. Its physical structure is primarily created by:", "options": ["Ependymal cells lining the ventricles.", "Tight junctions between capillary endothelial cells and astrocyte end-feet.", "The dura mater and arachnoid mater.", "Oligodendrocytes wrapping around the capillaries."], "correct": "B", "rationale": {"A": "A) Ependymal cells line the ventricles, separating CSF from brain tissue, but are not the BBB.", "B": "The lecture describes the physical structure of the BBB as having three components: the tight junctions of the endothelial cells (preventing passage between cells), the basement membrane, and the end-feet of astrocytes wrapped around the capillary.", "C": "C) The meninges are protective outer coverings of the brain.", "D": "D) Oligodendrocytes provide myelin for axons, not the BBB."}}, {"id": 226, "category": ["Week 3 Questions Only"], "stem": "A new drug is developed that is a large, water-soluble molecule. What is the likelihood that this drug will effectively cross the blood-brain barrier to act on the CNS?", "options": ["High, because water-soluble molecules are easily transported.", "High, because large molecules can pass through the fenestrations in brain capillaries.", "Low, because it is not lipid-soluble and lacks a specific transporter.", "Low, because only gases like oxygen and carbon dioxide can cross the barrier."], "correct": "A", "rationale": {"A": "A) The primary somatosensory cortex perceives conscious sensation.", "B": "B) The prefrontal cortex is involved in planning and executive function, but the command originates in the motor cortex.", "C": "C) Primary motor cortex", "D": "D) The basal ganglia regulate motor commands, but do not originate them."}}, {"id": 227, "category": ["Week 3 Questions Only"], "stem": "The part of the cerebral cortex responsible for initiating all voluntary motor movements is the:", "options": ["Primary somatosensory cortex", "Prefrontal cortex", "Primary motor cortex", "Basal ganglia"], "correct": "C", "rationale": {"A": "A) The primary somatosensory cortex perceives conscious sensation.", "B": "B) The prefrontal cortex is involved in planning and executive function, but the command originates in the motor cortex.", "C": "The lecture explicitly states that all voluntary motor movements originate in the primary motor cortex, located in the frontal lobe just anterior to the central sulcus.", "D": "D) The basal ganglia regulate motor commands, but do not originate them."}}, {"id": 228, "category": ["Week 3 Questions Only"], "stem": "A neuroscientist is studying a circuit where a small group of neurons in the brainstem sends projections to modulate the activity of the entire neocortex, the hippocampus, and the cerebellum. This circuit pattern would be best described as:", "options": ["Spatially focused", "Widely divergent", "A spinal reflex", "A sensory pathway"], "correct": "A", "rationale": {"A": "A) These symptoms represent a deficit, not an excess, of serotonin activity.", "B": "B) Motor restlessness, hyperthermia, and altered mental status.", "C": "C) These are desired therapeutic effects at normal levels, not symptoms of a toxic overload.", "D": "D) These symptoms are not characteristic of serotonin function."}}, {"id": 229, "category": ["Week 3 Questions Only"], "stem": "Serotonin syndrome is a potentially life-threatening condition caused by excessive serotonergic activity. Based on the functions of the serotonin system, which set of symptoms would be expected?", "options": ["Sedation, decreased body temperature, and constipation.", "Motor restlessness, hyperthermia, and altered mental status.", "Improved attention, reduced appetite, and calm mood.", "Paralysis, low blood pressure, and sleepiness."], "correct": "B", "rationale": {"A": "A) These symptoms represent a deficit, not an excess, of serotonin activity.", "B": "The lecture identifies the serotonin system's role in motor excitation, temperature control, and mood/cognition. Serotonin syndrome, an overload of this system, would therefore manifest as hyperactivity (motor restlessness), elevated temperature (hyperthermia), and cognitive changes (altered mental status, psychosis).", "C": "C) These are desired therapeutic effects at normal levels, not symptoms of a toxic overload.", "D": "D) These symptoms are not characteristic of serotonin function."}}, {"id": 230, "category": ["Week 3 Questions Only"], "stem": "Addiction hijacks the brain's reward pathway. The prefrontal cortex, which is responsible for planning and impulse control, becomes a \"slave\" to the reward system because it receives a massive influx of which neurotransmitter from the VTA?", "options": ["Serotonin", "Norepinephrine", "Acetylcholine", "Dopamine"], "correct": "A", "rationale": {"A": "A, B, C) While these neurotransmitters are involved in mood and wakefulness, dopamine is the primary neurotransmitter of the reward and motivation circuit discussed.", "B": "A, B, C) While these neurotransmitters are involved in mood and wakefulness, dopamine is the primary neurotransmitter of the reward and motivation circuit discussed.", "C": "A, B, C) While these neurotransmitters are involved in mood and wakefulness, dopamine is the primary neurotransmitter of the reward and motivation circuit discussed.", "D": "This option is incorrect."}}, {"id": 231, "category": ["Week 3 Questions Only"], "stem": "Ascending tracts in the spinal cord's white matter are responsible for conveying what type of information?", "options": ["Motor commands from the brain to the muscles.", "Sensory information from the body to the brain.", "Autonomic commands to visceral organs.", "Reflexive motor outputs within a spinal segment."], "correct": "A", "rationale": {"A": "A) Astrocytes form part of the BBB.", "B": "B) Schwann cells provide myelin in the peripheral nervous system.", "C": "C) Oligodendrocyte", "D": "D) Ependymal cells line the ventricles."}}, {"id": 232, "category": ["Week 3 Questions Only"], "stem": "Which glial cell is responsible for forming the myelin sheath around axons within the central nervous system?", "options": ["Astrocyte", "Schwann cell", "Oligodendrocyte", "Ependymal cell"], "correct": "C", "rationale": {"A": "A) Astrocytes form part of the BBB.", "B": "B) Schwann cells provide myelin in the peripheral nervous system.", "C": "The lecture identifies oligodendrocytes as one of the three main glial cells and states their function is to provide myelination to axons within the central nervous system.", "D": "D) Ependymal cells line the ventricles."}}, {"id": 233, "category": ["Week 3 Questions Only"], "stem": "A patient is given a beta-1 adrenergic antagonist (a \"beta-blocker\"). What is the expected effect on the heart?", "options": ["Increased heart rate and contractility.", "Decreased heart rate and contractility.", "Dilation of the coronary arteries.", "No effect, as the heart has alpha receptors."], "correct": "A", "rationale": {"A": "A) Sympathetic tone increases during stress.", "B": "B) Parasympathetic nervous system", "C": "C) The somatic system controls voluntary muscle movement.", "D": "D) The endocrine system is a separate signaling system."}}, {"id": 234, "category": ["Week 3 Questions Only"], "stem": "Under normal, resting conditions, the autonomic tone of the body is dominated by the:", "options": ["Sympathetic nervous system", "Parasympathetic nervous system", "Somatic nervous system", "Endocrine system"], "correct": "B", "rationale": {"A": "A) Sympathetic tone increases during stress.", "B": "The lecture states that under resting conditions, the parasympathetic tone to all targets of the body is much higher than the sympathetic tone. It maintains baseline \"rest and digest\" functions.", "C": "C) The somatic system controls voluntary muscle movement.", "D": "D) The endocrine system is a separate signaling system."}}, {"id": 235, "category": ["Week 3 Questions Only"], "stem": "An individual is trying to understand a complex sentence while also interpreting the speaker's body language and tone of voice. All of this sensory information is integrated and given meaning primarily in which brain region?", "options": ["The primary motor cortex", "Broca's area", "Wernicke's area", "The cerebellum"], "correct": "A", "rationale": {"A": "A) This describes the sympathetic chain ganglia.", "B": "B) Very close to or within the wall of the target organ.", "C": "C & D) The ganglia are, by definition, outside the CNS in the peripheral nervous system.", "D": "C & D) The ganglia are, by definition, outside the CNS in the peripheral nervous system."}}, {"id": 236, "category": ["Week 3 Questions Only"], "stem": "The disproportionately large representation of the hands and face on the somatotopic map (homunculus) of the somatosensory cortex signifies that these areas have:", "options": ["The largest muscle groups.", "The highest density of sensory receptors and greatest sensitivity.", "The least amount of brain plasticity.", "The most direct connection to the brain stem."], "correct": "B", "rationale": {"A": "A) The trunk has the largest muscles but a small representation.", "B": "The lecture explains that the size of the body part on the somatotopic map represents the amount of cortex dedicated to it, which corresponds to areas with the greatest resolution and sensitivity.", "C": "C) The brain is plastic, and these areas can change.", "D": "D) This is not what the map represents."}}, {"id": 237, "category": ["Week 3 Questions Only"], "stem": "The cell bodies of autonomic efferent neurons are located in which specific region of the spinal cord's gray matter?", "options": ["The dorsal horn", "The ventral horn", "The lateral horn", "The central canal"], "correct": "C", "rationale": {"A": "A) The dorsal horn receives sensory neurons.", "B": "B) The ventral horn contains somatic motor neurons.", "C": "The lecture specifies that the lateral horn of the gray matter is where the cell bodies belonging to autonomic efferent neurons are found.", "D": "D) The central canal is for CSF flow."}}, {"id": 238, "category": ["Week 3 Questions Only"], "stem": "Stimulation of the parasympathetic nervous system would lead to which of the following physiological responses?", "options": ["Increased heart rate", "Dilation of the pupils", "Increased digestion and gut motility", "Bronchodilation"], "correct": "C", "rationale": {"A": "A, B, D) Increased heart rate, pupillary dilation, and bronchodilation are all effects of the sympathetic (\"fight-or-flight\") system.", "B": "A, B, D) Increased heart rate, pupillary dilation, and bronchodilation are all effects of the sympathetic (\"fight-or-flight\") system.", "C": "The parasympathetic system is the \"rest and digest\" system. Its stimulation promotes vegetative functions like digestion.", "D": "A, B, D) Increased heart rate, pupillary dilation, and bronchodilation are all effects of the sympathetic (\"fight-or-flight\") system."}}, {"id": 239, "category": ["Week 3 Questions Only"], "stem": "Unlike the sympathetic system with its long sympathetic chain, the ganglia of the parasympathetic system are located:", "options": ["In a chain running parallel to the vertebral column.", "Very close to or within the wall of the target organ.", "Exclusively within the central nervous system.", "In the dorsal root of the spinal nerves."], "correct": "B", "rationale": {"A": "A) This describes the sympathetic chain ganglia.", "B": "The lecture contrasts the two systems. In the parasympathetic system, the ganglia are described as small plexi located very close to, and sometimes on, the target organ itself.", "C": "C & D) The ganglia are, by definition, outside the CNS in the peripheral nervous system.", "D": "C & D) The ganglia are, by definition, outside the CNS in the peripheral nervous system."}}, {"id": 240, "category": ["Week 3 Questions Only"], "stem": "A drug that acts as a norepinephrine reuptake inhibitor, such as Strattera, would be expected to improve symptoms of which condition?", "options": ["Depression", "Attention Deficit Disorder (ADHD)", "Parkinson's Disease", "Insomnia"], "correct": "A", "rationale": {"A": "A) This is an executive function of the frontal lobe.", "B": "B) This is a function of the cerebellum.", "C": "C) Regulating baseline breathing and heart rate.", "D": "D) This is a function of Wernicke's area in the cerebrum."}}, {"id": 241, "category": ["Week 3 Questions Only"], "stem": "In the language circuit, what is the role of the angular gyrus?", "options": ["It generates the motor plan for speaking.", "It processes the emotional content of language only.", "It combines auditory, visual, and other sensory inputs and feeds them into Wernicke's area for comprehension.", "It is the final checkpoint that edits speech before it is produced."], "correct": "C", "rationale": {"A": "A) Broca's area generates the motor plan for speaking.", "B": "B) It integrates multiple senses, not just emotion.", "C": "This is the precise definition given in the lecture. The angular gyrus acts as an integration center for various senses before the information is processed for meaning in Wernicke's area.", "D": "D) The editing function is described as a bidirectional process between Wernicke's and Broca's areas."}}, {"id": 242, "category": ["Week 3 Questions Only"], "stem": "Which of the following is an example of a function controlled by the brain stem?", "options": ["Planning a weekly schedule.", "Storing the motor pattern for writing your signature.", "Regulating baseline breathing and heart rate.", "Comprehending a spoken sentence."], "correct": "C", "rationale": {"A": "A) This is an executive function of the frontal lobe.", "B": "B) This is a function of the cerebellum.", "C": "The lecture identifies the brain stem (medulla, pons, midbrain) as the part of the brain responsible for maintaining baseline vegetative functions, including keeping the heart pumping and lungs breathing.", "D": "D) This is a function of Wernicke's area in the cerebrum."}}, {"id": 243, "category": ["Week 3 Questions Only"], "stem": "A patient is administered a drug that blocks all nicotinic acetylcholine receptors in the peripheral nervous system. What would be a direct consequence?", "options": ["Only sympathetic postganglionic neurons would fail to fire.", "Only parasympathetic postganglionic neurons would fail to fire.", "All autonomic postganglionic neurons (both sympathetic and parasympathetic) would fail to fire.", "Only target organs of the parasympathetic system would be affected."], "correct": "A", "rationale": {"A": "A) Spinal reflexes are typically faster because the pathway is shorter.", "B": "B) The sensory input is received and motor output is controlled entirely by a segment of the spinal cord without brain input.", "C": "C) Purely spinal reflexes are involuntary and cannot be consciously overridden, though the brain can modulate them under certain circumstances.", "D": "D) Sensory information travels along sensory (afferent) pathways."}}, {"id": 244, "category": ["Week 3 Questions Only"], "stem": "The \"leaky\" regions of the blood-brain barrier, known as the circumventricular organs, serve what important purpose?", "options": ["To drain excess cerebrospinal fluid from the brain.", "To allow the brain to monitor the chemical composition of the blood for things like hormones and cytokines.", "To provide the primary site for neurotransmitter synthesis.", "To anchor the brain to the dura mater."], "correct": "B", "rationale": {"A": "A) CSF is drained via arachnoid granulations.", "B": "The lecture explains that these circumventricular organs are strategic \"windows\" where parts of the brain can get access to circulating messengers that normally cannot cross the BBB, allowing for monitoring and response. The example given was the hypothalamus detecting cytokines to initiate a fever.", "C": "C & D) These are incorrect functions.", "D": "C & D) These are incorrect functions."}}, {"id": 245, "category": ["Week 3 Questions Only"], "stem": "Which part of the cerebrum is most heavily involved in \"executive function,\" such as planning, judgment, and focusing attention?", "options": ["The occipital lobe", "The parietal lobe", "The temporal lobe", "The frontal lobe"], "correct": "D", "rationale": {"A": "A, B, C) The occipital (vision), parietal (sensation/body image), and temporal (hearing/memory) lobes have other primary functions.", "B": "A, B, C) The occipital (vision), parietal (sensation/body image), and temporal (hearing/memory) lobes have other primary functions.", "C": "A, B, C) The occipital (vision), parietal (sensation/body image), and temporal (hearing/memory) lobes have other primary functions.", "D": "The lecture attributes higher-order brain functions, including executive function (planning, judgment, narrowing attention), to the cerebrum, specifically the frontal lobe and frontal cortex."}}, {"id": 246, "category": ["Week 3 Questions Only"], "stem": "The patellar reflex is classified as a purely spinal reflex. This means that:", "options": ["It is much slower than reflexes that involve the brain.", "The sensory input is received and motor output is controlled entirely by a segment of the spinal cord without brain input.", "It can be consciously overridden by the primary motor cortex.", "The sensory information travels along motor pathways."], "correct": "B", "rationale": {"A": "A) Spinal reflexes are typically faster because the pathway is shorter.", "B": "This is the definition of a purely spinal reflex provided in the lecture. The entire circuit is contained within the spinal cord (in this case, L2-L4), and it does not require descending input from the brain.", "C": "C) Purely spinal reflexes are involuntary and cannot be consciously overridden, though the brain can modulate them under certain circumstances.", "D": "D) Sensory information travels along sensory (afferent) pathways."}}, {"id": 247, "category": ["Week 3 Questions Only"], "stem": "A patient complains of tingling and numbness specifically in their thumb and index finger. A clinician using a dermatome map would investigate for a potential issue at which spinal nerve level?", "options": ["C3", "C6", "T4", "L1"], "correct": "A", "rationale": {"A": "A) This would be bronchoconstriction, a parasympathetic response.", "B": "B) Dilation of bronchioles in the lungs.", "C": "C & D) Changes in heart rate and contractility are mediated by beta-1 receptors on cardiac muscle.", "D": "C & D) Changes in heart rate and contractility are mediated by beta-1 receptors on cardiac muscle."}}, {"id": 248, "category": ["Week 3 Questions Only"], "stem": "What is the primary function of the basal ganglia in motor movement?", "options": ["To initiate all voluntary motor commands.", "To help regulate and smooth out motor movements initiated by the cortex.", "To store learned motor patterns like \"muscle memory.\"", "To receive sensory feedback from the muscles during movement."], "correct": "B", "rationale": {"A": "A) The primary motor cortex initiates commands.", "B": "The lecture describes the basal ganglia's role as modifying or adjusting motor movements. In the analogy used, it \"hears\" the command from the motor cortex and adjusts it to be more appropriate, preventing overshoot and imprecision.", "C": "C) The cerebellum stores learned motor patterns.", "D": "D) Sensory feedback is processed in the somatosensory cortex and cerebellum."}}, {"id": 249, "category": ["Week 3 Questions Only"], "stem": "Stimulation of beta-2 adrenergic receptors by epinephrine during a stress response would cause:", "options": ["Constriction of bronchioles in the lungs.", "Dilation of bronchioles in the lungs.", "An increase in the force of cardiac contraction.", "A decrease in heart rate."], "correct": "B", "rationale": {"A": "A) This would be bronchoconstriction, a parasympathetic response.", "B": "The lecture states that beta-2 receptors are found on the smooth muscle of the bronchioles in the lungs and that their stimulation causes bronchodilation, which is consistent with a \"fight-or-flight\" response to increase ventilation.", "C": "C & D) Changes in heart rate and contractility are mediated by beta-1 receptors on cardiac muscle.", "D": "C & D) Changes in heart rate and contractility are mediated by beta-1 receptors on cardiac muscle."}}, {"id": 250, "category": ["Week 4 Questions Only"], "stem": "Which of the following best defines an endocrine gland?", "options": ["A gland that releases its chemical messenger into a duct.", "A gland that releases its chemical messenger directly onto a neighboring cell.", "A gland that releases a chemical messenger directly into the bloodstream.", "A neuronal cell that releases a neurotransmitter into a synapse."], "correct": "C", "rationale": {"A": "A) describes an exocrine gland. B) describes paracrine signaling or neurotransmission. D) specifically describes a neuron's function at a synapse, not an endocrine gland.", "B": "This option is incorrect.", "C": "The lecture defines an endocrine gland as any structure that releases its chemical messenger (a hormone) directly into the bloodstream to travel throughout the body.", "D": "This option is incorrect."}}, {"id": 251, "category": ["Week 4 Questions Only"], "stem": "The hypothalamus and pituitary gland are classified as which type of endocrine structure?", "options": ["Dedicated peripheral endocrine glands", "Peripheral endocrine glands of mixed function", "Central endocrine glands", "Exocrine glands"], "correct": "C", "rationale": {"A": "A) refers to glands outside the CNS like the thyroid or adrenal glands. B) refers to organs with other primary functions, like the kidneys or reproductive organs. D) is a different category of gland altogether.", "B": "This option is incorrect.", "C": "The lecture explicitly categorizes the hypothalamus, pineal gland, and pituitary gland as central endocrine glands because they are parts of the central nervous system.", "D": "This option is incorrect."}}, {"id": 252, "category": ["Week 4 Questions Only"], "stem": "A key difference between a water-soluble hormone and a lipid-soluble hormone is that a water-soluble hormone:", "options": ["Can freely cross the cell membrane to bind to a nuclear receptor.", "Requires a binding protein for transport in the bloodstream.", "Is typically derived from cholesterol.", "Is limited to binding to a membrane receptor on the target cell."], "correct": "A", "rationale": {"A": "A) describes the action of lipid-soluble hormones. B) is a characteristic of lipid-soluble hormones. C) is the precursor for steroid (lipid-soluble) hormones.  Question 4: Thyroid hormone is an exception among amino acid-derived hormones because it is: A. Water-soluble B. Stored in large amounts in vesicles C. Lipid-soluble D. A polypeptide  C. Lipid-soluble Rationale for Correct Answer: The lecture highlights thyroid hormone (T3 and T4) as a major exception, stating that even though it is derived from an amino acid, the presence of iodine atoms makes the molecule non-polar and thus lipid-soluble (fat-soluble). Rationale for Incorrect Answers: A) is incorrect; this is the key exception. B) is incorrect; being lipid-soluble makes it hard to store in vesicles. D) is incorrect; it is derived from a single amino acid (tyrosine), not a chain.  Question 5: What is the common precursor molecule from which all steroid hormones are synthesized? A. Pregnenolone B. Amino acids C. Cholesterol D. Tyrosine  C. Cholesterol Rationale for Correct Answer: The lecture materials repeatedly state that all steroid hormones are derived from cholesterol. Rationale for Incorrect Answers: A) is the first product formed from cholesterol, but not the ultimate precursor. B) and D) are precursors for other classes of hormones (protein and amino acid-derived).  Question 6: In the biosynthesis of steroid hormones, cholesterol is transported to endocrine cells primarily via: A. High-density lipoprotein (HDL) B. Free diffusion as a lipid C. Albumin binding D. Low-density lipoprotein (LDL)  D. Low-density lipoprotein (LDL) Rationale for Correct Answer: The lecture describes how cholesterol is packaged into LDLs by the liver, which then find their way to endocrine cells, bind to LDL receptors, and are internalized to provide the cholesterol for steroid hormone synthesis. Rationale for Incorrect Answers: A), B), and C) are incorrect transport mechanisms for delivering cholesterol to steroid-producing cells according to the lecture.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 253, "category": ["Week 4 Questions Only"], "stem": "Thyroid hormone is an exception among amino acid-derived hormones because it is:", "options": ["Water-soluble", "Stored in large amounts in vesicles", "Lipid-soluble", "A polypeptide"], "correct": "C", "rationale": {"A": "A) is incorrect; this is the key exception. B) is incorrect; being lipid-soluble makes it hard to store in vesicles. D) is incorrect; it is derived from a single amino acid (tyrosine), not a chain.", "B": "This option is incorrect.", "C": "The lecture highlights thyroid hormone (T3 and T4) as a major exception, stating that even though it is derived from an amino acid, the presence of iodine atoms makes the molecule non-polar and thus lipid-soluble (fat-soluble).", "D": "This option is incorrect."}}, {"id": 254, "category": ["Week 4 Questions Only"], "stem": "What is the common precursor molecule from which all steroid hormones are synthesized?", "options": ["Pregnenolone", "Amino acids", "Cholesterol", "Tyrosine"], "correct": "C", "rationale": {"A": "A) is the first product formed from cholesterol, but not the ultimate precursor. B) and D) are precursors for other classes of hormones (protein and amino acid-derived).", "B": "This option is incorrect.", "C": "The lecture materials repeatedly state that all steroid hormones are derived from cholesterol.", "D": "This option is incorrect."}}, {"id": 255, "category": ["Week 4 Questions Only"], "stem": "In the biosynthesis of steroid hormones, cholesterol is transported to endocrine cells primarily via:", "options": ["High-density lipoprotein (HDL)", "Free diffusion as a lipid", "Albumin binding", "Low-density lipoprotein (LDL)"], "correct": "D", "rationale": {"A": "A), B), and C) are incorrect transport mechanisms for delivering cholesterol to steroid-producing cells according to the lecture.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture describes how cholesterol is packaged into LDLs by the liver, which then find their way to endocrine cells, bind to LDL receptors, and are internalized to provide the cholesterol for steroid hormone synthesis."}}, {"id": 256, "category": ["Week 4 Questions Only"], "stem": "A congenital deficiency in an enzyme required for cortisol synthesis often leads to the in-utero overproduction of which other hormones?", "options": ["Aldosterone", "Thyroid hormones", "Androgens and testosterone", "Catecholamines"], "correct": "A", "rationale": {"A": "A), B), and D) are incorrect; the lecture specifies that the pathway shifts toward androgen production.  Question 8: Lipid-soluble hormones, such as steroids and thyroid hormone, primarily exert their effects on target cells by: A. Activating second messenger systems like cyclic AMP. B. Opening or closing ion channels to change membrane potential. C. Binding to nuclear receptors to activate or deactivate specific genes. D. Triggering the immediate exocytosis of proteins.  C. Binding to nuclear receptors to activate or deactivate specific genes. Rationale for Correct Answer: The lecture explains that lipid-soluble hormones freely cross the cell membrane, enter the nucleus, and bind to nuclear receptors, which then directly influence gene expression (transcription) to
