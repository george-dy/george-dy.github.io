ontext and meaning (e.g., understanding sarcasm).", "The inability to recall long-term memories."], "correct": "A", "rationale": {"A": "A is the function of Wernicke's area. B is the function of Broca's area. D is a function of the hippocampus.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 410, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A pharmaceutical company is designing a new drug that needs to act on nuclear receptors within brain cells. Which chemical property is most essential for this drug?", "options": ["High water solubility to travel freely in the bloodstream.", "High lipid solubility to cross the blood-brain barrier and the cell membrane.", "A large molecular weight to prevent rapid degradation.", "A peptide structure to mimic endogenous hormones."], "correct": "A", "rationale": {"A": "A would prevent the drug from crossing the BBB. C is not the essential property for crossing membranes. D (peptide) would be water-soluble and unable to cross.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 411, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient is treated with a medication that is a potent agonist for beta-2 adrenergic receptors. Which of the following effects would be expected?", "options": ["Increased heart rate and contractility.", "Constriction of visceral blood vessels.", "Bronchodilation and relaxation of the bladder wall.", "Decreased glucose production by the liver."], "correct": "A", "rationale": {"A": "A is a beta-1 effect. B is an alpha-1 effect. D is incorrect; sympathetic stimulation generally increases glucose availability.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 412, "category": ["\"More difficult\" Exam Questions 2"], "stem": "During a state of prolonged starvation, the liver begins to break down fats, producing an excess of keto acids. This would be classified as:", "options": ["Respiratory acidosis", "Respiratory alkalosis", "Metabolic acidosis", "Metabolic alkalosis"], "correct": "D", "rationale": {"A": "a) Infiltration due to the cell's inability to digest the substance. Rationale for Correct Answer: The lecture defines infiltrations/accumulations as occurring when \"the cell cannot digest whatever it's being presented with.\" Tay-Sachs is used as an example where a missing enzyme prevents the digestion of a specific lipid, causing it to accumulate. Rationale for Incorrect Answers: B is a different cause of accumulation (e.g., fatty liver due to high fat intake). C and D are different cellular responses altogether.", "B": "b) Accumulation due to overwhelming demand for storage.", "C": "c) Atrophy due to decreased nutritional support.", "D": "d) Hydropic swelling due to hypoxic injury."}}, {"id": 413, "category": ["\"More difficult\" Exam Questions 2"], "stem": "What is the primary reason that a disease is considered more than just its etiology (cause)?", "options": ["Because many diseases are idiopathic, and therefore the cause is irrelevant to the diagnosis.", "Because the body's response to the initial injury is a critical component of the pathogenesis and clinical manifestations.", "Because the etiology only determines the signs of a disease, not the symptoms.", "Because the pathogenesis always fully resolves the initial injury."], "correct": "B", "rationale": {"A": "A is incorrect; the cause is highly relevant. C is an incorrect statement. D is incorrect; pathogenesis is the development of the disease, not its resolution.", "B": "The lecture strongly emphasizes this point, stating, \"in many of the diseases and conditions we will talk about, the body's response to the injury is actually what causes more of the negative manifestations than the initial injury.\" This makes the pathogenesis a critical component of the disease definition.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 414, "category": ["\"More difficult\" Exam Questions 2"], "stem": "In a patient with Tay-Sachs disease, a deficiency in a lysosomal enzyme leads to the accumulation of lipids within neurons. This is an example of which type of altered intracellular storage?", "options": ["Infiltration due to the cell's inability to digest the substance.", "Accumulation due to overwhelming demand for storage.", "Atrophy due to decreased nutritional support.", "Hydropic swelling due to hypoxic injury."], "correct": "A", "rationale": {"A": "The lecture defines infiltrations/accumulations as occurring when \"the cell cannot digest whatever it's being presented with.\" Tay-Sachs is used as an example where a missing enzyme prevents the digestion of a specific lipid, causing it to accumulate.", "B": "B is a different cause of accumulation (e.g., fatty liver due to high fat intake). C and D are different cellular responses altogether.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 415, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient is found to have a pH of 7.28, PCO2 of 32 mmHg, and HCO3 of 15 mEq/L. Which acid-base disorder is present?", "options": ["Respiratory acidosis with metabolic compensation.", "Metabolic acidosis with respiratory compensation.", "Respiratory alkalosis with metabolic compensation.", "Metabolic alkalosis with respiratory compensation."], "correct": "A", "rationale": {"A": "A, C, and D are incorrect interpretations of the ABG values based on the rules provided in the lecture.", "B": "This option is incorrect.", "C": "A, C, and D are incorrect interpretations of the ABG values based on the rules provided in the lecture.", "D": "A, C, and D are incorrect interpretations of the ABG values based on the rules provided in the lecture."}}, {"id": 416, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A significant increase in interstitial oncotic pressure, as seen in acute inflammation when plasma proteins leak from capillaries, will have what effect on fluid movement?", "options": ["It will favor reabsorption, pulling fluid back into the capillary.", "It will have no effect on fluid movement, as this force is normally near zero.", "It will favor ultrafiltration, pulling fluid out of the capillary and causing edema.", "It will increase capillary blood pressure."], "correct": "A", "rationale": {"A": "a) It does not release hormones that affect peripheral target tissues.", "B": "b) It is an extension of nervous tissue from the hypothalamus and does not synthesize its own hormones. Rationale for Correct Answer: The lecture explains that the posterior pituitary is an extension of the hypothalamus, containing the axon terminals of hypothalamic neurons. It \"only stores and releases hormones\" (ADH and oxytocin) that are synthesized in the hypothalamus. The anterior pituitary, in contrast, synthesizes its own hormones. Rationale for Incorrect Answers: A is incorrect; its hormones act on peripheral targets. C is incorrect. D is incorrect; it releases hormones into a rich capillary network.", "C": "c) It is not regulated by negative feedback loops.", "D": "d) It does not release hormones directly into the bloodstream."}}, {"id": 417, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The ability of a single neuron in the locus coeruleus to influence activity in the cerebellum, hippocampus, prefrontal cortex, and spinal cord is an example of which pattern of synaptic connectivity?", "options": ["Spatially focused", "Widely divergent", "Reciprocal inhibition", "Hierarchical control"], "correct": "B", "rationale": {"A": "A is for task-oriented circuits. C is a specific type of local circuit. D is an endocrine concept.", "B": "The lecture defines a widely divergent pattern as one where \"a few cells, a fairly small area of the brain, that's sending widespread projections to multiple other cells...and multiple regions of the brain.\" This is characteristic of the modulatory neurotransmitter systems like norepinephrine.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 418, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Why is the posterior pituitary not considered a \"true\" endocrine gland in the same way the anterior pituitary is?", "options": ["It does not release hormones that affect peripheral target tissues.", "It is an extension of nervous tissue from the hypothalamus and does not synthesize its own hormones.", "It is not regulated by negative feedback loops.", "It does not release hormones directly into the bloodstream."], "correct": "B", "rationale": {"A": "A, C, and D are all incorrect statements about the posterior pituitary.", "B": "The lecture explains that the posterior pituitary is an extension of the hypothalamus, containing the axon terminals of hypothalamic neurons. It \"only stores and releases hormones\" (ADH and oxytocin) that are synthesized in the hypothalamus. The anterior pituitary, in contrast, synthesizes its own hormones.", "C": "A, C, and D are all incorrect statements about the posterior pituitary.", "D": "A, C, and D are all incorrect statements about the posterior pituitary."}}, {"id": 419, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with long-standing, untreated hypertension develops significant left ventricular hypertrophy. This is an example of which cellular adaptation?", "options": ["Hyperplasia in response to increased hormonal stimulation.", "Hypertrophy in response to increased functional demand.", "Metaplasia due to chronic cellular injury.", "Dysplasia due to pathological stimulation."], "correct": "A", "rationale": {"A": "A is an increase in cell number. C and D are different, non-adaptive types of cellular changes.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 420, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with Addison's disease has aldosterone deficiency. This will lead to which electrolyte imbalances?", "options": ["Hypernatremia and hypokalemia", "Hyponatremia and hyperkalemia", "Hypercalcemia and hypokalemia", "Hyponatremia and hypocalcemia"], "correct": "A", "rationale": {"A": "a) They force most substances to be transported through the endothelial cells rather than between them. Rationale for Correct Answer: The lecture explains that in brain capillaries, unlike systemic ones, the endothelial cells are joined by tight junctions, closing the gaps. This structural feature forces substances to pass through the endothelial cells themselves, allowing transport to be tightly regulated by the channels and transporters present on the cell membranes. Rationale for Incorrect Answers: B is the opposite of its function; it restricts exchange. C is the function of the choroid plexus. D is not the function of the tight junctions themselves.", "B": "b) They facilitate the rapid exchange of water and ions between blood and brain.", "C": "c) They are the primary site of cerebrospinal fluid production.", "D": "d) They actively pump neurotransmitters out of the brain ECF."}}, {"id": 421, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The blood-brain barrier is formed by tight junctions between endothelial cells, a basement membrane, and the end-feet of astrocytes. What is the functional consequence of these tight junctions?", "options": ["They force most substances to be transported through the endothelial cells rather than between them.", "They facilitate the rapid exchange of water and ions between blood and brain.", "They are the primary site of cerebrospinal fluid production.", "They actively pump neurotransmitters out of the brain ECF."], "correct": "A", "rationale": {"A": "The lecture explains that in brain capillaries, unlike systemic ones, the endothelial cells are joined by tight junctions, closing the gaps. This means that \"instead of going through the hole, anything that wants to get out of the capillary has to actually cross through the two membranes of this endothelial cell.\"", "B": "B is the opposite of its function; it restricts exchange. C describes the choroid plexus. D is not the function of the tight junctions themselves.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 422, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with congestive heart failure is given a diuretic that blocks sodium reabsorption in the kidneys. This leads to a loss of sodium and water. If the diuretic is taken in excess, it can cause:", "options": ["Hypernatremia and hypertonic alteration.", "Isotonic volume excess.", "Hyponatremia and hypotonic alteration.", "Hyperchloremia and hypertonic alteration."], "correct": "A", "rationale": {"A": "a) To promote sleep and tissue repair.", "B": "b) To increase alertness and mobilize energy for the start of the day. Rationale for Correct Answer: The lecture states that the natural rise in cortisol just before waking \"actually helps wake you up. It's part of the hormonal balance that helps you be more alert in the morning.\" This aligns with its role in mobilizing energy (e.g., raising blood glucose) for the body's transition from a sleeping state to an active one. Rationale for Incorrect Answers: A is contrary to cortisol's catabolic and alerting effects. C is a consequence of chronic, not rhythmic, elevation. D is incorrect.", "C": "c) To suppress the immune system in preparation for daily pathogen exposure.", "D": "d) To stimulate the release of growth hormone."}}, {"id": 423, "category": ["\"More difficult\" Exam Questions 2"], "stem": "What is the fundamental difference between an excitatory postsynaptic potential (EPSP) and an action potential?", "options": ["An EPSP is a large, all-or-none signal, while an action potential is a small, graded potential.", "An EPSP is a small, local depolarization, while an action potential is a large, all-or-none signal that propagates down the axon.", "EPSPs are caused by voltage-gated channels, while action potentials are caused by ligand-gated channels.", "An EPSP always leads to an action potential."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "An EPSP is a graded, local potential change on the dendrite or soma caused by neurotransmitter binding. If enough EPSPs summate to reach threshold at the axon hillock, they trigger an action potential, which is a large, all-or-none, self-propagating electrical signal.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 424, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The diurnal rhythm of cortisol secretion is characterized by a peak just before waking. What is the primary physiological purpose of this morning surge?", "options": ["To promote sleep and tissue repair.", "To increase alertness and mobilize energy for the start of the day.", "To suppress the immune system in preparation for daily pathogen exposure.", "To stimulate the release of growth hormone."], "correct": "B", "rationale": {"A": "A is contrary to cortisol's catabolic and alerting effects. C is a long-term effect of chronic elevation, not the purpose of the diurnal rhythm. D is incorrect; GH is released during sleep.", "B": "The lecture states that the natural rise in cortisol just before waking \"actually helps wake you up. It's part of the hormonal balance that helps you be more alert in the morning.\" This aligns with its role in mobilizing energy (e.g., raising blood glucose) for the day's activities.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 425, "category": ["\"More difficult\" Exam Questions 2"], "stem": "During the patellar reflex, an inhibitory interneuron is activated. What is the role of this neuron?", "options": ["To inhibit the sensory neuron and stop the signal from reaching the spinal cord.", "To inhibit the motor neuron of the antagonistic muscle (hamstring), allowing it to relax.", "To inhibit the motor neuron of the quadriceps to prevent excessive contraction.", "To send an inhibitory signal to the brain, preventing conscious perception of the reflex."], "correct": "D", "rationale": {"A": "A, C, and D describe incorrect synaptic connections or functions within the reflex arc.", "B": "This option is incorrect.", "C": "A, C, and D describe incorrect synaptic connections or functions within the reflex arc.", "D": "A, C, and D describe incorrect synaptic connections or functions within the reflex arc."}}, {"id": 426, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient experiences a crushing injury to their arm, leading to massive cell lysis. They are at immediate risk for which life-threatening electrolyte imbalance?", "options": ["Hyperkalemia", "Hyponatremia", "Hypocalcemia", "Hypermagnesemia"], "correct": "A", "rationale": {"A": "a) Hormone synthesis", "B": "b) Post-release activation Rationale for Correct Answer: T4 is released from the thyroid as a relatively inactive prohormone. It is then converted in the periphery (liver, target tissues) to the more biologically active T3. This conversion, which happens after secretion from the primary gland, is a form of post-release activation. Rationale for Incorrect Answers: A happens in the thyroid. C and D are regulatory principles, not the biochemical conversion itself.", "C": "c) Negative feedback", "D": "d) Hierarchical control"}}, {"id": 427, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The conversion of T4 to the more active T3 in peripheral tissues is a critical step in thyroid hormone function. This conversion is an example of:", "options": ["Hormone synthesis", "Post-release activation", "Negative feedback", "Hierarchical control"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "T4 is released by the thyroid but is largely inactive. The lecture explains that the extra iodine must be removed to form the active T3, and this can happen in the liver or at the target cell. This process of converting a less active hormone into a more active one after its release is a form of post-release activation.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 428, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with chronic gastroesophageal reflux disease (GERD) has the normal squamous epithelium of their esophagus replaced by columnar epithelium, a change known as Barrett's esophagus. This is a classic example of:", "options": ["Dysplasia, a precancerous state.", "Metaplasia, an adaptive response to chronic acid injury.", "Hyperplasia, an increase in the number of squamous cells.", "Atrophy, a shrinkage of the esophageal cells."], "correct": "A", "rationale": {"A": "a) It represents the chronological order in which motor and sensory skills are developed.", "B": "b) It is a fixed map that is identical in all individuals, regardless of experience.", "C": "c) It is a topographical representation where the size of the cortical area is proportional to the degree of sensory innervation or fine motor control of a body part. Rationale for Correct Answer: The lecture explains that the homunculus is a map where \"the size of the body part represents the amount of cortex dedicated to sensing that structure\" (for the sensory cortex) or controlling it (for the motor cortex). This reflects the density of innervation and the need for fine control. Rationale for Incorrect Answers: A, B, and D are incorrect descriptions of the map's function or properties.", "D": "d) It maps the pathways of the autonomic nervous system."}}, {"id": 429, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Which of the following best describes the function of the somatotopic map (homunculus) in the primary somatosensory and motor cortices?", "options": ["It represents the chronological order in which motor and sensory skills are developed.", "It is a fixed map that is identical in all individuals, regardless of experience.", "It is a topographical representation where the size of the cortical area is proportional to the degree of sensory innervation or fine motor control of a body part.", "It maps the pathways of the autonomic nervous system."], "correct": "C", "rationale": {"A": "A, B, and D are incorrect descriptions of the map's function or properties.", "B": "A, B, and D are incorrect descriptions of the map's function or properties.", "C": "The lecture explains that the homunculus is a map where \"the size of the body part represents the amount of cortex dedicated to sensing that structure\" (for the sensory cortex) or controlling it (for the motor cortex). This reflects the density of innervation and the need for fine control.", "D": "A, B, and D are incorrect descriptions of the map's function or properties."}}, {"id": 430, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient taking a high dose of a muscarinic acetylcholine receptor antagonist for an overactive bladder might experience which of the following side effects?", "options": ["Bradycardia and excessive salivation.", "Tachycardia and dry mouth.", "Muscle weakness and paralysis.", "Bronchoconstriction and digestive upset."], "correct": "A", "rationale": {"A": "a) The liquefaction of dead adipose tissue.", "B": "b) The reaction of released fatty acids with calcium. Rationale for Correct Answer: The lecture on necrosis types states that in fat necrosis, released enzymes break down fats into fatty acids, which then undergo \"saponification\" by precipitating with calcium to form \"soapy deposits.\" Saponification is the chemical reaction between fatty acids and calcium. Rationale for Incorrect Answers: A describes liquefactive necrosis. C describes coagulative necrosis. D is a general inflammatory response.", "C": "c) The accumulation of coagulated proteins from necrotic cells.", "D": "d) The infiltration of lymphocytes and macrophages into the dead tissue."}}, {"id": 431, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The primary difference between how the hypothalamus controls the anterior versus the posterior pituitary is that it controls the:", "options": ["Anterior via a vascular portal system and the posterior via direct neural projections.", "Anterior via direct neural projections and the posterior via a vascular portal system.", "Anterior with releasing hormones and the posterior with inhibitory hormones.", "Anterior via the sympathetic nervous system and the posterior via the parasympathetic nervous system."], "correct": "A", "rationale": {"A": "The lecture clearly illustrates that the hypothalamus releases hormones into the hypothalamic-hypophyseal portal system (a vascular link) to control the anterior pituitary, while it uses long axons that terminate in the posterior pituitary (a direct neural link) to release ADH and oxytocin.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 432, "category": ["\"More difficult\" Exam Questions 2"], "stem": "In fat necrosis, as seen in acute pancreatitis, the characteristic \"soapy deposits\" are formed by:", "options": ["The liquefaction of dead adipose tissue.", "The reaction of released fatty acids with calcium.", "The accumulation of coagulated proteins from necrotic cells.", "The infiltration of lymphocytes and macrophages into the dead tissue."], "correct": "B", "rationale": {"A": "A describes liquefactive necrosis. C describes coagulative necrosis. D is a general inflammatory response.", "B": "The lecture on necrosis types states that in fat necrosis, \"when the intracellular contents of the cells that have died get released, they react with the fatty deposits and they undergo something called saponification. You get these soapy deposits in the tissue.\" Saponification is the chemical reaction between fatty acids and calcium.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 433, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with a tumor on their adrenal gland is hypersecreting aldosterone, leading to isotonic volume excess. This occurs because aldosterone promotes the retention of:", "options": ["Free water only.", "Sodium and water in proportional amounts.", "Potassium and water.", "Glucose, which osmotically holds water."], "correct": "A", "rationale": {"A": "a) The hormone is chemically modified into two different forms after being released.", "B": "b) It binds to two different receptor subtypes (V1 and V2) located on different target tissues. Rationale for Correct Answer: The lecture uses vasopressin (ADH) as a prime example of this principle. It explains that the same molecule acts as \"vasopressin\" by binding to V1 receptors on blood vessels and as \"ADH\" by binding to V2 receptors on kidney tubules. The distinct effects are entirely dependent on the receptor subtype and its location. Rationale for Incorrect Answers: A, C, and D are incorrect explanations for this phenomenon.", "C": "c) It is released at different concentrations to produce different effects.", "D": "d) One effect is mediated by the nervous system, and the other by the endocrine system."}}, {"id": 434, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The concept of \"etiology\" in pathophysiology encompasses all of the following EXCEPT:", "options": ["An idiopathic cause where the origin is unknown.", "An iatrogenic cause resulting from medical intervention.", "The physiologic development of the disease over time.", "An intrinsic cause such as a genetic mutation."], "correct": "C", "rationale": {"A": "A, B, and D are all directly related to the concept of etiology as described in the lecture.", "B": "A, B, and D are all directly related to the concept of etiology as described in the lecture.", "C": "Etiology is defined as the cause of a disease. Idiopathic, iatrogenic, and intrinsic are all categories or descriptions of etiology. The physiologic development of the disease is the definition of pathogenesis, which is what happens after the etiological insult.", "D": "A, B, and D are all directly related to the concept of etiology as described in the lecture."}}, {"id": 435, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Insulin facilitates the storage of glucose as glycogen in muscle cells. This requires the coordinated action of second messenger systems that:", "options": ["Activate enzymes for glycogen synthesis and deactivate enzymes for glycogen breakdown.", "Open calcium channels to trigger muscle contraction.", "Activate gene transcription for new glucose transporters.", "Exclusively promote the breakdown of fats for energy."], "correct": "A", "rationale": {"A": "B, C, and D are not the primary mechanisms described for insulin's effect on glycogen storage.", "B": "B, C, and D are not the primary mechanisms described for insulin's effect on glycogen storage.", "C": "B, C, and D are not the primary mechanisms described for insulin's effect on glycogen storage.", "D": "B, C, and D are not the primary mechanisms described for insulin's effect on glycogen storage."}}, {"id": 436, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The vagus nerve (cranial nerve X) provides the majority of parasympathetic outflow. A patient with damage to this nerve would most likely experience dysfunction in:", "options": ["The \"fight-or-flight\" response.", "Voluntary movement of the neck and shoulders.", "Sensation on the face.", "The \"rest-and-digest\" processes of the heart, lungs, and GI tract."], "correct": "D", "rationale": {"A": "A is a sympathetic function. B is a function of the accessory nerve (XI) and cervical spinal nerves. C is a function of the trigeminal nerve (V).", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states that the vagus nerve carries about 70% of all parasympathetic input. The parasympathetic system is responsible for \"rest-and-digest\" functions, so damage would impair the baseline regulation of organs like the heart (slowing it), lungs (bronchoconstriction), and GI tract (digestion)."}}, {"id": 437, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The purpose of a differential diagnosis is to:", "options": ["Select the single most likely diagnosis based on the initial presenting symptom.", "Systematically create a list of all possible diagnoses and then rule out incompatible ones based on all available clinical data.", "Confirm a diagnosis using only laboratory methods, excluding the clinical exam.", "Differentiate between signs and symptoms to determine the disease etiology."], "correct": "B", "rationale": {"A": "A is too simplistic. C incorrectly excludes the clinical exam, which the lecture deems \"extremely important.\" D is a component of data gathering, not the diagnostic reasoning process itself.", "B": "The lecture describes diagnostics as detective work. The process of differential diagnosis is to \"make a very long list of possible diagnoses that can match any part of the clues that we have... [then] we start eliminating some of these based on looking at all of the clues at once.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 438, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Growth hormone has direct effects on tissues and indirect effects via IGF-1. A direct effect of GH is stimulating cell division, while a major indirect effect mediated by IGF-1 is:", "options": ["Increasing blood glucose levels.", "Increasing organ size and bone density.", "Inhibiting the hypothalamus.", "Breaking down lean muscle mass."], "correct": "B", "rationale": {"A": "A is an effect of GH itself, not IGF-1. C is a feedback mechanism. D is the opposite of its anabolic effect.", "B": "The lecture states that GH stimulates the liver to produce IGF-1 and 2, and that these IGFs \"increase organ size\" and \"increase the density of bone.\" These are key indirect, growth-promoting effects.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 439, "category": ["\"More difficult\" Exam Questions 2"], "stem": "How does a single hormone, like vasopressin (ADH), produce two distinct effects such as vasoconstriction and renal water reabsorption?", "options": ["The hormone is chemically modified into two different forms after being released.", "It binds to two different receptor subtypes (V1 and V2) located on different target tissues.", "It is released at different concentrations to produce different effects.", "One effect is mediated by the nervous system, and the other by the endocrine system."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect mechanisms. The effect is receptor-dependent.", "B": "The lecture uses vasopressin/ADH as a key example of how a single hormone can have multiple effects. It explains that it binds to the V1 receptor on blood vessels to cause vasoconstriction and to the V2 receptor in the kidneys to cause water reabsorption. The different effects are due to different receptor subtypes in different tissues.", "C": "A, C, and D are incorrect mechanisms. The effect is receptor-dependent.", "D": "A, C, and D are incorrect mechanisms. The effect is receptor-dependent."}}, {"id": 440, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with a damaged cerebellum would most likely present with:", "options": ["An inability to comprehend language.", "A loss of conscious sensation in their limbs.", "Difficulty with balance and the smooth execution of learned motor patterns.", "Unregulated body temperature and appetite."], "correct": "A", "rationale": {"A": "a) Dorsal horn of the gray matter.", "B": "b) Ventral horn of the gray matter.", "C": "c) Dorsal root ganglia. Rationale for Correct Answer: The lecture describes the anatomy of the spinal nerves, noting the swelling on the dorsal root called the dorsal root ganglia. It identifies this structure as the location of \"all the cell bodies of the sensory neurons.\" Rationale for Incorrect Answers: A and B are where interneuron and motor neuron cell bodies are located, respectively. D is incorrect.", "D": "d) Brainstem."}}, {"id": 441, "category": ["\"More difficult\" Exam Questions 2"], "stem": "What is the fundamental role of a buffer system in maintaining acid-base balance?", "options": ["To completely eliminate all acids and bases from body fluids.", "To absorb or donate hydrogen ions to resist fluctuations in pH.", "To exclusively donate hydrogen ions when the body is in a state of alkalosis.", "To signal the lungs and kidneys to change their function."], "correct": "B", "rationale": {"A": "A is incorrect; they buffer, not eliminate. C is incomplete; they can also absorb H+. D is a consequence of severe pH changes, but not the direct function of the buffer itself.", "B": "The lecture defines buffer systems as \"weak acids that also exist in their weak base form.\" It explains that they work because they can \"readily either absorb extra hydrogen ions... or donate hydrogen ions in order to prevent any fluctuation in pH.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 442, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Which of the following would NOT be considered a clinical manifestation of a disease?", "options": ["A patient's report of a headache.", "A lab result showing elevated white blood cell count.", "An exposure to a pathogenic virus.", "A visible rash on the patient's skin."], "correct": "C", "rationale": {"A": "A is a symptom. B is a sign (from a lab test). D is a sign.", "B": "This option is incorrect.", "C": "Clinical manifestations are defined as the observable consequences of a disease, categorized as signs (objective) and symptoms (subjective). An exposure to a virus is an etiology (cause), not a consequence of the disease process itself.", "D": "This option is incorrect."}}, {"id": 443, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Which factor is the most significant source of variation in the percentage of total body water, and what is its consequence?", "options": ["Age; older individuals have a higher percentage of water, making them resistant to dehydration.", "Percentage of body fat; individuals with more fat have less water, increasing their vulnerability to dehydration.", "Biologic sex; males have a lower percentage of water, making them more vulnerable to dehydration.", "Altitude; living at high altitude decreases total body water."], "correct": "B", "rationale": {"A": "A is incorrect; older individuals have less water. C is incorrect; males have a higher percentage of water. D is incorrect.", "B": "The lecture states that total body water percentage \"tends to vary mainly by percentage of body fat\" because water is found in muscle, not fat tissue. It concludes that \"The significance of having a lower percentage of water is a slight vulnerability to dehydration.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 444, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The serotonin and norepinephrine modulatory systems both originate in the brainstem and have widely divergent projections. A key shared function they influence is:", "options": ["The reward pathway and motivation.", "Storage of learned motor patterns.", "Regulation of sleep-wake cycles and mood.", "Comprehension and production of language."], "correct": "C", "rationale": {"A": "A is primarily the dopamine system. B is the cerebellum. D involves Wernicke's and Broca's areas.", "B": "This option is incorrect.", "C": "The lecture discusses the norepinephrine and serotonin systems sequentially. A key function mentioned for both is their role in regulating sleep-wake cycles. Additionally, norepinephrine is said to have a role in \"regulating mood\" in interaction with the serotonin system, which is best known for its role in mood.", "D": "This option is incorrect."}}, {"id": 445, "category": ["\"More difficult\" Exam Questions 2"], "stem": "In the spinal cord, sensory information from the body enters via the dorsal roots. The cell bodies of these primary afferent neurons are located in the:", "options": ["Dorsal horn of the gray matter.", "Ventral horn of the gray matter.", "Dorsal root ganglia.", "Brainstem."], "correct": "C", "rationale": {"A": "A and B are locations of interneuron and motor neuron cell bodies, respectively. D is incorrect.", "B": "A and B are locations of interneuron and motor neuron cell bodies, respectively. D is incorrect.", "C": "The lecture on spinal nerves shows a diagram and explains that the swelling on the dorsal root is the dorsal root ganglia, which contains \"all the cell bodies of the sensory neurons conveyed through that spinal nerve.\"", "D": "A and B are locations of interneuron and motor neuron cell bodies, respectively. D is incorrect."}}, {"id": 446, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Aldosterone secretion is stimulated by angiotensin II. Cortisol secretion is stimulated by ACTH. What is the primary stimulus for the release of aldosterone that is different from cortisol?", "options": ["A tropic hormone from the anterior pituitary.", "A releasing hormone from the hypothalamus.", "The renin-angiotensin system, which responds to changes in blood pressure and sodium.", "Direct neural stimulation from the sympathetic nervous system."], "correct": "A", "rationale": {"A": "A and B describe the control of cortisol, not the unique control of aldosterone. D is not the primary stimulus.", "B": "A and B describe the control of cortisol, not the unique control of aldosterone. D is not the primary stimulus.", "C": "This option is incorrect.", "D": "A and B describe the control of cortisol, not the unique control of aldosterone. D is not the primary stimulus."}}, {"id": 447, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient has a condition where their astrocytes are not functioning correctly. This would most directly compromise which of the following?", "options": ["The speed of action potential conduction down an axon.", "The integrity of the blood-brain barrier and the composition of the brain's extracellular fluid.", "The production of cerebrospinal fluid in the ventricles.", "The release of neurotransmitters at the synapse."], "correct": "A", "rationale": {"A": "a) The latent period is when signs and symptoms are at their peak, while the prodromal period has no signs or symptoms.", "B": "b) The latent period is the time between injury and the first appearance of symptoms, while the prodromal period is when the first, often nonspecific, signs and symptoms appear. Rationale for Correct Answer: The lecture on clinical manifestations defines the latent period as the \"period of no signs and symptoms that tends to occur between the initial injury and the first signs and symptoms.\" It defines the prodromal period as \"the first appearance of signs and symptoms after an injury.\" Rationale for Incorrect Answers: A, C, and D are incorrect definitions of these specific stages of disease progression.", "C": "c) The prodromal period is the recovery phase, while the latent period is the initial injury phase.", "D": "d) There is no difference; the terms are interchangeable."}}, {"id": 448, "category": ["\"More difficult\" Exam Questions 2"], "stem": "What is the key difference between the prodromal period and the latent period of a disease?", "options": ["The latent period is when signs and symptoms are at their peak, while the prodromal period has no signs or symptoms.", "The latent period is the time between injury and the first appearance of symptoms, while the prodromal period is when the first, often nonspecific, signs and symptoms appear.", "The prodromal period is the recovery phase, while the latent period is the initial injury phase.", "There is no difference; the terms are interchangeable."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect definitions of these specific stages of disease progression.", "B": "The lecture on clinical manifestations defines the latent period as the \"period of no signs and symptoms that tends to occur between the initial injury and the first signs and symptoms.\" It defines the prodromal period as \"the first appearance of signs and symptoms after an injury.\"", "C": "A, C, and D are incorrect definitions of these specific stages of disease progression.", "D": "A, C, and D are incorrect definitions of these specific stages of disease progression."}}, {"id": 449, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient presents with hyponatremia. After evaluation, it is determined that their total body sodium is normal, but they have an excess of body water. This condition is best described as:", "options": ["Isotonic volume depletion.", "Hypertonic hyponatremia.", "Dilutional hyponatremia.", "Iatrogenic hyponatremia."], "correct": "A", "rationale": {"A": "A is a loss of both water and sodium. B is a contradictory term. D implies the condition was caused by medical treatment, which isn't specified.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 450, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with end-stage liver failure presents with generalized edema and ascites. While the low albumin level is a primary contributor, chronic inflammation is also present. How would the inflammation specifically exacerbate the fluid shift into the interstitial space?", "options": ["By increasing capillary blood pressure via systemic vasoconstriction.", "By increasing interstitial oncotic pressure due to leakage of plasma proteins from permeable capillaries.", "By causing lymphatic obstruction, preventing the drainage of interstitial fluid.", "By decreasing interstitial hydrostatic pressure, creating more space for fluid."], "correct": "A", "rationale": {"A": "A describes the opposite fluid movement. B is incorrect because this force becomes a major factor in this pathological state. D is an incorrect effect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 451, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is in a state of severe metabolic acidosis (pH 7.10). This condition leads to hyperkalemia due to ion shifts. How would this resulting hyperkalemia secondarily affect the resting membrane potential of their neurons and their overall excitability?", "options": ["The resting membrane potential would become more negative, making neurons less excitable.", "The resting membrane potential would become less negative, bringing it closer to threshold and paradoxically increasing the risk of spontaneous firing or seizures.", "The resting membrane potential would be unchanged, but the action potential duration would be shortened.", "The Na+/K+ pump would reverse, pumping potassium in and sodium out, stabilizing the membrane."], "correct": "A", "rationale": {"A": "A describes the effect of hypokalemia. C is incorrect; the resting potential is fundamentally altered. D is an effect of some toxins, not hyperkalemia itself.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 452, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with a crush injury develops rhabdomyolysis, leading to massive cell lysis and subsequent hyperkalemia. To rapidly lower serum potassium, they are given an infusion of insulin and dextrose. Why is dextrose administered along with the insulin in a non-diabetic patient?", "options": ["Dextrose is required to activate the insulin receptors.", "To prevent severe hypoglycemia, as insulin will drive both potassium and glucose into the cells.", "Dextrose directly binds to potassium, aiding in its cellular uptake.", "To create a hypertonic ECF, which draws potassium out of the bloodstream and into the interstitial fluid."], "correct": "A", "rationale": {"A": "A, C, and D describe incorrect mechanisms.", "B": "This option is incorrect.", "C": "A, C, and D describe incorrect mechanisms.", "D": "A, C, and D describe incorrect mechanisms."}}, {"id": 453, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient has the following ABG results: pH 7.49, PCO2 48 mmHg, HCO3 35 mEq/L.  (normal pH 7.35-7.45, pCO2 35-45, HCO3 21-28) Which statement provides the most accurate interpretation?", "options": ["The primary disorder is respiratory alkalosis, with renal compensation.", "The patient has an uncompensated metabolic alkalosis.", "The primary disorder is metabolic alkalosis, with respiratory compensation (hypoventilation).", "The patient has a mixed disorder of metabolic alkalosis and respiratory acidosis."], "correct": "A", "rationale": {"A": "Following the rules of ABG interpretation:", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 454, "category": ["Exam Questions \"Very difficult\""], "stem": "Considering the hypothalamic-pituitary-thyroid (HPT) axis, a patient is found to have low levels of T3/T4 and a low level of TSH. A TRH stimulation test is administered, and TSH levels fail to rise. Where is the most likely site of dysfunction?", "options": ["The hypothalamus (tertiary hypothyroidism).", "The thyroid gland (primary hypothyroidism).", "The anterior pituitary (secondary hypothyroidism).", "The peripheral tissues are resistant to TSH."], "correct": "C", "rationale": {"A": "a) A descending inhibitory signal from the primary motor cortex.", "B": "b) The same motor neuron that excites the quadriceps also sends an inhibitory signal to the hamstring.", "C": "c) The afferent sensory neuron synapsing on an inhibitory interneuron, which in turn inhibits the hamstring's motor neuron. Rationale for Correct Answer: This is the principle of reciprocal inhibition. The lecture diagram and explanation of the patellar reflex show that the sensory afferent neuron branches, with one branch synapsing on an inhibitory interneuron. This interneuron then inhibits the motor neuron supplying the antagonist muscle (hamstring), causing it to relax. Rationale for Incorrect Answers: The other options describe incorrect neural pathways or functions within this specific reflex arc.", "D": "d) A lack of any neural input to the hamstring, causing it to remain passive."}}, {"id": 455, "category": ["Exam Questions \"Very difficult\""], "stem": "The patellar reflex is a monosynaptic spinal reflex. However, for the reflex to manifest as a leg kick, the antagonistic hamstring muscle must relax. This relaxation is achieved via:", "options": ["A descending inhibitory signal from the primary motor cortex.", "The same motor neuron that excites the quadriceps also sends an inhibitory signal to the hamstring.", "The afferent sensory neuron synapsing on an inhibitory interneuron, which in turn inhibits the hamstring's motor neuron.", "A lack of any neural input to the hamstring, causing it to remain passive."], "correct": "B", "rationale": {"A": "A is incorrect; depolarization would occur. C describes the opposite of what would happen. D is incorrect; the relative refractory period depends on the resetting of Na+ channels and the state of K+ channels, both of which would be disrupted.", "B": "Repolarization requires two events: the cessation of Na+ influx and the beginning of K+ efflux. The inactivation gate is responsible for stopping the Na+ influx at the peak of the action potential. If this gate cannot close, Na+ would continue to flow into the cell, opposing the repolarizing effect of K+ efflux and locking the membrane in a prolonged depolarized state.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 456, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient has a rare neurotoxin that selectively and permanently opens the inactivation gates of voltage-gated sodium channels while leaving the activation gates functional. What would be the effect on neuronal function?", "options": ["Neurons would be unable to depolarize, preventing any action potentials.", "Action potentials would fire but would be unable to repolarize, leading to a state of prolonged depolarization.", "The resting membrane potential would become significantly more negative (hyperpolarized).", "The relative refractory period would be significantly prolonged."], "correct": "A", "rationale": {"A": "a) Thyroid hormone normally inhibits metabolic processes; its absence causes a paradoxical increase in heat loss.", "B": "b) A lack of thyroid hormone prevents the release of norepinephrine, leading to vasodilation and heat loss.", "C": "c) Thyroid hormone is required for the synthesis of energy-consuming proteins (like the Na+/K+ pump), so its absence lowers the basal metabolic rate and heat production. Rationale for Correct Answer: The lecture defines thyroid hormone as a primary regulator of the basal metabolic rate (BMR). It does this by stimulating gene transcription for proteins (like the Na+/K+ ATPase pump) that consume large amounts of ATP. Reduced BMR means less energy is spent, and since most energy expenditure is released as heat, the patient feels cold and lacks energy (lethargy). Rationale for Incorrect Answers: A and B are incorrect physiological mechanisms. D is incorrect.", "D": "d) The hypothalamus becomes insensitive to cold stimuli in the absence of thyroid hormone."}}, {"id": 457, "category": ["Exam Questions \"Very difficult\""], "stem": "The blood-brain barrier severely restricts the passage of water-soluble substances. Given this, how does the brain receive its essential supply of glucose from the bloodstream?", "options": ["Glucose is lipid-soluble and diffuses freely across the barrier.", "Glucose is transported across the endothelial cells via specific carrier-mediated transporters (e.g., GLUT1).", "Glucose enters the brain through the \"leaky\" circumventricular organs only.", "Astrocytes actively pump glucose from the blood into the brain extracellular fluid."], "correct": "B", "rationale": {"A": "A is incorrect because their effects on blood glucose are opposing. C is incorrect; IGF-1 provides negative feedback that inhibits, not stimulates, GH release. D is incorrect as GH and IGF-1 promote lean muscle mass and decrease adiposity.", "B": "The lecture explicitly states that GH has \"anti-insulin effects\" that \"increase blood sugar.\" Following this, the rise of IGF-1, or \"insulin-like growth factor,\" has the opposite effect, helping to \"bring down blood glucose\" by promoting its uptake into cells for growth. This creates a balanced metabolic cycle during sleep.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 458, "category": ["Exam Questions \"Very difficult\""], "stem": "Why does a deficiency of thyroid hormone (hypothyroidism) lead to symptoms of cold intolerance and lethargy?", "options": ["Thyroid hormone normally inhibits metabolic processes; its absence causes a paradoxical increase in heat loss.", "A lack of thyroid hormone prevents the release of norepinephrine, leading to vasodilation and heat loss.", "Thyroid hormone is required for the synthesis of energy-consuming proteins (like the Na+/K+ pump), so its absence lowers the basal metabolic rate and heat production.", "The hypothalamus becomes insensitive to cold stimuli in the absence of thyroid hormone."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The question describes a defect in the synthesis of catecholamines (dopamine, norepinephrine, epinephrine), all of which are derived from the amino acid tyrosine. The system originating in the raphe nuclei is the serotonin system, which uses the neurotransmitter serotonin, derived from the amino acid tryptophan, not tyrosine. Therefore, it would be unaffected.", "D": "This option is incorrect."}}, {"id": 459, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with long-standing Cushing's syndrome (excess cortisol) is at high risk for osteoporosis. This is a direct result of cortisol's chronic effect of:", "options": ["Inhibiting calcium absorption in the gut.", "Increasing bone resorption to mobilize calcium.", "Preventing the synthesis of vitamin D.", "Increasing renal excretion of phosphate."], "correct": "A", "rationale": {"A": "A and C are incorrect mechanisms. D is not the primary mechanism of bone destruction.", "B": "This option is incorrect.", "C": "A and C are incorrect mechanisms. D is not the primary mechanism of bone destruction.", "D": "A and C are incorrect mechanisms. D is not the primary mechanism of bone destruction."}}, {"id": 460, "category": ["Exam Questions \"Very difficult\""], "stem": "A stroke damages a patient's primary motor cortex but spares their cerebellum and basal ganglia. Which of the following deficits would be most expected?", "options": ["The patient would be unable to initiate voluntary movements (paralysis) on the contralateral side.", "The patient could initiate movements, but they would be uncoordinated, jerky, and lack smooth control.", "The patient would have difficulty storing new motor patterns, like learning to play the piano.", "The patient would experience a loss of sensation on the contralateral side."], "correct": "A", "rationale": {"A": "a) Norepinephrine is primarily for motor control, while dopamine is for attention and wakefulness.", "B": "b) Norepinephrine is primarily for attention/wakefulness, while dopamine is primarily for motor control (substantia nigra) and reward/motivation (VTA). Rationale for Correct Answer: The lecture separates the two. Norepinephrine, originating in the locus coeruleus, is key for attention, focus, and general arousal (wakefulness). Dopamine is crucial for voluntary movement (substantia nigra) and the pleasure/motivation system (VTA). Rationale for Incorrect Answers: A has the roles reversed. C is incorrect, as both are involved in much more complex functions. D is incorrect; these are central, not peripheral, functions.", "C": "c) Both systems are exclusively involved in regulating mood and sleep-wake cycles.", "D": "d) Dopamine controls the parasympathetic nervous system, while norepinephrine controls the sympathetic nervous system."}}, {"id": 461, "category": ["Exam Questions \"Very difficult\""], "stem": "The norepinephrine and dopamine systems are both modulatory neurotransmitter systems involving catecholamines. How do their primary functions within the CNS differ?", "options": ["Norepinephrine is primarily for motor control, while dopamine is for attention and wakefulness.", "Norepinephrine is primarily for attention/wakefulness, while dopamine is primarily for motor control (substantia nigra) and reward/motivation (VTA).", "Both systems are exclusively involved in regulating mood and sleep-wake cycles.", "Dopamine controls the parasympathetic nervous system, while norepinephrine controls the sympathetic nervous system."], "correct": "C", "rationale": {"A": "A is a beta-1 mediated effect. B is an alpha-1 mediated effect. D is incorrect; sympathetic stimulation generally increases glucose availability.", "B": "This option is incorrect.", "C": "The lecture materials table indicates that beta-2 adrenergic receptors are responsible for \"Bronchodilatation\" and \"Bladder wall relaxation.\" An agonist would stimulate these effects.", "D": "This option is incorrect."}}, {"id": 462, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with a pheochromocytoma (a tumor of the adrenal medulla) experiences episodes of extreme hypertension, tachycardia, and sweating. These symptoms are caused by the tumor's excessive, unregulated endocrine release of:", "options": ["Cortisol and aldosterone.", "Acetylcholine.", "Epinephrine and norepinephrine.", "ACTH and TSH."], "correct": "A", "rationale": {"A": "A are adrenal cortex steroids. B is the neurotransmitter received by the medulla. D are pituitary hormones.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 463, "category": ["Exam Questions \"Very difficult\""], "stem": "During an acute inflammatory response, capillary permeability increases. This directly contributes to edema by altering which two Starling forces?", "options": ["It increases capillary blood pressure and decreases interstitial hydrostatic pressure.", "It decreases capillary oncotic pressure and increases interstitial hydrostatic pressure.", "It increases interstitial oncotic pressure (as proteins leak out) and may increase capillary blood pressure due to fluid dynamics.", "It has no effect on Starling forces but increases lymphatic drainage."], "correct": "D", "rationale": {"A": "a) They must be synthesized on demand, and their mechanism involves the relatively slow processes of gene transcription and protein synthesis. Rationale for Correct Answer: The lecture states that steroid hormones are not stored and must be synthesized (slower process) and that their final mechanism is to alter gene expression (transcription), which is a much slower process than the second messenger systems used by peptide hormones. Rationale for Incorrect Answers: B is incorrect; transport is facilitated by binding proteins. C is incorrect. D is incorrect; binding proteins give them a longer half-life, not a shorter one.", "B": "b) They are transported more slowly through the bloodstream.", "C": "c) They bind to their receptors with lower affinity.", "D": "d) They are cleared from the body more rapidly by the kidneys."}}, {"id": 464, "category": ["Exam Questions \"Very difficult\""], "stem": "What is the fundamental reason that steroid hormones have a slower onset but longer duration of action compared to peptide hormones?", "options": ["They must be synthesized on demand, and their mechanism involves the relatively slow processes of gene transcription and protein synthesis.", "They are transported more slowly through the bloodstream.", "They bind to their receptors with lower affinity.", "They are cleared from the body more rapidly by the kidneys."], "correct": "A", "rationale": {"A": "B, C, and D describe other distinct cellular processes that are not the primary mechanism in Tay-Sachs.", "B": "B, C, and D describe other distinct cellular processes that are not the primary mechanism in Tay-Sachs.", "C": "B, C, and D describe other distinct cellular processes that are not the primary mechanism in Tay-Sachs.", "D": "B, C, and D describe other distinct cellular processes that are not the primary mechanism in Tay-Sachs."}}, {"id": 465, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is given a drug that is a powerful alpha-1 adrenergic agonist. What is the most likely and immediate cardiovascular effect?", "options": ["A decrease in heart rate (bradycardia).", "A widespread vasodilation and drop in blood pressure.", "A significant increase in blood pressure due to systemic vasoconstriction.", "An increase in cardiac contractility without a change in blood pressure."], "correct": "A", "rationale": {"A": "a) The damage to Broca's area severs its connection to the cerebellum, which controls hand movement.", "B": "b) Broca's area is responsible for the formulation and expression of language in all forms, not just the motor act of speaking. Rationale for Correct Answer: The lecture implies that Broca's area controls the motor plan for language, whether it is speaking, writing, or signing. Damage to this area means the patient cannot formulate the coherent motor output necessary to express their thoughts, regardless of the effector used (mouth or hand). Rationale for Incorrect Answers: A and D are anatomically incorrect. C is incorrect; receptive aphasia is a Wernicke's area problem.", "C": "c) Wernicke's area is also invariably damaged, preventing the comprehension of what to write.", "D": "d) The primary motor cortex for the hand is located within Broca's area."}}, {"id": 466, "category": ["Exam Questions \"Very difficult\""], "stem": "If a patient's ADH-thirst system is functioning properly but their renin-angiotensin-aldosterone system (RAAS) is completely blocked, what imbalance would they be most susceptible to?", "options": ["A pure water imbalance (dehydration or water intoxication).", "A sodium imbalance (hyponatremia or hypernatremia), particularly in response to volume changes.", "A potassium imbalance (hyperkalemia), due to the lack of aldosterone's effect on excretion.", "B and C are both highly likely."], "correct": "C", "rationale": {"A": "A describes the opposite fluid movement. B is incorrect because this force becomes a major factor in this pathological state. D is an incorrect effect.", "B": "This option is incorrect.", "C": "The lecture defines interstitial oncotic pressure as a \"pulling force\" originating from the interstitial space. When inflammation causes protein leakage, this force increases significantly, pulling fluid out of the capillaries and into the interstitium, thus causing or exacerbating edema.", "D": "This option is incorrect."}}, {"id": 467, "category": ["Exam Questions \"Very difficult\""], "stem": "In the language circuit, Broca's area is responsible for speech production. Why would a patient with damage to Broca's area (expressive aphasia) also have difficulty writing their thoughts, even if their hand muscles are unaffected?", "options": ["The damage to Broca's area severs its connection to the cerebellum, which controls hand movement.", "Broca's area is responsible for the formulation and expression of language in all forms, not just the motor act of speaking.", "Wernicke's area is also invariably damaged, preventing the comprehension of what to write.", "The primary motor cortex for the hand is located within Broca's area."], "correct": "B", "rationale": {"A": "A is for precise, point-to-point connections. C and D are different neural or endocrine concepts.", "B": "The lecture defines a widely divergent pattern as one where a small group of neurons has widespread projections to modulate activity across multiple brain regions. The modulatory neurotransmitter systems, such as the norepinephrine system from the locus coeruleus, are the quintessential examples of this pattern.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 468, "category": ["Exam Questions \"Very difficult\""], "stem": "Compare two patients with edema. Patient A has nephrotic syndrome with massive protein loss in the urine. Patient B has congestive heart failure with venous backup. The primary disrupted Starling force in Patient A is ________, while in Patient B it is ________.", "options": ["decreased capillary oncotic pressure; increased capillary blood pressure", "increased interstitial oncotic pressure; decreased capillary oncotic pressure", "increased capillary blood pressure; lymphatic obstruction", "lymphatic obstruction; increased interstitial oncotic pressure"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Patient A is losing protein (albumin) in the urine, resulting in hypoalbuminemia, which lowers the plasma's pulling force (decreased capillary oncotic pressure). Patient B has venous congestion, which causes blood to back up, leading to high pressure inside the capillaries (increased capillary blood pressure).", "D": "This option is incorrect."}}, {"id": 469, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient suffers a severe hypoxic injury to a region of their brain. This would most likely result in which type of necrosis?", "options": ["Coagulative necrosis, due to the high density of structural proteins.", "Fat necrosis, due to the high lipid content of myelin.", "Caseous necrosis, due to the presence of a loose connective tissue network.", "Liquefactive necrosis, due to the lack of significant connective tissue support."], "correct": "A", "rationale": {"A": "A is typical of the heart or kidneys. B is typical of the pancreas or breast tissue. C is typical of tuberculosis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 470, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with a chronic cough due to smoking develops metaplasia in their bronchial epithelium. If the patient continues to smoke, this metaplasia is at high risk of progressing to which non-adaptive, precancerous state?", "options": ["Atrophy", "Hypertrophy", "Necrosis", "Dysplasia"], "correct": "A", "rationale": {"A": "A, B, and C are other cellular states but not the next step in the precancerous continuum.", "B": "A, B, and C are other cellular states but not the next step in the precancerous continuum.", "C": "A, B, and C are other cellular states but not the next step in the precancerous continuum.", "D": "A, B, and C are other cellular states but not the next step in the precancerous continuum."}}, {"id": 471, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with myasthenia gravis, an autoimmune disease that destroys nicotinic acetylcholine receptors at the neuromuscular junction, would experience muscle weakness. Which other synapse in the autonomic nervous system would be directly affected?", "options": ["The synapse between postganglionic parasympathetic neurons and their target organs.", "The synapse between postganglionic sympathetic neurons and their target organs.", "The synapse between preganglionic and postganglionic neurons in both the sympathetic and parasympathetic systems.", "There would be no effect on the autonomic nervous system."], "correct": "A", "rationale": {"A": "The lecture specifies that all postganglionic neurons (both sympathetic and parasympathetic) have nicotinic acetylcholine receptors on their cell bodies. Therefore, a drug or disease that blocks these receptors would impair signal transmission in both divisions of the ANS, in addition to the neuromuscular junction.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 472, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is given a medication that enhances the activity of the serotonin system. Based on the functions of the raphe nuclei projections, which combination of side effects might be anticipated?", "options": ["Improved motor coordination and reduced appetite.", "Disrupted sleep-wake cycles and motor restlessness.", "Feelings of fear and enhanced short-term memory.", "Decreased body temperature and profound sedation."], "correct": "A", "rationale": {"A": "a) A hierarchical endocrine axis.", "B": "b) Neurohormonal release from a central endocrine gland. Rationale for Correct Answer: The lecture describes this as a system where nervous tissue (hypothalamic neurons) synthesizes a hormone and releases it into the bloodstream (neurohormonal) from a structure in the CNS (central endocrine gland). Rationale for Incorrect Answers: A is incorrect; there is no three-tiered axis. C is incorrect; the posterior pituitary is not peripheral. D is incorrect; the hormones enter the general circulation.", "C": "c) A peripheral endocrine gland system.", "D": "d) A paracrine signaling system."}}, {"id": 473, "category": ["Exam Questions \"Very difficult\""], "stem": "What is the key difference between an intrinsic and an extrinsic etiology of disease?", "options": ["Intrinsic etiologies are always genetic, while extrinsic etiologies are always infectious.", "Intrinsic etiologies originate from within the body (e.g., autoimmune, mutation), while extrinsic etiologies originate from outside (e.g., physical trauma, infection).", "Intrinsic etiologies are always idiopathic, while extrinsic etiologies are always known.", "Intrinsic etiologies lead to symptoms, while extrinsic etiologies lead to signs."], "correct": "B", "rationale": {"A": "A and C have the definitions/mechanisms reversed. D is incorrect as summation is required.", "B": "The lecture explains that an EPSP is a small, graded change in potential that occurs locally on the dendrite/soma. An action potential is a large, all-or-none, regenerative electrical event that is triggered at the axon hillock (if EPSPs summate to threshold) and propagates down the axon.", "C": "A and C have the definitions/mechanisms reversed. D is incorrect as summation is required.", "D": "A and C have the definitions/mechanisms reversed. D is incorrect as summation is required."}}, {"id": 474, "category": ["Exam Questions \"Very difficult\""], "stem": "The posterior pituitary releases ADH and oxytocin, but these hormones are synthesized in the paraventricular and supraoptic nuclei of the hypothalamus. This system is best described as:", "options": ["A hierarchical endocrine axis.", "Neurohormonal release from a central endocrine gland.", "A peripheral endocrine gland system.", "A paracrine signaling system."], "correct": "B", "rationale": {"A": "A is the opposite of cortisol's effects. C is a consequence of chronic, not rhythmic, elevation. D is incorrect.", "B": "The lecture states that the diurnal rise in cortisol \"helps wake you up\" and makes one \"more alert in the morning.\" This is coupled with its metabolic effects, such as increasing blood glucose, to provide energy for the body's transition from a sleeping state to an active one.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 475, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is severely dehydrated. Their hypothalamus will respond by increasing the sensation of thirst and stimulating the posterior pituitary to release which hormone to act on the kidneys?", "options": ["Aldosterone", "Angiotensin II", "Antidiuretic Hormone (ADH)", "Cortisol"], "correct": "A", "rationale": {"A": "a) There are no solutes in the interstitial fluid.", "B": "b) The lymphatic system actively removes all proteins from the interstitial space.", "C": "c) Plasma proteins, the primary contributors to oncotic pressure, are normally retained within the capillaries. Rationale for Correct Answer: The lecture explains that the plasma proteins (albumin) are too large to pass through the capillary wall's fenestrations. Therefore, they remain in the capillary, and the protein concentration in the interstitial space is negligible, making interstitial oncotic pressure near zero. Rationale for Incorrect Answers: A is incorrect; there are small solutes present. B is true but secondary to the retention mechanism. D is incorrect; hydrostatic pressure is a pushing force, not a neutralizing oncotic force.", "D": "d) Interstitial hydrostatic pressure neutralizes any oncotic pressure."}}, {"id": 476, "category": ["Exam Questions \"Very difficult\""], "stem": "The equilibrium potential for potassium (K+) is approximately -92 mV, while the equilibrium potential for sodium (Na+) is approximately +67 mV. Why is the resting membrane potential of a typical neuron (around -65 mV to -70 mV) so much closer to potassium's equilibrium potential?", "options": ["Because the Na+/K+ pump moves more potassium than sodium.", "Because at rest, the membrane is significantly more permeable to potassium than to sodium.", "Because there is a much higher concentration of potassium inside the cell.", "Because sodium is a larger ion and cannot move as easily through channels."], "correct": "A", "rationale": {"A": "Potassium is the most abundant intracellular cation. The lecture explicitly states that \"cell lysis... with any kind of traumatic injury where you have a lot of cell death, like crushing injuries... can actually cause potassium to elevate in the bloodstream.\" This rapid release can lead to fatal cardiac arrhythmias.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 477, "category": ["Exam Questions \"Very difficult\""], "stem": "In a healthy individual, interstitial oncotic pressure is near zero. This is because:", "options": ["There are no solutes in the interstitial fluid.", "The lymphatic system actively removes all proteins from the interstitial space.", "Plasma proteins, the primary contributors to oncotic pressure, are normally retained within the capillaries.", "Interstitial hydrostatic pressure neutralizes any oncotic pressure."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "T4 is released from the thyroid as a relatively inactive prohormone. It is then converted in the periphery (liver, target tissues) to the more biologically active T3. This conversion, which happens after secretion from the primary gland, is a form of post-release activation.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 478, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with chronic stress has persistently elevated cortisol levels. This can lead to immunosuppression. What is the teleological (purpose-based) reasoning for cortisol having this effect during an acute stress response?", "options": ["To prevent autoimmune reactions during a period of high physiological stress.", "To conserve energy by downregulating non-essential processes like inflammation and immunity in favor of immediate survival needs.", "To enhance the function of white blood cells to fight potential infections acquired during a \"fight-or-flight\" event.", "To lower body temperature by reducing the pyrogenic effects of immune cytokines."], "correct": "A", "rationale": {"A": "A, C, and D are incorrect explanations for this specific hormonal effect.", "B": "This option is incorrect.", "C": "A, C, and D are incorrect explanations for this specific hormonal effect.", "D": "A, C, and D are incorrect explanations for this specific hormonal effect."}}, {"id": 479, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient with a spinal cord injury has lost all somatosensory input from their lower body. This indicates damage to which spinal cord tracts?", "options": ["Descending tracts in the ventral white matter, such as the corticospinal tract.", "Ascending tracts in the dorsal white matter, such as the fasciculus gracilis.", "The lateral horn of the gray matter.", "The ventral roots of the spinal nerves."], "correct": "A", "rationale": {"A": "a) Increased T3/T4 levels leading to decreased TSH and TRH secretion.", "B": "b) A rise in blood glucose after a meal stimulating insulin release, which then lowers blood glucose.", "C": "c) An ACTH-secreting pituitary tumor that continues to secrete ACTH despite high cortisol levels. Rationale for Correct Answer: In a negative feedback loop, the resulting output (high cortisol) should suppress the input signal (ACTH). The fact that the tumor is ignoring this signal and continuing to secrete ACTH represents a failure of the feedback loop, leading to uncontrolled hypercortisolism (Cushing's disease). Rationale for Incorrect Answers: A, B, and D are all examples of correctly functioning negative feedback loops.", "D": "d) A drop in blood pressure stimulating the RAAS, which then raises blood pressure."}}, {"id": 480, "category": ["Exam Questions \"Very difficult\""], "stem": "If the connection between Wernicke's area and Broca's area were severed, what would be the most likely result?", "options": ["The patient would be unable to hear.", "The patient would be able to comprehend language but would be unable to produce fluent, meaningful speech in response.", "The patient would be able to speak fluently, but the speech would be nonsensical and unrelated to any question asked.", "The patient would lose the ability to read written language."], "correct": "B", "rationale": {"A": "A and D describe the effects of an agonist (stimulation). C is an effect seen with nicotinic receptor antagonists at the neuromuscular junction.", "B": "Muscarinic receptors mediate the \"rest-and-digest\" functions of the parasympathetic nervous system. An antagonist would block these functions. Blocking parasympathetic input to the heart's SA node would remove the \"brake,\" leading to tachycardia. Blocking input to the salivary glands would lead to dry mouth.", "C": "This option is incorrect.", "D": "A and D describe the effects of an agonist (stimulation). C is an effect seen with nicotinic receptor antagonists at the neuromuscular junction."}}, {"id": 481, "category": ["Exam Questions \"Very difficult\""], "stem": "The primary difference between a simple spinal reflex (like the patellar reflex) and a more complex one (like the pain withdrawal reflex) is that the pain withdrawal reflex:", "options": ["Is purely inhibitory, whereas the patellar reflex is purely excitatory.", "Does not involve interneurons.", "Involves ascending tracts to the brain for conscious perception of pain, which then influences the motor response.", "Is controlled by the autonomic nervous system."], "correct": "A", "rationale": {"A": "The lecture and its diagrams clearly distinguish these two connections. The hypothalamus controls the anterior pituitary by releasing hormones into the specialized hypothalamic-hypophyseal portal system (a vascular link). It controls the posterior pituitary via long axons that extend directly from the hypothalamus (a neural link).", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 482, "category": ["Exam Questions \"Very difficult\""], "stem": "Which of the following represents a failure of a homeostatic negative feedback loop?", "options": ["Increased T3/T4 levels leading to decreased TSH and TRH secretion.", "A rise in blood glucose after a meal stimulating insulin release, which then lowers blood glucose.", "An ACTH-secreting pituitary tumor that continues to secrete ACTH despite high cortisol levels.", "A drop in blood pressure stimulating the RAAS, which then raises blood pressure."], "correct": "B", "rationale": {"A": "A describes liquefactive necrosis. C describes coagulative necrosis. D is a general description of inflammation.", "B": "The lecture on types of necrosis states that in fat necrosis, released enzymes break down fats into fatty acids, which then undergo \"saponification\" by precipitating with calcium to form \"soapy deposits.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 483, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient has a rare condition that destroys the oligodendrocytes in their central nervous system. What would be the primary consequence?", "options": ["A failure of the blood-brain barrier, leading to cerebral edema.", "A loss of myelination in the brain and spinal cord, slowing or blocking neural signal propagation.", "An inability to produce cerebrospinal fluid, leading to a collapse of the ventricles.", "A loss of myelination in the peripheral nerves, leading to peripheral neuropathy."], "correct": "A", "rationale": {"A": "a) Can freely cross the semi-permeable membrane.", "B": "b) Cannot cross the semi-permeable membrane and thus exerts an osmotic pressure. Rationale for Correct Answer: The lecture emphasizes that only non-permeable solutes (osmolytes) can exert an osmotic pressure across a semi-permeable membrane, pulling water towards them. Permeable solutes do not affect tonicity. Rationale for Incorrect Answers: A describes a permeable solute. C is incorrect; water moves passively via osmosis. D is incorrect; osmolytes exist in both ECF (Na+) and ICF (K+).", "C": "c) Actively transports water across the membran
