thus farther from the threshold to fire an action potential, reducing the risk of seizure.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 335, "category": ["Mixed set 3"], "stem": "The 12 pairs of cranial nerves are part of the peripheral nervous system. Which cranial nerve is responsible for carrying approximately 70% of all parasympathetic input to the body?", "options": ["Optic Nerve (II)", "Trigeminal Nerve (V)", "Vagus Nerve (X)", "Accessory Nerve (XI)"], "correct": "C", "rationale": {"A": "A, B, and D are other important cranial nerves but do not carry the majority of parasympathetic outflow.", "B": "A, B, and D are other important cranial nerves but do not carry the majority of parasympathetic outflow.", "C": "The lecture states that \"about 70% of all of the parasympathetic input to the body is conveyed through the vagus nerves.\"", "D": "A, B, and D are other important cranial nerves but do not carry the majority of parasympathetic outflow."}}, {"id": 336, "category": ["Mixed set 3"], "stem": "A patient with shingles develops a painful rash that follows a distinct line across one side of their chest. This pattern corresponds to a:", "options": ["Myotome", "Cranial nerve distribution", "Dermatome", "Sympathetic chain ganglion"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture explains that the shingles virus (varicella) hides in the spinal cord and reemerges through a spinal nerve, causing a region of lesions that \"conform to a dermatome.\"", "D": "This option is incorrect."}}, {"id": 337, "category": ["Mixed set 3"], "stem": "The patellar (knee-jerk) reflex is a purely spinal reflex. This means that:", "options": ["It requires descending input from the brain to be initiated.", "The sensory input is received and motor output is controlled entirely by a segment of the spinal cord.", "The brain is not aware that the reflex has occurred.", "It is controlled by the autonomic nervous system."], "correct": "B", "rationale": {"A": "A is incorrect by definition. C is incorrect; the brain is made aware via ascending tracts, but it does not control the reflex itself. D is incorrect; this is a somatic (skeletal muscle) reflex.", "B": "The lecture defines a purely spinal reflex by stating that \"the inputs are received and the outputs are controlled entirely by the spinal cord. There's no descending input from the brain.\" The patellar reflex is used as the prime example.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 338, "category": ["Mixed set 3"], "stem": "The autonomic nervous system is characterized by a two-neuron chain. For the sympathetic nervous system, the preganglionic neurons originate in which region of the spinal cord?", "options": ["Cranial and sacral regions", "The dorsal root ganglia only", "The lateral horn of the thoracolumbar region (T1-L3)", "The ventral horn of the cervical region"], "correct": "C", "rationale": {"A": "A describes the parasympathetic origins. B and D are incorrect locations for these specific neurons.", "B": "This option is incorrect.", "C": "The lecture specifies that for the sympathetic nervous system, the preganglionic cell bodies are \"sitting in the lateral horn of the spinal cord between levels T1 and L3.\"", "D": "This option is incorrect."}}, {"id": 339, "category": ["Mixed set 3"], "stem": "In both the sympathetic and parasympathetic systems, the neurotransmitter released by the preganglionic neuron is:", "options": ["Norepinephrine", "Epinephrine", "Dopamine", "Acetylcholine"], "correct": "D", "rationale": {"A": "A, B, and C are incorrect. Norepinephrine and epinephrine are associated with the sympathetic second synapse.", "B": "A, B, and C are incorrect. Norepinephrine and epinephrine are associated with the sympathetic second synapse.", "C": "A, B, and C are incorrect. Norepinephrine and epinephrine are associated with the sympathetic second synapse.", "D": "A, B, and C are incorrect. Norepinephrine and epinephrine are associated with the sympathetic second synapse."}}, {"id": 340, "category": ["Mixed set 3"], "stem": "While the parasympathetic postganglionic neuron releases acetylcholine, the sympathetic postganglionic neuron primarily releases:", "options": ["Acetylcholine", "Norepinephrine", "Serotonin", "GABA"], "correct": "B", "rationale": {"A": "A is released by the parasympathetic postganglionic neuron. C and D are CNS neurotransmitters not primarily involved in this peripheral synapse.", "B": "The lecture highlights the key difference at the second synapse, stating that \"The postganglionic cells of the sympathetic system release norepinephrine, and norepinephrine binds to adrenergic receptors.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 341, "category": ["Mixed set 3"], "stem": "What is the primary functional difference between the nervous system and the endocrine system?", "options": ["The nervous system uses chemical messengers, while the endocrine system does not.", "The nervous system provides rapid, brief responses, while the endocrine system provides slower, more sustained responses.", "The endocrine system is \"wired,\" while the nervous system is \"wireless.\"", "The endocrine system only controls growth, while the nervous system controls all other functions."], "correct": "B", "rationale": {"A": "A is incorrect; both use chemical messengers. C has the terms reversed. D is an oversimplification and incorrect.", "B": "A comparison table in the materials shows that the nervous system has a \"Rapid (milliseconds)\" speed of response and \"Brief (milliseconds)\" duration of action, while the endocrine system is \"Slow (minutes to hours)\" with a \"Long (minutes to days or longer)\" duration.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 342, "category": ["Mixed set 3"], "stem": "Based on chemical structure, hormones are divided into three main types. To which type do cortisol, aldosterone, and testosterone belong?", "options": ["Peptide hormones", "Steroid hormones", "Amino acid-derived hormones", "Glycoprotein hormones"], "correct": "B", "rationale": {"A": "A and C are the other two main categories of hormones.", "B": "The lecture identifies three types of hormones and lists cortisol, aldosterone, and testosterone as examples of steroid hormones, which are all derived from cholesterol.", "C": "A and C are the other two main categories of hormones.", "D": "A and C are the other two main categories of hormones."}}, {"id": 343, "category": ["Mixed set 3"], "stem": "Thyroid hormone is an amino acid-derived hormone but is unique because it is lipid-soluble. This allows it to:", "options": ["Bind to membrane receptors and activate second messengers.", "Be stored in large quantities within intracellular vesicles.", "Freely cross the cell membrane and interact with nuclear receptors to control gene expression.", "Dissolve easily in blood plasma without a carrier protein."], "correct": "C", "rationale": {"A": "A is the mechanism for water-soluble hormones. B is incorrect; lipid-soluble hormones are hard to store in vesicles. D is incorrect; lipid-soluble hormones require a carrier protein in the blood.", "B": "This option is incorrect.", "C": "The lecture states that because thyroid hormone is fat-soluble (lipid-soluble), it \"can diffuse across membranes\" and, like steroid hormones, \"tends to cross the membrane, enter the nucleus, and control the expression of a variety of genes.\"", "D": "This option is incorrect."}}, {"id": 344, "category": ["Mixed set 3"], "stem": "Hierarchical control of hormone secretion, involving the hypothalamus, anterior pituitary, and a peripheral gland, serves to:", "options": ["Ensure a rapid, large burst of hormone release.", "Allow for tight control over hormone levels through multiple points of negative feedback.", "Bypass the need for negative feedback.", "Limit hormone effects to a single target organ."], "correct": "B", "rationale": {"A": "A is incorrect; this system is for fine control, not necessarily speed. C is the opposite of its function. D is incorrect as the final hormone can have widespread effects.", "B": "The lecture explains that in a hierarchical system, the final hormone (hormone 3) \"provides negative feedback at the level of gland 2 and gland 1... You have multiple points of control, and so you get this very good and strong control of hormone 3.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 345, "category": ["Mixed set 3"], "stem": "The posterior pituitary is not a true endocrine gland because it:", "options": ["Only produces one type of hormone.", "Is an extension of the hypothalamus and only stores and releases hormones made there.", "Is controlled by the peripheral nervous system.", "Does not release hormones into the bloodstream."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect statements about the posterior pituitary's function and structure.", "B": "The lecture explains that the posterior pituitary is \"just an extension of the hypothalamus,\" consisting of the axon terminals of hypothalamic neurons. It stores and releases oxytocin and vasopressin, but these hormones are synthesized in the hypothalamus.", "C": "A, C, and D are incorrect statements about the posterior pituitary's function and structure.", "D": "A, C, and D are incorrect statements about the posterior pituitary's function and structure."}}, {"id": 346, "category": ["Mixed set 3"], "stem": "The hypothalamus controls the anterior pituitary through the release of hormones into a:", "options": ["Direct neural connection.", "General systemic circulation.", "Hypothalamic-hypophyseal portal system.", "Cerebrospinal fluid channel."], "correct": "C", "rationale": {"A": "A, B, and D describe incorrect connection types. The connection is vascular, not neural, and it is a specific portal system, not general circulation.", "B": "A, B, and D describe incorrect connection types. The connection is vascular, not neural, and it is a specific portal system, not general circulation.", "C": "The lecture describes a unique circulatory connection where hypothalamic hormones are released into a \"small network of capillaries within the connecting stalk\" that travels directly to the anterior pituitary. This is the hypothalamic-hypophyseal portal system.", "D": "A, B, and D describe incorrect connection types. The connection is vascular, not neural, and it is a specific portal system, not general circulation."}}, {"id": 347, "category": ["Mixed set 3"], "stem": "Growth hormone (GH) secretion is highest during which period?", "options": ["During stressful events", "Immediately after a high-protein meal", "In the morning upon waking", "During stage 2 non-REM sleep at night"], "correct": "D", "rationale": {"A": "A, B, and C are incorrect timings for the primary release of growth hormone.", "B": "A, B, and C are incorrect timings for the primary release of growth hormone.", "C": "A, B, and C are incorrect timings for the primary release of growth hormone.", "D": "A, B, and C are incorrect timings for the primary release of growth hormone."}}, {"id": 348, "category": ["Mixed set 3"], "stem": "Growth hormone exerts some of its effects indirectly by stimulating the liver to produce:", "options": ["Cortisol", "Thyroid hormone", "Insulin-like growth factors (IGFs)", "Aldosterone"], "correct": "C", "rationale": {"A": "A, B, and D are hormones from other endocrine axes.", "B": "A, B, and D are hormones from other endocrine axes.", "C": "The lecture describes the indirect effects of growth hormone, stating that it \"acts on liver tissue, on the liver, to produce what we call IGF-1 and 2. IGF stands for insulin-like growth factor.\"", "D": "A, B, and D are hormones from other endocrine axes."}}, {"id": 349, "category": ["Mixed set 3"], "stem": "Cortisol is a glucocorticoid released in response to stress. One of its primary metabolic actions is to:", "options": ["Lower blood glucose by promoting its uptake into muscle.", "Increase blood glucose by stimulating gluconeogenesis and protein breakdown.", "Promote the storage of fat in peripheral tissues.", "Enhance immune function and inflammation."], "correct": "B", "rationale": {"A": "A is the opposite of its effect. C is incorrect; it promotes central fat deposition, not peripheral. D is incorrect; cortisol is an immunosuppressant.", "B": "The lecture on cortisol's actions states that it \"elevates blood glucose\" by acting on the liver to enhance glycogen breakdown and on muscle to cause breakdown for amino acids that can be used for gluconeogenesis. This is part of its function to \"mobilize energy.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 350, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A disease process is described as \"dynamic.\" What is the most significant clinical implication of this concept?", "options": ["A disease's etiology can change over time.", "The clinical manifestations and the body's response can change over time, even if the initial injury does not.", "A single diagnosis will remain appropriate for the patient's entire life.", "The pathogenesis of a disease is static once the initial injury occurs."], "correct": "B", "rationale": {"A": "A is incorrect; the etiology is the initial cause and typically does not change. C is a clinical assumption that contradicts the dynamic nature of disease. D is incorrect; pathogenesis is the entire process of development, which is itself dynamic.", "B": "The lecture emphasizes that diseases are dynamic, meaning the body's response can change over time. This implies that clinical manifestations are not static and a patient's condition can evolve, requiring ongoing assessment.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 351, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with chronic, severe diarrhea is at high risk for developing metabolic acidosis. What is the primary mechanism causing this specific acid-base imbalance?", "options": ["Loss of non-carbonic acids through the stool.", "Increased production of keto acids due to malnourishment.", "Inappropriate loss of bicarbonate in the diarrheal fluid.", "Compensatory hypoventilation leading to CO2 retention."], "correct": "C", "rationale": {"A": "A is incorrect; diarrhea causes a loss of base, not acid. B is a possible but not the primary mechanism. D is incorrect; the compensatory response would be hyperventilation (blowing off acid), not hypoventilation.", "B": "This option is incorrect.", "C": "The lecture identifies \"Bicarbonate Loss: Diarrhea\" as a major cause of metabolic acidosis. Diarrheal fluid is rich in bicarbonate, and its loss removes a key buffer from the body, tipping the pH balance toward acidic.", "D": "This option is incorrect."}}, {"id": 352, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The irreversible step leading to cell death during hypoxic injury is most closely associated with:", "options": ["The initial failure of the Na+/K+ pump and cellular swelling.", "The switch to anaerobic glycolysis and a decrease in intracellular pH.", "The detachment of ribosomes from the endoplasmic reticulum.", "Swelling and irreversible damage to the mitochondria, halting ATP production."], "correct": "D", "rationale": {"A": "A, B, and C are all parts of the hypoxic injury pathway but are considered reversible if oxygen is restored before mitochondrial damage becomes permanent.", "B": "A, B, and C are all parts of the hypoxic injury pathway but are considered reversible if oxygen is restored before mitochondrial damage becomes permanent.", "C": "A, B, and C are all parts of the hypoxic injury pathway but are considered reversible if oxygen is restored before mitochondrial damage becomes permanent.", "D": "A, B, and C are all parts of the hypoxic injury pathway but are considered reversible if oxygen is restored before mitochondrial damage becomes permanent."}}, {"id": 353, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "How does the body systemically control cell volume versus locally at the cell membrane?", "options": ["Systemically by the ADH-thirst system and RAAS; locally by the Na+/K+ ATPase pump.", "Systemically by the Na+/K+ ATPase pump; locally by the ADH-thirst system and RAAS.", "Systemically by capillary bulk flow; locally by the bicarbonate buffer system.", "Systemically and locally by the ADH-thirst system exclusively."], "correct": "A", "rationale": {"A": "The lecture explains that overall body hydration is controlled systemically by the ADH-thirst system (water balance) and RAAS (sodium/osmolyte balance). At the local cellular level, the Na+/K+ ATPase pump is critical for maintaining the specific ion gradients across the membrane that regulate individual cell volume.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 354, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The composition of cerebrospinal fluid (CSF) is specifically regulated to reduce neuronal excitability. Which compositional difference from plasma MOST contributes to hyperpolarizing the neuronal resting membrane potential?", "options": ["Slightly lower sodium concentration.", "Significantly lower potassium concentration.", "Slightly higher magnesium concentration.", "Significantly lower protein concentration."], "correct": "B", "rationale": {"A": "A and C have smaller or different effects on resting potential compared to the potent effect of the K+ gradient. D is related but is a consequence of reduced excitability, not the primary cause.", "B": "The lecture explains that lowering extracellular potassium increases the concentration gradient for potassium to exit the cell. Since potassium is a positive ion, its efflux makes the cell's interior more negative (hyperpolarized), moving it further away from the threshold for firing an action potential.", "C": "A and C have smaller or different effects on resting potential compared to the potent effect of the K+ gradient. D is related but is a consequence of reduced excitability, not the primary cause.", "D": "A and C have smaller or different effects on resting potential compared to the potent effect of the K+ gradient. D is related but is a consequence of reduced excitability, not the primary cause."}}, {"id": 355, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "In the context of the patellar reflex, what is the specific spinal cord circuitry that allows the quadriceps to contract while the hamstring relaxes?", "options": ["A single sensory neuron directly excites both the quadriceps and hamstring motor neurons.", "Sensory input excites the quadriceps motor neuron and simultaneously excites an inhibitory interneuron that synapses on the hamstring motor neuron.", "Descending motor commands from the brain coordinate the contraction and relaxation.", "The sensory neuron synapses only on the quadriceps motor neuron, and the hamstring relaxes passively."], "correct": "B", "rationale": {"A": "A would cause both muscles to contract. C is incorrect, as this is a spinal reflex. D is incomplete; the hamstring must be actively inhibited for the reflex to work efficiently.", "B": "The lecture on the patellar reflex shows the sensory neuron synapsing on and stimulating the motor neuron to the quadriceps (the extensor). It also shows the sensory neuron synapsing on an inhibitory interneuron, which then inhibits the motor neuron to the hamstring (the flexor), causing it to relax. This is called reciprocal inhibition.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 356, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with a pituitary adenoma that is overproducing ACTH is given a dexamethasone suppression test. The test fails to suppress cortisol levels. Why?", "options": ["The adrenal gland has become resistant to cortisol's negative feedback.", "The pituitary tumor is insensitive to the negative feedback that dexamethasone (a synthetic glucocorticoid) mimics.", "Dexamethasone is not a strong enough glucocorticoid to suppress a normal pituitary.", "The hypothalamus is overproducing CRH, overriding the suppression signal."], "correct": "B", "rationale": {"A": "A is incorrect; the adrenal gland is responding appropriately to high ACTH. C is incorrect; dexamethasone is a potent glucocorticoid. D might cause similar symptoms but is a different diagnosis (Cushing's disease vs. ectopic ACTH, etc.); the test itself fails because the pituitary tumor is the problem.", "B": "In Cushing's syndrome caused by an ACTH-secreting pituitary adenoma, the tumor cells do not respond to normal negative feedback signals. Dexamethasone mimics cortisol, which would normally suppress ACTH release from a healthy pituitary, but the tumor continues to secrete ACTH regardless.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 357, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient has a genetic defect that prevents the conversion of cholesterol to pregnenolone. This would lead to a deficiency in which of the following hormones?", "options": ["Aldosterone only", "Cortisol and testosterone only", "Aldosterone, cortisol, testosterone, and estrogen", "Growth hormone and thyroid hormone"], "correct": "C", "rationale": {"A": "A and B are incomplete. D are not steroid hormones and are not derived from cholesterol.", "B": "A and B are incomplete. D are not steroid hormones and are not derived from cholesterol.", "C": "The lecture shows a diagram where cholesterol is the universal precursor molecule that is first converted to pregnenolone. From pregnenolone, all other steroid hormones (mineralocorticoids like aldosterone, glucocorticoids like cortisol, and sex hormones like testosterone and estrogen) are synthesized. A block at this first step would prevent the synthesis of all of them.", "D": "A and B are incomplete. D are not steroid hormones and are not derived from cholesterol."}}, {"id": 358, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Which of the following scenarios would most likely lead to a hypotonic fluid alteration?", "options": ["Administration of excess IV normal saline.", "A patient with SIADH (syndrome of inappropriate ADH) who is retaining excess free water.", "Inadequate water intake leading to dehydration.", "A massive hemorrhage with proportional loss of fluid and electrolytes."], "correct": "B", "rationale": {"A": "A would cause isotonic volume excess. C would cause a hypertonic alteration. D would cause isotonic volume depletion.", "B": "The lecture defines hypotonic alterations as a decrease in the concentration of solutes in the ECF (it becomes more dilute). SIADH causes the inappropriate retention of free water, which directly dilutes the sodium and other solutes in the blood, creating a hypotonic state.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 359, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Reperfusion injury paradoxically causes further cellular damage after blood flow is restored to an ischemic area. This secondary injury is primarily mediated by:", "options": ["A rapid and excessive increase in ATP production that damages mitochondria.", "The sudden washout of accumulated lactic acid, causing an alkalotic state.", "The influx of inflammatory mediators and the generation of reactive oxygen species (ROS).", "The failure of sodium-potassium pumps to restart, leading to massive cellular swelling."], "correct": "C", "rationale": {"A": "A, B, and D are incorrect mechanisms. The damage is explicitly linked to inflammation and ROS in the lecture materials.", "B": "A, B, and D are incorrect mechanisms. The damage is explicitly linked to inflammation and ROS in the lecture materials.", "C": "The lecture states that reperfusion injury is a \"secondary injury\" that happens when blood flow returns because the initial hypoxia triggers an inflammatory response. The returning blood carries \"inflammatory mediators,\" and white blood cells release reactive oxygen species (ROS), both of which cause additional damage.", "D": "A, B, and D are incorrect mechanisms. The damage is explicitly linked to inflammation and ROS in the lecture materials."}}, {"id": 360, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "What is the fundamental difference in the mechanism of action between a peptide hormone and a steroid hormone?", "options": ["Peptide hormones activate gene expression, while steroid hormones use second messengers.", "Peptide hormones bind to intracellular receptors, while steroid hormones bind to membrane receptors.", "Peptide hormones bind to membrane receptors to trigger second messengers, while steroid hormones cross the membrane to bind with nuclear receptors and regulate gene expression.", "Peptide hormones are transported by binding proteins, while steroid hormones travel freely in the plasma."], "correct": "C", "rationale": {"A": "A and B have the mechanisms reversed. D has the transport mechanisms reversed (lipid-soluble hormones need binding proteins).", "B": "A and B have the mechanisms reversed. D has the transport mechanisms reversed (lipid-soluble hormones need binding proteins).", "C": "The materials distinguish water-soluble (peptide/amino acid-derived) from lipid-soluble (steroid/thyroid) hormones. Water-soluble hormones cannot cross the membrane and bind to surface receptors to activate second messengers. Lipid-soluble hormones can cross the membrane to bind with nuclear receptors and directly regulate gene transcription.", "D": "A and B have the mechanisms reversed. D has the transport mechanisms reversed (lipid-soluble hormones need binding proteins)."}}, {"id": 361, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The absolute refractory period of an action potential is a time when a new action potential cannot be initiated, regardless of stimulus strength. This is due to the:", "options": ["Voltage-gated potassium channels being wide open.", "Inactivation gate of the voltage-gated sodium channels being closed.", "Neuron being hyperpolarized.", "Sodium-potassium pump working at maximum capacity."], "correct": "B", "rationale": {"A": "A is associated with repolarization and the relative refractory period. C occurs during the relative refractory period. D works throughout the process but doesn't define the absolute refractory period.", "B": "The lecture on the action potential explains that the voltage-gated sodium channel has a unique \"inactivation gate.\" After opening for depolarization, this gate closes and blocks the channel. The channel remains in this inactivated state and \"won't respond to any amount of stimuli\" until the cell repolarizes.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 362, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient presents with the following ABG values: pH 7.44, PCO2 50 mmHg, HCO3 30 mEq/L.  (normal pH 7.35-7.45, pCO2 35-45, HCO3 21-28) This is indicative of:", "options": ["Uncompensated respiratory acidosis.", "Uncompensated metabolic alkalosis.", "Fully compensated respiratory acidosis.", "Fully compensated metabolic alkalosis."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The pH is normal (7.44), but high-normal. PCO2 is high (50), which is acidotic. HCO3 is high (30), which is alkalotic. The pH is leaning alkalotic.  The pH is 7.44, which is on the high side of normal. We look at which value (PCO2 or HCO3) matches the direction of the pH. The high HCO3 (alkalosis) matches the high-normal pH (leaning alkalotic). Thus, the primary disturbance is metabolic alkalosis. The high PCO2 is the respiratory compensation. So it is a fully compensated metabolic alkalosis."}}, {"id": 363, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The dopaminergic \"reward pathway,\" which is critical for motivation and addiction, originates in the ventral tegmental area (VTA) and projects to several areas, including the prefrontal cortex. What is the functional significance of the projection to the prefrontal cortex?", "options": ["To directly produce the feeling of pleasure.", "To alert the organism to danger associated with the reward.", "To hijack executive functions like planning and judgment to facilitate repeating the rewarding behavior.", "To store the motor pattern associated with the reward-seeking behavior."], "correct": "C", "rationale": {"A": "A is more associated with the limbic system targets (e.g., nucleus accumbens). B is the role of the amygdala. D is the role of the cerebellum.", "B": "This option is incorrect.", "C": "The lecture explains that the VTA's projection to the prefrontal cortex is significant because this is the brain region for executive function (planning, judgment). In addiction, this pathway is \"hijacked,\" and the prefrontal cortex becomes a \"slave to the reward system,\" focusing its cognitive resources on obtaining the reward.", "D": "This option is incorrect."}}, {"id": 364, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Left ventricular hypertrophy is an adaptive response of cardiac muscle. However, it can become pathological and lead to heart failure because:", "options": ["The hypertrophied cells can no longer contract.", "It represents a precancerous change to the cardiac tissue.", "The enlarged cells have increased functional demand but may not have adequate blood supply, leading to dysfunction.", "The increase in cell size is accompanied by a decrease in cell number."], "correct": "C", "rationale": {"A": "A is incorrect; they can contract, but inefficiently. B is incorrect; hypertrophy is not neoplasia. D is incorrect; hypertrophy is an increase in size, not a change in number.", "B": "This option is incorrect.", "C": "Pathological hypertrophy, like that from chronic hypertension, increases the size and metabolic demand of the muscle cells. However, the blood supply (coronary arteries) may not increase proportionally, leading to relative ischemia, impaired function, and eventually, heart failure.", "D": "This option is incorrect."}}, {"id": 365, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with severe liver failure develops ascites. The disruption in which Starling force is the primary cause?", "options": ["A decrease in capillary oncotic pressure due to a lack of plasma protein synthesis.", "An increase in capillary blood pressure due to portal hypertension.", "An increase in interstitial oncotic pressure from leaking proteins.", "A decrease in interstitial hydrostatic pressure."], "correct": "A", "rationale": {"A": "Ascites in liver failure is a classic example used in the lecture. The primary cause is the liver's inability to synthesize albumin, the main plasma protein. This drastically reduces capillary oncotic pressure, the force that holds fluid inside blood vessels, causing massive fluid leakage into the peritoneal \"third space.\"", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 366, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Unlike the sympathetic nervous system, the parasympathetic preganglionic neurons are characterized by:", "options": ["Short preganglionic fibers and long postganglionic fibers.", "Originating exclusively in the thoracolumbar region of the spinal cord.", "Long preganglionic fibers that synapse in ganglia close to or on the target organ.", "The use of norepinephrine at the preganglionic synapse."], "correct": "C", "rationale": {"A": "A describes the sympathetic system. B describes the sympathetic system's origin. D is incorrect; both systems use acetylcholine at the preganglionic synapse.", "B": "This option is incorrect.", "C": "The lecture materials and diagrams show that parasympathetic preganglionic fibers are very long, originating in the brainstem or sacral spine and traveling nearly all the way to the target organ before synapsing in small, scattered plexi. Consequently, the postganglionic fibers are very short.", "D": "This option is incorrect."}}, {"id": 367, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "What is the key difference between the communication mediated by a neurotransmitter and that mediated by a neuroactive peptide?", "options": ["Neurotransmitters cause slow, modulatory changes, while peptides cause fast, direct excitation.", "Neurotransmitters are always excitatory, while peptides are always inhibitory.", "Neurotransmitters typically mediate fast, direct synaptic transmission, while peptides often have a slower, modulatory role.", "Neurotransmitters are released into the bloodstream, while peptides are released into the synaptic cleft."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture distinguishes between classic neurotransmitters that cause fast synaptic potentials and neuroactive peptides, which are \"often released along with other neurotransmitters\" to \"modulate the response to the neurotransmitter\" in the postsynaptic cell, creating a slower, longer-lasting change.", "D": "This option is incorrect."}}, {"id": 368, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "All of the following are mechanisms by which reactive oxygen species (ROS) cause cellular injury EXCEPT:", "options": ["Lipid peroxidation of membranes.", "Damage to DNA leading to mutations.", "Disruption of polypeptide chains.", "Enhanced production of ATP through oxidative phosphorylation."], "correct": "D", "rationale": {"A": "A, B, and C are all explicitly mentioned in the lecture as damaging effects of ROS.", "B": "A, B, and C are all explicitly mentioned in the lecture as damaging effects of ROS.", "C": "A, B, and C are all explicitly mentioned in the lecture as damaging effects of ROS.", "D": "A, B, and C are all explicitly mentioned in the lecture as damaging effects of ROS."}}, {"id": 369, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The release of prolactin is unique among anterior pituitary hormones because it is primarily under tonic:", "options": ["stimulatory control by Prolactin-Releasing Hormone (PRH).", "inhibitory control by dopamine.", "stimulatory control by oxytocin.", "inhibitory control by somatostatin."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture on the hypothalamic-pituitary axis states that prolactin release is controlled by two hormones, but \"Dopamine is what is dominant most of the time, and it inhibits the production of prolactin.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 370, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with a spinal cord injury at the T6 level retains a patellar reflex. This demonstrates that the reflex:", "options": ["Is controlled by the brain via descending tracts that were spared.", "Does not require sensory input to be initiated.", "Is mediated entirely within the L2-L4 spinal segment without input from higher centers.", "Will be felt by the patient even if they cannot voluntarily move their leg."], "correct": "C", "rationale": {"A": "A is incorrect by definition of a spinal reflex. B is incorrect; it requires a sensory stimulus (the tap). D is incorrect; the patient will not feel it because the ascending sensory tracts are severed at T6.", "B": "This option is incorrect.", "C": "The lecture uses the patellar reflex as an example of a purely spinal reflex, stating it is \"controlled entirely by the portion of the spinal cord between L2 and L4.\" A T6 injury severs the connection to the brain but leaves the lumbar spinal cord circuitry intact and functional.", "D": "This option is incorrect."}}, {"id": 371, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A drug that acts as a beta-1 adrenergic receptor antagonist (a beta-blocker) would be expected to have what primary effect on the heart?", "options": ["Increase heart rate and contraction strength.", "Decrease heart rate and contraction strength.", "Cause bronchodilation in the lungs.", "Cause vasoconstriction of blood vessels in skeletal muscle."], "correct": "B", "rationale": {"A": "A is the effect of an agonist. C is an effect mediated by beta-2 receptors. D is an effect mediated by alpha-1 or beta-2 receptors depending on location, but not beta-1.", "B": "The lecture materials indicate that beta-1 adrenergic receptors are found on cardiac muscle and their stimulation causes \"cardio-acceleration\" and increased contraction strength. An antagonist would block these effects, leading to a decrease in heart rate and force of contraction.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 372, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with untreated hyperthyroidism often feels chronically hot. This is a direct consequence of thyroid hormone's action to:", "options": ["Increase the number of sodium-potassium ATPase pumps, thereby increasing basal metabolic rate and heat production.", "Decrease blood flow to the skin, trapping heat in the core.", "Directly stimulate the temperature-regulating center in the hypothalamus.", "Increase the breakdown of adipose tissue, which is an exothermic process."], "correct": "A", "rationale": {"A": "B, C, and D are incorrect mechanisms. The effect is systemic and metabolic, stemming from increased energy consumption at the cellular level.", "B": "B, C, and D are incorrect mechanisms. The effect is systemic and metabolic, stemming from increased energy consumption at the cellular level.", "C": "B, C, and D are incorrect mechanisms. The effect is systemic and metabolic, stemming from increased energy consumption at the cellular level.", "D": "B, C, and D are incorrect mechanisms. The effect is systemic and metabolic, stemming from increased energy consumption at the cellular level."}}, {"id": 373, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "While both are part of the central nervous system, gray matter is structurally different from white matter in that:", "options": ["Gray matter contains myelinated axons, while white matter contains neuronal cell bodies.", "Gray matter primarily processes information horizontally within a spinal segment, while white matter transmits information vertically in ascending/descending tracts.", "White matter is where synapses occur, while gray matter is for signal propagation.", "White matter is only found in the brain, while gray matter is only found in the spinal cord."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture emphasizes that gray matter, containing cell bodies and synapses, should be thought of \"in terms of horizontal space\" for processing within a segment. White matter, containing myelinated axons, should be thought of \"vertically, because the white matter is composed of axons that are either traveling upward... or down the spinal cord.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 374, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with a damaged hypothalamus might exhibit all of the following EXCEPT:", "options": ["Inability to regulate body temperature.", "Disrupted release of TSH and ACTH from the anterior pituitary.", "Impaired storage of learned motor patterns like writing.", "Alterations in appetite and thirst."], "correct": "C", "rationale": {"A": "A, B, and D are all key functions controlled by the hypothalamus.", "B": "A, B, and D are all key functions controlled by the hypothalamus.", "C": "The hypothalamus is a major control center for baseline functions like temperature, appetite, and thirst, and it controls the pituitary. However, the lecture clearly states that learned motor patterns are stored in the cerebellum.", "D": "A, B, and D are all key functions controlled by the hypothalamus."}}, {"id": 375, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The ADH-thirst system and the Renin-Angiotensin-Aldosterone System (RAAS) are both critical for fluid balance. What is the primary distinction in what they regulate?", "options": ["The ADH-thirst system regulates total body sodium, while RAAS regulates total body water.", "The ADH-thirst system primarily regulates water balance and osmolarity, while RAAS primarily regulates sodium balance and blood pressure.", "The ADH-thirst system is a slow response, while RAAS is a rapid response.", "Both systems regulate the exact same parameters through different mechanisms."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture describes the ADH-thirst system as the controller of \"water balance.\" It describes the RAAS as the \"systemic method of helping to regulate extracellular concentration of sodium and potassium,\" which is closely tied to blood pressure.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 376, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with low levels of IGF-1 but normal or high levels of growth hormone (GH) likely has a dysfunction in which organ?", "options": ["Hypothalamus", "Anterior Pituitary", "The target cells throughout the body", "Liver"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture explains the GH axis: the hypothalamus releases GHRH, the pituitary releases GH, and GH acts on the liver to produce IGFs. If GH levels are normal/high but IGF-1 is low, the problem lies in the liver's inability to respond to GH."}}, {"id": 377, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The blood-brain barrier is least effective in certain \"leaky\" regions known as circumventricular organs. What is the physiological purpose of these areas?", "options": ["To allow for the drainage of cerebrospinal fluid into the venous sinuses.", "To allow specific brain regions, like the hypothalamus, to monitor the chemical composition of the systemic blood.", "To provide the main sites of entry for nutrients like glucose into the brain.", "To allow neurotransmitters to exit the brain and act systemically as hormones."], "correct": "B", "rationale": {"A": "A describes arachnoid granulations. C and D are incorrect functions of these specific organs.", "B": "The lecture explains that these \"leaky\" regions allow parts of the brain, like the hypothalamus, to \"get access to things like circulating hormones\" and cytokines, allowing them to monitor the body's internal state without compromising the entire blood-brain barrier.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 378, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "An individual who has lost their vision and learns to read Braille will experience an expansion of the cortical area in the somatosensory cortex dedicated to their fingertips. This phenomenon is known as:", "options": ["Morphological adaptation", "Neuroplasticity", "Somatotopic mapping", "Saltatory conduction"], "correct": "B", "rationale": {"A": "A is a cellular-level term. C is the map itself, not the process of changing it. D is a mechanism of action potential propagation.", "B": "The lecture introduces the concept of neuroplasticity in the context of the somatotopic map, stating, \"The brain is very plastic; it can shift responsibilities,\" and gives the example of Braille readers having an expanded cortical area for their fingertips.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 379, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "In a hierarchical endocrine axis, what is the consequence of a peripheral gland (gland 3) failing to produce its hormone?", "options": ["Hormone levels from gland 1 (hypothalamus) and gland 2 (pituitary) will decrease due to positive feedback.", "Hormone levels from gland 1 and gland 2 will increase due to a loss of negative feedback.", "The target tissue will start producing the missing hormone to compensate.", "There will be no change in the levels of hormones from gland 1 and gland 2."], "correct": "B", "rationale": {"A": "A describes positive feedback. C is not a physiological mechanism. D is incorrect because the lack of feedback will cause a change.", "B": "In a hierarchical system, the final hormone (from gland 3) provides negative feedback to glands 1 and 2. If this hormone is absent, the feedback inhibition is lost, and glands 1 and 2 will increase their secretion of stimulating hormones (hormones 1 and 2).", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 380, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "An adult patient with a tumor secreting excessive growth hormone will develop acromegaly but will not grow taller. Why?", "options": ["Adult bones are no longer responsive to IGF-1.", "The epiphyseal (growth) plates in the long bones have closed.", "Excessive growth hormone inhibits the liver from producing IGF-1 in adults.", "Adult cortisol levels antagonize the effects of growth hormone on long bones."], "correct": "B", "rationale": {"A": "A is incorrect; other bones (like those in the hands, feet, and face) remain responsive, leading to the features of acromegaly. C and D are incorrect statements.", "B": "Growth hormone and IGFs promote the elongation of long bones. However, this only occurs while the cartilaginous epiphyseal plates at the ends of the bones are open. After puberty, these plates close (ossify), and linear growth is no longer possible.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 381, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The primary motor cortex originates voluntary motor commands. What is the role of the basal ganglia in this process?", "options": ["To store the learned memory of the movement.", "To receive sensory feedback about the movement.", "To initiate the desire to perform the movement.", "To refine the motor command and ensure smooth, precise execution."], "correct": "D", "rationale": {"A": "A is the cerebellum's function. B is the somatosensory cortex's function. C involves more complex limbic and frontal lobe interactions.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture uses an analogy where the primary motor cortex is the \"boss\" giving a command, and the basal ganglia and cerebellum refine it. It notes that damage to these structures leads to movements that \"lack precision.\""}}, {"id": 382, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Which of the following is an example of an intrinsic, neoplastic etiology of disease?", "options": ["An autoimmune disorder like rheumatoid arthritis.", "A bacterial infection causing sepsis.", "A mutation in a cell leading to the development of lung cancer.", "Renal failure caused by a nephrotoxic drug."], "correct": "C", "rationale": {"A": "A is intrinsic but immunologic, not neoplastic. B is extrinsic and infectious. D is iatrogenic/extrinsic.", "B": "This option is incorrect.", "C": "Intrinsic means the cause is from within the body. Neoplastic refers to cancer. A cellular mutation is an intrinsic event, and cancer is a neoplastic process.", "D": "This option is incorrect."}}, {"id": 383, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Why does the sympathetic nervous system cause vasoconstriction in visceral blood vessels but vasodilation in blood vessels of skeletal muscle?", "options": ["Both vessel types have the same receptor, but the downstream signaling is different.", "Visceral vessels have alpha-1 receptors that cause constriction, while skeletal muscle vessels have beta-2 receptors that cause dilation.", "Norepinephrine is released to visceral vessels, while epinephrine is released to skeletal muscle vessels.", "It is a dose-dependent effect; low levels cause dilation while high levels cause constriction."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect explanations for this well-defined receptor-specific phenomenon.", "B": "The lecture explains that the differential effect is due to different receptor subtypes. Visceral vessels primarily have alpha-1 receptors, which cause vasoconstriction. Blood vessels perfusing skeletal muscle have beta-2 receptors, which cause vasodilation, shunting blood to muscles during a fight-or-flight response.", "C": "A, C, and D are incorrect explanations for this well-defined receptor-specific phenomenon.", "D": "A, C, and D are incorrect explanations for this well-defined receptor-specific phenomenon."}}, {"id": 384, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with severe heart failure cannot pump blood effectively, causing blood to \"back up\" in the venous system. This would directly increase which Starling force, leading to edema?", "options": ["Interstitial oncotic pressure", "Capillary blood pressure", "Capillary oncotic pressure", "Interstitial hydrostatic pressure"], "correct": "B", "rationale": {"A": "A, C, and D are other Starling forces but are not the one directly increased by venous backup.", "B": "Venous obstruction or backup, as seen in heart failure, prevents blood from effectively leaving the capillary beds. This increases the pressure inside the capillaries (capillary blood pressure), which is a \"pushing\" force that drives fluid out into the interstitial space, causing edema.", "C": "A, C, and D are other Starling forces but are not the one directly increased by venous backup.", "D": "A, C, and D are other Starling forces but are not the one directly increased by venous backup."}}, {"id": 385, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "All of the following are direct physiological effects of a surge in cortisol during an acute stress response EXCEPT:", "options": ["Increased blood glucose levels.", "Suppression of inflammatory and immune responses.", "Increased neural excitability.", "Enhanced bone formation and calcium storage."], "correct": "D", "rationale": {"A": "A, B, and C are all explicitly stated effects of cortisol.", "B": "A, B, and C are all explicitly stated effects of cortisol.", "C": "A, B, and C are all explicitly stated effects of cortisol.", "D": "A, B, and C are all explicitly stated effects of cortisol."}}, {"id": 386, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A drug that blocks all nicotinic acetylcholine receptors would have what effect on the autonomic nervous system?", "options": ["It would block neurotransmission at the target organs of the parasympathetic system only.", "It would block neurotransmission between preganglionic and postganglionic neurons in both the sympathetic and parasympathetic systems.", "It would block neurotransmission at the target organs of the sympathetic system only.", "It would have no effect on the autonomic nervous system, only on skeletal muscle."], "correct": "B", "rationale": {"A": "A and C are incomplete. D is incorrect because while nicotinic receptors are also at the neuromuscular junction, blocking them would profoundly affect the ANS as well.", "B": "Nicotinic acetylcholine receptors are located at the synapse between the preganglionic and postganglionic neurons in both the sympathetic and parasympathetic divisions. Blocking these receptors would disrupt the signal transmission for both branches of the autonomic nervous system.", "C": "A and C are incomplete. D is incorrect because while nicotinic receptors are also at the neuromuscular junction, blocking them would profoundly affect the ANS as well.", "D": "A and C are incomplete. D is incorrect because while nicotinic receptors are also at the neuromuscular junction, blocking them would profoundly affect the ANS as well."}}, {"id": 387, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The somatotopic map (homunculus) shows disproportionately large areas of the cortex for the hands and face. This indicates that these areas have:", "options": ["A greater density of sensory receptors and require finer motor control.", "Larger muscles than other parts of the body.", "A more direct connection to the cerebellum.", "A less significant role in interacting with the environment."], "correct": "A", "rationale": {"A": "The lecture explains that the size of the body part on the map represents the amount of cortex dedicated to it. Large representations for the hands and face reflect their high degree of sensory sensitivity and the need for complex, fine motor control.", "B": "B is not necessarily true (e.g., thigh muscles are large but have a small representation). C and D are incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 388, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The functional difference between a widely divergent neural circuit and a spatially focused circuit is that a divergent circuit is better suited for:", "options": ["Executing precise, task-oriented motor commands.", "Relaying a sensory signal from a specific point on the skin.", "Modulating the overall state of excitability across multiple brain regions, such as in sleep-wake cycles.", "Rapid, simple reflexes at the spinal cord level."], "correct": "C", "rationale": {"A": "A, B, and D are functions better suited to spatially focused circuits.", "B": "A, B, and D are functions better suited to spatially focused circuits.", "C": "The lecture explains that widely divergent patterns, where a few cells project to many widespread targets, are important for modulating the overall level of excitation in the brain. It uses sleep-wake cycles and attention as key examples.", "D": "A, B, and D are functions better suited to spatially focused circuits."}}, {"id": 389, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "An enzyme deficiency in one of the steps of steroid hormone biosynthesis can lead to the overproduction of intermediates. This is because:", "options": ["The body increases cholesterol uptake to compensate.", "The final hormone is not being produced, so negative feedback on the hypothalamus and pituitary is lost.", "The deficient enzyme starts working in reverse.", "Other steroid hormones are converted into the missing intermediates."], "correct": "B", "rationale": {"A": "A, C, and D are not the correct mechanism for the buildup of precursors.", "B": "In hierarchical control, the final steroid hormone (e.g., cortisol) provides negative feedback to the hypothalamus (gland 1) and pituitary (gland 2). If the final hormone cannot be produced due to an enzyme deficiency, this feedback is lost, leading to over-secretion of CRH and ACTH, which then drives the accumulation of the intermediate precursors before the enzyme block.", "C": "A, C, and D are not the correct mechanism for the buildup of precursors.", "D": "A, C, and D are not the correct mechanism for the buildup of precursors."}}, {"id": 390, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with an aldosterone-secreting tumor develops hypertension and hypokalemia. The hypertension is a direct result of aldosterone's action to:", "options": ["Increase sodium and water retention by the kidneys.", "Cause systemic vasodilation.", "Stimulate the heart to beat more forcefully.", "Increase potassium retention, which raises osmotic pressure."], "correct": "A", "rationale": {"A": "The lecture identifies aldosterone as a mineralocorticoid whose major action, part of the RAAS, is to act on the kidneys to cause an \"increase in salt and water retention,\" which directly increases blood volume and, therefore, blood pressure.", "B": "B is the opposite of its effect on blood vessels. C is not its primary mechanism. D is incorrect; it causes potassium excretion.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 391, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "How does apoptosis serve as a protective mechanism against cancer?", "options": ["It stimulates the immune system to attack abnormal cells.", "It allows the cell to repair DNA damage before it can lead to mutations.", "It is a programmed pathway that can be triggered when a cell detects excessive, unrepairable DNA errors.", "It causes rapid inflammation to wall off potentially cancerous cells."], "correct": "C", "rationale": {"A": "A and B are functions of the immune system and DNA repair proteins, respectively, though they can lead to apoptosis. D is incorrect; apoptosis is a non-inflammatory process.", "B": "A and B are functions of the immune system and DNA repair proteins, respectively, though they can lead to apoptosis. D is incorrect; apoptosis is a non-inflammatory process.", "C": "The lecture on apoptosis explains that the process is designed as a protection from cells vulnerable to becoming cancerous. It is triggered when the cell \"notices lots of DNA errors,\" initiating a programmed self-destruction to eliminate the potentially mutated cell.", "D": "A and B are functions of the immune system and DNA repair proteins, respectively, though they can lead to apoptosis. D is incorrect; apoptosis is a non-inflammatory process."}}, {"id": 392, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "Which statement accurately contrasts the central and peripheral endocrine glands?", "options": ["Central glands (e.g., hypothalamus, pituitary) are part of the CNS and often control peripheral glands.", "Peripheral glands are always dedicated endocrine structures, while central glands have mixed functions.", "Central glands release steroid hormones, while peripheral glands release peptide hormones.", "Central glands are controlled by the autonomic nervous system, while peripheral glands are not."], "correct": "A", "rationale": {"A": "The lecture distinguishes between central endocrine glands (hypothalamus, pituitary, pineal), which are part of the brain, and peripheral glands (thyroid, adrenals, etc.). The central glands often release tropic hormones that regulate the activity of the peripheral glands.", "B": "B is incorrect; many peripheral glands have mixed functions (e.g., pancreas, kidneys). C is an incorrect generalization. D is incorrect; both are subject to complex controls.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 393, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient in a state of alkalosis (high blood pH) may become hypokalemic. What is the underlying cellular mechanism?", "options": ["To buffer the alkalosis, hydrogen ions move out of cells, and potassium ions move into cells to maintain charge balance.", "The kidneys begin to excrete large amounts of potassium.", "Insulin is released in response to alkalosis, driving potassium into cells.", "The Na+/K+ pump reverses its direction in response to high pH."], "correct": "A", "rationale": {"A": "B, C, and D describe incorrect mechanisms for this specific pH-induced ion shift.", "B": "B, C, and D describe incorrect mechanisms for this specific pH-induced ion shift.", "C": "B, C, and D describe incorrect mechanisms for this specific pH-induced ion shift.", "D": "B, C, and D describe incorrect mechanisms for this specific pH-induced ion shift."}}, {"id": 394, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The language circuit involves Wernicke's area for comprehension and Broca's area for production. The bidirectional connection between them is crucial for:", "options": ["Hearing the words that someone is speaking.", "Moving the muscles of the tongue and jaw to form words.", "The \"internal editing\" process, ensuring that the speech produced is coherent and contextually appropriate.", "Combining visual cues with auditory input."], "correct": "C", "rationale": {"A": "A is the function of the primary auditory cortex. B is the function of the primary motor cortex, which receives its command from Broca's area. D is the role of the angular gyrus.", "B": "This option is incorrect.", "C": "The lecture describes the connection between Wernicke's and Broca's areas as \"bidirectional to facilitate the integration of speech formation, comprehension, & editing.\" This allows for an \"internal dialogue\" to ensure the language being generated is meaningful and appropriate.", "D": "This option is incorrect."}}, {"id": 395, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "What is the primary difference in cellular response between hypertrophy and hyperplasia?", "options": ["Hypertrophy is an increase in cell size, while hyperplasia is an increase in cell number.", "Hypertrophy is always pathological, while hyperplasia is always physiological.", "Hypertrophy occurs in response to hormonal stimulation, while hyperplasia occurs in response to increased functional demand.", "Hypertrophy is reversible, while hyperplasia is irreversible."], "correct": "A", "rationale": {"A": "The lecture and diagrams clearly define hypertrophy as an increase in the size of cells and hyperplasia as an increase in the number of cells.", "B": "B is incorrect; both can be physiological or pathological. C is an incorrect generalization; both can be caused by either stimulus. D is incorrect; both are generally reversible if the stimulus is removed in time.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 396, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "The serotonin neurotransmitter system, originating in the raphe nuclei, is implicated in all of the following functions EXCEPT:", "options": ["Regulation of mood.", "Control of sleep-wake cycles.", "Regulation of fine motor movements and storing motor patterns.", "Modulation of motor excitation and temperature control."], "correct": "C", "rationale": {"A": "A, B, and D are all functions associated with the serotonin system in the lecture.", "B": "A, B, and D are all functions associated with the serotonin system in the lecture.", "C": "The lecture attributes the regulation of mood, sleep-wake cycles, motor excitation, and temperature to the serotonin system. The control and storage of fine motor patterns is explicitly described as a primary function of the cerebellum.", "D": "A, B, and D are all functions associated with the serotonin system in the lecture."}}, {"id": 397, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A pharmaceutical drug designed to treat hypertension is a lipid-soluble molecule that must act within the brain. Its lipid solubility allows it to:", "options": ["Bind to plasma proteins, extending its half-life.", "Be transported into the brain via specific carrier-mediated transporters.", "Passively diffuse across the multiple membrane layers of the blood-brain barrier.", "Activate G-protein coupled receptors on the surface of brain capillaries."], "correct": "C", "rationale": {"A": "A is a property of many drugs but doesn't explain how it crosses the BBB. B and D describe mechanisms for substances that cannot easily diffuse across the membrane.", "B": "This option is incorrect.", "C": "The lecture explains that the blood-brain barrier is primarily composed of cell membranes with tight junctions. Therefore, for a substance to cross, it must be lipid-soluble to passively diffuse through these lipid bilayers.", "D": "This option is incorrect."}}, {"id": 398, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "An infant exposed to cold temperatures will have a stimulated hypothalamic-pituitary-thyroid axis. What is the ultimate purpose of this response?", "options": ["To increase growth hormone release for development.", "To increase thyroid hormone levels, which boosts metabolic rate and heat production.", "To release cortisol as a general stress response.", "To conserve heat by causing peripheral vasoconstriction via the autonomic nervous system."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect pathways or outcomes for this specific stimulus.", "B": "The lecture diagram of the thyroid axis explicitly shows that cold in infants is a stimulus for the hypothalamus to release TRH. The ultimate effect of T3/T4 is an increase in \"Metabolic rate and heat production.\"", "C": "A, C, and D are incorrect pathways or outcomes for this specific stimulus.", "D": "A, C, and D are incorrect pathways or outcomes for this specific stimulus."}}, {"id": 399, "category": ["MIxed \"more difficult\" set 1 Exam Questions"], "stem": "A patient with chronic kidney disease develops metabolic acidosis because their kidneys fail to excrete H+ and reabsorb HCO3-. This acidosis can cause hyperkalemia. How would this secondary hyperkalemia then affect the resting membrane potential of their excitable cells, such as neurons and muscle cells?", "options": ["It would have no effect on the resting membrane potential.", "It would make the resting membrane potential more negative (hyperpolarized), making them less excitable.", "It would make the resting membrane potential less negative (partially depolarized), bringing it closer to the threshold for firing.", "It would cause the inactivation of all voltage-gated sodium channels."], "correct": "C", "rationale": {"A": "A is incorrect; electrolyte imbalances profoundly affect membrane potential. B describes the effect of hypokalemia. D is an event that occurs at the peak of the action potential, not an effect on the resting state.", "B": "This option is incorrect.", "C": "This is a two-step question. First, metabolic acidosis leads to hyperkalemia (as explained in question 12). Second, hyperkalemia (increased extracellular K+) reduces the concentration gradient for K+ to exit the cell. This decreased efflux of positive charge makes the resting membrane potential less negative (e.g., moving from -92mV equilibrium potential closer to -70mV), thus bringing it closer to the threshold for firing.", "D": "This option is incorrect."}}, {"id": 400, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient in a cast for six weeks experiences disuse atrophy of the leg muscles. This morphological change is primarily the result of which underlying cellular processes?", "options": ["A decrease in cell number (hypoplasia) and a switch to anaerobic metabolism.", "An increase in cellular digestion of organelles and a decrease in protein synthesis.", "The replacement of muscle cells with less mature squamous cells (metaplasia).", "Cellular swelling due to failure of the Na+/K+ pump."], "correct": "A", "rationale": {"A": "A is incorrect; atrophy is a decrease in size, not number. C is incorrect; this describes metaplasia. D describes an early stage of hypoxic injury, not the organized shrinking of atrophy.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 401, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient is diagnosed with a pituitary tumor that is secreting excessive amounts of TSH. What would be the expected levels of TRH and T3/T4?", "options": ["High TRH, High T3/T4", "Low TRH, High T3/T4", "High TRH, Low T3/T4", "Low TRH, Low T3/T4"], "correct": "A", "rationale": {"A": "a) The adrenal medulla is controlled by postganglionic sympathetic neurons, while the cortex is controlled by the hypothalamus.", "B": "b) The adrenal medulla is directly innervated by a preganglionic sympathetic neuron, bypassing the two-neuron chain, while the cortex is controlled via the HPA axis. Rationale for Correct Answer: The lecture on the autonomic nervous system highlights the control of the adrenal medulla as an exception. A preganglionic sympathetic neuron directly innervates it, causing the release of epinephrine. In contrast, the adrenal cortex is controlled hormonally by the HPA (Hypothalamic-Pituitary-Adrenal) axis via CRH and ACTH. Rationale for Incorrect Answers: A is incorrect; it's a preganglionic neuron. C has the hormone types reversed. D has the nervous system divisions reversed.", "C": "c) The adrenal medulla releases steroid hormones, while the adrenal cortex releases catecholamines.", "D": "d) The adrenal medulla is part of the parasympathetic nervous system, while the cortex is part of the sympathetic nervous system."}}, {"id": 402, "category": ["\"More difficult\" Exam Questions 2"], "stem": "How does the nervous system's control of the adrenal medulla differ from the hierarchical control of the adrenal cortex?", "options": ["The adrenal medulla is controlled by postganglionic sympathetic neurons, while the cortex is controlled by the hypothalamus.", "The adrenal medulla is directly innervated by a preganglionic sympathetic neuron, bypassing the two-neuron chain, while the cortex is controlled via the HPA axis.", "The adrenal medulla releases steroid hormones, while the adrenal cortex releases catecholamines.", "The adrenal medulla is part of the parasympathetic nervous system, while the cortex is part of the sympathetic nervous system."], "correct": "B", "rationale": {"A": "A is incorrect; it's a preganglionic neuron. C has the hormone types reversed. D has the nervous system divisions reversed.", "B": "The lecture on the autonomic nervous system highlights the control of the adrenal medulla as an exception. A preganglionic sympathetic neuron directly innervates it, causing the release of epinephrine. In contrast, the adrenal cortex is controlled hormonally by the HPA (Hypothalamic-Pituitary-Adrenal) axis via CRH and ACTH.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 403, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with chronic renal failure has metabolic acidosis and a serum potassium of 5.8 mEq/L (hyperkalemia). How does this hyperkalemia affect the resting membrane potential of his neurons?", "options": ["It makes the resting potential more negative (hyperpolarizes it), increasing the stimulus needed for an action potential.", "It makes the resting potential less negative (depolarizes it), bringing it closer to the threshold for an action potential.", "It has no effect on the resting membrane potential but shortens the absolute refractory period.", "It blocks sodium channels, preventing depolarization."], "correct": "A", "rationale": {"A": "a) The patient will consciously feel the hammer tap but will not be aware that their leg kicked.", "B": "b) The reflex occurs, but the patient will have no conscious awareness of either the stimulus or the motor response. Rationale for Correct Answer: The patellar reflex arc is contained within the L2-L4 spinal segments. A T6 transection severs the ascending sensory pathways to the brain and the descending motor pathways from the brain. Therefore, the reflex will occur autonomously within the intact lumbar spinal cord, but no sensory information about the tap or the kick can reach the brain for conscious perception. Rationale for Incorrect Answers: A and D are incorrect because no sensory information can ascend past the injury. C is incorrect; a key feature of this specific reflex is its independence from brain input.", "C": "c) Descending motor tracts from the brain must be partially intact for the reflex to occur.", "D": "d) The reflex demonstrates that the dorsal root ganglia at L2-L4 are damaged."}}, {"id": 404, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The patellar reflex is tested on a patient with a complete spinal cord transection at T6. The reflex is present. The patient is not looking at their leg. Which statement is true?", "options": ["The patient will consciously feel the hammer tap but will not be aware that their leg kicked.", "The reflex occurs, but the patient will have no conscious awareness of either the stimulus or the motor response.", "Descending motor tracts from the brain must be partially intact for the reflex to occur.", "The reflex demonstrates that the dorsal root ganglia at L2-L4 are damaged."], "correct": "B", "rationale": {"A": "A and D are incorrect because no sensory information can ascend past the injury. C is incorrect; a key feature of this specific reflex is its independence from brain input.", "B": "The patellar reflex arc is contained within the L2-L4 spinal segments. A T6 transection severs the ascending sensory pathways to the brain and the descending motor pathways from the brain. Therefore, the reflex will occur autonomously within the intact lumbar spinal cord, but no sensory information about the tap or the kick can reach the brain for conscious perception.", "C": "This option is incorrect.", "D": "A and D are incorrect because no sensory information can ascend past the injury. C is incorrect; a key feature of this specific reflex is its independence from brain input."}}, {"id": 405, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A drug is developed that specifically blocks the inactivation gate of voltage-gated sodium channels, preventing it from closing after depolarization. What effect would this have on the action potential?", "options": ["It would prevent the cell from reaching the threshold potential.", "The depolarization phase would be shorter and weaker.", "It would prevent the cell from repolarizing, prolonging the action potential indefinitely.", "The cell would become permanently hyperpolarized."], "correct": "A", "rationale": {"A": "a) Both GH and IGF-1 increase blood glucose to provide energy for growth.", "B": "b) GH has an anti-insulin effect, raising blood glucose, while the subsequent rise in IGF-1 has an insulin-like effect, promoting glucose uptake by tissues. Rationale for Correct Answer: The lecture states that GH has \"anti-insulin effects\" and tends to \"increase blood sugar.\" Following this, the rise of IGF-1, or \"insulin-like growth factor,\" has the opposite effect, helping to \"bring down blood glucose\" by promoting its uptake into cells for growth. This creates a balanced metabolic cycle during sleep. Rationale for Incorrect Answers: A is incorrect as their effects on glucose are opposing. C is incorrect; IGF-1 provides negative feedback that inhibits, not stimulates, GH release. D is incorrect as GH and IGF-1 promote lean muscle mass and decrease adiposity.", "C": "c) IGF-1 provides negative feedback to stimulate the next pulse of GH.", "D": "d) GH promotes fat storage, while IGF-1 promotes fat breakdown."}}, {"id": 406, "category": ["\"More difficult\" Exam Questions 2"], "stem": "Which of the following best contrasts the cellular events of apoptosis and necrosis?", "options": ["Apoptosis involves cellular swelling and inflammation, while necrosis involves cell shrinkage and phagocytosis by immune cells.", "Necrosis is a programmed process to eliminate cancerous cells, while apoptosis is uncontrolled cell death from external injury.", "Apoptosis involves a controlled implosion and packaging of the cell into apoptotic bodies, while necrosis involves swelling, loss of membrane integrity, and inflammation.", "Necrosis involves the activation of DNA repair proteins, while apoptosis involves the release of lysosomal enzymes."], "correct": "C", "rationale": {"A": "A and B have the descriptions reversed. D is incorrect; apoptosis involves caspases that dismantle the cell, not lysosomal release, and necrosis is a failure of repair.", "B": "A and B have the descriptions reversed. D is incorrect; apoptosis involves caspases that dismantle the cell, not lysosomal release, and necrosis is a failure of repair.", "C": "The lecture explicitly contrasts these two forms of cell death. Necrosis is described as the cell \"exploding,\" with swelling and loss of membrane integrity leading to inflammation. Apoptosis is described as the cell \"imploding,\" shrinking and packaging itself into non-inflammatory apoptotic bodies for clean removal.", "D": "A and B have the descriptions reversed. D is incorrect; apoptosis involves caspases that dismantle the cell, not lysosomal release, and necrosis is a failure of repair."}}, {"id": 407, "category": ["\"More difficult\" Exam Questions 2"], "stem": "The release of growth hormone (GH) is pulsatile and occurs predominantly during Stage 2 non-REM sleep. Following a pulse of GH, the liver releases IGF-1. What is the metabolic relationship between these two hormones during the sleep cycle?", "options": ["Both GH and IGF-1 increase blood glucose to provide energy for growth.", "GH has an anti-insulin effect, raising blood glucose, while the subsequent rise in IGF-1 has an insulin-like effect, promoting glucose uptake by tissues.", "IGF-1 provides negative feedback to stimulate the next pulse of GH.", "GH promotes fat storage, while IGF-1 promotes fat breakdown."], "correct": "B", "rationale": {"A": "A is incorrect as their effects on glucose are opposing. C is incorrect; IGF-1 provides negative feedback to inhibit GH release. D is incorrect; GH tends to decrease adiposity and increase lean muscle mass.", "B": "The lecture states that GH has \"anti-insulin effects\" and tends to \"increase blood sugar.\" It then explains that IGF stands for \"insulin-like growth factor\" and that it will \"tend to bring down blood glucose\" by allowing cells to take it up for growth. This creates a cyclical balance of glucose availability and utilization throughout the night.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 408, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient with a rare genetic disorder lacks the enzyme necessary to convert tyrosine into dopamine, norepinephrine, and epinephrine. This patient would likely exhibit symptoms related to the dysfunction of all the following EXCEPT:", "options": ["The motor control circuit originating in the substantia nigra.", "The reward pathway originating in the ventral tegmental area.", "The mood and attention-regulating system originating in the raphe nuclei.", "The \"fight-or-flight\" response mediated by the sympathetic nervous system."], "correct": "A", "rationale": {"A": "Dopamine, norepinephrine, and epinephrine are all catecholamines derived from tyrosine. Dopamine is key for the substantia nigra motor circuit and the VTA reward pathway. Norepinephrine is the key neurotransmitter for the sympathetic nervous system. The system originating in the raphe nuclei is the serotonin system, which uses serotonin (derived from tryptophan), not a catecholamine.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 409, "category": ["\"More difficult\" Exam Questions 2"], "stem": "A patient suffers a stroke that damages the angular gyrus but spares Wernicke's and Broca's areas. What deficit would be most characteristic of this specific injury?", "options": ["The inability to comprehend spoken words.", "The inability to physically form words.", "The inability to integrate visual and auditory information to understand c
