e.", "D": "d) Is only found in the extracellular fluid."}}, {"id": 484, "category": ["Exam Questions \"Very difficult\""], "stem": "The concept of \"osmolyte balance\" is critical for maintaining cell volume. An osmolyte is a solute that:", "options": ["Can freely cross the semi-permeable membrane.", "Cannot cross the semi-permeable membrane and thus exerts an osmotic pressure.", "Actively transports water across the membrane.", "Is only found in the extracellular fluid."], "correct": "C", "rationale": {"A": "A, B, and D are all valid categories or descriptions of etiology.", "B": "A, B, and D are all valid categories or descriptions of etiology.", "C": "Etiology is the cause of a disease. Pathogenesis is the mechanism of development of the disease following the initial cause. Therefore, the physiologic development of the disease over time is the definition of pathogenesis, not etiology.", "D": "A, B, and D are all valid categories or descriptions of etiology."}}, {"id": 485, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient has a genetic mutation causing their voltage-gated potassium channels to be slow to close during the repolarization phase of an action potential. What effect would this have on the shape of the action potential?", "options": ["It would cause a more pronounced and prolonged hyperpolarization (afterpotential).", "It would prevent the cell from depolarizing.", "The peak of the action potential would be significantly higher.", "The absolute refractory period would be eliminated."], "correct": "A", "rationale": {"A": "a) It is the only layer that receives direct innervation from the sympathetic nervous system.", "B": "b) It is the only layer that expresses the specific enzyme (aldosterone synthase) required for the final step in aldosterone synthesis. Rationale for Correct Answer: The lecture states that the difference in the final product of each layer (glomerulosa, fasciculata, reticularis) is determined by the presence of a specific, required enzyme in that layer. Aldosterone synthase is unique to the zona glomerulosa. Rationale for Incorrect Answers: A is incorrect; the cortex is hormonally controlled. C is incorrect; all layers need cholesterol. D is incorrect; the fasciculata (cortisol) is the primary target of ACTH.", "C": "c) It is the only layer that has LDL receptors to take up cholesterol.", "D": "d) It is the only layer that is stimulated by ACTH."}}, {"id": 486, "category": ["Exam Questions \"Very difficult\""], "stem": "The adrenal cortex has three layers. Why can only the zona glomerulosa produce aldosterone?", "options": ["It is the only layer that receives direct innervation from the sympathetic nervous system.", "It is the only layer that expresses the specific enzyme (aldosterone synthase) required for the final step in aldosterone synthesis.", "It is the only layer that has LDL receptors to take up cholesterol.", "It is the only layer that is stimulated by ACTH."], "correct": "D", "rationale": {"A": "A is a sympathetic function. B involves the accessory nerve (XI). C involves the trigeminal nerve (V).", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture emphasizes that the vagus nerve carries about 70% of the body's parasympathetic outflow, which governs \"rest-and-digest\" functions. Therefore, damage to this nerve would significantly impair the baseline regulation of the heart, lungs, and most of the digestive tract."}}, {"id": 487, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is given a drug that is a pure dopamine agonist. Which two distinct effects might be observed, based on the major dopaminergic pathways in the brain?", "options": ["Disruption of sleep-wake cycles and suppression of appetite.", "Decreased anxiety and enhanced memory consolidation.", "Modulation of motor movements and activation of the reward/motivation system.", "Increased attention and a decrease in heart rate."], "correct": "A", "rationale": {"A": "a) A patient complains of pain, and the nurse documents \"patient reports pain.\"", "B": "b) A patient complains of feeling hot, and the nurse measures a temperature of 102.2\u00b0F. Rationale for Correct Answer: \"Feeling hot\" is a subjective symptom. Measuring the temperature (102.2\u00b0F) converts the subjective complaint into an objective, verifiable sign (fever), allowing the physician to quantify the manifestation. Rationale for Incorrect Answers: A is simply documentation of a symptom. C and D are interventions, not conversions of symptoms to signs.", "C": "c) A patient complains of nausea, and the nurse administers an anti-emetic.", "D": "d) A patient complains of fatigue, and the nurse suggests they get more rest."}}, {"id": 488, "category": ["Exam Questions \"Very difficult\""], "stem": "The lecture describes the nervous system as \"hardwired\" and the endocrine system as \"wireless.\" This analogy highlights that:", "options": ["The nervous system is faster but less complex than the endocrine system.", "The nervous system relies on specific, physical synaptic connections, while the endocrine system uses hormones broadcast through the bloodstream.", "The nervous system is not capable of plasticity, while the endocrine system is.", "The endocrine system can only cause inhibitory effects, while the nervous system can cause both excitatory and inhibitory effects."], "correct": "B", "rationale": {"A": "A is a direct effect of GH itself. C is a feedback action of IGFs. D is the opposite of the anabolic effects of the GH/IGF axis.", "B": "The lecture materials and diagrams show that while GH has some direct effects, it also stimulates the liver to produce somatomedins (IGFs). The diagram then shows these IGFs acting on tissues to cause \"Increased organ size\" and acting on bone to cause \"Increased linear growth.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 489, "category": ["Exam Questions \"Very difficult\""], "stem": "How does the body store a lipid-soluble hormone like thyroid hormone for later release, given that it cannot be contained within a simple vesicle?", "options": ["It is stored extracellularly in adipose tissue.", "It is synthesized on demand and never stored.", "It is stored within the thyroid follicle as part of a large, water-soluble protein molecule (thyroglobulin).", "It is bound to albumin within the bloodstream and released slowly over time."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect explanations for this phenomenon.", "B": "The lecture uses vasopressin (ADH) as a prime example of this principle. It explains that the same molecule acts as \"vasopressin\" by binding to V1 receptors on blood vessels and as \"ADH\" by binding to V2 receptors on kidney tubules. The distinct effects are entirely dependent on the receptor subtype and its location.", "C": "A, C, and D are incorrect explanations for this phenomenon.", "D": "A, C, and D are incorrect explanations for this phenomenon."}}, {"id": 490, "category": ["Exam Questions \"Very difficult\""], "stem": "Why might a patient with chronically elevated cortisol levels (Cushing's syndrome) present with central obesity but wasting of the limbs?", "options": ["Cortisol promotes glucose uptake in central fat cells but inhibits it in peripheral tissues.", "Cortisol's effects on fat distribution and protein catabolism lead to the redistribution of fat to the trunk and face, and the breakdown of muscle protein in the limbs.", "The limbs become atrophied due to disuse, while the central obesity is from overeating.", "This is an inflammatory response, with fluid accumulating centrally and being drawn from the limbs."], "correct": "C", "rationale": {"A": "A is a function of Wernicke's area. B is a function of the somatosensory cortex. D is a function of the hypothalamus.", "B": "This option is incorrect.", "C": "The lecture identifies the cerebellum as crucial for \"learned motor movements\" and storing \"motor patterns.\" Damage to the cerebellum does not cause paralysis but leads to ataxia\u2014a lack of voluntary coordination of muscle movements, resulting in clumsiness, imprecision, and balance problems.", "D": "This option is incorrect."}}, {"id": 491, "category": ["Exam Questions \"Very difficult\""], "stem": "The difference between a sign and a symptom is their objectivity. Which of the following represents a physician converting a patient's symptom into a measurable sign?", "options": ["A patient complains of pain, and the nurse documents \"patient reports pain.\"", "A patient complains of feeling hot, and the nurse measures a temperature of 102.2\u00b0F.", "A patient complains of nausea, and the nurse administers an anti-emetic.", "A patient complains of fatigue, and the nurse suggests they get more rest."], "correct": "B", "rationale": {"A": "A is incorrect; their role is to buffer, not eliminate. C is only half of their function. D is a downstream consequence of pH changes, not the buffer's direct action.", "B": "The lecture defines buffers as weak acids and bases that can \"absorb excess H+ or OH- thereby preventing fluctuations in pH.\" Their function is not to eliminate acids but to stabilize the pH by binding or releasing H+ as needed.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 492, "category": ["Exam Questions \"Very difficult\""], "stem": "A patient is given a drug that selectively blocks muscarinic acetylcholine receptors. This would interfere with which component of the autonomic nervous system?", "options": ["Signal transmission from preganglionic to postganglionic neurons in both divisions.", "Signal transmission from postganglionic parasympathetic neurons to their target organs.", "Signal transmission from postganglionic sympathetic neurons to their target organs.", "Signal transmission at the neuromuscular junction."], "correct": "A", "rationale": {"A": "The lecture confirms that muscarinic receptor         // App State
        let categories = {};
        let selectedCategory = 'All Questions';
        let isRandom = false;
        let sessionQuestions = [];
        let currentIndex = 0;
        
        // Global persistent state keyed by unique question 'id'
        let globalUserAnswers = {}; // q.id -> selected option index (0-3)
        let globalChecked = {};     // q.id -> boolean

        function init() {
            categories = {'All Questions': questionData.length};
            questionData.forEach(q => {
                q.category.forEach(c => {
                    categories[c] = (categories[c] || 0) + 1;
                });
            });

            renderCategories();

            document.getElementById('mode-sequential').onclick = (e) => {
                isRandom = false;
                e.target.classList.add('active');
                document.getElementById('mode-random').classList.remove('active');
            };
            document.getElementById('mode-random').onclick = (e) => {
                isRandom = true;
                e.target.classList.add('active');
                document.getElementById('mode-sequential').classList.remove('active');
            };
        }

        function renderCategories() {
            const catContainer = document.getElementById('categories-container');
            catContainer.innerHTML = '';
            
            for (let [cat, count] of Object.entries(categories)) {
                let wrapper = document.createElement('div');
                wrapper.className = 'category-item';
                
                let btn = document.createElement('button');
                btn.className = 'category-btn' + (cat === selectedCategory ? ' active' : '');
                btn.innerHTML = `<span>${cat}</span> <span class="badge">${count}</span>`;
                btn.onclick = () => {
                    selectedCategory = cat;
                    renderCategories();
                };
                wrapper.appendChild(btn);
                
                let resetBtn = document.createElement('button');
                resetBtn.className = 'reset-btn';
                resetBtn.innerText = 'Reset Set';
                resetBtn.title = 'Clear progress for this set';
                resetBtn.onclick = (e) => {
                    e.stopPropagation();
                    resetSet(cat);
                };
                wrapper.appendChild(resetBtn);
                
                catContainer.appendChild(wrapper);
            }
        }
        
        function resetSet(cat) {
            let qs = cat === 'All Questions' ? questionData : questionData.filter(q => q.category.includes(cat));
            let clearedCount = 0;
            qs.forEach(q => {
                if (globalUserAnswers[q.id] !== undefined || globalChecked[q.id]) {
                    delete globalUserAnswers[q.id];
                    delete globalChecked[q.id];
                    clearedCount++;
                }
            });
            if (clearedCount > 0) {
                alert(`Reset progress for ${clearedCount} questions in "${cat}".`);
            } else {
                alert(`No progress to reset for "${cat}".`);
            }
        }

        function startPractice() {
            if (selectedCategory === 'All Questions') {
                sessionQuestions = [...questionData];
            } else {
                sessionQuestions = questionData.filter(q => q.category.includes(selectedCategory));
            }

            if (isRandom) {
                sessionQuestions.sort(() => Math.random() - 0.5);
            }

            currentIndex = 0;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            renderQuestion();
        }

        function renderQuestion() {
            const q = sessionQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Question ${currentIndex + 1} / ${sessionQuestions.length}`;
            document.getElementById('question-category').innerText = q.category[0];
            document.getElementById('question-text').innerText = q.stem;
            
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            let isChecked = globalChecked[q.id];
            let selectedOpt = globalUserAnswers[q.id];
            let correctLetter = q.correct.trim().toUpperCase();
            
            q.options.forEach((opt, idx) => {
                let wrapper = document.createElement('div');
                wrapper.className = 'option-wrapper';
                
                let btn = document.createElement('button');
                let letter = String.fromCharCode(65 + idx); // A, B, C, D
                
                btn.className = 'option-btn';
                btn.innerText = `${letter}. ${opt}`;
                
                if (selectedOpt === idx) btn.classList.add('selected');
                
                let ratDiv = document.createElement('div');
                ratDiv.className = 'rationale-text';
                ratDiv.innerText = q.rationale[letter] || '';
                
                if (isChecked) {
                    btn.disabled = true;
                    if (letter === correctLetter) {
                        btn.classList.add('correct');
                        ratDiv.style.borderLeftColor = 'var(--correct-text)';
                    } else if (selectedOpt === idx && letter !== correctLetter) {
                        btn.classList.add('incorrect');
                        ratDiv.style.borderLeftColor = 'var(--incorrect-text)';
                    }
                    ratDiv.style.display = 'block';
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                
                wrapper.appendChild(btn);
                wrapper.appendChild(ratDiv);
                optsContainer.appendChild(wrapper);
            });

            const checkBtn = document.getElementById('check-btn');

            if (isChecked) {
                checkBtn.disabled = true;
                checkBtn.style.opacity = '0.5';
                checkBtn.innerText = 'Checked';
            } else {
                checkBtn.disabled = selectedOpt === undefined;
                checkBtn.style.opacity = '1';
                checkBtn.innerText = 'Check Answer';
            }

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === sessionQuestions.length - 1;
        }

        function selectOption(idx) {
            const q = sessionQuestions[currentIndex];
            globalUserAnswers[q.id] = idx;
            renderQuestion();
        }

        function checkAnswer() {
            const q = sessionQuestions[currentIndex];
            if (globalUserAnswers[q.id] !== undefined) {
                globalChecked[q.id] = true;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < sessionQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function backToSets() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
        }

        // Run
        init();
    </script>
