 create new proteins. Rationale for Incorrect Answers: A) and B) are the primary mechanisms of water-soluble hormones. D) is not the primary mechanism described.  Question 9: What is the primary purpose of a hierarchical control system, such as the hypothalamic-pituitary-adrenal axis? A. To ensure a rapid, short-lived hormonal response. B. To allow multiple hormones to act on a single target organ simultaneously. C. To provide multiple points of negative feedback for tight regulation of the final hormone. D. To bypass the need for a transport protein in the blood.  C. To provide multiple points of negative feedback for tight regulation of the final hormone. Rationale for Correct Answer: The lecture emphasizes that the value of hierarchical control is in the feedback. The final hormone (hormone 3) provides negative feedback at the levels of gland 2 and gland 1, allowing for very strong and stable control. Rationale for Incorrect Answers: A) is incorrect; this complex system is often used for hormones that need to be steady, not necessarily rapid. B) is not the primary purpose. D) is irrelevant to the function of the hierarchy.  Question 10: The posterior pituitary is not considered a true endocrine gland because it: A. Produces seven different major hormones. B. Is controlled by dopamine inhibition. C. Only synthesizes amino acid-derived hormones. D. Does not synthesize its own hormones but stores and releases hormones made by the hypothalamus.  D. Does not synthesize its own hormones but stores and releases hormones made by the hypothalamus. Rationale for Correct Answer: The lecture explains that the posterior pituitary is just an extension of the hypothalamus, consisting of axon terminals of neurosecretory cells whose cell bodies are in the hypothalamus. It stores and releases oxytocin and vasopressin, but does not make them. Rationale for Incorrect Answers: A) is a characteristic of the anterior pituitary. B) is a control mechanism for prolactin in the anterior pituitary. C) is incorrect.  Question 11: Which hypothalamic hormone is responsible for stimulating the anterior pituitary to release TSH (thyroid-stimulating hormone)? A. CRH (corticotropin-releasing hormone) B. TRH (thyrotropin-releasing hormone) C. GnRH (gonadotropin-releasing hormone) D. GHRH (growth hormone-releasing hormone)  B. TRH (thyrotropin-releasing hormone) Rationale for Correct Answer: The lecture outlines this axis: The hypothalamus releases TRH, which acts on the anterior pituitary to trigger the release of TSH. Rationale for Incorrect Answers: A) stimulates ACTH release. C) stimulates LH/FSH release. D) stimulates GH release.  Question 12: The release of prolactin from the anterior pituitary is predominantly controlled by: A. Stimulation from prolactin-releasing hormone (PRH). B. Inhibition from dopamine released by the hypothalamus. C. Negative feedback from mammary gland milk production. D. Positive feedback from oxytocin.  B. Inhibition from dopamine released by the hypothalamus. Rationale for Correct Answer: The lecture explains that dopamine's inhibitory action is the dominant control over prolactin most of the time, and prolactin levels rise when this dopamine input declines. Rationale for Incorrect Answers: A) PRH is stimulatory, but dopamine inhibition is the dominant, constant control. C) and D) are incorrect mechanisms of control described in the lecture.  Question 13: Growth hormone (GH) secretion from the anterior pituitary is stimulated by GHRH and inhibited by which other hypothalamic hormone? A. Somatostatin B. Dopamine C. CRH D. Oxytocin  A. Somatostatin Rationale for Correct Answer: The lecture explicitly states that growth hormone release is controlled by two hypothalamic hormones: GHRH (stimulatory) and somatostatin (inhibitory). Rationale for Incorrect Answers: B), C), and D) are hypothalamic hormones that control other pituitary hormones.  Question 14: The release of growth hormone exhibits a distinct pattern, with peak secretion occurring: A. Just before waking in the morning. B. During the mid-afternoon. C. In response to a high-carbohydrate meal. D. During stage 2 non-REM deep sleep.  D. During stage 2 non-REM deep sleep. Rationale for Correct Answer: The lecture is very specific that the release of growth hormone happens predominantly at night and is associated with a particular part of deep sleep called stage 2 non-REM sleep. Rationale for Incorrect Answers: A), B), and C) are incorrect timings according to the detailed lecture description.  Question 15: Growth hormone exerts some of its effects indirectly by stimulating the liver to produce what other hormones? A. Glucocorticoids B. Insulin-like growth factors (IGF-1 and 2) C. Somatostatins D. Thyroid hormones (T3 and T4)  B. Insulin-like growth factors (IGF-1 and 2) Rationale for Correct Answer: The lecture explains that growth hormone has direct effects but also acts on the liver to produce IGF-1 and 2, which then mediate many of the growth-promoting effects. Rationale for Incorrect Answers: A), C), and D) are hormones from different endocrine axes.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 257, "category": ["Week 4 Questions Only"], "stem": "Lipid-soluble hormones, such as steroids and thyroid hormone, primarily exert their effects on target cells by:", "options": ["Activating second messenger systems like cyclic AMP.", "Opening or closing ion channels to change membrane potential.", "Binding to nuclear receptors to activate or deactivate specific genes.", "Triggering the immediate exocytosis of proteins."], "correct": "C", "rationale": {"A": "A) and B) are the primary mechanisms of water-soluble hormones. D) is not the primary mechanism described.", "B": "This option is incorrect.", "C": "The lecture explains that lipid-soluble hormones freely cross the cell membrane, enter the nucleus, and bind to nuclear receptors, which then directly influence gene expression (transcription) to create new proteins.", "D": "This option is incorrect."}}, {"id": 258, "category": ["Week 4 Questions Only"], "stem": "What is the primary purpose of a hierarchical control system, such as the hypothalamic-pituitary-adrenal axis?", "options": ["To ensure a rapid, short-lived hormonal response.", "To allow multiple hormones to act on a single target organ simultaneously.", "To provide multiple points of negative feedback for tight regulation of the final hormone.", "To bypass the need for a transport protein in the blood."], "correct": "C", "rationale": {"A": "A) is incorrect; this complex system is often used for hormones that need to be steady, not necessarily rapid. B) is not the primary purpose. D) is irrelevant to the function of the hierarchy.", "B": "This option is incorrect.", "C": "The lecture emphasizes that the value of hierarchical control is in the feedback. The final hormone (hormone 3) provides negative feedback at the levels of gland 2 and gland 1, allowing for very strong and stable control.", "D": "This option is incorrect."}}, {"id": 259, "category": ["Week 4 Questions Only"], "stem": "The posterior pituitary is not considered a true endocrine gland because it:", "options": ["Produces seven different major hormones.", "Is controlled by dopamine inhibition.", "Only synthesizes amino acid-derived hormones.", "Does not synthesize its own hormones but stores and releases hormones made by the hypothalamus."], "correct": "D", "rationale": {"A": "A) is a characteristic of the anterior pituitary. B) is a control mechanism for prolactin in the anterior pituitary. C) is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture explains that the posterior pituitary is just an extension of the hypothalamus, consisting of axon terminals of neurosecretory cells whose cell bodies are in the hypothalamus. It stores and releases oxytocin and vasopressin, but does not make them."}}, {"id": 260, "category": y hormones.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 263, "category": ["Week 4 Questions Only"], "stem": "The release of growth hormone exhibits a distinct pattern, with peak secretion occurring:", "options": ["Just before waking in the morning.", "During the mid-afternoon.", "In response to a high-carbohydrate meal.", "During stage 2 non-REM deep sleep."], "correct": "D", "rationale": {"A": "A), B), and C) are incorrect timings according to the detailed lecture description.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture is very specific that the release of growth hormone happens predominantly at night and is associated with a particular part of deep sleep called stage 2 non-REM sleep."}}, {"id": 264, "category": ["Week 4 Questions Only"], "stem": "Growth hormone exerts some of its effects indirectly by stimulating the liver to produce what other hormones?", "options": ["Glucocorticoids", "Insulin-like growth factors (IGF-1 and 2)", "Somatostatins", "Thyroid hormones (T3 and T4)"], "correct": "B", "rationale": {"A": "A), C), and D) are hormones from different endocrine axes.", "B": "The lecture explains that growth hormone has direct effects but also acts on the liver to produce IGF-1 and 2, which then mediate many of the growth-promoting effects.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 265, "category": ["Week 4 Questions Only"], "stem": "A patient who is chronically sleep-deprived might experience decreased lean muscle mass and increased adiposity. This is partly due to the insufficient release of which hormone?", "options": ["Cortisol", "Aldosterone", "Growth hormone", "Prolactin"], "correct": "A", "rationale": {"A": "A), B), and D) are involved in stress, mineral balance, and lactation, respectively, not primarily in maintaining muscle/fat composition during sleep.  Question 17: What is a primary physiological effect of thyroid hormone (T3/T4) on target cells? A. It decreases the number of sodium-potassium ATPase pumps. B. It stimulates the transcription of genes for proteins that consume large amounts of energy. C. It inhibits gluconeogenesis in the liver. D. It acts as a potent anti-inflammatory agent.  B. It stimulates the transcription of genes for proteins that consume large amounts of energy. Rationale for Correct Answer: The lecture details that T3 enters the nucleus and triggers the transcription of various genes, including the sodium-potassium pump and respiratory enzymes, which consume energy and are the basis for its connection to metabolic rate. Rationale for Incorrect Answers: A) is the opposite of its effect. C) is incorrect; it promotes enzymes for gluconeogenesis. D) is an action of cortisol.  Question 18: In the microstructure of the thyroid gland, thyroid hormone is synthesized by follicular cells and then stored in what substance? A. The C-cells B. The bloodstream C. Intracellular vesicles D. The colloid, attached to thyroglobulin  D. The colloid, attached to thyroglobulin Rationale for Correct Answer: The lecture states that because thyroid hormone is fat-soluble, it cannot be stored easily in vesicles. The thyroid gland's unique solution is to store it attached to a large protein called thyroglobulin, which makes up the acellular protein matrix called colloid inside the follicles. Rationale for Incorrect Answers: A), B), and C) are incorrect locations or mechanisms for thyroid hormone storage.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 266, "category": ["Week 4 Questions Only"], "stem": "What is a primary physiological effect of thyroid hormone (T3/T4) on target cells?", "options": ["It decreases the number of sodium-potassium ATPase pumps.", "It stimulates the transcription of genes for proteins that consume large amounts of energy.", "It inhibits gluconeogenesis in the liver.", "It acts as a potent anti-inflammatory agent."], "correct": "B", "rationale": {"A": "A) is the opposite of its effect. C) is incorrect; it promotes enzymes for gluconeogenesis. D) is an action of cortisol.", "B": "The lecture details that T3 enters the nucleus and triggers the transcription of various genes, including the sodium-potassium pump and respiratory enzymes, which consume energy and are the basis for its connection to metabolic rate.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 267, "category": ["Week 4 Questions Only"], "stem": "In the microstructure of the thyroid gland, thyroid hormone is synthesized by follicular cells and then stored in what substance?", "options": ["The C-cells", "The bloodstream", "Intracellular vesicles", "The colloid, attached to thyroglobulin"], "correct": "D", "rationale": {"A": "A), B), and C) are incorrect locations or mechanisms for thyroid hormone storage.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states that because thyroid hormone is fat-soluble, it cannot be stored easily in vesicles. The thyroid gland's unique solution is to store it attached to a large protein called thyroglobulin, which makes up the acellular protein matrix called colloid inside the follicles."}}, {"id": 268, "category": ["Week 4 Questions Only"], "stem": "A patient with hyperthyroidism would be expected to have which of the following symptoms related to metabolic rate?", "options": ["Chronically feeling cold", "A tendency to gain weight easily", "Lethargy and fatigue", "Chronically feeling hot"], "correct": "A", "rationale": {"A": "A), B), and C) are all symptoms associated with hypothyroidism (a low metabolic rate).  Question 20: Which part of the adrenal gland is functionally an endocrine branch of the sympathetic nervous system and produces catecholamines? A. Adrenal cortex B. Zona glomerulosa C. Adrenal medulla D. Zona reticularis  C. Adrenal medulla Rationale for Correct Answer: The lecture distinguishes the adrenal gland as two glands in one, identifying the adrenal medulla (the center) as part of the sympathetic nervous system that produces catecholamines (epinephrine and norepinephrine). Rationale for Incorrect Answers: A), B), and D) are all parts of the adrenal cortex, which produces steroid hormones.  Question 21: The adrenal cortex produces which three categories of steroid hormones? A. Catecholamines, glucocorticoids, and androgens B. Glucocorticoids, mineralocorticoids, and sex hormones C. Aldosterone, epinephrine, and testosterone D. Cortisol, thyroid hormone, and estrogen  B. Glucocorticoids, mineralocorticoids, and sex hormones Rationale for Correct Answer: The lecture explicitly lists these three categories of hormones produced by the adrenal cortex. Rationale for Incorrect Answers: A), C), and D) contain hormones (catecholamines, thyroid hormone) not produced by the adrenal cortex or are incomplete lists.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 269, "category": ["Week 4 Questions Only"], "stem": "Which part of the adrenal gland is functionally an endocrine branch of the sympathetic nervous system and produces catecholamines?", "options": ["Adrenal cortex", "Zona glomerulosa", "Adrenal medulla", "Zona reticularis"], "correct": "C", "rationale": {"A": "A), B), and D) are all parts of the adrenal cortex, which produces steroid hormones.", "B": "This option is incorrect.", "C": "The lecture distinguishes the adrenal gland as two glands in one, identifying the adrenal medulla (the center) as part of the sympathetic nervous system that produces catecholamines (epinephrine and norepinephrine).", "D": "This option is incorrect."}}, {"id": 270, "category": ["Week 4 Questions Only"], "stem": "The adrenal cortex produces which three categories of steroid hormones?", "options": ["Catecholamines, glucocorticoids, and androgens", "Glucocorticoids, mineralocorticoids, and sex hormones", "Aldosterone, epinephrine, and testosterone", "Cortisol, thyroid hormone, and estrogen"], "correct": "B", "rationale": {"A": "A), C), and D) contain hormones (catecholamines, thyroid hormone) not produced by the adrenal cortex or are incomplete lists.", "B": "The lecture explicitly lists these three categories of hormones produced by the adrenal cortex.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 271, "category": ["Week 4 Questions Only"], "stem": "A patient is diagnosed with a tumor in the zona glomerulosa of the adrenal cortex. The production of which hormone would be most directly affected?", "options": ["Cortisol", "Testosterone", "Aldosterone", "Epinephrine"], "correct": "A", "rationale": {"A": "A) and B) are produced in other layers of the cortex. D) is produced by the adrenal medulla.  Question 23: Glucocorticoids, such as cortisol, are named for their tendency to: A. Cause the retention of minerals like sodium. B. Elevate blood glucose levels. C. Stimulate the reproductive organs. D. Lower the body's metabolic rate.  B. Elevate blood glucose levels. Rationale for Correct Answer: The lecture explains that they are called glucocorticoids specifically because they tend to cause an elevation of blood glucose. Rationale for Incorrect Answers: A) is the function of mineralocorticoids. C) is the function of sex hormones. D) is the opposite of the effect of related hormones like thyroid hormone.  Question 24: The release of glucocorticoids from the adrenal cortex is directly stimulated by which hormone from the anterior pituitary? A. TSH B. CRH C. LH D. ACTH  D. ACTH Rationale for Correct Answer: The lecture describes the HPA axis: CRH from the hypothalamus acts on the anterior pituitary to release ACTH (adrenocorticotropic hormone), which then acts on the adrenal cortex to stimulate glucocorticoid release. Rationale for Incorrect Answers: A), B), and C) are incorrect hormones in this specific axis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 272, "category": ["Week 4 Questions Only"], "stem": "Glucocorticoids, such as cortisol, are named for their tendency to:", "options": ["Cause the retention of minerals like sodium.", "Elevate blood glucose levels.", "Stimulate the reproductive organs.", "Lower the body's metabolic rate."], "correct": "B", "rationale": {"A": "A) is the function of mineralocorticoids. C) is the function of sex hormones. D) is the opposite of the effect of related hormones like thyroid hormone.", "B": "The lecture explains that they are called glucocorticoids specifically because they tend to cause an elevation of blood glucose.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 273, "category": ["Week 4 Questions Only"], "stem": "The release of glucocorticoids from the adrenal cortex is directly stimulated by which hormone from the anterior pituitary?", "options": ["TSH", "CRH", "LH", "ACTH"], "correct": "D", "rationale": {"A": "A), B), and C) are incorrect hormones in this specific axis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture describes the HPA axis: CRH from the hypothalamus acts on the anterior pituitary to release ACTH (adrenocorticotropic hormone), which then acts on the adrenal cortex to stimulate glucocorticoid release."}}, {"id": 274, "category": ["Week 4 Questions Only"], "stem": "Cortisol levels exhibit a diurnal pattern, which means they are:", "options": ["Highest in the evening hours and lowest just before waking.", "Constant throughout the day and night.", "Highest just before waking and lowest in the evening.", "Released only in response to a direct threat."], "correct": "C", "rationale": {"A": "A), B), and D) are all incorrect descriptions of this specific daily rhythm.  Question 26: Which of the following is an action of cortisol designed to mobilize energy during a stress response? A. It enhances glycogen storage in the liver. B. It stimulates muscle protein synthesis. C. It enhances the breakdown of muscle to release amino acids for gluconeogenesis. D. It stimulates the immune system and inflammatory responses.  C. It enhances the breakdown of muscle to release amino acids for gluconeogenesis. Rationale for Correct Answer: The lecture explains that to mobilize energy, cortisol acts on muscle to cause breakdown and release of amino acids, which the liver then uses to make more glucose (gluconeogenesis). Rationale for Incorrect Answers: A) is the opposite; it enhances glycogen breakdown. B) is the opposite of its effect. D) is the opposite; it suppresses the immune system.", "B": "This option is incorrect.", "C": "The lecture clearly describes the diurnal pattern of cortisol, stating that levels are lowest in the evening and highest just before waking, which helps a person become more alert in the morning.", "D": "This option is incorrect."}}, {"id": 275, "category": ["Week 4 Questions Only"], "stem": "Which of the following is an action of cortisol designed to mobilize energy during a stress response?", "options": ["It enhances glycogen storage in the liver.", "It stimulates muscle protein synthesis.", "It enhances the breakdown of muscle to release amino acids for gluconeogenesis.", "It stimulates the immune system and inflammatory responses."], "correct": "C", "rationale": {"A": "A) is the opposite; it enhances glycogen breakdown. B) is the opposite of its effect. D) is the opposite; it suppresses the immune system.", "B": "This option is incorrect.", "C": "The lecture explains that to mobilize energy, cortisol acts on muscle to cause breakdown and release of amino acids, which the liver then uses to make more glucose (gluconeogenesis).", "D": "This option is incorrect."}}, {"id": 276, "category": ["Week 4 Questions Only"], "stem": "A student feeling stressed before an exam may experience heightened mental agility or the ability to \"think on their toes.\" This is due to cortisol's effect of:", "options": ["Suppressing immune function.", "Increasing neural excitability in the brain.", "Causing vasoconstriction.", "Enhancing calcium release from bone."], "correct": "A", "rationale": {"A": "A), C), and D) are all real effects of cortisol, but they are not the ones responsible for the increase in mental agility described.  Question 28: What is the primary anti-inflammatory and immunosuppressant effect of cortisol meant to achieve during a short-lived stress response? A. To prevent infection from potential injuries. B. To prioritize energy for the fight-or-flight response by giving the immune system \"the day off.\" C. To increase bone density for physical exertion. D. To lower blood glucose to conserve energy.  B. To prioritize energy for the fight-or-flight response by giving the immune system \"the day off.\" Rationale for Correct Answer: The lecture explains the rationale behind cortisol's immunosuppressant effect: in a short-lived stress situation, the body prioritizes all available energy for the immediate stress response (fight or flight) and diverts it away from non-essential processes like a full immune response. Rationale for Incorrect Answers: A) is incorrect; it suppresses the immune system. C) is incorrect; cortisol weakens bone over time. D) is incorrect; it raises blood glucose.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 277, "category": ["Week 4 Questions Only"], "stem": "What is the primary anti-inflammatory and immunosuppressant effect of cortisol meant to achieve during a short-lived stress response?", "options": ["To prevent infection from potential injuries.", "To prioritize energy for the fight-or-flight response by giving the immune system \"the day off.\"", "To increase bone density for physical exertion.", "To lower blood glucose to conserve energy."], "correct": "B", "rationale": {"A": "A) is incorrect; it suppresses the immune system. C) is incorrect; cortisol weakens bone over time. D) is incorrect; it raises blood glucose.", "B": "The lecture explains the rationale behind cortisol's immunosuppressant effect: in a short-lived stress situation, the body prioritizes all available energy for the immediate stress response (fight or flight) and diverts it away from non-essential processes like a full immune response.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 278, "category": ["Week 4 Questions Only"], "stem": "Chronic stress and persistently high levels of cortisol can lead to which of the following health problems?", "options": ["A strengthened immune system and resistance to illness.", "Increased bone density and reduced risk of fractures.", "Enhanced blood sugar control in diabetics.", "Suppression of immune function and increased susceptibility to illness."], "correct": "C", "rationale": {"A": "A) is the opposite of the long-term effect. B) is the opposite; it leads to osteoporosis. C) is incorrect; it makes blood sugar control harder for diabetics.", "B": "This option is incorrect.", "C": "The lecture explicitly states that when cortisol levels are too high for too long (chronic stress), you start getting sick because immune function is suppressed.", "D": "This option is incorrect."}}, {"id": 279, "category": ["Week 4 Questions Only"], "stem": "Arginine vasopressin (ADH) is an example of a polypeptide hormone. When it binds to V1 receptors on blood vessels, it causes vasoconstriction, but when it binds to V2 receptors in the kidneys, it causes increased water reabsorption. This illustrates that:", "options": ["A single hormone can have different effects on different tissues based on receptor subtypes.", "Polypeptide hormones always cause opposite effects in the body.", "Hormones must change their chemical structure to act on different organs.", "Renal and cardiovascular physiology are completely separate systems."], "correct": "A", "rationale": {"A": "The lecture uses ADH as a prime example of this principle, explaining that it binds to V1 receptors in one tissue and V2 receptors in another, producing two entirely different physiological effects.", "B": "B), C), and D) are incorrect generalizations or conclusions.  Question 31: How is the transport of a lipid-soluble hormone like testosterone different from a water-soluble hormone like insulin? A. Testosterone travels freely in the plasma, while insulin requires a binding protein. B. Testosterone requires a binding protein, while insulin travels freely in the plasma. C. Both hormones require binding proteins for transport. D. Both hormones travel freely in the plasma.  B. Testosterone requires a binding protein, while insulin travels freely in the plasma. Rationale for Correct Answer: The lecture explains that lipid-soluble hormones (like testosterone) need binding proteins for transport in the water-based bloodstream, while water-soluble hormones (like insulin) move freely. Rationale for Incorrect Answers: A) is the reverse. C) and D) are incorrect for one of the hormone types.  Question 32: The conversion of cholesterol to which intermediate molecule is the first universal step in the synthesis of all steroid hormones? A. Aldosterone B. Cortisol C. Progesterone D. Pregnenolone  D. Pregnenolone Rationale for Correct Answer: The lecture states that cholesterol is first converted into a substance called pregnenolone, and then from pregnenolone, the various steroid hormones are produced. Rationale for Incorrect Answers: A), B), and C) are all steroid hormones synthesized from pregnenolone, not the initial intermediate.  Question 33: Which of the following is a second messenger system commonly activated by water-soluble hormones that cannot cross the cell membrane? A. Gene transcription B. The LDL receptor pathway C. The sodium-potassium pump D. Cyclic AMP (cAMP) and intracellular calcium  D. Cyclic AMP (cAMP) and intracellular calcium Rationale for Correct Answer: The lecture identifies cyclic AMP and intracellular calcium as two very common second messengers that are triggered when a hormone binds to a membrane receptor, bringing about a change inside the cell. Rationale for Incorrect Answers: A) is the mechanism of lipid-soluble hormones. B) is a transport mechanism. C) is a protein whose production can be affected by hormones, not a second messenger system itself.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 280, "category": ["Week 4 Questions Only"], "stem": "How is the transport of a lipid-soluble hormone like testosterone different from a water-soluble hormone like insulin?", "options": ["Testosterone travels freely in the plasma, while insulin requires a binding protein.", "Testosterone requires a binding protein, while insulin travels freely in the plasma.", "Both hormones require binding proteins for transport.", "Both hormones travel freely in the plasma."], "correct": "B", "rationale": {"A": "A) is the reverse. C) and D) are incorrect for one of the hormone types.", "B": "The lecture explains that lipid-soluble hormones (like testosterone) need binding proteins for transport in the water-based bloodstream, while water-soluble hormones (like insulin) move freely.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 281, "category": ["Week 4 Questions Only"], "stem": "The conversion of cholesterol to which intermediate molecule is the first universal step in the synthesis of all steroid hormones?", "options": ["Aldosterone", "Cortisol", "Progesterone", "Pregnenolone"], "correct": "D", "rationale": {"A": "A), B), and C) are all steroid hormones synthesized from pregnenolone, not the initial intermediate.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states that cholesterol is first converted into a substance called pregnenolone, and then from pregnenolone, the various steroid hormones are produced."}}, {"id": 282, "category": ["Week 4 Questions Only"], "stem": "Which of the following is a second messenger system commonly activated by water-soluble hormones that cannot cross the cell membrane?", "options": ["Gene transcription", "The LDL receptor pathway", "The sodium-potassium pump", "Cyclic AMP (cAMP) and intracellular calcium"], "correct": "D", "rationale": {"A": "A) is the mechanism of lipid-soluble hormones. B) is a transport mechanism. C) is a protein whose production can be affected by hormones, not a second messenger system itself.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture identifies cyclic AMP and intracellular calcium as two very common second messengers that are triggered when a hormone binds to a membrane receptor, bringing about a change inside the cell."}}, {"id": 283, "category": ["Week 4 Questions Only"], "stem": "A patient with chronically low growth hormone levels would be expected to have correspondingly low levels of which other hormone, as its production is dependent on GH stimulation?", "options": ["Cortisol", "IGF-1", "TSH", "Aldosterone"], "correct": "A", "rationale": {"A": "A), C), and D) belong to different and independent hormonal axes.  Question 35: How do the effects of growth hormone (GH) and insulin-like growth factor (IGF-1) on blood sugar differ throughout the night? A. Both GH and IGF-1 consistently increase blood sugar. B. GH tends to increase blood sugar, while IGF-1 tends to decrease it. C. Both GH and IGF-1 consistently decrease blood sugar. D. GH tends to decrease blood sugar, while IGF-1 tends to increase it.  B. GH tends to increase blood sugar, while IGF-1 tends to decrease it. Rationale for Correct Answer: The lecture clearly explains this opposing relationship: GH has anti-insulin effects and tends to increase blood sugar. As GH falls, IGF-1 rises, and being \"insulin-like,\" it helps bring blood sugar back down by allowing cells to take up glucose for growth. Rationale for Incorrect Answers: A), C), and D) all misrepresent this dynamic relationship.  Question 36: The cells within the anterior pituitary that are responsible for releasing growth hormone are called: A. Thyrotrophs B. Gonadotrophs C. Somatotrophs D. Lactotrophs  C. Somatotrophs Rationale for Correct Answer: The lecture specifically names the pituitary cells that release growth hormone as somatotrophs, noting that \"soma\" means body. Rationale for Incorrect Answers: A) releases TSH. B) releases LH/FSH. D) releases prolactin.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 284, "category": ["Week 4 Questions Only"], "stem": "How do the effects of growth hormone (GH) and insulin-like growth factor (IGF-1) on blood sugar differ throughout the night?", "options": ["Both GH and IGF-1 consistently increase blood sugar.", "GH tends to increase blood sugar, while IGF-1 tends to decrease it.", "Both GH and IGF-1 consistently decrease blood sugar.", "GH tends to decrease blood sugar, while IGF-1 tends to increase it."], "correct": "B", "rationale": {"A": "A), C), and D) all misrepresent this dynamic relationship.", "B": "The lecture clearly explains this opposing relationship: GH has anti-insulin effects and tends to increase blood sugar. As GH falls, IGF-1 rises, and being \"insulin-like,\" it helps bring blood sugar back down by allowing cells to take up glucose for growth.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 285, "category": ["Week 4 Questions Only"], "stem": "The cells within the anterior pituitary that are responsible for releasing growth hormone are called:", "options": ["Thyrotrophs", "Gonadotrophs", "Somatotrophs", "Lactotrophs"], "correct": "C", "rationale": {"A": "A) releases TSH. B) releases LH/FSH. D) releases prolactin.", "B": "This option is incorrect.", "C": "The lecture specifically names the pituitary cells that release growth hormone as somatotrophs, noting that \"soma\" means body.", "D": "This option is incorrect."}}, {"id": 286, "category": ["Week 4 Questions Only"], "stem": "A patient with an overactive thyroid gland is found to have high levels of T3/T4 but very low levels of TSH. What does this suggest about the hypothalamic-pituitary-thyroid axis?", "options": ["The hypothalamus is over-releasing TRH.", "The anterior pituitary is over-releasing TSH.", "The negative feedback mechanism from T3/T4 on the pituitary and hypothalamus is functioning correctly.", "The thyroid gland is not responding to TSH."], "correct": "A", "rationale": {"A": "A) and B) would result in high TSH. D) would result in low T3/T4, not high.  Question 38: Which layer of the adrenal cortex is responsible for producing sex hormones like testosterone, regardless of the individual's sex? A. The adrenal gland does not produce sex hormones. B. The zona glomerulosa. C. The adrenal medulla. D. All layers of the adrenal cortex produce all steroid hormones, including sex hormones.  D. All layers of the adrenal cortex produce all steroid hormones, including sex hormones. Rationale for Correct Answer: The lecture states, \"whether you are male or female, your adrenal cortex produces testosterone, estrogen, and progesterone, on top of producing cortisol, corticosterone, and aldosterone,\" and that all three categories of hormones (glucocorticoids, mineralocorticoids, and sex hormones) are produced by the adrenal cortex. Rationale for Incorrect Answers: A) is explicitly contradicted. B) is incorrect; while it specializes in aldosterone, the cortex as a whole produces all categories. C) produces catecholamines, not steroids.  Question 39: The physiological response to a real threat (seeing a deadly snake) and a perceived threat (taking a difficult exam) is neurologically and hormonally very similar, primarily due to the release of: A. Growth hormone and IGF-1 B. Thyroid hormone and calcitonin C. Cortisol and catecholamines D. Prolactin and oxytocin  C. Cortisol and catecholamines Rationale for Correct Answer: The lecture explains that the neurohormonal response to real or perceived threats is nearly identical and is characterized by the stress response, which involves the release of cortisol and catecholamines (epinephrine/norepinephrine). Rationale for Incorrect Answers: A), B), and D) are hormones involved in growth, metabolism, and lactation/social bonding, respectively, not the primary acute stress response.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 287, "category": ["Week 4 Questions Only"], "stem": "Which layer of the adrenal cortex is responsible for producing sex hormones like testosterone, regardless of the individual's sex?", "options": ["The adrenal gland does not produce sex hormones.", "The zona glomerulosa.", "The adrenal medulla.", "All layers of the adrenal cortex produce all steroid hormones, including sex hormones."], "correct": "D", "rationale": {"A": "A) is explicitly contradicted. B) is incorrect; while it specializes in aldosterone, the cortex as a whole produces all categories. C) produces catecholamines, not steroids.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture states, \"whether you are male or female, your adrenal cortex produces testosterone, estrogen, and progesterone, on top of producing cortisol, corticosterone, and aldosterone,\" and that all three categories of hormones (glucocorticoids, mineralocorticoids, and sex hormones) are produced by the adrenal cortex."}}, {"id": 288, "category": ["Week 4 Questions Only"], "stem": "The physiological response to a real threat (seeing a deadly snake) and a perceived threat (taking a difficult exam) is neurologically and hormonally very similar, primarily due to the release of:", "options": ["Growth hormone and IGF-1", "Thyroid hormone and calcitonin", "Cortisol and catecholamines", "Prolactin and oxytocin"], "correct": "C", "rationale": {"A": "A), B), and D) are hormones involved in growth, metabolism, and lactation/social bonding, respectively, not the primary acute stress response.", "B": "This option is incorrect.", "C": "The lecture explains that the neurohormonal response to real or perceived threats is nearly identical and is characterized by the stress response, which involves the release of cortisol and catecholamines (epinephrine/norepinephrine).", "D": "This option is incorrect."}}, {"id": 289, "category": ["Week 4 Questions Only"], "stem": "Cortisol's effect on bone tissue, especially under chronic stress, is to:", "options": ["Stimulate bone growth and increase density.", "Have no effect on bone tissue.", "Inhibit the release of calcium from bone.", "Stimulate the breakdown of bone to release calcium."], "correct": "C", "rationale": {"A": "A) is the opposite effect. B) is incorrect. C) is the opposite effect.  Question 41: Mineralocorticoids like aldosterone primarily affect the body's balance of: A. Glucose and glycogen B. Amino acids and proteins C. Sodium and potassium D. Calcium and phosphate  C. Sodium and potassium Rationale for Correct Answer: The lecture defines mineralocorticoids as hormones that \"tend to affect sodium and potassium levels,\" specifically causing sodium retention and potassium loss. Rationale for Incorrect Answers: A) is the primary domain of glucocorticoids. B) and D) are affected by various hormones, but are not the primary targets of mineralocorticoids.  Question 42: What is the anatomical and functional relationship between the hypothalamus and the posterior pituitary? A. They are connected by a portal circulatory system. B. The posterior pituitary is an extension of the hypothalamus, composed of its axon terminals. C. The posterior pituitary is a true endocrine gland that controls the hypothalamus. D. There is no direct physical or functional connection between them.  B. The posterior pituitary is an extension of the hypothalamus, composed of its axon terminals. Rationale for Correct Answer: The lecture describes in detail how neurosecretory cells with cell bodies in the hypothalamus have long axons that terminate in the posterior pituitary, making it an extension of the hypothalamus. Rationale for Incorrect Answers: A) describes the connection to the anterior pituitary. C) and D) are incorrect.  Question 43: Which two hormones are released from the posterior pituitary? A. TSH and ACTH B. LH and FSH C. Oxytocin and Vasopressin (ADH) D. Prolactin and Growth Hormone  C. Oxytocin and Vasopressin (ADH) Rationale for Correct Answer: The lecture explicitly names oxytocin and vasopressin (also called ADH) as the two hormones released from the posterior pituitary. Rationale for Incorrect Answers: A), B), and D) are all hormones released from the anterior pituitary.", "B": "This option is incorrect.", "C": "The lecture states that cortisol acts on bone to enhance the release of calcium by stimulating the micro-breakdown of bone. It also notes that chronic exposure leads to a risk of osteoporosis.", "D": "This option is incorrect."}}, {"id": 290, "category": ["Week 4 Questions Only"], "stem": "Mineralocorticoids like aldosterone primarily affect the body's balance of:", "options": ["Glucose and glycogen", "Amino acids and proteins", "Sodium and potassium", "Calcium and phosphate"], "correct": "C", "rationale": {"A": "A) is the primary domain of glucocorticoids. B) and D) are affected by various hormones, but are not the primary targets of mineralocorticoids.", "B": "This option is incorrect.", "C": "The lecture defines mineralocorticoids as hormones that \"tend to affect sodium and potassium levels,\" specifically causing sodium retention and potassium loss.", "D": "This option is incorrect."}}, {"id": 291, "category": ["Week 4 Questions Only"], "stem": "What is the anatomical and functional relationship between the hypothalamus and the posterior pituitary?", "options": ["They are connected by a portal circulatory system.", "The posterior pituitary is an extension of the hypothalamus, composed of its axon terminals.", "The posterior pituitary is a true endocrine gland that controls the hypothalamus.", "There is no direct physical or functional connection between them."], "correct": "B", "rationale": {"A": "A) describes the connection to the anterior pituitary. C) and D) are incorrect.", "B": "The lecture describes in detail how neurosecretory cells with cell bodies in the hypothalamus have long axons that terminate in the posterior pituitary, making it an extension of the hypothalamus.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 292, "category": ["Week 4 Questions Only"], "stem": "Which two hormones are released from the posterior pituitary?", "options": ["TSH and ACTH", "LH and FSH", "Oxytocin and Vasopressin (ADH)", "Prolactin and Growth Hormone"], "correct": "C", "rationale": {"A": "A), B), and D) are all hormones released from the anterior pituitary.", "B": "This option is incorrect.", "C": "The lecture explicitly names oxytocin and vasopressin (also called ADH) as the two hormones released from the posterior pituitary.", "D": "This option is incorrect."}}, {"id": 293, "category": ["Week 4 Questions Only"], "stem": "A patient has a deficiency of LDL receptors on their endocrine cells. This would most directly impair the synthesis of which class of hormones?", "options": ["Polypeptide hormones", "Amino acid-derived hormones", "Steroid hormones", "Catecholamines"], "correct": "A", "rationale": {"A": "A), B), and D) are synthesized from amino acids, not cholesterol, so their synthesis would not be directly affected.  Question 45: The conversion of the inactive form of thyroid hormone (T4) to the active form (T3) can occur in the liver or at the target cell through the action of which type of enzyme? A. Monodeiodinase B. Aldosterone synthase C. 21-hydroxylase D. Aromatase  A. Monodeiodinase Rationale for Correct Answer: The lecture mentions that an enzyme inside most cells called monodeiodinase is able to convert T4 into T3 by removing an iodine atom. Rationale for Incorrect Answers: B), C), and D) are all enzymes involved in the steroid hormone synthesis pathway, not thyroid hormone activation.  Question 46: Which of the following is NOT a dedicated endocrine gland, but rather an organ of mixed function that also produces hormones? A. Adrenal gland B. Thyroid gland C. Kidney D. Parathyroid gland  C. Kidney Rationale for Correct Answer: The lecture uses the kidney as a key example of an endocrine structure of mixed function. Its \"day job\" is filtering blood, but it also releases hormones like erythropoietin (EPO). Rationale for Incorrect Answers: A), B), and D) are all listed as dedicated endocrine structures, meaning their primary job is hormone production.  Question 47: When a protein hormone binds its receptor, it is considered the \"first messenger.\" This interaction then triggers the production of an intracellular \"second messenger.\" This is necessary because: A. The hormone is too large to fit into the receptor. B. The hormone is lipid-soluble and gets trapped in the membrane. C. The hormone is water-soluble and cannot cross the cell membrane. D. The hormone needs to be amplified before it can have an effect.  C. The hormone is water-soluble and cannot cross the cell membrane. Rationale for Correct Answer: The lecture explains that since the hormone (first messenger) cannot penetrate the membrane, it must trigger a second messenger inside the cell to carry out its function. Rationale for Incorrect Answers: A) is incorrect. B) describes a lipid-soluble hormone. D) is a consequence of the second messenger system (amplification), but not the reason it is necessary.  Question 48: The release of cortisol is part of the body's response to stress. This entire pathway begins with the release of which hormone from the hypothalamus? A. ACTH B. TSH C. TRH D. CRH  D. CRH Rationale for Correct Answer: The lecture clearly outlines the axis: \"the control starts with the hypothalamus. It starts with the release of CRH, which stands for corticotropin-releasing hormone.\" Rationale for Incorrect Answers: A) is from the pituitary. B) and C) are from the wrong axis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 294, "category": ["Week 4 Questions Only"], "stem": "The conversion of the inactive form of thyroid hormone (T4) to the active form (T3) can occur in the liver or at the target cell through the action of which type of enzyme?", "options": ["Monodeiodinase", "Aldosterone synthase", "21-hydroxylase", "Aromatase"], "correct": "A", "rationale": {"A": "The lecture mentions that an enzyme inside most cells called monodeiodinase is able to convert T4 into T3 by removing an iodine atom.", "B": "B), C), and D) are all enzymes involved in the steroid hormone synthesis pathway, not thyroid hormone activation.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 295, "category": ["Week 4 Questions Only"], "stem": "Which of the following is NOT a dedicated endocrine gland, but rather an organ of mixed function that also produces hormones?", "options": ["Adrenal gland", "Thyroid gland", "Kidney", "Parathyroid gland"], "correct": "C", "rationale": {"A": "A), B), and D) are all listed as dedicated endocrine structures, meaning their primary job is hormone production.", "B": "This option is incorrect.", "C": "The lecture uses the kidney as a key example of an endocrine structure of mixed function. Its \"day job\" is filtering blood, but it also releases hormones like erythropoietin (EPO).", "D": "This option is incorrect."}}, {"id": 296, "category": ["Week 4 Questions Only"], "stem": "When a protein hormone binds its receptor, it is considered the \"first messenger.\" This interaction then triggers the production of an intracellular \"second messenger.\" This is necessary because:", "options": ["The hormone is too large to fit into the receptor.", "The hormone is lipid-soluble and gets trapped in the membrane.", "The hormone is water-soluble and cannot cross the cell membrane.", "The hormone needs to be amplified before it can have an effect."], "correct": "C", "rationale": {"A": "A) is incorrect. B) describes a lipid-soluble hormone. D) is a consequence of the second messenger system (amplification), but not the reason it is necessary.", "B": "This option is incorrect.", "C": "The lecture explains that since the hormone (first messenger) cannot penetrate the membrane, it must trigger a second messenger inside the cell to carry out its function.", "D": "This option is incorrect."}}, {"id": 297, "category": ["Week 4 Questions Only"], "stem": "The release of cortisol is part of the body's response to stress. This entire pathway begins with the release of which hormone from the hypothalamus?", "options": ["ACTH", "TSH", "TRH", "CRH"], "correct": "D", "rationale": {"A": "A) is from the pituitary. B) and C) are from the wrong axis.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture clearly outlines the axis: \"the control starts with the hypothalamus. It starts with the release of CRH, which stands for corticotropin-releasing hormone.\""}}, {"id": 298, "category": ["Week 4 Questions Only"], "stem": "A patient with Addison's disease (adrenal insufficiency) would suffer from a deficiency in which of the following hormones?", "options": ["Glucocorticoids and mineralocorticoids", "Thyroid hormone", "Growth hormone", "Catecholamines"], "correct": "A", "rationale": {"A": "Addison's disease is adrenal insufficiency, meaning the adrenal cortex is not functioning. The adrenal cortex produces glucocorticoids (like cortisol) and mineralocorticoids (like aldosterone).", "B": "B), C), and D) are produced by the thyroid, pituitary, and adrenal medulla, respectively, not the adrenal cortex.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 299, "category": ["Week 4 Questions Only"], "stem": "Based on cortisol's diurnal rhythm, at which time would a heart attack or stroke be statistically more likely to occur, due to high cortisol levels causing vasoconstriction?", "options": ["Late in the evening, around 11 PM", "In the middle of the night, during deep sleep", "In the early morning hours, just before or upon waking", "In the mid-afternoon, after lunch"], "correct": "B", "rationale": {"A": "A), B), and D) are times when cortisol levels are lower according to its diurnal rhythm.", "B": "The lecture makes this direct link: \"heart attack rates... tend to happen more in the morning hours. That's because cortisol levels are the highest just before waking and in the morning, and cortisol tends to cause vasoconstriction.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 300, "category": ["Mixed set 3"], "stem": "A disease is best defined as an interplay between:", "options": ["The initial cause of injury and the pattern of the organism's response.", "The observable signs and the subjective symptoms.", "Extrinsic physical agents and intrinsic inherited conditions.", "The latent period and the acute period of illness."], "correct": "A", "rationale": {"A": "The lecture defines a disease as the interplay between the cause of the initial insult and the pattern of the organism's response to that insult, noting that the body's response can often cause more pathology than the initial injury itself.", "B": "B is incomplete as it omits the initial injury. C lists types of etiologies but doesn't define the disease process. D describes stages of a disease's progression, not the definition of the disease itself.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 301, "category": ["Mixed set 3"], "stem": "A 45-year-old patient reports debilitating fatigue and nausea. In the context of clinical pathophysiology, fatigue and nausea are best classified as:", "options": ["Signs", "Symptoms", "Etiologies", "Pathogenesis"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "A symptom is defined as a subjectively experienced clinical manifestation that must be reported by the patient. Fatigue and nausea cannot be objectively measured by an observer.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 302, "category": ["Mixed set 3"], "stem": "A patient is diagnosed with essential hypertension, but the underlying cause cannot be determined. This condition is best described as:", "options": ["Iatrogenic", "Idiopathic", "Intrinsic", "Extrinsic"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture explicitly defines an idiopathic disease as one of unknown cause and uses essential hypertension as a prime example.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 303, "category": ["Mixed set 3"], "stem": "Following a cardiac catheterization procedure that used contrast dye, a patient develops acute kidney injury. This type of injury is categorized as:", "options": ["Idiopathic", "Iatrogenic", "Neoplastic", "Congenital"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "Iatrogenic conditions are defined as those inadvertently caused by medical care. The lecture provides the specific example of contrast dye used in imaging causing nephrotoxicity (kidney injury).", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 304, "category": ["Mixed set 3"], "stem": "During hypoxic injury, the initial failure of the sodium-potassium ATPase pump leads directly to:", "options": ["Increased ATP production via glycolysis.", "Activation of lysosomal enzymes.", "Acute cellular swelling due to sodium and water accumulation.", "Apoptosis and programmed cell death."], "correct": "C", "rationale": {"A": "A is incorrect because glycolysis increases to compensate for lost ATP, but this doesn't cause swelling. B and D are later, often irreversible, events in the cell injury cascade.", "B": "This option is incorrect.", "C": "The lecture on hypoxic injury details that a drop in ATP production causes the sodium-potassium pump to fail. This leads to an accumulation of sodium inside the cell, and \"where sodium goes, water follows,\" resulting in acute cellular swelling.", "D": "This option is incorrect."}}, {"id": 305, "category": ["Mixed set 3"], "stem": "Which statement accurately describes the role of the Renin-Angiotensin-Aldosterone System (RAAS)?", "options": ["It is the primary system for regulating total body water through thirst.", "It is a systemic method for regulating extracellular sodium and potassium.", "It primarily controls the intracellular concentration of osmolytes via ATPase pumps.", "It is activated by high blood pressure to promote sodium excretion."], "correct": "B", "rationale": {"A": "A describes the ADH-thirst system. C is the function of the Na+/K+ ATPase pump at the cellular level, not the systemic RAAS. D is incorrect; RAAS is activated by low blood pressure to retain sodium.", "B": "The lecture states that the Renin-Angiotensin-Aldosterone System is the systemic method for helping to regulate the extracellular concentration of sodium and potassium, noting its activation by changes in blood pressure or sodium.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 306, "category": ["Mixed set 3"], "stem": "Which of the Starling forces is primarily responsible for holding fluid within the intravascular space and is most directly affected by severe liver disease or starvation?", "options": ["Capillary blood pressure", "Interstitial hydrostatic pressure", "Capillary oncotic pressure", "Interstitial oncotic pressure"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "Capillary oncotic pressure is the \"pulling force\" exerted by plasma proteins, primarily albumin. The lecture states that the liver synthesizes albumin and that liver disease or starvation leads to a fall in albumin, diminishing this force and causing fluid to leak out (edema).", "D": "This option is incorrect."}}, {"id": 307, "category": ["Mixed set 3"], "stem": "A patient develops significant swelling in their arm after a mastectomy that included the removal of lymph nodes. This condition, known as lymphedema, is a direct result of:", "options": ["Decreased plasma oncotic pressure.", "Increased capillary blood pressure.", "Lymphatic obstruction.", "Increased interstitial oncotic pressure."], "correct": "C", "rationale": {"A": "A, B, and D are other causes of edema but are not the direct result of removing lymph nodes.", "B": "A, B, and D are other causes of edema but are not the direct result of removing lymph nodes.", "C": "The lecture describes lymphatic obstruction as a cause of edema, explaining that lymphatic vessels drain excess interstitial fluid. If this drainage is blocked, an extreme version of edema called lymphedema occurs.", "D": "A, B, and D are other causes of edema but are not the direct result of removing lymph nodes."}}, {"id": 308, "category": ["Mixed set 3"], "stem": "Ascites, the accumulation of fluid in the peritoneal cavity, is a form of \"third-spacing.\" This condition often occurs in liver failure due to:", "options": ["A significant reduction in capillary oncotic pressure from lack of albumin.", "A sharp increase in capillary blood pressure within the peritoneal capillaries.", "Blocked lymphatic drainage from the peritoneal cavity exclusively.", "Increased interstitial hydrostatic pressure pushing fluid into the cavity."], "correct": "A", "rationale": {"A": "B, C, and D are incorrect mechanisms for ascites as described in the lecture. The primary mechanism cited is the loss of oncotic pressure.", "B": "B, C, and D are incorrect mechanisms for ascites as described in the lecture. The primary mechanism cited is the loss of oncotic pressure.", "C": "B, C, and D are incorrect mechanisms for ascites as described in the lecture. The primary mechanism cited is the loss of oncotic pressure.", "D": "B, C, and D are incorrect mechanisms for ascites as described in the lecture. The primary mechanism cited is the loss of oncotic pressure."}}, {"id": 309, "category": ["Mixed set 3"], "stem": "A patient experiencing a hemorrhage loses a large volume of blood. This results in which type of fluid alteration?", "options": ["Isotonic volume depletion", "Hypotonic alteration", "Hypertonic alteration", "Isotonic volume excess"], "correct": "A", "rationale": {"A": "B and C are incorrect because the loss is proportional, so tonicity doesn't change. D is incorrect because volume is lost, not gained.", "B": "B and C are incorrect because the loss is proportional, so tonicity doesn't change. D is incorrect because volume is lost, not gained.", "C": "B and C are incorrect because the loss is proportional, so tonicity doesn't change. D is incorrect because volume is lost, not gained.", "D": "B and C are incorrect because the loss is proportional, so tonicity doesn't change. D is incorrect because volume is lost, not gained."}}, {"id": 310, "category": ["Mixed set 3"], "stem": "A patient with uncontrolled diabetes mellitus has extremely high blood glucose levels. This can lead to a dilutional hyponatremia because:", "options": ["High glucose levels trigger the kidneys to excrete sodium.", "The high osmolarity from glucose pulls fluid from the interstitial space into the bloodstream, diluting sodium.", "Glucose metabolism consumes sodium ions.", "The patient develops excessive thirst and drinks too much water."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect mechanisms. The process is a fluid shift due to osmolarity changes, not a direct effect on sodium excretion, consumption, or intake.", "B": "The lecture explains dilutional hyponatremia, stating that when blood glucose is extremely high, it \"elevates the osmolarity and it ends up pulling fluid in from the interstitial space,\" which dilutes the sodium already present in the bloodstream.", "C": "A, C, and D are incorrect mechanisms. The process is a fluid shift due to osmolarity changes, not a direct effect on sodium excretion, consumption, or intake.", "D": "A, C, and D are incorrect mechanisms. The process is a fluid shift due to osmolarity changes, not a direct effect on sodium excretion, consumption, or intake."}}, {"id": 311, "category": ["Mixed set 3"], "stem": "A patient with metabolic acidosis will have an increased concentration of hydrogen ions in their extracellular fluid. How does this affect potassium levels?", "options": ["Hydrogen ions enter cells, causing potassium to shift out of cells, leading to hyperkalemia.", "Hydrogen ions are buffered by bicarbonate, having no effect on potassium.", "The kidneys excrete more potassium to compensate for the acidosis.", "Potassium shifts into cells to balance the charge, leading to hypokalemia."], "correct": "A", "rationale": {"A": "The lecture explains that when extracellular fluid becomes more acidic (acidosis), excess hydrogen ions enter the cell. To maintain electrical neutrality, the cell \"swaps a potassium for a hydrogen,\" kicking potassium out and causing hyperkalemia.", "B": "B is incorrect because acidosis directly affects the ion exchange. C is a compensatory mechanism but not the direct cellular shift. D describes what happens in alkalosis, the opposite condition.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 312, "category": ["Mixed set 3"], "stem": "A patient with severe, uncontrolled hyperkalemia is in a life-threatening situation. A rapid way to lower their blood potassium level is to administer insulin because:", "options": ["Insulin causes the kidneys to excrete potassium rapidly.", "Insulin directly binds to potassium in the bloodstream.", "Insulin causes potassium to move into cells along with glucose.", "Insulin neutralizes the electrical charge of potassium ions."], "correct": "C", "rationale": {"A": "A and B are incorrect mechanisms. D is nonsensical. Insulin facilitates cellular uptake, it does not act in the kidneys for this purpose or bind directly to potassium.", "B": "A and B are incorrect mechanisms. D is nonsensical. Insulin facilitates cellular uptake, it does not act in the kidneys for this purpose or bind directly to potassium.", "C": "The lecture explicitly states that a method to quickly bring down extreme hyperkalemia is to give insulin, because \"in addition to glucose entering the cell, so does potassium.\" Insulin causes potassium to move into cells.", "D": "A and B are incorrect mechanisms. D is nonsensical. Insulin facilitates cellular uptake, it does not act in the kidneys for this purpose or bind directly to potassium."}}, {"id": 313, "category": ["Mixed set 3"], "stem": "According to the provided materials, which two physiological parameters are the most tightly regulated by the body due to their profound effect on protein structure and function?", "options": ["Blood glucose and sodium levels", "Body temperature and pH", "Blood pressure and heart rate", "Oxygen and carbon dioxide levels"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture states, \"The only other parameter that is as tightly controlled as pH by the body is temperature...because temperature changes can also cause proteins to denature.\" This highlights their critical importance for protein function.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 314, "category": ["Mixed set 3"], "stem": "What is the primary physiological purpose of oxygen in cellular metabolism?", "options": ["To initiate the process of glycolysis in the cytosol.", "To serve as the final electron acceptor in oxidative phosphorylation.", "To break down glucose into pyruvate.", "To directly generate heat for maintaining body temperature."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture on cell metabolism states that oxidative phosphorylation requires oxygen and that oxygen \"acts as a final electron acceptor that allows for the formation of ATP. That's the only purpose behind oxygen.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 315, "category": ["Mixed set 3"], "stem": "Which step of cellular energy metabolism yields the most ATP but is entirely dependent on the presence of oxygen?", "options": ["Glycolysis", "Citric acid cycle (Krebs cycle)", "Oxidative phosphorylation", "Conversion of pyruvate to lactate"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture provides a chart and text indicating that glycolysis yields 2 ATP, the Krebs cycle yields 2 ATP, but oxidative phosphorylation yields the \"biggest payoff energetically,\" which is 32 ATP.", "D": "This option is incorrect."}}, {"id": 316, "category": ["Mixed set 3"], "stem": "A patient is hyperventilating due to anxiety. This rapid breathing will \"blow off\" CO2, leading to which acid-base imbalance?", "options": ["Respiratory acidosis", "Metabolic alkalosis", "Respiratory alkalosis", "Metabolic acidosis"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture explains that hyperventilation \"depletes CO2...because we're blowing it off, and it reduces the amount of carbonic acid. As a result, we're left with blood that's too alkalotic.\"", "D": "This option is incorrect."}}, {"id": 317, "category": ["Mixed set 3"], "stem": "A patient has the following arterial blood gas (ABG) values: pH 7.31, PCO2 52 mmHg, HCO3 24 mEq/L. (normal pH 7.35-7.45, pCO2 35-45, HCO3 21-28)  How would this be interpreted?", "options": ["Metabolic acidosis, uncompensated", "Respiratory acidosis, uncompensated", "Respiratory alkalosis, partially compensated", "Metabolic alkalosis, fully compensated"], "correct": "B", "rationale": {"A": "A and D are incorrect because the primary problem is respiratory, as indicated by the abnormal PCO2. C is incorrect because the pH is acidotic, not alkalotic.", "B": "The pH (7.31) is below the normal range of 7.35-7.45, indicating acidosis. The PCO2 (52 mmHg) is above the normal range of 35-45, which is an acidotic change (more CO2 = more carbonic acid). The HCO3 (24 mEq/L) is within the normal range of 21-28. Since the PCO2 change matches the pH change, it is a respiratory acidosis, and since HCO3 is normal, it is uncompensated.", "C": "This option is incorrect.", "D": "A and D are incorrect because the primary problem is respiratory, as indicated by the abnormal PCO2. C is incorrect because the pH is acidotic, not alkalotic."}}, {"id": 318, "category": ["Mixed set 3"], "stem": "Which organ system provides a slower but more powerful compensation for acid-base imbalances by regulating bicarbonate and hydrogen ions?", "options": ["The respiratory system", "The cardiovascular system", "The renal system", "The hepatic system"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture states that the renal system compensates for acid-base imbalances by controlling bicarbonate and hydrogen ion excretion. It is described as a \"much slower effect...but it's a very strong effect,\" taking hours to days, in contrast to the rapid respiratory response.", "D": "This option is incorrect."}}, {"id": 319, "category": ["Mixed set 3"], "stem": "A chronic smoker develops changes in their bronchial epithelium where the normal ciliated columnar cells are replaced by simple squamous cells. This adaptation is known as:", "options": ["Hyperplasia", "Dysplasia", "Atrophy", "Metaplasia"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "Metaplasia is defined as the replacement of one mature cell type with a less mature, more resilient cell type in response to chronic injury. The lecture uses smoking causing the replacement of ciliated columnar cells with simple squamous cells as the classic example."}}, {"id": 320, "category": ["Mixed set 3"], "stem": "Which cellular adaptation is considered precancerous and is characterized by a complete derangement of cell growth, size, and number?", "options": ["Metaplasia", "Hypertrophy", "Dysplasia", "Atrophy"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture describes dysplasia as a \"complete derangement of cell control over the tissue\" where cell number and size change irregularly. It is explicitly stated to be \"precancerous\" and \"never adaptive.\"", "D": "This option is incorrect."}}, {"id": 321, "category": ["Mixed set 3"], "stem": "Fatty liver disease can result from chronic heavy ethanol consumption because a byproduct of ethanol metabolism, acetaldehyde, directly:", "options": ["Blocks the liver's ability to metabolize fat.", "Increases the synthesis of cholesterol.", "Causes hypertrophy of liver cells.", "Stimulates the breakdown of glycogen."], "correct": "A", "rationale": {"A": "B, C, and D are incorrect mechanisms. The key issue described is the impairment of fat metabolism.", "B": "B, C, and D are incorrect mechanisms. The key issue described is the impairment of fat metabolism.", "C": "B, C, and D are incorrect mechanisms. The key issue described is the impairment of fat metabolism.", "D": "B, C, and D are incorrect mechanisms. The key issue described is the impairment of fat metabolism."}}, {"id": 322, "category": ["Mixed set 3"], "stem": "Which form of necrotic cell death is characterized by a \"cheesy\" appearance and is classically seen in lung lymph nodes affected by tuberculosis?", "options": ["Coagulative necrosis", "Liquefactive necrosis", "Fat necrosis", "Caseous necrosis"], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture defines caseous necrosis, noting it happens in tissues with a loose network of connective tissue. The name comes from its resemblance to cottage cheese, and the classic example provided is necrosis in lung lymph nodes due to tuberculosis infection."}}, {"id": 323, "category": ["Mixed set 3"], "stem": "How does apoptosis fundamentally differ from necrosis?", "options": ["Apoptosis is a passive process of cell explosion, while necrosis is a programmed implosion.", "Apoptosis is a programmed, controlled cell death, while necrosis is an uncontrolled \"cell explosion\" due to injury.", "Apoptosis only occurs due to external injury, while necrosis is triggered by internal DNA errors.", "Apoptosis triggers a strong inflammatory response, while necrosis does not."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture distinguishes the two by describing necrosis as the cell looking like it \"exploded\" due to irreversible injury, while apoptosis is a \"programmed cell death\" where the cell looks like it has \"imploded\" or collapsed on itself as a protective measure.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 324, "category": ["Mixed set 3"], "stem": "The resting membrane potential of a neuron is primarily established and maintained by:", "options": ["The equal distribution of positive and negative ions across the membrane.", "The continuous influx of calcium ions.", "The Na+/K+ ATPase pump creating and maintaining Na+ and K+ concentration gradients.", "The closing of all ion channels in the membrane."], "correct": "C", "rationale": {"A": "A is incorrect; there is an unequal distribution. B is incorrect; calcium has a very low permeability at rest. D is incorrect; leak channels are open at rest, particularly for potassium.", "B": "This option is incorrect.", "C": "The lecture on resting membrane potential identifies the sodium-potassium pump as the \"workhorse of the cell\" that \"helps establish the concentration gradient for potassium and sodium,\" which is the fundamental basis for the resting potential.", "D": "This option is incorrect."}}, {"id": 325, "category": ["Mixed set 3"], "stem": "The rising phase of the action potential (depolarization) is caused by the rapid:", "options": ["Influx of sodium ions through voltage-gated channels.", "Efflux of potassium ions through leak channels.", "Influx of chloride ions.", "Action of the sodium-potassium pump."], "correct": "A", "rationale": {"A": "The lecture explains that when the membrane potential reaches a threshold value (around -55mV), it \"triggers the opening of voltage-gated sodium channels... when these open, sodium rushes into the cell,\" causing the rapid depolarization phase of the action potential.", "B": "B describes repolarization. C would cause hyperpolarization or an IPSP. D is involved in maintaining the long-term gradient but not the rapid depolarization event itself.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 326, "category": ["Mixed set 3"], "stem": "The primary function of myelination on an axon is to:", "options": ["Provide structural support to the neuron.", "Decrease the amount of neurotransmitter needed for signaling.", "Slow down the action potential for more precise control.", "Speed up the rate of action potential propagation."], "correct": "D", "rationale": {"A": "A and B are incorrect functions. C is the opposite of myelin's actual function.", "B": "A and B are incorrect functions. C is the opposite of myelin's actual function.", "C": "This option is incorrect.", "D": "A and B are incorrect functions. C is the opposite of myelin's actual function."}}, {"id": 327, "category": ["Mixed set 3"], "stem": "The release of neurotransmitters from the presynaptic axon terminal is directly triggered by the influx of which ion?", "options": ["Sodium (Na+)", "Potassium (K+)", "Calcium (Ca2+)", "Chloride (Cl-)"], "correct": "C", "rationale": {"A": "A, B, and D are not the direct trigger for vesicle exocytosis.", "B": "A, B, and D are not the direct trigger for vesicle exocytosis.", "C": "The lecture on chemical synapses explains that the depolarization from the action potential reaching the axon terminal stimulates voltage-gated calcium channels. The resulting \"rush of calcium into this terminal actually stimulates these vesicles of neurotransmitter to exocytose.\"", "D": "A, B, and D are not the direct trigger for vesicle exocytosis."}}, {"id": 328, "category": ["Mixed set 3"], "stem": "Glutamic acid (glutamate) and GABA are the primary workhorses for neurotransmission in the central nervous system. They are best described, respectively, as:", "options": ["Inhibitory and excitatory", "Excitatory and inhibitory", "Modulatory and modulatory", "Excitatory and excitatory"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture states that glutamic acid (glutamate) \"is the ubiquitous stimulatory neurotransmitter,\" and GABA is described as \"the generic inhibitory neurotransmitter.\"", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 329, "category": ["Mixed set 3"], "stem": "In the neuromuscular junction, the action potential in the motor neuron leads to the release of which neurotransmitter to stimulate the skeletal muscle cell?", "options": ["Dopamine", "Serotonin", "Norepinephrine", "Acetylcholine"], "correct": "D", "rationale": {"A": "A, B, and C are important neurotransmitters but are not the primary one released at the neuromuscular junction to stimulate skeletal muscle.", "B": "A, B, and C are important neurotransmitters but are not the primary one released at the neuromuscular junction to stimulate skeletal muscle.", "C": "A, B, and C are important neurotransmitters but are not the primary one released at the neuromuscular junction to stimulate skeletal muscle.", "D": "A, B, and C are important neurotransmitters but are not the primary one released at the neuromuscular junction to stimulate skeletal muscle."}}, {"id": 330, "category": ["Mixed set 3"], "stem": "Neuroactive peptides differ from traditional neurotransmitters in that they typically:", "options": ["Act faster than neurotransmitters.", "Are released alone to cause direct excitation.", "Modulate the postsynaptic cell's response to a co-released neurotransmitter.", "Are only involved in inhibitory synapses."], "correct": "C", "rationale": {"A": "A, B, and D describe characteristics of traditional neurotransmitters, not the modulatory role of neuroactive peptides.", "B": "A, B, and D describe characteristics of traditional neurotransmitters, not the modulatory role of neuroactive peptides.", "C": "The lecture explains that neuroactive peptides \"are often co-released with neurotransmitters and modify the response in the postsynaptic cell,\" giving an example of modulating receptor production.", "D": "A, B, and D describe characteristics of traditional neurotransmitters, not the modulatory role of neuroactive peptides."}}, {"id": 331, "category": ["Mixed set 3"], "stem": "Which brain structure is responsible for maintaining baseline vegetative functions like heart rate and breathing?", "options": ["Cerebellum", "Cerebrum", "Brain Stem", "Basal ganglia"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The lecture identifies the brain stem (medulla, pons, midbrain) as being \"responsible for baseline function... It's really the part of the brain that keeps your heart pumping and your lungs breathing.\"", "D": "This option is incorrect."}}, {"id": 332, "category": ["Mixed set 3"], "stem": "A person learning to sign their name is a conscious process. After years of practice, the signature becomes an automatic motor pattern stored primarily in which brain region?", "options": ["Hypothalamus", "Cerebellum", "Primary motor cortex", "Thalamus"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture states that the cerebellum is \"extremely important in learned motor movements. It helps regulate motor movements, and it stores all of our motor patterns,\" using the example of developing a signature.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 333, "category": ["Mixed set 3"], "stem": "A patient suffers a stroke affecting Wernicke's area. Which of the following deficits is most likely?", "options": ["Inability to generate any speech.", "Inability to comprehend spoken or written language.", "Paralysis on the right side of the body.", "Loss of short-term memory."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The lecture identifies Wernicke's area as \"critical for the comprehension of language.\" An injury to this area results in receptive aphasia, where a patient can generate speech, but it may be nonsensical because their ability to understand is damaged.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 334, "category": ["Mixed set 3"], "stem": "The composition of cerebrospinal fluid (CSF) differs from plasma in that CSF has a significantly lower concentration of potassium. What is the primary purpose of this difference?", "options": ["To increase the excitability of central nervous system neurons.", "To reduce the excitability of neurons and decrease the risk of seizures.", "To facilitate the transport of glucose into the brain.", "To provide a source of energy for glial cells."], "correct": "B", "rationale": {"A": "A is the opposite of the intended effect. C and D are not the primary reasons cited for the low potassium concentration.", "B": "The lecture explains that the composition of CSF is designed to \"reduce excitability.\" A lower extracellular potassium increases the concentration gradient for potassium to leave the cell, making the cell's interior more negative (hyperpolarized) and
