<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathopathophysiology Exam 1 Practice</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-text: #991b1b;
            --border-color: #e2e8f0;
            --selected-bg: #e0e7ff;
            --selected-border: #6366f1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0 0 10px 0; color: var(--primary); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Start Screen */
        #start-screen { display: block; }
        .category-list { display: grid; gap: 10px; margin-bottom: 20px; }
        .category-item {
            display: flex; gap: 10px; align-items: stretch;
        }
        .category-btn {
            flex-grow: 1;
            background: white; border: 2px solid var(--border-color); padding: 15px; border-radius: 8px;
            font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .category-btn:hover { border-color: var(--primary); }
        .category-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .badge { background: #e2e8f0; color: #475569; padding: 4px 10px; border-radius: 20px; font-size: 14px; }
        .category-btn.active .badge { background: white; color: var(--primary); }
        
        .reset-btn {
            background: white; border: 2px solid var(--border-color); color: var(--danger);
            padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .reset-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .start-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .start-btn:hover { background: var(--primary-hover); }

        /* Quiz Screen */
        #quiz-screen { display: none; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .question-stem { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        
        .options-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        .option-wrapper { display: flex; flex-direction: column; gap: 4px; }
        
        .option-btn {
            background: white; border: 2px solid var(--border-color); padding: 15px; border-radius: 8px;
            font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s; width: 100%;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f1f5f9; }
        .option-btn.selected { border-color: var(--selected-border); background: var(--selected-bg); }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-text); color: var(--correct-text); font-weight: bold; }
        .option-btn.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-text); color: var(--incorrect-text); }
        .option-btn:disabled { cursor: default; }

        .rationale-text {
            display: none; padding: 10px 15px; font-size: 14px; color: #334155;
            background: #f8fafc; border-left: 4px solid var(--border-color); border-radius: 4px;
            white-space: pre-wrap; margin-top: 4px;
        }

        .controls { display: flex; justify-content: space-between; margin-top: 20px; }
        .control-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .btn-outline { background: white; border: 2px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { background: #f1f5f9; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .back-to-sets-container { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px dashed var(--border-color); }

        /* End Screen */
        #end-screen { display: none; text-align: center; }
        .score-display { font-size: 48px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #f1f5f9; padding: 20px; border-radius: 8px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        
        .mode-toggle { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        .mode-btn { padding: 8px 16px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; border-radius: 20px; }
        .mode-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pathophysiology Exam 1 Practice</h1>
            <p style="color: var(--text-muted)">Hi Crystal and friends! This is just a test; it may be a bit buggy 🐛🐞🦗. </p>
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="card">
            <h2>Select a Category</h2>
            <div class="category-list" id="categories-container"></div>
            
            <div class="mode-toggle" style="margin-bottom: 20px;">
                <button class="mode-btn active" id="mode-sequential">Sequential</button>
                <button class="mode-btn" id="mode-random">Randomized</button>
            </div>

            <button class="start-btn" onclick="startPractice()">Start Practice</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card">
            <div class="quiz-header">
                <span id="question-progress" style="font-weight: 600; color: var(--text-muted)">Question 1 / 50</span>
                <span id="question-category" class="badge">Week 1</span>
            </div>
            
            <div class="question-stem" id="question-text"></div>
            
            <div class="options-list" id="options-container"></div>

            <div class="controls">
                <button class="control-btn btn-outline" id="prev-btn" onclick="prevQuestion()">Previous</button>
                <button class="control-btn btn-primary" id="check-btn" onclick="checkAnswer()">Check Answer</button>
                <button class="control-btn btn-primary" id="next-btn" onclick="nextQuestion()">Next</button>
            </div>
            <div class="back-to-sets-container">
                <button class="control-btn btn-outline" style="padding: 8px 16px; font-size: 14px;" onclick="backToSets()">Back to Sets</button>
            </div>
        </div>

    </div>

    <script>
        const questionData = [{"id": 0, "category": ["Questions Mixed set 1"], "stem": "Which of the following best defines the term 'pathogenesis'?", "options": ["The initial cause of an injury or disease.", "The observable consequences of a disease, such as a fever or rash.", "The physiologic development of a disease, describing the mechanism of abnormal function.", "A disease with an unknown cause."], "correct": "C", "rationale": {"A": "A is the definition of etiology.", "B": "B describes clinical manifestations (signs and symptoms).", "C": "Pathogenesis is defined as the specific mechanism by which an original injury interacts with physiologic processes to produce abnormal function. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "D": "D describes an idiopathic condition."}}, {"id": 1, "category": ["Questions Mixed set 1"], "stem": "A patient reports feeling nauseous and fatigued. A nurse observes that the patient has a rash and a fever of 101.5\u00b0F. Which of the following are considered signs?", "options": ["Nausea and fatigue.", "Rash and fever.", "Nausea and rash.", "Fatigue and fever."], "correct": "B", "rationale": {"A": "A: Nausea and fatigue are symptoms, as they are subjectively experienced and must be reported by the patient.", "B": "Signs are objective clinical manifestations that can be measured or observed by a healthcare provider. A rash can be seen, and a fever can be measured with a thermometer. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "C": "C & D include a mix of signs and symptoms.", "D": "C & D include a mix of signs and symptoms."}}, {"id": 2, "category": ["Questions Mixed set 1"], "stem": "A 65-year-old man is diagnosed with primary hypertension. His physician informs him that the cause is unknown. Which term best describes this type of condition?", "options": ["Iatrogenic", "Idiopathic", "Intrinsic", "Infectious"], "correct": "B", "rationale": {"A": "A: Iatrogenic refers to a condition inadvertently caused by medical care.", "B": "The term idiopathic is used to describe diseases of unknown cause. Primary (or essential) hypertension is a classic example. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "C": "C: Intrinsic refers to a disease caused by the body itself, like an autoimmune disorder.", "D": "D: Infectious refers to a disease caused by a pathogenic organism."}}, {"id": 3, "category": ["Questions Mixed set 1"], "stem": "Total body water (TBW) accounts for approximately 60% of body weight. Which fluid compartment contributes the most to this percentage?", "options": ["Intracellular fluid", "Interstitial fluid", "Plasma", "Transcellular fluid"], "correct": "A", "rationale": {"A": "Intracellular fluid contributes about 40% of total body weight, making it the largest single fluid compartment. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]", "B": "B: Interstitial fluid contributes about 15% of body weight.", "C": "C: Plasma contributes about 5% of body weight.", "D": "D: The transcellular compartment is a very small sub-compartment of the extracellular fluid."}}, {"id": 4, "category": ["Questions Mixed set 1"], "stem": "A patient with severe liver disease presents with significant edema. The accumulation of fluid in the interstitial space is most likely caused by:", "options": ["Increased capillary blood pressure.", "Lymphatic obstruction.", "Decreased plasma oncotic pressure.", "Increased interstitial oncotic pressure."], "correct": "C", "rationale": {"A": "A, B, and D are other potential causes of edema but are not the primary mechanism associated with liver failure.", "B": "A, B, and D are other potential causes of edema but are not the primary mechanism associated with liver failure.", "C": "The liver is responsible for synthesizing albumin, the main protein contributing to plasma oncotic pressure. In liver disease, albumin production falls (hypoalbuminemia), reducing the \"pulling\" force that keeps fluid inside capillaries and leading to edema. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]", "D": "A, B, and D are other potential causes of edema but are not the primary mechanism associated with liver failure."}}, {"id": 5, "category": ["Questions Mixed set 1"], "stem": "During acute inflammation, capillaries become more permeable, allowing plasma proteins like albumin to leak into the interstitial space. This leads to edema primarily by:", "options": ["Increasing capillary blood pressure.", "Increasing interstitial oncotic pressure.", "Decreasing interstitial hydrostatic pressure.", "Decreasing plasma oncotic pressure."], "correct": "B", "rationale": {"A": "A & C are incorrect mechanisms in this context.", "B": "When albumin leaks out of the permeable capillaries into the interstitial space, it exerts an oncotic (pulling) pressure that draws fluid out of the capillaries, causing edema. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]", "C": "A & C are incorrect mechanisms in this context.", "D": "D: Plasma oncotic pressure would decrease if albumin leaves the bloodstream, but the primary cause of the fluid shift is the new pulling force in the interstitial space."}}, {"id": 6, "category": ["Questions Mixed set 1"], "stem": "A patient is experiencing a state of acidosis. How would this affect serum potassium levels?", "options": ["Potassium would shift into the cells, causing hypokalemia.", "Potassium would shift out of the cells, causing hyperkalemia.", "It would have no effect on potassium levels.", "It would increase the renal excretion of potassium, causing hypokalemia."], "correct": "B", "rationale": {"A": "A describes what happens during alkalosis.", "B": "In a state of acidosis, there is an excess of hydrogen ions (H+) in the extracellular fluid. To buffer this, H+ ions move into the cells. To maintain electrical neutrality, cells swap a potassium ion (K+) for every hydrogen ion that enters, causing K+ to move out of the cells and elevating serum potassium levels (hyperkalemia). [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 4_default - Clean.txt]", "C": "C is incorrect; pH has a significant impact on potassium balance.", "D": "D is incorrect; acidosis leads to a shift, not primarily a change in renal excretion in the acute phase."}}, {"id": 7, "category": ["Questions Mixed set 1"], "stem": "What is the primary role of the sodium-potassium ATPase pump in maintaining cellular homeostasis?", "options": ["To regulate body temperature by generating heat.", "To maintain the concentration gradients for sodium and potassium, which is critical for cell volume and excitability.", "To facilitate the passive diffusion of ions across the cell membrane.", "To directly produce ATP for cellular processes."], "correct": "B", "rationale": {"A": "A is incorrect; while metabolism generates heat, this is not the pump's primary role.", "B": "The sodium-potassium ATPase pump actively transports 3 Na+ ions out of the cell and 2 K+ ions into the cell, maintaining the high extracellular sodium and high intracellular potassium concentrations necessary for stable cell volume and the resting membrane potential of excitable cells. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 2_default - Clean.txt]", "C": "C is incorrect; the pump uses active transport, not passive diffusion.", "D": "D is incorrect; the pump consumes ATP, it does not produce it."}}, {"id": 8, "category": ["Questions Mixed set 1"], "stem": "A patient is given a large infusion of isotonic IV fluids, leading to isotonic volume excess. This condition can be mimicked by the hypersecretion of which hormone?", "options": ["Antidiuretic hormone (ADH)", "Aldosterone", "Cortisol", "Angiotensin II"], "correct": "B", "rationale": {"A": "A: ADH primarily causes water retention, which would lead to a hypotonic alteration if in excess.", "B": "Hypersecretion of aldosterone causes the kidneys to retain excess sodium and water in proportional amounts, leading to an isotonic volume expansion, similar to what occurs with excessive isotonic IV fluid administration. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 4_default - Clean.txt]", "C": "C: Cortisol has weaker mineralocorticoid effects than aldosterone.", "D": "D: Angiotensin II stimulates aldosterone secretion but also has direct vasoconstrictor effects."}}, {"id": 9, "category": ["Questions Mixed set 1"], "stem": "A cell is placed in a hypertonic solution. What is the expected outcome?", "options": ["The cell will swell as water moves in.", "The cell will shrink as water moves out.", "The cell will maintain its volume.", "The cell will burst due to excessive osmotic pressure."], "correct": "B", "rationale": {"A": "A & D describe what happens in a hypotonic solution.", "B": "A hypertonic solution has a higher concentration of solutes (and therefore a lower concentration of water) than the cell's interior. Due to osmosis, water will move from its area of higher concentration (inside the cell) to its area of lower concentration (outside the cell), causing the cell to shrink. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 2_default - Clean.txt]", "C": "C describes what happens in an isotonic solution.", "D": "A & D describe what happens in a hypotonic solution."}}, {"id": 10, "category": ["Questions Mixed set 1"], "stem": "What is the primary function of the bicarbonate-carbonic acid buffer system in the body?", "options": ["To regulate body temperature.", "To transport oxygen in the blood.", "To maintain the pH of body fluids within a narrow range.", "To produce ATP during metabolism."], "correct": "C", "rationale": {"A": "A, B, and D are incorrect functions for this specific system.", "B": "A, B, and D are incorrect functions for this specific system.", "C": "Buffer systems, like the bicarbonate-carbonic acid system, are composed of weak acids and bases that can absorb or donate hydrogen ions to prevent significant fluctuations in pH. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 5_default - Clean.txt]", "D": "A, B, and D are incorrect functions for this specific system."}}, {"id": 11, "category": ["Questions Mixed set 1"], "stem": "A patient with COPD is hypoventilating. An arterial blood gas (ABG) analysis would most likely reveal which of the following conditions?", "options": ["Respiratory alkalosis", "Metabolic acidosis", "Respiratory acidosis", "Metabolic alkalosis"], "correct": "C", "rationale": {"A": "A would be caused by hyperventilation (blowing off too much CO2).", "B": "B & D are metabolic in origin, not directly caused by a change in respiratory function.", "C": "Hypoventilation leads to the retention of CO2. Increased CO2 in the blood shifts the bicarbonate buffer system equation to the right, leading to the formation of more carbonic acid (H2CO3) and a drop in pH, which is respiratory acidosis. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 5_default - Clean.txt]", "D": "B & D are metabolic in origin, not directly caused by a change in respiratory function."}}, {"id": 12, "category": ["Questions Mixed set 1"], "stem": "In the final step of aerobic metabolism, oxidative phosphorylation, what is the primary purpose of oxygen?", "options": ["To initiate the glycolysis pathway.", "To act as the final electron acceptor, allowing for the maximum yield of ATP.", "To convert pyruvate into lactate.", "To help break down carbohydrates into glucose."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect roles for oxygen in the metabolic pathway. Glycolysis does not require oxygen.", "B": "Oxygen's sole purpose in metabolism is to act as the final electron acceptor in the electron transport chain, a process which allows for the vast majority of ATP (around 32 ATP) to be produced during oxidative phosphorylation. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 5_default - Clean.txt]", "C": "A, C, and D are incorrect roles for oxygen in the metabolic pathway. Glycolysis does not require oxygen.", "D": "A, C, and D are incorrect roles for oxygen in the metabolic pathway. Glycolysis does not require oxygen."}}, {"id": 13, "category": ["Questions Mixed set 1"], "stem": "During a state of hypoxia, ATP production drops significantly. A direct and immediate consequence of this is:", "options": ["Increased activity of the sodium-potassium pumps.", "Failure of the sodium-potassium pumps, leading to intracellular sodium accumulation and cellular swelling.", "A decrease in intracellular lactate.", "Swelling of the nucleus, leading to apoptosis."], "correct": "B", "rationale": {"A": "A is the opposite of what happens.", "B": "Hypoxic injury leads to a drop in ATP production. The sodium-potassium pump is an active transporter that requires ATP. Without ATP, the pump fails, sodium accumulates inside the cell, and water follows via osmosis, causing acute cellular swelling. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 6_default_default - Clean.txt]", "C": "C is incorrect; glycolysis increases, leading to more lactate.", "D": "D: Swelling of the mitochondria, not the nucleus, is a key step toward irreversible injury."}}, {"id": 14, "category": ["Questions Mixed set 1"], "stem": "The cellular adaptation where cells increase in number in response to a stressor is known as:", "options": ["Atrophy", "Hypertrophy", "Hyperplasia", "Metaplasia"], "correct": "C", "rationale": {"A": "A: Atrophy is a decrease in cell size.", "B": "B: Hypertrophy is an increase in cell size.", "C": "Hyperplasia is an adaptive response characterized by an increase in the number of cells in a tissue or organ. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 7_default_default - Clean.txt]", "D": "D: Metaplasia is the replacement of one mature cell type with another."}}, {"id": 15, "category": ["Questions Mixed set 1"], "stem": "In a chronic smoker, the normal ciliated columnar epithelial cells of the airways are often replaced by stratified squamous epithelial cells. This adaptation is called:", "options": ["Dysplasia", "Anaplasia", "Metaplasia", "Hypertrophy"], "correct": "C", "rationale": {"A": "A: Dysplasia is disordered cell growth.", "B": "B: Anaplasia is a hallmark of malignant tumors.", "C": "Metaplasia is a reversible change where one differentiated cell type is replaced by another cell type to better withstand a chronic injury, such as the replacement of delicate ciliated cells with more resilient squamous cells in a smoker's airway. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 7_default_default - Clean.txt]", "D": "D: Hypertrophy is an increase in cell size."}}, {"id": 16, "category": ["Questions Mixed set 1"], "stem": "Which of the following cellular changes is considered a derangement of cell growth and is often a precursor to cancer?", "options": ["Atrophy", "Metaplasia", "Dysplasia", "Hyperplasia"], "correct": "C", "rationale": {"A": "A, B, and D are cellular adaptations to stress, and while they can become pathological, dysplasia is inherently disordered.", "B": "A, B, and D are cellular adaptations to stress, and while they can become pathological, dysplasia is inherently disordered.", "C": "Dysplasia is characterized by a complete derangement of cell control, leading to variations in cell size, shape, and organization. It is not considered an adaptive process and is a precancerous change. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 7_default_default - Clean.txt]", "D": "A, B, and D are cellular adaptations to stress, and while they can become pathological, dysplasia is inherently disordered."}}, {"id": 17, "category": ["Questions Mixed set 1"], "stem": "A patient suffers a heart attack (myocardial infarction). A biopsy of the cardiac tissue would most likely show which type of necrosis?", "options": ["Liquefactive necrosis", "Caseous necrosis", "Fat necrosis", "Coagulative necrosis"], "correct": "D", "rationale": {"A": "A typically occurs in the brain.", "B": "B is associated with tuberculosis infection.", "C": "C occurs in tissues rich in fatty deposits, like the pancreas.", "D": "Coagulative necrosis is the general term for tissue death resulting from an external cause like ischemia (lack of blood flow), which is what happens in a myocardial infarction. The proteins and cellular components clump up, or coagulate. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 8_default_default - Clean.txt]"}}, {"id": 18, "category": ["Questions Mixed set 1"], "stem": "Apoptosis differs from necrosis in that apoptosis is:", "options": ["A passive process resulting from irreversible cell injury.", "A programmed cell death process that involves cellular shrinkage and implosion.", "Always associated with a significant inflammatory response.", "Characterized by cellular swelling and lysis."], "correct": "B", "rationale": {"A": "A & D describe necrosis, which is a passive, uncontrolled process resulting from injury, characterized by swelling and lysis.", "B": "Apoptosis is a controlled, programmed \"cell suicide\" where the cell implodes, shrinks, and its components are neatly packaged for removal, avoiding a major inflammatory response. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 8_default_default - Clean.txt]", "C": "C is incorrect; necrosis, not apoptosis, is associated with significant inflammation.", "D": "A & D describe necrosis, which is a passive, uncontrolled process resulting from injury, characterized by swelling and lysis."}}, {"id": 19, "category": ["Questions Mixed set 1"], "stem": "A patient presents with generalized weakness, leg cramps, and \"strong\" heartbeats after doubling their daily dose of furosemide (a diuretic). These symptoms are most indicative of an imbalance in which electrolyte?", "options": ["Sodium", "Calcium", "Potassium", "Magnesium"], "correct": "C", "rationale": {"A": "A, B, and D are less likely to be the primary cause of this specific constellation of symptoms related to diuretic use.", "B": "A, B, and D are less likely to be the primary cause of this specific constellation of symptoms related to diuretic use.", "C": "Furosemide is a diuretic that can cause significant potassium loss (hypokalemia). Low potassium levels disrupt the resting membrane potential of excitable cells like neurons and muscle cells, leading to muscle weakness, cramps, and cardiac arrhythmias (which can be perceived as \"strong\" or irregular heartbeats).", "D": "A, B, and D are less likely to be the primary cause of this specific constellation of symptoms related to diuretic use."}}, {"id": 20, "category": ["Questions Mixed set 1"], "stem": "What primarily establishes the resting membrane potential of a neuron?", "options": ["The equal distribution of all ions across the membrane.", "The movement of proteins across the membrane.", "The differential permeability of the membrane to various ions and their concentration gradients.", "The exclusive action of the sodium-potassium pump."], "correct": "C", "rationale": {"A": "A is incorrect; ions are unequally distributed.", "B": "B is incorrect; proteins are largely impermeable.", "C": "The resting membrane potential is a summation of the equilibrium potentials for each permeable ion, weighted by their relative permeability. It is primarily driven by the high permeability of the membrane to potassium (K+) and the concentration gradient pushing K+ out of the cell. [cite: Normal Function of the Nervous System Part 2_default - Clean.txt]", "D": "D is incorrect; the pump helps maintain the gradients but the potential itself is established by ion flux through leak channels."}}, {"id": 21, "category": ["Questions Mixed set 1"], "stem": "During the depolarization phase of an action potential, which event occurs?", "options": ["Voltage-gated potassium channels open, and K+ rushes out.", "Voltage-gated sodium channels open, and Na+ rushes in.", "The sodium-potassium pump becomes hyperactive.", "Ligand-gated chloride channels open, and Cl- rushes in."], "correct": "B", "rationale": {"A": "A describes the repolarization phase.", "B": "When the neuron's membrane potential reaches the threshold value (around -55mV), voltage-gated sodium channels open, allowing a rapid influx of positive sodium ions, which causes the sharp depolarization phase of the action potential. [cite: Normal Function of the Nervous System Part 3_default - Clean.txt]", "C": "C is involved in restoring the gradient after the action potential, not causing depolarization.", "D": "D describes an inhibitory postsynaptic potential (IPSP), not an action potential."}}, {"id": 22, "category": ["Questions Mixed set 1"], "stem": "What is the function of myelination in the nervous system?", "options": ["To slow down the transmission of electrical impulses for better control.", "To provide structural support to the neuron's cell body.", "To increase the speed of action potential propagation down the axon.", "To store neurotransmitters for release at the synapse."], "correct": "C", "rationale": {"A": "A is the opposite of its function.", "B": "B & D are incorrect functions of myelin.", "C": "Myelin acts as an insulator, allowing the electrical signal to \"jump\" between the unmyelinated gaps called nodes of Ranvier. This process, known as saltatory conduction, greatly increases the velocity of the action potential. [cite: Normal Function of the Nervous System Part 1_default - Clean.txt]", "D": "B & D are incorrect functions of myelin."}}, {"id": 23, "category": ["Questions Mixed set 1"], "stem": "The neuromuscular junction is a classic example of a chemical synapse. What is the primary neurotransmitter released at this junction to stimulate skeletal muscle contraction?", "options": ["Dopamine", "Serotonin", "Acetylcholine", "GABA"], "correct": "C", "rationale": {"A": "A, B, and D are important neurotransmitters but are not the primary one at the skeletal neuromuscular junction.", "B": "A, B, and D are important neurotransmitters but are not the primary one at the skeletal neuromuscular junction.", "C": "Acetylcholine is the neurotransmitter released by motor neurons at the neuromuscular junction. It binds to receptors on the skeletal muscle cell, causing depolarization and triggering contraction. [cite: Normal Function of the Nervous System Part 4_default - Clean.txt]", "D": "A, B, and D are important neurotransmitters but are not the primary one at the skeletal neuromuscular junction."}}, {"id": 24, "category": ["Questions Mixed set 1"], "stem": "Glutamate is the primary ______ neurotransmitter in the central nervous system, while GABA is the primary ______ neurotransmitter.", "options": ["inhibitory; excitatory", "excitatory; inhibitory", "modulatory; excitatory", "excitatory; modulatory"], "correct": "B", "rationale": {"A": "A has the roles reversed.", "B": "Glutamate is the ubiquitous excitatory neurotransmitter in the CNS, causing depolarization in postsynaptic neurons. GABA is the primary inhibitory neurotransmitter, causing hyperpolarization. [cite: Normal Function of the Nervous System Part 4_default - Clean.txt]", "C": "C & D incorrectly categorize these primary neurotransmitters.", "D": "This option is incorrect."}}, {"id": 25, "category": ["Questions Mixed set 1"], "stem": "Which division of the nervous system is responsible for the \"fight-or-flight\" response?", "options": ["Somatic nervous system", "Parasympathetic nervous system", "Central nervous system", "Sympathetic nervous system"], "correct": "D", "rationale": {"A": "A controls voluntary skeletal muscle.", "B": "B is responsible for \"rest and digest\" functions.", "C": "C is the brain and spinal cord, which contains the control centers but is not the division itself.", "D": "The sympathetic division of the autonomic nervous system is responsible for activating stress-related responses, preparing the body for \"fight or flight\" by increasing heart rate, mobilizing energy, etc. [cite: Normal Function of the Nervous System Part 1_default - Clean.txt]"}}, {"id": 26, "category": ["Questions Mixed set 1"], "stem": "A patient experiences a stroke that damages Wernicke's area. Which of the following deficits is most likely?", "options": ["Inability to execute motor commands for speech (expressive aphasia).", "Inability to comprehend spoken and written language (receptive aphasia).", "Paralysis of the facial muscles.", "Loss of vision."], "correct": "B", "rationale": {"A": "A is expressive aphasia, caused by damage to Broca's area.", "B": "Wernicke's area is critical for the comprehension of language. Damage to this area results in receptive aphasia, where a person can generate fluent but nonsensical speech because they cannot understand its meaning. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "C": "C & D are functions controlled by other brain regions.", "D": "C & D are functions controlled by other brain regions."}}, {"id": 27, "category": ["Questions Mixed set 1"], "stem": "The primary motor cortex and the primary somatosensory cortex are separated by which anatomical landmark?", "options": ["The lateral fissure", "The longitudinal fissure", "The central sulcus", "The parietooccipital notch"], "correct": "C", "rationale": {"A": "A, B, and D are other fissures or notches in the cerebrum but do not separate these two specific cortical areas.", "B": "A, B, and D are other fissures or notches in the cerebrum but do not separate these two specific cortical areas.", "C": "The central sulcus is the anatomical groove that separates the frontal lobe (containing the primary motor cortex) from the parietal lobe (containing the primary somatosensory cortex). [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "D": "A, B, and D are other fissures or notches in the cerebrum but do not separate these two specific cortical areas."}}, {"id": 28, "category": ["Questions Mixed set 1"], "stem": "The composition of cerebrospinal fluid (CSF) differs from plasma. The significantly lower concentration of potassium in CSF serves to:", "options": ["Increase the excitability of neurons to promote faster signaling.", "Reduce the excitability of neurons to prevent spontaneous firing and seizures.", "Provide a primary energy source for brain cells.", "Enhance the transport of proteins across the blood-brain barrier."], "correct": "B", "rationale": {"A": "A is the opposite of the intended effect.", "B": "A lower extracellular potassium concentration increases the concentration gradient for potassium to leave the cell. This makes the resting membrane potential more negative (hyperpolarized), moving it further from the threshold for firing an action potential, thus reducing overall excitability. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "C": "C & D are incorrect functions related to potassium levels in CSF.", "D": "C & D are incorrect functions related to potassium levels in CSF."}}, {"id": 29, "category": ["Questions Mixed set 1"], "stem": "In the autonomic nervous system, preganglionic neurons of both the sympathetic and parasympathetic divisions release which neurotransmitter?", "options": ["Norepinephrine", "Epinephrine", "Acetylcholine", "Dopamine"], "correct": "C", "rationale": {"A": "A & B are primarily associated with the second synapse in the sympathetic division.", "B": "A & B are primarily associated with the second synapse in the sympathetic division.", "C": "In the two-neuron chain of the autonomic nervous system, the first synapse (between the preganglionic and postganglionic neuron) is always cholinergic, meaning acetylcholine is the neurotransmitter, for both the sympathetic and parasympathetic divisions. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "D": "D is a central neurotransmitter, not the primary one at this specific peripheral synapse."}}, {"id": 30, "category": ["Questions Mixed set 1"], "stem": "Hormones are defined as chemical messengers that are released directly into the:", "options": ["Synaptic cleft", "Lymphatic system", "Bloodstream", "Target cell cytoplasm"], "correct": "C", "rationale": {"A": "A describes neurotransmission.", "B": "B & D are incorrect release sites for hormones.", "C": "The definition of an endocrine gland and a hormone is that the chemical messenger is released directly into the bloodstream to travel to distant target cells. [cite: Normal Function of the Endocrine System Part 1 - Clean.txt]", "D": "B & D are incorrect release sites for hormones."}}, {"id": 31, "category": ["Questions Mixed set 1"], "stem": "Steroid hormones, being lipid-soluble, typically exert their effects on a target cell by:", "options": ["Binding to a membrane receptor and activating a second messenger system.", "Opening or closing ion channels in the plasma membrane.", "Diffusing across the cell membrane and binding to a nuclear receptor to alter gene expression.", "Being transported into the cell via active transport."], "correct": "C", "rationale": {"A": "A & B describe the mechanisms of water-soluble (peptide/amine) hormones.", "B": "A & B describe the mechanisms of water-soluble (peptide/amine) hormones.", "C": "Being derived from cholesterol, steroid hormones are lipid-soluble and can easily pass through the cell membrane. They typically bind to intracellular or nuclear receptors, which then act as transcription factors to turn genes on or off. [cite: Normal Function of the Endocrine System Part 2 - Clean.txt]", "D": "D is incorrect; they diffuse passively."}}, {"id": 32, "category": ["Questions Mixed set 1"], "stem": "The hierarchical control of many hormone systems involves a specific sequence of glands. Which sequence is correct?", "options": ["Anterior Pituitary -> Hypothalamus -> Peripheral Gland", "Hypothalamus -> Anterior Pituitary -> Peripheral Gland", "Peripheral Gland -> Hypothalamus -> Anterior Pituitary", "Hypothalamus -> Posterior Pituitary -> Peripheral Gland"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "This is the correct sequence for hierarchical control. The hypothalamus (gland 1) releases a releasing hormone, which acts on the anterior pituitary (gland 2) to release a stimulating hormone, which then acts on a peripheral endocrine gland (gland 3) like the thyroid or adrenal cortex. [cite: Normal Function of the Endocrine System Part 3 - Clean.txt]", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 33, "category": ["Questions Mixed set 1"], "stem": "A patient is found to have a tumor in the anterior pituitary that is hypersecreting ACTH. What would be the expected effect on cortisol levels?", "options": ["Cortisol levels would be low due to negative feedback.", "Cortisol levels would be high.", "Cortisol levels would be unaffected.", "Cortisol would be converted to aldosterone."], "correct": "B", "rationale": {"A": "A is incorrect because the tumor would not respond to negative feedback from high cortisol.", "B": "ACTH (Adrenocorticotropic hormone) from the anterior pituitary stimulates the adrenal cortex to produce and release cortisol. If ACTH is being hypersecreted by a tumor, it will lead to overstimulation of the adrenal cortex and high levels of cortisol. [cite: Normal Function of the Endocrine System Part 5 - Clean.txt]", "C": "C & D are incorrect physiological responses.", "D": "C & D are incorrect physiological responses."}}, {"id": 34, "category": ["Questions Mixed set 1"], "stem": "Growth Hormone (GH) secretion occurs in pulses, primarily during:", "options": ["Periods of intense exercise.", "The waking hours of the morning.", "Stage 2 non-REM sleep at night.", "The REM sleep stage."], "correct": "C", "rationale": {"A": "A, B, and D are not the primary times for significant growth hormone release.", "B": "A, B, and D are not the primary times for significant growth hormone release.", "C": "Growth hormone is released in pulses, predominantly at night during deep, non-REM sleep, particularly Stage 2. This is why adequate sleep is essential for growth and tissue repair. [cite: Normal Function of the Endocrine System Part 4 - Clean.txt]", "D": "A, B, and D are not the primary times for significant growth hormone release."}}, {"id": 35, "category": ["Questions Mixed set 1"], "stem": "A key difference between the anterior and posterior pituitary is that the posterior pituitary:", "options": ["Is a true endocrine gland that synthesizes its own hormones.", "Does not release any hormones.", "Is an extension of the hypothalamus and releases hormones synthesized by the hypothalamus.", "Is controlled by hormones traveling through a portal system, while the anterior pituitary is not."], "correct": "C", "rationale": {"A": "A & D describe the anterior pituitary.", "B": "B is incorrect; it releases two hormones.", "C": "The posterior pituitary is not a true endocrine gland but rather a collection of axon terminals from neurosecretory cells originating in the hypothalamus. It stores and releases oxytocin and vasopressin (ADH), which are produced in the hypothalamus. [cite: Normal Function of the Endocrine System Part 3 - Clean.txt]", "D": "A & D describe the anterior pituitary."}}, {"id": 36, "category": ["Questions Mixed set 1"], "stem": "A patient with hyperthyroidism would be expected to have which of the following symptoms?", "options": ["Feeling cold, weight gain, and fatigue.", "A slow heart rate (bradycardia).", "A high metabolic rate, feeling hot, and weight loss.", "Low blood pressure and lethargy."], "correct": "C", "rationale": {"A": "A & B are symptoms of hypothyroidism (low thyroid hormone).", "B": "A & B are symptoms of hypothyroidism (low thyroid hormone).", "C": "Thyroid hormone increases the basal metabolic rate by stimulating the production of energy-consuming proteins. Hyperthyroidism (excess thyroid hormone) leads to symptoms of a hypermetabolic state, including heat intolerance, weight loss, and increased heart rate. [cite: Normal Function of the Endocrine System Part 4 - Clean.txt]", "D": "D is inconsistent with a hypermetabolic state."}}, {"id": 37, "category": ["Questions Mixed set 1"], "stem": "The adrenal cortex produces which class of hormones?", "options": ["Catecholamines", "Steroid hormones", "Peptide hormones", "Glycoprotein hormones"], "correct": "B", "rationale": {"A": "A: Catecholamines (epinephrine, norepinephrine) are produced by the adrenal medulla.", "B": "The adrenal cortex synthesizes all steroid hormones from cholesterol, including glucocorticoids (cortisol), mineralocorticoids (aldosterone), and sex hormones. [cite: Normal Function of the Endocrine System Part 5 - Clean.txt]", "C": "C & D are incorrect hormone classes for this gland.", "D": "C & D are incorrect hormone classes for this gland."}}, {"id": 38, "category": ["Questions Mixed set 1"], "stem": "What is the primary physiological effect of cortisol during a stress response?", "options": ["To decrease blood glucose and suppress inflammation.", "To increase blood glucose, mobilize energy, and suppress the immune system.", "To enhance immune function and promote long-term energy storage.", "To lower blood pressure and induce a state of calm."], "correct": "B", "rationale": {"A": "A is incorrect; cortisol increases blood glucose.", "B": "Cortisol's primary role in an acute stress response is to ensure energy is available for \"fight or flight.\" It does this by stimulating gluconeogenesis and breaking down protein. It also suppresses non-essential functions like the immune and inflammatory responses to conserve energy. [cite: Normal Function of the Endocrine System Part 5 - Clean.txt]", "C": "C is incorrect; it suppresses immune function.", "D": "D is incorrect; it increases neural excitability, not calmness."}}, {"id": 39, "category": ["Questions Mixed set 1"], "stem": "Which part of the brain is considered the major control center for the autonomic nervous system, regulating functions like body temperature, appetite, and water balance?", "options": ["Cerebellum", "Thalamus", "Hypothalamus", "Basal ganglia"], "correct": "C", "rationale": {"A": "A, B, and D are involved in motor control, sensory relay, and emotion, but not the primary autonomic control.", "B": "A, B, and D are involved in motor control, sensory relay, and emotion, but not the primary autonomic control.", "C": "The hypothalamus, along with the brain stem, is the primary control center for the autonomic nervous system, integrating sensory information and issuing efferent commands to maintain homeostasis for functions like temperature, appetite, and fluid balance. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "D": "A, B, and D are involved in motor control, sensory relay, and emotion, but not the primary autonomic control."}}, {"id": 40, "category": ["Questions Mixed set 1"], "stem": "A patient with a spinal cord injury at T6 retains the patellar reflex. This is because the patellar reflex:", "options": ["Is controlled by the brain and descending motor tracts are intact.", "Is a purely spinal reflex controlled by the lumbar segments of the spinal cord.", "Is mediated by the autonomic nervous system.", "Becomes stronger after a spinal cord injury."], "correct": "B", "rationale": {"A": "A is incorrect; it does not require brain input.", "B": "The patellar reflex is a simple spinal reflex. The sensory input enters the L2-L4 spinal segments and the motor output exits from the same segments without requiring any input from the brain. Therefore, it remains intact even with an injury higher up the spinal cord. [cite: Normal Function of the Nervous System Part 7_default - Clean.txt]", "C": "C is incorrect; it is part of the somatic (motor) system.", "D": "D is not necessarily true."}}, {"id": 41, "category": ["Questions Mixed set 1"], "stem": "The \"one-drop rule\" is a historical social construct that defined an individual as Black if they had any African ancestry. From a genetic perspective, this has contributed to:", "options": ["A genetically homogenous African American population.", "The elimination of European genetic markers in the African American gene pool.", "A highly diverse and mixed gene pool within the African American population.", "The complete separation of African and European gene pools."], "correct": "C", "rationale": {"A": "A is the opposite of what occurred.", "B": "B is incorrect; European markers are present.", "C": "The \"one-drop rule\" socially grouped individuals with any African ancestry into the \"Black\" category. This meant that generations of gene flow (admixture) from European and Native American populations occurred within this socially defined group, creating a genetically diverse and varied gene pool. [cite: The biology of race in the absence of biological race - Dr. Rick Kittles_default - Clean.txt]", "D": "D is incorrect; the rule facilitated, rather than prevented, the mixing of"}}, {"id": 42, "category": ["Questions Mixed set 1"], "stem": "Darker skin pigmentation evolved in populations near the equator primarily to:", "options": ["Increase the production of Vitamin D.", "Enhance camouflage in tropical environments.", "Protect circulating folate from being broken down by intense UV radiation.", "Prevent skin cancer, which was a major selective pressure on reproductive success."], "correct": "C", "rationale": {"A": "a) This is incorrect. Dark skin, rich in melanin, actually makes it more difficult to produce Vitamin D, as melanin absorbs the necessary UVB radiation.", "B": "b) Camouflage is not mentioned in the provided materials as the primary selective pressure for human skin color.", "C": "The lecture transcript \"The biology of skin color - HHMI\" explicitly states that strong sunlight breaks down the B vitamin folate as it circulates in skin blood vessels. Folate is essential for reproductive success (normal embryonic development and healthy sperm production). Dark skin evolved to provide protection for this vital nutrient against UV degradation, offering a powerful survival and reproductive advantage. [cite: The biology of skin color - HHMI_default - Clean.txt]", "D": "d) While UV radiation can cause skin cancer, the transcript notes that this is a weaker explanation for selection because skin cancer typically occurs after peak reproductive years, meaning it has less impact on an individual's ability to pass on their genes."}}, {"id": 43, "category": ["Questions Mixed set 1"], "stem": "An individual with dark skin moves to a high-latitude region with low UV exposure (e.g., Scandinavia). They are at an increased risk for deficiency in which vitamin?", "options": ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin D"], "correct": "D", "rationale": {"A": "a), b), and c) The synthesis of Vitamins A, B12, and C is not dependent on skin exposure to UV radiation.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "Vitamin D synthesis in the skin is dependent on UVB radiation from the sun. The melanin in dark skin blocks a significant amount of UVB penetration. In high-latitude areas where UV exposure is already low, this combination puts dark-skinned individuals at a high risk of being unable to synthesize adequate amounts of Vitamin D. [cite: The biology of skin color - HHMI_default - Clean.txt]"}}, {"id": 44, "category": ["Questions Mixed set 1"], "stem": "The release of neurotransmitters from an axon terminal is directly triggered by the influx of which ion?", "options": ["Na+", "K+", "Ca2+", "Cl-"], "correct": "C", "rationale": {"A": "a) Na+ influx is responsible for the depolarization of the action potential itself.", "B": "b) K+ efflux is responsible for the repolarization phase of the action potential.", "C": "The arrival of an action potential at the axon terminal causes a depolarization that opens voltage-gated calcium channels. The resulting influx of Ca2+ ions into the terminal is the direct trigger that causes synaptic vesicles to fuse with the presynaptic membrane and release their neurotransmitter content into the synaptic cleft. [cite: Normal Function of the Nervous System Part 4_default - Clean.txt]", "D": "d) Cl- influx is typically associated with inhibitory postsynaptic potentials."}}, {"id": 45, "category": ["Questions Mixed set 1"], "stem": "What is the fundamental difference between a spatially focused and a widely divergent neural circuit?", "options": ["Spatially focused circuits use glutamate, while divergent circuits use dopamine.", "Spatially focused circuits are for task-oriented functions, while divergent circuits modulate the excitability of large brain regions.", "Spatially focused circuits are found only in the spinal cord, while divergent circuits are only in the brain.", "Spatially focused circuits are slow, while divergent circuits are rapid."], "correct": "B", "rationale": {"A": "a) The type of neurotransmitter does not define the pattern of connectivity.", "B": "As described in the lecture, spatially focused circuits have a low cell-to-cell connection ratio and are well-suited for specific tasks like motor commands. Widely divergent circuits feature a few neurons projecting to vast areas of the brain, allowing them to modulate the overall excitability and influence complex, global states like attention or sleep-wake cycles. [cite: Normal Function of the Nervous System Part 6_default - Clean.txt]", "C": "c) Both patterns are found within the brain.", "D": "d) The speed of transmission is not the defining difference between these patterns."}}, {"id": 46, "category": ["Questions Mixed set 1"], "stem": "A patient taking an SSRI for depression experiences relief because the drug increases the amount of serotonin in the synaptic cleft. The serotonin system in the brain originates in which area?", "options": ["Locus coeruleus", "Raphe nuclei", "Substantia nigra", "Ventral tegmental area (VTA)"], "correct": "B", "rationale": {"A": "a) The locus coeruleus is the origin of the norepinephrine system.", "B": "The modulatory serotonin system in the brain originates from a group of cell bodies located in the brainstem known as the raphe nuclei. These neurons project widely to influence mood, sleep-wake cycles, and other functions. [cite: Normal Function of the Nervous System Part 6_default - Clean.txt]", "C": "c) The substantia nigra is the origin of the dopaminergic motor pathway.", "D": "d) The ventral tegmental area (VTA) is the origin of the dopaminergic reward pathway."}}, {"id": 47, "category": ["Questions Mixed set 1"], "stem": "Parkinson's disease is characterized by a deficiency in dopamine. The dopaminergic neurons that degenerate are part of a circuit that is critical for motor control, originating in the:", "options": ["Raphe nuclei", "Substantia nigra", "Locus coeruleus", "Hypothalamus"], "correct": "B", "rationale": {"A": "a) The raphe nuclei are the origin of the serotonin system.", "B": "The dopamine system that is crucial for motor control originates in the substantia nigra, a structure within the basal ganglia. These neurons project to other parts of the basal ganglia to refine and smooth motor movements. Degeneration of these specific neurons leads to the motor symptoms of Parkinson's disease. [cite: Normal Function of the Nervous System Part 6_default - Clean.txt]", "C": "c) The locus coeruleus is the origin of the norepinephrine system.", "D": "d) The hypothalamus is a primary control center for the endocrine and autonomic systems."}}, {"id": 48, "category": ["Questions Mixed set 1"], "stem": "What is the primary difference between white matter and gray matter in the central nervous system?", "options": ["Gray matter contains myelinated axons, while white matter contains cell bodies.", "White matter processes information horizontally, while gray matter transmits signals vertically.", "White matter is composed primarily of myelinated axons, while gray matter is composed of neuronal cell bodies.", "Gray matter is found only in the brain, while white matter is found only in the spinal cord."], "correct": "C", "rationale": {"A": "a) This reverses the definitions.", "B": "b) This reverses the general direction of information flow; gray matter is for local, horizontal processing, while white matter tracts carry information vertically.", "C": "This is the fundamental structural difference. Gray matter contains the neuronal cell bodies, dendrites, unmyelinated axons, and synapses where processing occurs. White matter is composed of bundles of axons coated with white, fatty myelin, which transmit signals over longer distances. [cite: Normal Function of the Nervous System Part 7_default - Clean.txt]", "D": "d) Both white and gray matter are present in both the brain and the spinal cord."}}, {"id": 49, "category": ["Questions Mixed set 1"], "stem": "An ABG result shows: pH 7.31, PCO2 50 mmHg, HCO3 24 mEq/L.  How would you interpret this? (normal pH 7.35-7.45, pCO2 35-45, HCO3 21-28)", "options": ["Metabolic acidosis, uncompensated.", "Respiratory alkalosis, partially compensated.", "Respiratory acidosis, uncompensated.", "Metabolic alkalosis, fully compensated."], "correct": "C", "rationale": {"A": "a) The problem is respiratory (high PCO2), not metabolic.", "B": "b) & d) The pH indicates acidosis, not alkalosis.", "C": "The steps for interpretation are:", "D": "This option is incorrect."}}, {"id": 50, "category": ["Questions Mixed set 2"], "stem": "According to the lecture, \"normal\" values for physiological parameters like blood pressure can vary significantly between individuals. Which of the following is described as a source of this variation?", "options": ["The time of day the measurement is taken.", "The specific laboratory conditions used for testing.", "The individual's age and genetics.", "All of the above."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "The lecture explicitly mentions time of day, laboratory conditions, age, and genetics as sources of variation for what is considered a \"normal\" physiological parameter. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]"}}, {"id": 51, "category": ["Questions Mixed set 2"], "stem": "A patient in the hospital recovers from a cardiac procedure but subsequently develops acute kidney injury due to the nephrotoxic contrast dye used during imaging. This is an example of what kind of etiology?", "options": ["Idiopathic", "Iatrogenic", "Intrinsic", "Psychogenic"], "correct": "B", "rationale": {"A": "A: Idiopathic means the cause is unknown.", "B": "Iatrogenic conditions are those that are inadvertently caused by medical care. Kidney injury resulting from the administration of a necessary but toxic contrast dye is a classic example. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "C": "C: Intrinsic means the cause is from within the body, like an autoimmune disease.", "D": "D: Psychogenic means the cause is psychological in origin."}}, {"id": 52, "category": ["Questions Mixed set 2"], "stem": "A patient is exposed to a virus on Monday. They feel perfectly fine until Thursday, when they begin to experience mild, nonspecific symptoms like fatigue and a headache. The period from Monday to Thursday is best described as the:", "options": ["Prodromal period", "Acute period", "Latent period", "Recovery period"], "correct": "C", "rationale": {"A": "A: The prodromal period is when the first, often nonspecific, signs and symptoms appear (Thursday in this case).", "B": "B: The acute period is when the disease reaches its peak severity.", "C": "The latent period is defined as the time between the initial injury (viral exposure) and the first appearance of signs and symptoms. During this time, the pathogenesis of the disease is occurring, but there are no observable manifestations. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "D": "D: The recovery period occurs after the acute phase."}}, {"id": 53, "category": ["Questions Mixed set 2"], "stem": "Dr. Rick Kittles argues that using race as a proxy in biomedical research is problematic because:", "options": ["Race is a precise biological category that does not account for environmental factors.", "It is a crude proxy that conflates genetic ancestry with a wide range of environmental and social factors.", "Genetic ancestry and self-reported race are always identical.", "There are no genetic differences between populations."], "correct": "B", "rationale": {"A": "A: Race is described as a social, not a precise biological, category.", "B": "Dr. Kittles explains that race has been used as a proxy for shared biology and a shared environment (socioeconomic status, diet, lifestyle). This makes it difficult to tease apart the actual risk factors for disease, obscuring whether the cause is genetic or environmental. [cite: The biology of race in the absence of biological race - Dr. Rick Kittles_default - Clean.txt]", "C": "C: The lecture makes a clear point that self-reported race and genetic ancestry can be very different.", "D": "D: The lecture discusses genetic variation between populations, not the absence of it."}}, {"id": 54, "category": ["Questions Mixed set 2"], "stem": "The evolution of lighter skin in populations that migrated to northern latitudes is primarily driven by the need to:", "options": ["Protect against folate degradation.", "Absorb more heat in colder climates.", "Synthesize adequate amounts of Vitamin D in an environment with less UVB radiation.", "Reduce the risk of skin cancer."], "correct": "C", "rationale": {"A": "A: Protecting folate is the selective pressure for dark skin in high-UV environments.", "B": "B & D are not the primary evolutionary drivers discussed in the transcript.", "C": "UVB radiation is necessary for Vitamin D synthesis in the skin. In northern latitudes, UVB is less intense. Dark skin blocks UVB, but lighter skin allows more UVB to penetrate, which is an adaptive advantage in low-UV environments to ensure sufficient Vitamin D production and prevent diseases like rickets. [cite: The biology of skin color - HHMI_default - Clean.txt]", "D": "B & D are not the primary evolutionary drivers discussed in the transcript."}}, {"id": 55, "category": ["Questions Mixed set 2"], "stem": "In the context of Starling forces, which pressure is a \"pulling\" force that favors the reabsorption of fluid back into the capillary?", "options": ["Capillary blood pressure", "Interstitial oncotic pressure", "Interstitial hydrostatic pressure", "Capillary oncotic pressure"], "correct": "D", "rationale": {"A": "A is a \"pushing\" pressure favoring filtration.", "B": "B is a \"pulling\" force, but it originates from the interstitial space and favors filtration.", "C": "C is a \"pushing\" pressure from the interstitial space favoring reabsorption, but capillary oncotic pressure is the primary pulling force.", "D": "Capillary oncotic pressure is the \"pulling\" force exerted by plasma proteins (mainly albumin) that are too large to leave the capillary. This force draws fluid from the interstitial space back into the capillary, favoring reabsorption. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]"}}, {"id": 56, "category": ["Questions Mixed set 2"], "stem": "A patient with ascites, a form of third-space fluid accumulation, has fluid building up in the peritoneal cavity. This is most often a consequence of:", "options": ["Increased capillary blood pressure due to hypertension.", "Blocked lymphatic drainage in the abdomen.", "A severe imbalance of Starling forces, often due to liver failure and low albumin.", "Increased fluid intake."], "correct": "C", "rationale": {"A": "A & B can cause edema but are less specifically associated with the massive third-spacing seen in ascites due to liver failure.", "B": "A & B can cause edema but are less specifically associated with the massive third-spacing seen in ascites due to liver failure.", "C": "Ascites is a type of third-space accumulation in the peritoneal cavity. A common cause is liver failure, which leads to a lack of albumin production. This dramatically reduces capillary oncotic pressure, disrupting the Starling forces and causing fluid to leak from the capillaries into the peritoneal cavity. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]", "D": "D is incorrect; the issue is fluid distribution, not necessarily total body fluid volume."}}, {"id": 57, "category": ["Questions Mixed set 2"], "stem": "Insulin administration is a treatment for severe hyperkalemia. How does insulin lower serum potassium?", "options": ["It increases the excretion of potassium by the kidneys.", "It causes potassium to shift from the extracellular fluid into the cells.", "It binds to potassium in the bloodstream, inactivating it.", "It blocks the sodium-potassium ATPase pump."], "correct": "B", "rationale": {"A": "A, C, and D are incorrect mechanisms of action for insulin in this context.", "B": "Insulin binds to its receptor on cells, which facilitates the uptake of not only glucose but also potassium. The potassium is required for the process of storing glucose as glycogen. This cellular uptake of potassium rapidly lowers its concentration in the bloodstream. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 4_default - Clean.txt]", "C": "A, C, and D are incorrect mechanisms of action for insulin in this context.", "D": "A, C, and D are incorrect mechanisms of action for insulin in this context."}}, {"id": 58, "category": ["Questions Mixed set 2"], "stem": "A patient with burns develops dilutional hyponatremia. What is the underlying mechanism for this specific type of hyponatremia?", "options": ["A direct loss of sodium through the burned skin.", "The kidneys begin to waste sodium in response to the injury.", "Loss of albumin from the bloodstream causes fluid to shift and dilute the remaining sodium.", "The patient is consuming too much water."], "correct": "C", "rationale": {"A": "A, B, and D are other potential causes of hyponatremia but do not describe the specific dilutional mechanism associated with albumin loss in burns mentioned in the lecture.", "B": "A, B, and D are other potential causes of hyponatremia but do not describe the specific dilutional mechanism associated with albumin loss in burns mentioned in the lecture.", "C": "The lecture describes how burns can cause vascular injury and inflammation, leading to a loss of albumin from the bloodstream. This loss can cause a fluid shift that dilutes the sodium in the extracellular fluid, resulting in dilutional hyponatremia. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 4_default - Clean.txt]", "D": "A, B, and D are other potential causes of hyponatremia but do not describe the specific dilutional mechanism associated with albumin loss in burns mentioned in the lecture."}}, {"id": 59, "category": ["Questions Mixed set 2"], "stem": "Which of the following best describes the process of a differential diagnosis?", "options": ["Immediately identifying the single most likely diagnosis based on the chief complaint.", "Using only laboratory methods to determine the cause of a disease.", "Creating a long list of possible diagnoses and then systematically ruling out incompatible ones based on all clinical data.", "A diagnosis that changes over the course of an illness."], "correct": "C", "rationale": {"A": "A, B, and D do not accurately describe the systematic, comprehensive process of a differential diagnosis.", "B": "A, B, and D do not accurately describe the systematic, comprehensive process of a differential diagnosis.", "C": "The lecture describes the process of differential diagnosis as creating a \"long laundry list\" of possibilities that could match any of the clinical clues, and then systematically ruling out diagnoses that are incompatible with the complete set of data to arrive at the most likely diagnosis. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "D": "A, B, and D do not accurately describe the systematic, comprehensive process of a differential diagnosis."}}, {"id": 60, "category": ["Questions Mixed set 2"], "stem": "Which form of necrosis is uniquely characterized by the presence of soapy deposits resulting from the reaction of fatty acids and calcium?", "options": ["Coagulative necrosis", "Liquefactive necrosis", "Caseous necrosis", "Fat necrosis"], "correct": "D", "rationale": {"A": "A, B, and C are other types of necrosis with different morphological appearances and are not associated with saponification.", "B": "A, B, and C are other types of necrosis with different morphological appearances and are not associated with saponification.", "C": "A, B, and C are other types of necrosis with different morphological appearances and are not associated with saponification.", "D": "A, B, and C are other types of necrosis with different morphological appearances and are not associated with saponification."}}, {"id": 61, "category": ["Questions Mixed set 2"], "stem": "A biopsy of a lung lymph node from a patient with tuberculosis reveals tissue that has a soft, cheese-like appearance. This is characteristic of which type of necrosis?", "options": ["Fat necrosis", "Liquefactive necrosis", "Caseous necrosis", "Fibrinoid necrosis"], "correct": "C", "rationale": {"A": "A, B, and D have different characteristic appearances and are associated with different pathologies.", "B": "A, B, and D have different characteristic appearances and are associated with different pathologies.", "C": "Caseous necrosis is named because the dead tissue resembles crumbly cheese (\"caseous\" refers to casein, the protein in cheese). It is classically seen in the center of granulomas in patients with tuberculosis infections. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 8_default_default - Clean.txt]", "D": "A, B, and D have different characteristic appearances and are associated with different pathologies."}}, {"id": 62, "category": ["Questions Mixed set 2"], "stem": "Reactive oxygen species (ROS) can cause significant cellular injury. Which of the following is a mechanism of ROS-induced damage?", "options": ["Lipid peroxidation of membranes", "DNA damage", "Protein damage", "All of the above"], "correct": "D", "rationale": {"A": "A, B, and C are all correct mechanisms of ROS damage and are included in option D.", "B": "A, B, and C are all correct mechanisms of ROS damage and are included in option D.", "C": "A, B, and C are all correct mechanisms of ROS damage and are included in option D.", "D": "A, B, and C are all correct mechanisms of ROS damage and are included in option D."}}, {"id": 63, "category": ["Questions Mixed set 2"], "stem": "Reperfusion injury occurs when blood flow is restored to ischemic tissue. The damage is primarily caused by:", "options": ["The sudden lack of oxygen when blood flow returns.", "An overwhelming inflammatory response and the production of reactive oxygen species.", "The rapid washout of lactate from the tissue.", "The failure of sodium-potassium pumps to restart."], "correct": "B", "rationale": {"A": "A is the opposite of what happens; oxygen is being restored.", "B": "When blood flow is restored, it carries inflammatory mediators and white blood cells to the site of injury. These cells release reactive oxygen species as part of the inflammatory response, which causes a secondary wave of damage to the already compromised tissue. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 6_default_default - Clean.txt]", "C": "C & D are cellular events but do not describe the primary cause of the secondary injury wave known as reperfusion injury.", "D": "C & D are cellular events but do not describe the primary cause of the secondary injury wave known as reperfusion injury."}}, {"id": 64, "category": ["Questions Mixed set 2"], "stem": "What is the primary difference between afferent and efferent neurons?", "options": ["Afferent neurons are myelinated, while efferent neurons are not.", "Afferent neurons transmit sensory information toward the CNS, while efferent neurons carry motor commands away from the CNS.", "Afferent neurons are only found in the brain, while efferent neurons are only in the spinal cord.", "Afferent neurons control voluntary muscles, while efferent neurons control involuntary muscles."], "correct": "B", "rationale": {"A": "A is incorrect; myelination is found on both types of neurons.", "B": "This is the fundamental functional distinction. The afferent division of the peripheral nervous system brings sensory information in to the CNS, while the efferent division carries commands out from the CNS to effector organs. [cite: Normal Function of the Nervous System Part 1_default - Clean.txt]", "C": "C is incorrect; both have components in the peripheral nervous system.", "D": "D is too simplistic; the efferent division includes both somatic (voluntary) and autonomic (involuntary) pathways."}}, {"id": 65, "category": ["Questions Mixed set 2"], "stem": "Which type of neuron is located entirely within the central nervous system and serves to connect sensory and motor neurons?", "options": ["Afferent neuron", "Efferent neuron", "Interneuron", "Postganglionic neuron"], "correct": "C", "rationale": {"A": "A & B have components in the peripheral nervous system.", "B": "A & B have components in the peripheral nervous system.", "C": "Interneurons are located entirely within the CNS (brain and spinal cord). They form the connecting circuits between afferent (sensory) neurons and efferent (motor) neurons, allowing for the processing of sensory information and the generation of an appropriate motor response. [cite: Normal Function of the Nervous System Part 1_default - Clean.txt]", "D": "D is a specific type of efferent neuron in the autonomic nervous system."}}, {"id": 66, "category": ["Questions Mixed set 2"], "stem": "The cell bodies of preganglionic neurons of the sympathetic nervous system are located in which region of the spinal cord?", "options": ["The dorsal horn from C1 to C8.", "The lateral horn from T1 to L3.", "The ventral horn from L3 to S4.", "The entire length of the dorsal root ganglia."], "correct": "B", "rationale": {"A": "A is where sensory neurons synapse.", "B": "The cell bodies of the first (preganglionic) neurons in the sympathetic nervous system originate in the lateral horn of the spinal cord's gray matter, specifically in the segments from the first thoracic (T1) to the third lumbar (L3) vertebrae. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "C": "C is where somatic motor neurons originate.", "D": "D contains the cell bodies of sensory neurons."}}, {"id": 67, "category": ["Questions Mixed set 2"], "stem": "While most of the sympathetic nervous system follows a two-neuron chain, one exception involves a direct connection from a preganglionic neuron to which structure?", "options": ["The thyroid gland", "The pancreas", "The adrenal medulla", "The heart"], "correct": "C", "rationale": {"A": "A, B, and D are target organs but are innervated by the standard two-neuron chain.", "B": "A, B, and D are target organs but are innervated by the standard two-neuron chain.", "C": "The endocrine arm of the sympathetic nervous system consists of a preganglionic neuron that extends directly from the spinal cord to the adrenal medulla. It releases acetylcholine, which stimulates the adrenal medulla to release epinephrine (and some norepinephrine) into the bloodstream as hormones. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "D": "A, B, and D are target organs but are innervated by the standard two-neuron chain."}}, {"id": 68, "category": ["Questions Mixed set 2"], "stem": "A patient is prescribed a beta-1 adrenergic receptor antagonist (a \"beta-blocker\"). This drug will primarily affect which target organ?", "options": ["The smooth muscle of the bronchioles in the lungs.", "The cardiac muscle of the heart.", "The smooth muscle of blood vessels perfusing skeletal muscle.", "The smooth muscle of the bladder wall."], "correct": "B", "rationale": {"A": "A & D are primarily controlled by Beta-2 receptors.", "B": "Beta-1 adrenergic receptors are predominantly located on cardiac muscle. Stimulation of these receptors (by norepinephrine or epinephrine) increases heart rate and contraction strength. A beta-1 antagonist would block this effect, slowing the heart. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "C": "C is controlled by Beta-2 receptors (causing vasodilation), while vessels in visceral organs have Alpha-1 receptors (causing vasoconstriction).", "D": "A & D are primarily controlled by Beta-2 receptors."}}, {"id": 69, "category": ["Questions Mixed set 2"], "stem": "Which of the following cranial nerves is a critical component of the parasympathetic nervous system, carrying approximately 70% of its output to the viscera?", "options": ["Optic nerve (II)", "Trigeminal nerve (V)", "Facial nerve (VII)", "Vagus nerve (X)"], "correct": "D", "rationale": {"A": "A, B, and C are important cranial nerves but are not the primary carriers of parasympathetic outflow to the body's major organs.", "B": "A, B, and C are important cranial nerves but are not the primary carriers of parasympathetic outflow to the body's major organs.", "C": "A, B, and C are important cranial nerves but are not the primary carriers of parasympathetic outflow to the body's major organs.", "D": "A, B, and C are important cranial nerves but are not the primary carriers of parasympathetic outflow to the body's major organs."}}, {"id": 70, "category": ["Questions Mixed set 2"], "stem": "In the parasympathetic nervous system, the postganglionic neuron releases acetylcholine, which binds to which type of receptor on the target organ?", "options": ["Nicotinic receptors", "Muscarinic receptors", "Alpha-1 adrenergic receptors", "Beta-2 adrenergic receptors"], "correct": "B", "rationale": {"A": "A: Nicotinic receptors are found at the first synapse, in the ganglion.", "B": "In the parasympathetic pathway, the second synapse (between the postganglionic neuron and the target organ) involves the release of acetylcholine onto muscarinic acetylcholine receptors. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "C": "C & D are adrenergic receptors for the sympathetic system.", "D": "C & D are adrenergic receptors for the sympathetic system."}}, {"id": 71, "category": ["Questions Mixed set 2"], "stem": "The brain's reward pathway, which is responsible for motivation and is often hijacked by drugs of abuse, is a dopaminergic circuit that originates in the:", "options": ["Substantia nigra", "Locus coeruleus", "Ventral tegmental area (VTA)", "Raphe nuclei"], "correct": "C", "rationale": {"A": "A is the origin of the dopaminergic motor pathway.", "B": "B is the origin of the norepinephrine system.", "C": "The lecture identifies the reward pathway as a dopaminergic circuit originating in the ventral tegmental area (VTA) and projecting to areas like the prefrontal cortex and limbic system. This pathway mediates pleasure and motivation. [cite: Normal Function of the Nervous System Part 6_default - Clean.txt]", "D": "D is the origin of the serotonin system."}}, {"id": 72, "category": ["Questions Mixed set 2"], "stem": "A drug that functions as a serotonin reuptake inhibitor (SSRI) would be expected to primarily affect which modulatory neurotransmitter system in the brain?", "options": ["The system originating in the locus coeruleus.", "The system originating in the raphe nuclei.", "The motor system originating in the substantia nigra.", "The system responsible for sleep-wake cycles involving acetylcholine."], "correct": "B", "rationale": {"A": "A refers to the norepinephrine system.", "B": "The serotonin system, which is critical for mood regulation, originates in the raphe nuclei of the brainstem. SSRIs work by increasing the availability of serotonin released from these neurons. [cite: Normal Function of the Nervous System Part 6_default - Clean.txt]", "C": "C refers to the dopamine motor system.", "D": "D is too general; while acetylcholine is involved in sleep-wake, the raphe nuclei are specific to serotonin."}}, {"id": 73, "category": ["Questions Mixed set 2"], "stem": "A patient experiences vertigo and difficulty maintaining balance. This suggests a problem with the sensory information being transmitted by which cranial nerve?", "options": ["Oculomotor nerve (III)", "Facial nerve (VII)", "Vestibulocochlear nerve (VIII)", "Hypoglossal nerve (XII)"], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The vestibular branch of the vestibulocochlear nerve transmits information from the inner ear about body position, balance, and movement, which is essential for proprioception. Dysfunction can cause vertigo and imbalance. [cite: Normal Function of the Nervous System Part 7_default - Clean.txt]", "D": "This option is incorrect."}}, {"id": 74, "category": ["Questions Mixed set 2"], "stem": "A patient develops shingles with a painful rash along a strip of skin on their right torso, not crossing the midline. This pattern corresponds to a:", "options": ["Myotome", "Scl
