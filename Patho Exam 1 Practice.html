erotome", "Dermatome", "Viscerotome"], "correct": "C", "rationale": {"A": "A is a map of muscle groups innervated by a single spinal nerve root.", "B": "B & D are incorrect terms in this context.", "C": "A dermatome is an area of skin that is supplied by sensory fibers from a single spinal nerve pair. The varicella virus (shingles) re-emerges from the spinal cord and travels down a specific spinal nerve, causing a characteristic rash that follows the pattern of that nerve's dermatome. [cite: Normal Function of the Nervous System Part 7_default - Clean.txt]", "D": "B & D are incorrect terms in this context."}}, {"id": 75, "category": ["Questions Mixed set 2"], "stem": "Which of the following hormones are synthesized by the hypothalamus but released from the posterior pituitary?", "options": ["TSH and ACTH", "LH and FSH", "Cortisol and Aldosterone", "Oxytocin and Vasopressin (ADH)"], "correct": "D", "rationale": {"A": "A & B are hormones released from the anterior pituitary.", "B": "A & B are hormones released from the anterior pituitary.", "C": "C are steroid hormones released from the adrenal cortex.", "D": "These two peptide hormones are synthesized in the cell bodies of neurosecretory cells located in the hypothalamus. They are then transported down the axons to be stored in and released from the axon terminals located in the posterior pituitary. [cite: Normal Function of the Endocrine System Part 3 - Clean.txt]"}}, {"id": 76, "category": ["Questions Mixed set 2"], "stem": "Which of the following correctly describes the hierarchical axis that controls cortisol release?", "options": ["TRH -> TSH -> Cortisol", "GnRH -> LH -> Cortisol", "CRH -> ACTH -> Cortisol", "GHRH -> GH -> Cortisol"], "correct": "C", "rationale": {"A": "A controls the thyroid gland.", "B": "B controls the gonads.", "C": "This represents the hypothalamic-pituitary-adrenal (HPA) axis. The hypothalamus releases Corticotropin-Releasing Hormone (CRH), which stimulates the anterior pituitary to release Adrenocorticotropic Hormone (ACTH), which in turn stimulates the adrenal cortex to release cortisol. [cite: Normal Function of the Endocrine System Part 3 - Clean.txt]", "D": "D controls growth."}}, {"id": 77, "category": ["Questions Mixed set 2"], "stem": "Prolactin release from the anterior pituitary is unique because it is primarily under tonic inhibition by which hypothalamic hormone?", "options": ["Prolactin-releasing hormone (PRH)", "Dopamine", "Somatostatin", "TRH"], "correct": "B", "rationale": {"A": "A stimulates prolactin release but is not the dominant signal.", "B": "The lecture emphasizes that prolactin release is unusual because it is mostly inhibited. Dopamine is released from the hypothalamus and tonically inhibits prolactin secretion from the anterior pituitary. A decrease in dopamine is required for prolactin levels to rise. [cite: Normal Function of the Endocrine System Part 3 - Clean.txt]", "C": "C inhibits growth hormone.", "D": "D stimulates TSH release."}}, {"id": 78, "category": ["Questions Mixed set 2"], "stem": "Growth hormone (GH) exerts some of its effects indirectly by stimulating the liver to produce:", "options": ["Cortisol", "Insulin-like growth factors (IGFs)", "Thyroid hormone", "Glucagon"], "correct": "B", "rationale": {"A": "A, C, and D are produced by other glands and are not part of the GH axis.", "B": "Growth hormone has both direct effects and indirect effects. The indirect effects are mediated by its action on the liver, which is stimulated to produce and release IGF-1 and IGF-2. These IGFs then act on target tissues to promote growth. [cite: Normal Function of the Endocrine System Part 4 - Clean.txt]", "C": "A, C, and D are produced by other glands and are not part of the GH axis.", "D": "A, C, and D are produced by other glands and are not part of the GH axis."}}, {"id": 79, "category": ["Questions Mixed set 2"], "stem": "Thyroid hormone is a lipid-soluble hormone derived from an amino acid. How is it stored in the thyroid gland before release?", "options": ["It is stored freely within the follicular cells.", "It cannot be stored and is only synthesized on demand.", "It is attached to a large protein called thyroglobulin and stored in the colloid of the follicles.", "It is packaged into lipoproteins and stored in the bloodstream."], "correct": "C", "rationale": {"A": "a) It cannot be stored freely within cells because its lipid-soluble nature would allow it to diffuse across the cell membrane.", "B": "b) This is incorrect. The body maintains a significant store of thyroid hormone, unlike steroid hormones which are typically synthesized on demand.", "C": "Because thyroid hormone is lipid-soluble, it cannot be stored in standard vesicles as it would diffuse out. The thyroid gland overcomes this by synthesizing the hormone while it is attached to a large, water-soluble protein, thyroglobulin. This large complex is stored as an acellular protein matrix called colloid in the center of the thyroid follicles until it is needed. [cite: Normal Function of the Endocrine System Part 4 - Clean.txt]", "D": "d) Lipoproteins are involved in the transport of lipids in the blood, not the storage of hormones within a gland."}}, {"id": 80, "category": ["Questions Mixed set 2"], "stem": "A patient's lab results show very high levels of T3/T4 and very low levels of TSH. This indicates a problem with the:", "options": ["Hypothalamus, which is not producing enough TRH.", "Anterior pituitary, which is not producing enough TSH.", "Thyroid gland, which is overproducing hormone despite negative feedback (primary hyperthyroidism).", "Liver, which is not breaking down thyroid hormone."], "correct": "C", "rationale": {"A": "a) A hypothalamic problem (low TRH) would lead to low TSH and subsequently low T3/T4.", "B": "b) A pituitary problem causing hyperthyroidism (e.g., a TSH-secreting tumor) would result in high TSH and high T3/T4.", "C": "This pattern indicates a failure in the negative feedback loop at the source. The high levels of T3/T4 are correctly signaling the pituitary to stop producing TSH (hence the low TSH level). However, the thyroid gland is continuing to produce hormone at a high rate, independent of TSH stimulation. This points to a problem originating in the thyroid gland itself, which is defined as primary hyperthyroidism. [cite: Normal Function of the Endocrine System Part 4 - Clean.txt]", "D": "d) While the liver is involved in hormone clearance, it would not cause this specific feedback pattern."}}, {"id": 81, "category": ["Questions Mixed set 2"], "stem": "The zona glomerulosa is the outermost layer of the adrenal cortex and is uniquely responsible for producing which hormone?", "options": ["Cortisol", "Androgens (e.g., testosterone)", "Aldosterone", "Epinephrine"], "correct": "C", "rationale": {"A": "a) Cortisol is a glucocorticoid produced mainly in the zona fasciculata.", "B": "b) Androgens are produced mainly in the zona reticularis.", "C": "The lecture on the adrenal cortex specifies that its layers produce different categories of steroid hormones. The zona glomerulosa, the outermost layer, is the exclusive site of mineralocorticoid production, with aldosterone being the primary mineralocorticoid. [cite: Normal Function of the Endocrine System Part 5 - Clean.txt]", "D": "d) Epinephrine is a catecholamine produced in the adrenal medulla, not the cortex."}}, {"id": 82, "category": ["Questions Mixed set 2"], "stem": "What is the difference between a dedicated endocrine gland and an endocrine gland of mixed function?", "options": ["Dedicated glands are in the brain, while mixed glands are in the periphery.", "Dedicated glands release steroid hormones, while mixed glands release peptide hormones.", "Dedicated glands have only endocrine functions, while mixed glands have other primary physiological roles.", "Dedicated glands are large, while mixed glands are small."], "correct": "C", "rationale": {"A": "a) Location (central vs. peripheral) is a different method of classification.", "B": "b) Hormone type is not the distinguishing feature; for example, the adrenal cortex (dedicated) and gonads (mixed) both produce steroids.", "C": "The lecture defines dedicated endocrine structures (like the thyroid and adrenal glands) as those whose sole purpose is to produce hormones. Mixed-function glands (like the kidneys, which filter blood, or the pancreas, which has digestive functions) have a primary \"day job\" in addition to their endocrine role. [cite: Normal Function of the Endocrine System Part 1 - Clean.txt]", "D": "d) The size of the gland is not the defining characteristic."}}, {"id": 83, "category": ["Questions Mixed set 2"], "stem": "A pharmaceutical drug is developed that is lipid-soluble and has a long half-life in the bloodstream. This long half-life is most likely achieved because the hormone is:", "options": ["Rapidly broken down by enzymes in the blood.", "Transported while bound to a carrier protein like albumin.", "Quickly excreted by the kidneys.", "Stored in red blood cells."], "correct": "B", "rationale": {"A": "a) & c) Rapid breakdown or excretion would lead to a short half-life.", "B": "Lipid-soluble hormones are not soluble in the water-based plasma of the blood. To travel through the bloodstream, they must bind to carrier proteins (like albumin or specific binding globulins). This binding not only facilitates transport but also protects the hormone from rapid degradation and clearance, thereby extending its half-life. [cite: Normal Function of the Endocrine System Part 1 - Clean.txt]", "C": "This option is incorrect.", "D": "d) Hormones are not stored or transported within red blood cells."}}, {"id": 84, "category": ["Questions Mixed set 2"], "stem": "The concept of \"biological race\" in humans is considered invalid because:", "options": ["Human genetic variation is continuous, and there are no distinct genetic boundaries that define racial groups.", "All human populations have identical genetic makeup.", "Skin color is the only trait that differs between populations.", "Social and cultural factors have no impact on health outcomes."], "correct": "A", "rationale": {"A": "Dr. Kittles' lecture emphasizes that \"there are no human races\" from a biological standpoint. Genetic variation related to ancestry exists on a continuous spectrum, or a cline, across geographical regions. There are no specific genes or sharp genetic dividing lines that can be used to separate all humans into discrete racial categories, making race a social, not biological, construct. [cite: The biology of race in the absence of biological race - Dr. Rick Kittles_default - Clean.txt]", "B": "b) This is false; significant genetic variation exists.", "C": "c) This is false; many traits vary clinally.", "D": "d) The lecture explains that while social factors are critical to health disparities, the biological concept of race itself is invalid for genetic reasons."}}, {"id": 85, "category": ["Questions Mixed set 2"], "stem": "An ABG result shows: pH 7.50, PCO2 30 mmHg, HCO3 23 mEq/L. How would you interpret this? (normal pH 7.35-7.45, pCO2 35-45, HCO3 21-28)", "options": ["Metabolic alkalosis, uncompensated.", "Respiratory acidosis, partially compensated.", "Metabolic acidosis, fully compensated.", "Respiratory alkalosis, uncompensated."], "correct": "D", "rationale": {"A": "a) The cause matches the respiratory component (PCO2), not the metabolic one.", "B": "b) The condition is alkalosis, not acidosis.", "C": "c) The condition is respiratory, not metabolic, and it is uncompensated.", "D": "Following the diagnostic steps:"}}, {"id": 86, "category": ["Questions Mixed set 2"], "stem": "The blood-brain barrier is a highly selective barrier protecting the CNS. Its structure is primarily formed by:", "options": ["Ependymal cells lining the ventricles.", "The dura mater and arachnoid mater.", "Tight junctions between capillary endothelial cells, a basement membrane, and the end-feet of astrocytes.", "Oligodendrocytes wrapping around the capillaries."], "correct": "C", "rationale": {"A": "a) Ependymal cells line the ventricles, not the capillaries that form the BBB.", "B": "b) The meninges are protective outer coverings of the brain.", "C": "The lecture describes the three structural components that form the blood-brain barrier: 1) the tight junctions that seal the space between the endothelial cells of the brain capillaries, 2) the continuous basement membrane underlying those cells, and 3) the end-feet of astrocytes that wrap around the capillaries, forming the final layer. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "D": "d) Oligodendrocytes provide myelin for axons."}}, {"id": 87, "category": ["Questions Mixed set 2"], "stem": "The cerebellum is crucial for motor movement. Its primary role is to:", "options": ["Initiate voluntary motor commands.", "Store learned motor patterns and ensure smooth, coordinated movements.", "Perceive sensory information from the muscles.", "Control the speed of the heart and respiration."], "correct": "B", "rationale": {"A": "a) Initiation of voluntary movement originates in the primary motor cortex.", "B": "The cerebellum's role is not to initiate movement but to regulate it. It stores learned motor patterns (often called \"muscle memory,\" like signing your name) and constantly updates them to ensure movements are smooth, coordinated, and precise. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "C": "c) Perception of sensation occurs in the somatosensory cortex.", "D": "d) These vegetative functions are controlled by the brain stem."}}, {"id": 88, "category": ["Questions Mixed set 2"], "stem": "The basal ganglia are involved in motor control by:", "options": ["Relaying sensory information to the somatosensory cortex.", "Storing emotional memories related to movement.", "Regulating and refining motor commands to control fine motor movements.", "Generating the initial intention to move."], "correct": "C", "rationale": {"A": "a) This is a function of the thalamus and somatosensory cortex.", "B": "b) The amygdala is more closely linked to emotional memories.", "C": "The lecture explains that the basal ganglia, along with the cerebellum, help refine motor commands that originate in the primary motor cortex, making them more appropriate and allowing for smooth, fine motor control. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "D": "d) The initial intention to move is a more complex process involving the frontal lobe."}}, {"id": 89, "category": ["Questions Mixed set 2"], "stem": "An individual's ability to plan their week, make judgments, and focus their attention is a higher-order cognitive process known as executive function. This is primarily controlled by which lobe of the brain?", "options": ["Occipital lobe", "Parietal lobe", "Temporal lobe", "Frontal lobe"], "correct": "D", "rationale": {"A": "a) The occipital lobe is primarily for vision.", "B": "b) The parietal lobe is for somatosensation and spatial processing.", "C": "c) The temporal lobe is for hearing, memory, and emotion.", "D": "The lecture explicitly identifies executive function\u2014which includes planning, making judgments, and focusing attention\u2014as a higher-order function of the cerebrum, specifically the frontal lobe and its prefrontal cortex. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]"}}, {"id": 90, "category": ["Questions Mixed set 2"], "stem": "Why is the African American gene pool described as being exceptionally diverse?", "options": ["It is rooted in the genetically diverse populations of West and Central Africa and further diversified by admixture from European and Native American populations.", "The population has remained genetically isolated for thousands of years.", "The \"one-drop rule\" limited the gene pool to only individuals with 100% African ancestry.", "All individuals share the exact same MC1R gene variant with no other variation."], "correct": "A", "rationale": {"A": "Dr. Kittles' lecture attributes the diversity of the African American gene pool to two main factors: the inherent biological diversity of the West and Central African populations from which enslaved people were taken, and the subsequent gene flow (admixture) from European and Native American populations over centuries in the Americas. [cite: The biology of race in the absence of biological race - Dr. Rick Kittles_default - Clean.txt]", "B": "b) This is incorrect; the population is not considered genetically isolated.", "C": "c) The one-drop rule socially broadened the group, increasing its genetic diversity through admixture.", "D": "d) While a specific MC1R allele is common, this does not negate the vast diversity in the rest of the genome."}}, {"id": 91, "category": ["Questions Mixed set 2"], "stem": "How does the body compensate for metabolic acidosis?", "options": ["The kidneys retain more H+ and excrete more HCO3-.", "The respiratory rate increases (hyperventilation) to blow off CO2 and raise the pH.", "The respiratory rate decreases (hypoventilation) to retain CO2 and lower the pH.", "The liver produces more bicarbonate."], "correct": "B", "rationale": {"A": "a) This describes a maladaptive renal response that would worsen the acidosis.", "B": "In metabolic acidosis, the primary problem is a metabolic one (e.g., low bicarbonate). The respiratory system compensates. By increasing the rate and depth of breathing (hyperventilation), the body expels more CO2. Since CO2 acts as an acid in the blood, removing it makes the blood more alkaline, thus raising the pH toward the normal range. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 5_default - Clean.txt]", "C": "c) This is the compensatory mechanism for metabolic alkalosis, not acidosis.", "D": "d) The kidneys, not the liver, are the primary regulators of bicarbonate for pH balance."}}, {"id": 92, "category": ["Questions Mixed set 2"], "stem": "Which of the following is an intrinsic cause of disease?", "options": ["An autoimmune disorder like rheumatoid arthritis.", "A bacterial infection like tuberculosis.", "A physical injury from a car accident.", "A condition caused by a prescribed medication."], "correct": "A", "rationale": {"A": "The lecture defines intrinsic causes of disease as those originating from within the body. An autoimmune disorder, where the body's own immune system causes pathology, is a primary example of an intrinsic cause. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 1_default - Clean.txt]", "B": "b), c), and d) are all examples of extrinsic causes, as they originate from an external source (a pathogen, a physical force, or a medical substance).", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 93, "category": ["Questions Mixed set 2"], "stem": "A patient with severe starvation is at risk for edema. The mechanism is most similar to which other cause of edema?", "options": ["Hypertension", "Liver disease", "Acute inflammation", "Lymphatic obstruction"], "correct": "B", "rationale": {"A": "a) Hypertension causes edema via increased capillary blood pressure (a pushing force).", "B": "Severe starvation leads to a deficiency of amino acids, which are necessary for the liver to synthesize proteins, particularly albumin. The resulting hypoalbuminemia (low albumin in the blood) causes a decrease in plasma oncotic pressure. This is the exact same pathophysiological mechanism that leads to edema in patients with liver failure who are unable to synthesize albumin. [cite: Introduction to Pathophysiology and Cellular Basis of Disease Part 3_default - Clean.txt]", "C": "c) Inflammation causes edema via increased capillary permeability and interstitial oncotic pressure (a pulling force from the interstitium).", "D": "d) Lymphatic obstruction causes edema by impairing fluid drainage."}}, {"id": 94, "category": ["Questions Mixed set 2"], "stem": "The absolute refractory period during an action potential is caused by the:", "options": ["Slow opening of voltage-gated potassium channels.", "Hyperpolarization of the membrane.", "Inactivation of voltage-gated sodium channels.", "Depletion of ATP needed for the sodium-potassium pump."], "correct": "C", "rationale": {"A": "a) This contributes to repolarization and the subsequent relative refractory period.", "B": "b) Hyperpolarization is associated with the relative refractory period.", "C": "During an action potential, after the voltage-gated Na+ channels open to cause depolarization, a separate inactivation gate blocks the channel. This inactivation renders the channel unresponsive to any further stimulation, regardless of the voltage, until the membrane has repolarized. This state of unresponsiveness is the absolute refractory period. [cite: Normal Function of the Nervous System Part 3_default - Clean.txt]", "D": "d) The refractory period is a feature of the ion channels themselves, not a result of ATP depletion."}}, {"id": 95, "category": ["Questions Mixed set 2"], "stem": "Which two body systems serve as the major \"control systems\" for maintaining homeostasis?", "options": ["The cardiovascular and respiratory systems.", "The digestive and renal systems.", "The nervous and endocrine systems.", "The immune and lymphatic systems."], "correct": "C", "rationale": {"A": "a), b), and d) represent effector systems that are regulated by the nervous and endocrine systems, but they are not the primary controllers themselves.", "B": "This option is incorrect.", "C": "The lecture material explicitly introduces the nervous and endocrine systems as the body's two major control systems, which regulate and coordinate the functions of all other organ systems to maintain homeostasis. [cite: Normal Function of the Nervous System Part 1_default - Clean.txt]", "D": "This option is incorrect."}}, {"id": 96, "category": ["Questions Mixed set 2"], "stem": "What is the key difference between a hormone and a neurotransmitter in terms of their action?", "options": ["Hormones are proteins, while neurotransmitters are amino acids.", "Hormones act slowly, while neurotransmitters always act instantly.", "Hormones are released into the bloodstream to act on distant targets, while neurotransmitters act across a short synaptic cleft.", "Hormones only cause inhibition, while neurotransmitters only cause excitation."], "correct": "C", "rationale": {"A": "a) This is not always true; for example, norepinephrine is an amino acid derivative that functions as both.", "B": "b) This is a generalization. The key difference is the mechanism of delivery.", "C": "This is the fundamental distinction between the two systems. The endocrine system is \"wireless,\" using the bloodstream for long-distance communication. The nervous system is \"wired,\" with neurotransmitters acting as short-range chemical messengers between adjacent cells at a synapse. [cite: Normal Function of the Endocrine System Part 1 - Clean.txt]", "D": "d) Both hormones and neurotransmitters can be either excitatory or inhibitory."}}, {"id": 97, "category": ["Questions Mixed set 2"], "stem": "A patient is taking a drug that blocks muscarinic acetylcholine receptors. Which division of the autonomic nervous system would be most directly affected at the target organ?", "options": ["The somatic motor system.", "The sympathetic nervous system.", "The parasympathetic nervous system.", "The sensory afferent system."], "correct": "C", "rationale": {"A": "a) The somatic system uses nicotinic, not muscarinic, receptors at the neuromuscular junction.", "B": "b) The sympathetic system primarily uses norepinephrine and adrenergic receptors at the target organ.", "C": "The postganglionic neurons of the parasympathetic nervous system release acetylcholine onto muscarinic receptors on target organs to mediate \"rest and digest\" functions. A drug that blocks these receptors would therefore directly antagonize parasympathetic activity. [cite: Normal Function of the Nervous System Part 8_default - Clean.txt]", "D": "d) This describes a sensory pathway, not a motor output pathway with target organ receptors."}}, {"id": 98, "category": ["Questions Mixed set 2"], "stem": "Thyroid hormones (T3 and T4) increase the synthesis of beta-adrenergic receptors on cells. This is an example of which type of hormonal effect?", "options": ["Antagonistic effect", "Permissive effect", "Synergistic effect", "Tropic effect"], "correct": "B", "rationale": {"A": "a) Antagonistic means they have opposing effects.", "B": "A permissive effect occurs when one hormone enhances the target organ's response to a different hormone. By increasing the number of beta-adrenergic receptors, thyroid hormone makes the cells more sensitive to epinephrine and norepinephrine. The presence of thyroid hormone is necessary for the catecholamines to exert their full effect.", "C": "c) Synergistic means their combined effect is greater than the sum of their individual effects.", "D": "d) A tropic hormone stimulates another endocrine gland."}}, {"id": 99, "category": ["Questions Mixed set 2"], "stem": "What is the role of the angular gyrus in the brain's language circuit?", "options": ["It generates the motor commands for speaking.", "It processes the primary auditory signals for words.", "It integrates auditory, visual, and other sensory information and feeds it into Wernicke's area for comprehension.", "It is the primary area for understanding the emotional tone of speech."], "correct": "C", "rationale": {"A": "a) This is the role of Broca's area.", "B": "b) This is the role of the primary auditory cortex.", "C": "The lecture describes the angular gyrus as a critical integration center that combines inputs from various sensory cortices (auditory, visual, somatosensory) and funnels this integrated information into Wernicke's area, which then assigns meaning and comprehension to language. [cite: Normal Function of the Nervous System Part 5_default - Clean.txt]", "D": "d) While it contributes to the richness of comprehension, its specific described role is multimodal sensory integration."}}, {"id": 100, "category": ["Week 1 Questions Only"], "stem": "A patient presents with a fever of 101.5\u00b0F and a visible rash on their abdomen. How are these clinical manifestations best categorized?", "options": ["Both are symptoms", "Both are signs", "The fever is a sign, and the rash is a symptom", "The fever is a symptom, and the rash is a sign"], "correct": "B", "rationale": {"A": "A) A symptom is a subjective experience (e.g., pain, nausea). Neither of these are purely subjective.", "B": "A sign is a clinical manifestation that can be objectively observed and measured. A fever can be measured with a thermometer, and a rash is visually observable.", "C": "C) A rash is objectively visible, not a subjective symptom.", "D": "D) A fever is objectively measurable, not a subjective symptom."}}, {"id": 101, "category": ["Week 1 Questions Only"], "stem": "According to the lecture, which statement best defines the term 'disease'?", "options": ["The initial injury or insult to the cell", "The observable physical manifestation in the tissue", "The interplay between the initial cause, the injury, and the body's response", "The subjective experience of illness reported by a patient"], "correct": "C", "rationale": {"A": "A) This is only the etiology, which is just one component of the disease.", "B": "B) This describes pathology, which is the physical manifestation, but not the complete definition of disease.", "C": "The lecture defines a disease as the interplay between the cause of the initial insult and the organism's pattern of response. It emphasizes that the body's response is often what causes the negative manifestations.", "D": "D) This describes symptoms, which are a component of the clinical manifestations, not the definition of the disease itself."}}, {"id": 102, "category": ["Week 1 Questions Only"], "stem": "A 65-year-old male is diagnosed with essential hypertension. His physician explains that the specific cause is not known. Which term best describes this type of etiology?", "options": ["Iatrogenic", "Intrinsic", "Idiopathic", "Extrinsic"], "correct": "C", "rationale": {"A": "A) Iatrogenic refers to a condition caused by medical care.", "B": "B) Intrinsic refers to a cause originating from within the body (e.g., autoimmune), but the specific cause is still known.", "C": "The lecture explicitly defines 'idiopathic' as a disease of unknown cause and uses essential (or primary) hypertension as a key example.", "D": "D) Extrinsic refers to a cause originating from outside the body (e.g., infection, trauma)."}}, {"id": 103, "category": ["Week 1 Questions Only"], "stem": "Which of the following is a primary function of the renin-angiotensin-aldosterone system (RAAS)?", "options": ["To increase potassium retention and decrease sodium excretion", "To regulate systemic blood pressure and sodium balance", "To control intracellular osmolyte balance via ATPase pumps", "To stimulate thirst in response to high blood glucose"], "correct": "B", "rationale": {"A": "A) Aldosterone, a component of RAAS, causes sodium retention and potassium excretion.", "B": "The RAAS is triggered by changes in blood pressure and sodium. Its end effects (vasoconstriction, sodium/water retention via aldosterone) are all aimed at restoring normal blood pressure and sodium levels.", "C": "C) The Na+/K+ ATPase pump controls intracellular balance at the cellular level, not the systemic RAAS.", "D": "D) The ADH-thirst system is stimulated by ECF osmolarity, though Angiotensin II can also stimulate thirst. The primary function described is blood pressure and sodium regulation."}}, {"id": 104, "category": ["Week 1 Questions Only"], "stem": "What is the primary mechanism by which insulin affects serum potassium levels?", "options": ["It increases the renal excretion of potassium", "It blocks the reabsorption of potassium in the gut", "It promotes the movement of potassium from the ECF into the ICF", "It causes the release of potassium from cells during glycogenolysis"], "correct": "C", "rationale": {"A": "A) Renal excretion of potassium is primarily managed by aldosterone.", "B": "B) Insulin does not act on the gut to block potassium reabsorption.", "C": "The lecture states that when insulin binds to its receptor, it facilitates the entry of both glucose and potassium into the cell, which is necessary for glycogen storage. This is the basis for using insulin to treat hyperkalemia.", "D": "D) Glycogenolysis is the breakdown of glycogen; insulin promotes glycogen synthesis."}}, {"id": 105, "category": ["Week 1 Questions Only"], "stem": "A patient with severe liver failure develops ascites, a form of third-space fluid accumulation. This condition is primarily caused by a disruption in which Starling force?", "options": ["Increased capillary blood pressure", "Decreased plasma oncotic pressure", "Increased interstitial hydrostatic pressure", "Decreased interstitial oncotic pressure"], "correct": "B", "rationale": {"A": "A) Increased capillary blood pressure is a cause of edema but is not the primary mechanism in ascites due to liver failure.", "B": "The lecture identifies that the liver is responsible for synthesizing albumin, the primary protein contributing to plasma oncotic pressure. In liver failure, albumin production decreases, reducing the pulling force that keeps fluid in the capillaries and leading to fluid accumulation in spaces like the peritoneal cavity (ascites).", "C": "C) Interstitial hydrostatic pressure pushes fluid in, so an increase would oppose edema.", "D": "D) Interstitial oncotic pressure is typically near zero unless there is inflammation or vascular injury."}}, {"id": 106, "category": ["Week 1 Questions Only"], "stem": "A patient experiences a severe crushing injury to their lower extremities. Which electrolyte imbalance would be an immediate and critical concern due to massive cell lysis?", "options": ["Hypernatremia", "Hypocalcemia", "Hyperkalemia", "Hypomagnesemia"], "correct": "C", "rationale": {"A": "A, B, D) While other electrolytes are released, the most immediate and life-threatening imbalance from massive cell lysis is hyperkalemia.", "B": "A, B, D) While other electrolytes are released, the most immediate and life-threatening imbalance from massive cell lysis is hyperkalemia.", "C": "Potassium is the most abundant intracellular cation. The lecture explicitly states that cell lysis, which occurs in crushing injuries, releases large amounts of potassium into the ECF, causing acute hyperkalemia. This is a medical emergency due to its effects on the heart.", "D": "A, B, D) While other electrolytes are released, the most immediate and life-threatening imbalance from massive cell lysis is hyperkalemia."}}, {"id": 107, "category": ["Week 1 Questions Only"], "stem": "The body maintains the normal function and health of its cells primarily by:", "options": ["Directly regulating the composition of intracellular fluid", "Ensuring each cell has direct access to oxygen and nutrients from the environment", "Maintaining the stability and normalcy of the extracellular fluid", "Prioritizing the function of organ systems over individual cellular needs"], "correct": "C", "rationale": {"A": "A) The body cannot directly control ICF; it does so indirectly by controlling ECF.", "B": "B) Cells in a multicellular organism do not have direct access to the external environment.", "C": "The lecture emphasizes the concept that the body's systems work in concert to maintain the ECF. As long as the ECF is normal (in terms of oxygen, nutrients, pH, etc.), the cells bathed in it can function normally.", "D": "D) The normal function of organ systems is dependent on the health of its cells; they are interdependent."}}, {"id": 108, "category": ["Week 1 Questions Only"], "stem": "What is the primary difference between the prodromal period and the latent period of a disease?", "options": ["The latent period is when the disease is at its peak severity, while the prodromal period is the recovery phase.", "The latent period is a time of no signs or symptoms, while the prodromal period is when the first signs and symptoms appear.", "The prodromal period is the initial injury, while the latent period is the body's response.", "There is no difference; the terms are used interchangeably."], "correct": "B", "rationale": {"A": "A) The acute period is when severity peaks, not the latent period.", "B": "The lecture defines the latent period as the interval between initial injury and the first appearance of signs/symptoms. The prodromal period is defined as the first appearance of those signs and symptoms.", "C": "C) The initial injury is the etiology, not a period of the disease course.", "D": "D) The terms describe distinct, sequential phases of a disease."}}, {"id": 109, "category": ["Week 1 Questions Only"], "stem": "A patient in diabetic ketoacidosis (DKA) has a low blood pH. What effect does this acidosis have on serum potassium?", "options": ["It causes hypokalemia by shifting potassium into the cells.", "It has no effect on serum potassium levels.", "It causes hyperkalemia by shifting potassium out of the cells.", "It causes potassium loss through rapid breathing."], "correct": "C", "rationale": {"A": "A) Alkalosis, not acidosis, causes hypokalemia by shifting K+ into cells.", "B": "B) pH has a significant and predictable effect on potassium levels.", "C": "The lecture explains that in acidosis, there is an excess of hydrogen ions (H+) in the ECF. These H+ ions move into the cells to be buffered, and in exchange, potassium ions (K+) move out of the cells into the ECF, leading to hyperkalemia.", "D": "D) While rapid breathing (Kussmaul respirations) is a feature of DKA, it is a compensatory mechanism for the acidosis and not the cause of the potassium shift."}}, {"id": 110, "category": ["Week 1 Questions Only"], "stem": "A patient is given an intravenous fluid that is hypertonic. What is the expected effect on the patient's cells?", "options": ["Cells will swell as water moves into them", "Cells will shrink as water moves out of them", "Cells will lyse due to the rapid influx of solutes", "Cell volume will remain unchanged"], "correct": "B", "rationale": {"A": "A) Swelling would occur if the cell were placed in a hypotonic solution.", "B": "A hypertonic solution has a higher concentration of non-permeable solutes (a higher osmolarity) than the cell's interior. Due to osmosis, water will move from the area of lower solute concentration (inside the cell) to the area of higher solute concentration (outside the cell), causing the cell to shrink.", "C": "C) Lysis (bursting) is an extreme outcome of swelling in a hypotonic solution.", "D": "D) Cell volume will only remain unchanged in an isotonic solution."}}, {"id": 111, "category": ["Week 1 Questions Only"], "stem": "The majority of the body's total body water (TBW) is located in which compartment?", "options": ["Intracellular fluid (ICF)", "Plasma", "Interstitial fluid", "Transcellular fluid"], "correct": "A", "rationale": {"A": "The lecture slides and transcript state that ICF accounts for approximately 40% of body weight, while the entire ECF (interstitial fluid + plasma) accounts for about 20%. Therefore, the ICF is the largest fluid compartment.", "B": "B, C, D) Plasma (~5%), interstitial fluid (~15%), and transcellular fluid (a very small part of ECF) are all smaller compartments than the ICF.", "C": "B, C, D) Plasma (~5%), interstitial fluid (~15%), and transcellular fluid (a very small part of ECF) are all smaller compartments than the ICF.", "D": "B, C, D) Plasma (~5%), interstitial fluid (~15%), and transcellular fluid (a very small part of ECF) are all smaller compartments than the ICF."}}, {"id": 112, "category": ["Week 1 Questions Only"], "stem": "Which scenario is an example of an iatrogenic disease?", "options": ["A patient develops lung cancer after a lifetime of smoking.", "A patient develops acute kidney injury after receiving a nephrotoxic contrast dye for a cardiac catheterization.", "A patient develops an autoimmune disorder due to genetic predisposition.", "A patient develops influenza after being exposed to the virus at a crowded event."], "correct": "B", "rationale": {"A": "A) This is an extrinsic cause related to lifestyle/environment.", "B": "The lecture defines 'iatrogenic' as a condition inadvertently caused by medical care. The example given of contrast dye causing kidney injury perfectly matches this definition.", "C": "C) This is an intrinsic (immunologic) cause.", "D": "D) This is an extrinsic (infectious) cause."}}, {"id": 113, "category": ["Week 1 Questions Only"], "stem": "The constant activity of the Na+/K+ ATPase pump is critical for maintaining cell volume and function. What is the primary energy source for this pump?", "options": ["Glucose", "Calcium", "ATP", "Sodium gradient"], "correct": "C", "rationale": {"A": "A, B, D) While glucose is the ultimate source of energy to produce ATP, and ion gradients are important, the direct fuel for the pump is ATP itself.", "B": "A, B, D) While glucose is the ultimate source of energy to produce ATP, and ion gradients are important, the direct fuel for the pump is ATP itself.", "C": "The name of the pump, Na+/K+ ATPase, indicates its mechanism. It is an enzyme (an \"ase\") that hydrolyzes ATP (Adenosine Triphosphate) to release the energy needed to pump Na+ and K+ against their concentration gradients.", "D": "A, B, D) While glucose is the ultimate source of energy to produce ATP, and ion gradients are important, the direct fuel for the pump is ATP itself."}}, {"id": 114, "category": ["Week 1 Questions Only"], "stem": "Edema caused by acute inflammation is directly related to:", "options": ["Decreased capillary blood pressure, which allows fluid to pool", "Lymphatic obstruction caused by invading pathogens", "Increased capillary permeability, leading to increased interstitial oncotic pressure", "A decrease in interstitial hydrostatic pressure"], "correct": "C", "rationale": {"A": "A) Inflammation causes vasodilation, which would increase, not decrease, capillary blood pressure.", "B": "B, D) While related to fluid balance, these are not the direct mechanisms of inflammatory edema.", "C": "The lecture explains that during acute inflammation, capillaries become more permeable, allowing plasma proteins like albumin to leak into the interstitial space. These proteins exert an oncotic (pulling) pressure that draws fluid out of the capillaries, causing edema.", "D": "B, D) While related to fluid balance, these are not the direct mechanisms of inflammatory edema."}}, {"id": 115, "category": ["Week 1 Questions Only"], "stem": "Which statement accurately describes the electrolyte composition of ECF versus ICF?", "options": ["Sodium is high in the ICF; potassium is high in the ECF.", "Sodium and potassium are in equal concentrations in both compartments.", "Sodium is high in the ECF; potassium is high in the ICF.", "Both sodium and potassium are in low concentrations in the ECF."], "correct": "C", "rationale": {"A": "A, B, D) These statements incorrectly describe the distribution of these critical electrolytes.", "B": "A, B, D) These statements incorrectly describe the distribution of these critical electrolytes.", "C": "A key concept presented in a chart and in the discussion of the Na+/K+ pump is that the ECF has a high concentration of sodium (Na+) and low potassium (K+), while the ICF has a high concentration of potassium and low sodium.", "D": "A, B, D) These statements incorrectly describe the distribution of these critical electrolytes."}}, {"id": 116, "category": ["Week 1 Questions Only"], "stem": "A patient is diagnosed with the Syndrome of Inappropriate Antidiuretic Hormone (SIADH). What is the expected alteration in fluid and electrolyte balance?", "options": ["Hypertonic hypernatremia", "Isotonic volume depletion", "Hypotonic hyponatremia", "Isotonic volume excess"], "correct": "C", "rationale": {"A": "A) This would occur in a state of water deficit, the opposite of SIADH.", "B": "B, D) These are isotonic conditions, where water and electrolytes change proportionally. SIADH involves a disproportional retention of water.", "C": "In SIADH, there is excessive, inappropriate release of ADH. This causes the kidneys to retain too much water, independent of sodium. The excess water dilutes the ECF, leading to a hypotonic state and dilutional hyponatremia (low sodium).", "D": "B, D) These are isotonic conditions, where water and electrolytes change proportionally. SIADH involves a disproportional retention of water."}}, {"id": 117, "category": ["Week 1 Questions Only"], "stem": "In the process of differential diagnosis, what is the first step a healthcare provider takes after collecting all the clinical data?", "options": ["Select the single most likely diagnosis and begin treatment.", "Order follow-up exams to rule out the most severe possibilities.", "Create a long list of all possible diagnoses that could match any of the clues.", "Eliminate diagnoses that are incompatible with the patient's age and gender."], "correct": "C", "rationale": {"A": "A, B) These are later steps in the diagnostic process, after the initial list has been narrowed down.", "B": "A, B) These are later steps in the diagnostic process, after the initial list has been narrowed down.", "C": "The lecture describes the process of differential diagnosis as first making a \"long laundry list of possibilities\" and then systematically ruling out incompatible diagnoses based on the complete set of data.", "D": "D) Elimination is the second step, not the first."}}, {"id": 118, "category": ["Week 1 Questions Only"], "stem": "The regulation of fluid movement between the intravascular space and the interstitial space is a passive process governed by:", "options": ["The ADH-thirst system", "The Na+/K+ ATPase pump", "The renin-angiotensin-aldosterone system", "Starling forces"], "correct": "D", "rationale": {"A": "A, C) These are systemic hormonal systems that regulate total body water and sodium, which affects the Starling forces but are not the forces themselves.", "B": "B) This is a cellular pump that regulates ICF/ECF balance at the cell membrane.", "C": "A, C) These are systemic hormonal systems that regulate total body water and sodium, which affects the Starling forces but are not the forces themselves.", "D": "The lecture dedicates a section to explaining that capillary bulk flow, the movement of fluid between the intravascular and interstitial spaces, is governed by a set of passive pressures called Starling forces (capillary/interstitial hydrostatic and oncotic pressures)."}}, {"id": 119, "category": ["Week 1 Questions Only"], "stem": "A patient reports feeling nauseous and fatigued. These clinical manifestations are best described as:", "options": ["Signs", "Pathogenesis", "Etiologies", "Symptoms"], "correct": "D", "rationale": {"A": "A) Signs are objective and measurable (e.g., fever, rash).", "B": "B, C) Pathogenesis and etiology are concepts related to the disease process and cause, not the manifestations themselves.", "C": "B, C) Pathogenesis and etiology are concepts related to the disease process and cause, not the manifestations themselves.", "D": "The lecture defines symptoms as subjectively experienced clinical manifestations that must be reported by the patient. Nausea (a feeling of sickness) and fatigue (a feeling of tiredness) fit this definition perfectly."}}, {"id": 120, "category": ["Week 1 Questions Only"], "stem": "What is the role of aldosterone in the renin-angiotensin-aldosterone system?", "options": ["It acts as a potent vasoconstrictor to directly increase blood pressure.", "It stimulates the posterior pituitary to release antidiuretic hormone.", "It acts on the kidneys to increase the retention of sodium and water.", "It converts angiotensin I to angiotensin II in the lungs."], "correct": "C", "rationale": {"A": "A) Angiotensin II is the potent vasoconstrictor.", "B": "B) Angiotensin II stimulates the pituitary, not aldosterone.", "C": "The lecture diagram and explanation show that Angiotensin II stimulates the adrenal cortex to release aldosterone. Aldosterone's primary effect is on the kidneys, where it promotes the reabsorption of sodium, with water following, and the excretion of potassium.", "D": "D) Angiotensin-converting enzyme (ACE) performs this function."}}, {"id": 121, "category": ["Week 1 Questions Only"], "stem": "A patient is suffering from severe hemorrhage after a traumatic injury. This leads to what type of fluid alteration?", "options": ["Isotonic volume depletion", "Hypotonic alteration", "Hypertonic alteration", "Isotonic volume excess"], "correct": "A", "rationale": {"A": "Hemorrhage involves the loss of whole blood, which means a proportional loss of both water and electrolytes from the ECF. Since the concentration (tonicity) of the remaining fluid doesn't change, this is defined as isotonic volume depletion.", "B": "B, C) These involve a disproportional loss of water or solutes.", "C": "B, C) These involve a disproportional loss of water or solutes.", "D": "D) This is a volume gain, not a loss."}}, {"id": 122, "category": ["Week 1 Questions Only"], "stem": "Which of the following is considered an intrinsic cause of disease?", "options": ["Traumatic injury from a fall", "An autoimmune disorder like rheumatoid arthritis", "A bacterial infection", "Exposure to radiation"], "correct": "B", "rationale": {"A": "A, C, D) Trauma, bacterial infections, and radiation are all examples of extrinsic causes originating from outside the body.", "B": "The lecture categorizes intrinsic causes as those originating from within the body. Immunologic problems, such as autoimmune disorders where the body attacks itself, fall into this category.", "C": "A, C, D) Trauma, bacterial infections, and radiation are all examples of extrinsic causes originating from outside the body.", "D": "A, C, D) Trauma, bacterial infections, and radiation are all examples of extrinsic causes originating from outside the body."}}, {"id": 123, "category": ["Week 1 Questions Only"], "stem": "The term 'pathogenesis' refers to the:", "options": ["Specific cause of the initial injury or disease", "Observable consequences of a disease, such as a rash or fever", "Subjective feelings of illness reported by the patient", "Physiologic development of a disease and the mechanism of its progression"], "correct": "D", "rationale": {"A": "A) This is the definition of etiology.", "B": "B, C) These describe clinical manifestations (signs and symptoms).", "C": "B, C) These describe clinical manifestations (signs and symptoms).", "D": "The lecture defines pathogenesis as the physiologic development of a disease, describing the specific mechanism by which the original injury interacts with the body's processes to produce abnormal function."}}, {"id": 124, "category": ["Week 1 Questions Only"], "stem": "The body's pH and temperature are the most tightly regulated physiological parameters primarily because deviations can cause:", "options": ["A shift of potassium into cells", "Denaturation of proteins and enzymes", "An increase in blood glucose levels", "A decrease in total body water"], "correct": "B", "rationale": {"A": "A, C, D) While pH can affect potassium and other metabolic factors can change, the primary, all-encompassing reason for tight regulation is to protect the function of proteins.", "B": "The lecture states this is \"extremely important,\" explaining that nearly every enzyme and structural component in the body is a protein. Changes in pH or temperature can cause these proteins to denature (change shape), altering their function and devastating the body's chemical reactions.", "C": "A, C, D) While pH can affect potassium and other metabolic factors can change, the primary, all-encompassing reason for tight regulation is to protect the function of proteins.", "D": "A, C, D) While pH can affect potassium and other metabolic factors can change, the primary, all-encompassing reason for tight regulation is to protect the function of proteins."}}, {"id": 125, "category": ["Week 1 Questions Only"], "stem": "What force directly opposes capillary blood pressure, favoring the reabsorption of fluid into the capillary?", "options": ["Interstitial oncotic pressure", "Interstitial hydrostatic pressure", "Capillary oncotic pressure", "Both B and C"], "correct": "D", "rationale": {"A": "A) Interstitial oncotic pressure is a pulling force that also favors filtration.", "B": "B, C) Both are correct, so the best answer includes both.", "C": "B, C) Both are correct, so the best answer includes both.", "D": "Capillary blood pressure is a pushing force that favors filtration (fluid out). Capillary oncotic pressure (a pulling force) and interstitial hydrostatic pressure (a pushing force) both favor reabsorption (fluid in). Therefore, both directly oppose the action of capillary blood pressure."}}, {"id": 126, "category": ["Week 1 Questions Only"], "stem": "The ADH-thirst system is primarily triggered by the hypothalamus detecting a change in:", "options": ["Blood pressure", "Serum potassium levels", "ECF osmolarity", "Blood glucose levels"], "correct": "C", "rationale": {"A": "A, B) Blood pressure and potassium are primary triggers for the RAAS, not the ADH-thirst system.", "B": "A, B) Blood pressure and potassium are primary triggers for the RAAS, not the ADH-thirst system.", "C": "The lecture explains that osmoreceptors in the hypothalamus detect the concentration of solutes in the blood (osmolarity). An increase in osmolarity (as seen in dehydration) triggers thirst and ADH release. A decrease in osmolarity (as in overhydration) suppresses them.", "D": "D) High blood glucose can indirectly affect osmolarity but is not the primary regulated variable for this system."}}, {"id": 127, "category": ["Week 1 Questions Only"], "stem": "The movement of substances across the cell membrane against a concentration gradient is a hallmark of:", "options": ["Facilitated diffusion", "Osmosis", "Secondary active transport", "Simple diffusion"], "correct": "C", "rationale": {"A": "A, B, D) Diffusion and osmosis are forms of passive transport that move substances down their concentration gradient and do not require metabolic energy.", "B": "A, B, D) Diffusion and osmosis are forms of passive transport that move substances down their concentration gradient and do not require metabolic energy.", "C": "Active transport, by definition, moves substances against their concentration gradient and requires energy. Secondary active transport uses the energy stored in an electrochemical gradient (like the one created by the Na+/K+ pump) to move another substance against its gradient.", "D": "A, B, D) Diffusion and osmosis are forms of passive transport that move substances down their concentration gradient and do not require metabolic energy."}}, {"id": 128, "category": ["Week 1 Questions Only"], "stem": "Chronic injury to an organ, such as the pancreas, often leads to a disease state like type 1 diabetes through a process of:", "options": ["An acute inflammatory response that resolves quickly", "Morphological and functional changes that occur over time", "A rapid increase in cellular metabolism", "The immediate shutdown of all cellular transport"], "correct": "B", "rationale": {"A": "A, C, D) These describe acute processes, whereas the question specifies a chronic injury leading to a disease like type 1 diabetes.", "B": "The lecture emphasizes that most diseases discussed in the course involve a chronic injury that causes morphological adaptations (changes in cell/tissue structure) and subsequent functional changes, which together bring about the disease state.", "C": "A, C, D) These describe acute processes, whereas the question specifies a chronic injury leading to a disease like type 1 diabetes.", "D": "A, C, D) These describe acute processes, whereas the question specifies a chronic injury leading to a disease like type 1 diabetes."}}, {"id": 129, "category": ["Week 1 Questions Only"], "stem": "A laboratory report includes a reference range for a specific value. This is important for interpretation primarily because:", "options": ["All laboratories use the exact same testing methods and equipment.", "The \"normal\" range is the same for all individuals regardless of age or sex.", "Different testing methods used by different labs can yield slightly different numerical ranges.", "Reference ranges are only important for diagnosing infectious diseases."], "correct": "C", "rationale": {"A": "A) This is false; labs use various methods.", "B": "B) Normal ranges vary significantly with age, sex, and other factors.", "C": "The lecture identifies \"laboratory conditions\" as a source of variation, explaining that different tests used to assay a substance can result in different numerical ranges for what is considered \"normal.\" The lab provides a reference range for the specific test used.", "D": "D) Reference ranges are critical for interpreting all quantitative lab tests, not just those for infectious diseases."}}, {"id": 130, "category": ["Week 1 Questions Only"], "stem": "In a state of alkalosis (high blood pH), what shift in potassium is expected?", "options": ["Potassium moves out of cells, causing hyperkalemia", "Potassium moves into cells, causing hypokalemia", "Potassium shifts from the plasma into the interstitial fluid", "There is no significant shift in potassium"], "correct": "B", "rationale": {"A": "A) This is the effect of acidosis.", "B": "Alkalosis represents a deficit of H+ ions in the ECF. To buffer this change, H+ ions move out of the cells into the ECF. To maintain electrical neutrality, the cells pull K+ ions in from the ECF, leading to a decrease in serum potassium (hypokalemia).", "C": "C) The primary shift is between the ICF and ECF, not plasma and interstitial fluid (both are ECF).", "D": "D) pH has a very significant effect on potassium distribution."}}, {"id": 131, "category": ["Week 1 Questions Only"], "stem": "Which of the following best describes 'dilutional hyponatremia'?", "options": ["A true loss of total body sodium due to diuretic use", "A decrease in serum sodium concentration due to an excess of water", "An increase in serum sodium due to inadequate water intake", "A proportional loss of both sodium and water"], "correct": "B", "rationale": {"A": "A) This describes a true hyponatremia, but not specifically the 'dilutional' type.", "B": "The lecture explains dilutional hyponatremia as a condition where sodium isn't lost, but is diluted by excess water. The example given is extremely high blood glucose pulling fluid from the interstitial space into the bloodstream, diluting the existing sodium.", "C": "C) This describes hypernatremia.", "D": "D) This describes an isotonic change."}}, {"id": 132, "category": ["Week 1 Questions Only"], "stem": "Which plasma protein is the most significant contributor to capillary oncotic pressure?", "options": ["Globulins", "Fibrinogen", "Albumin", "Hemoglobin"], "correct": "C", "rationale": {"A": "A, B, D) While these are all proteins in the blood, albumin is present in the highest concentration and is the primary driver of oncotic pressure.", "B": "A, B, D) While these are all proteins in the blood, albumin is present in the highest concentration and is the primary driver of oncotic pressure.", "C": "The lecture explicitly states that albumin is the plasma protein that contributes the most to plasma oncotic pressure, describing it as a force that \"maintains plasma volume.\"", "D": "A, B, D) While these are all proteins in the blood, albumin is present in the highest concentration and is the primary driver of oncotic pressure."}}, {"id": 133, "category": ["Week 1 Questions Only"], "stem": "A patient with long-standing venous obstruction in their legs is at high risk for edema due to an increase in which Starling force?", "options": ["Capillary blood pressure", "Capillary oncotic pressure", "Interstitial oncotic pressure", "Lymphatic pressure"], "correct": "A", "rationale": {"A": "A venous obstruction prevents blood from efficiently leaving the capillary bed. This causes blood to \"back up,\" which increases the pressure within the capillaries (capillary hydrostatic/blood pressure). This increased pushing force pushes more fluid out into the interstitial space, causing edema.", "B": "B, C) A venous obstruction does not directly affect oncotic pressures.", "C": "B, C) A venous obstruction does not directly affect oncotic pressures.", "D": "D) Lymphatic pressure is related to fluid drainage, not the cause of the increased fluid filtration in this case."}}, {"id": 134, "category": ["Week 1 Questions Only"], "stem": "The body's response to an injury, such as the profound immune deficiency that develops after HIV infection, is often:", "options": ["Less damaging than the initial injury itself", "The critical factor that defines the disease state (e.g., AIDS)", "A static process that does not change over time", "Completely independent of the etiology of the injury"], "correct": "B", "rationale": {"A": "A) The lecture states the opposite can be true.", "B": "The lecture uses the HIV/AIDS example to stress that the body's response (profound immune deficiency) is what defines the disease of AIDS, and is often more harmful than the initial viral infection itself.", "C": "C) The lecture states that diseases and the body's response are dynamic, not static.", "D": "D) The response is intrinsically linked to the etiology."}}, {"id": 135, "category": ["Week 1 Questions Only"], "stem": "A urinalysis, blood count, and serology analysis are all examples of:", "options": ["Clinical methods for diagnosis", "Differential diagnoses", "The pathogenesis of a disease", "Laboratory methods for diagnosis"], "correct": "D", "rationale": {"A": "A) Clinical methods refer to the physical assessment and patient interview.", "B": "B) A differential diagnosis is the list of possible diseases, not the tests themselves.", "C": "C) Pathogenesis is the development of the disease.", "D": "The lecture lists these specific tests (urinalysis, blood counts, serology) under the heading \"Laboratory Methods\" as tools used to gather data for making a diagnosis."}}, {"id": 136, "category": ["Week 1 Questions Only"], "stem": "What is the rate-limiting enzyme in the production of angiotensin II?", "options": ["Aldosterone", "Angiotensin-converting enzyme (ACE)", "Renin", "Antidiuretic hormone (ADH)"], "correct": "C", "rationale": {"A": "A) Aldosterone is a hormone released at the end of the pathway.", "B": "B) ACE is an enzyme in the pathway, but its availability is not the rate-limiting step; the production of its substrate (Angiotensin I) by renin is.", "C": "The lecture describes renin as the \"rate-limiting enzyme\" in the production of angiotensin II because its release by the kidneys is the tightly controlled trigger for the entire cascade. Without renin, angiotensinogen cannot be converted to angiotensin I.", "D": "D) ADH is a separate hormone, though its release can be stimulated by Angiotensin II."}}, {"id": 137, "category": ["Week 1 Questions Only"], "stem": "A patient is taking a diuretic that causes them to waste sodium. This puts them at risk for which type of fluid and electrolyte alteration?", "options": ["Hypertonic alteration", "Isotonic volume excess", "Hypotonic alteration", "Isotonic volume depletion"], "correct": "C", "rationale": {"A": "A) A hypertonic state would be caused by losing more water than sodium.", "B": "B, D) Isotonic states involve a proportional loss or gain of water and sodium.", "C": "The lecture identifies diuretics as a cause of hyponatremia. Losing more sodium than water leads to a decrease in the solute concentration of the ECF, making it hypotonic (dilute) relative to the cells.", "D": "B, D) Isotonic states involve a proportional loss or gain of water and sodium."}}, {"id": 138, "category": ["Week 1 Questions Only"], "stem": "The term for a disease of unknown cause, such as primary hypertension, is:", "options": ["Idiopathic", "Iatrogenic", "Neoplastic", "Infectious"], "correct": "A", "rationale": {"A": "This is a direct recall question. The lecture defines 'idiopathic' as a disease of unknown cause and uses primary hypertension as the prime example.", "B": "B) Iatrogenic means caused by medical treatment.", "C": "C) Neoplastic refers to cancer.", "D": "D) Infectious refers to a cause by a pathogenic organism."}}, {"id": 139, "category": ["Week 1 Questions Only"], "stem": "An abnormal gait (pattern of walking) is considered a:", "options": ["Symptom, because the patient may or may not notice it", "Sign, because it can be objectively observed by a healthcare provider", "Pathogenesis, because it shows the development of the disease", "Etiology, because it is the cause of the underlying condition"], "correct": "B", "rationale": {"A": "A) A symptom is subjective. An abnormal gait is objective.", "B": "The lecture defines a sign as a clinical manifestation that can be objectively observed and measured. A person's walking pattern can be directly observed by a clinician, regardless of whether the patient reports it.", "C": "C, D) Pathogenesis and etiology refer to the disease mechanism and cause, not the observable manifestation.", "D": "C, D) Pathogenesis and etiology refer to the disease mechanism and cause, not the observable manifestation."}}, {"id": 140, "category": ["Week 1 Questions Only"], "stem": "In a healthy individual, the interstitial oncotic pressure is near zero. Under what condition does this force become a significant factor in fluid movement?", "options": ["Dehydration", "Hypertension", "Acute inflammation", "Isotonic volume excess"], "correct": "C", "rationale": {"A": "A, B, D) These conditions primarily affect other Starling forces (capillary blood pressure or total volume) but do not cause significant protein leakage in the absence of inflammation.", "B": "A, B, D) These conditions primarily affect other Starling forces (capillary blood pressure or total volume) but do not cause significant protein leakage in the absence of inflammation.", "C": "The lecture states that interstitial oncotic pressure becomes relevant when plasma proteins leak out of the capillary. This happens under conditions of increased capillary permeability, such as acute inflammation or vascular injury.", "D": "A, B, D) These conditions primarily affect other Starling forces (capillary blood pressure or total volume) but do not cause significant protein leakage in the absence of inflammation."}}, {"id": 141, "category": ["Week 1 Questions Only"], "stem": "What is the primary physiological reason for administering insulin to a patient with acute, severe hyperkalemia?", "options": ["To correct the underlying acidosis that is causing the potassium shift", "To increase the kidneys' ability to excrete excess potassium", "To rapidly shift potassium from the bloodstream into the cells", "To lower blood glucose, which is always elevated in hyperkalemia"], "correct": "C", "rationale": {"A": "A) While acidosis can cause hyperkalemia, insulin does not correct the pH.", "B": "B) Insulin's primary effect is on cellular uptake, not renal excretion.", "C": "The lecture explains the clinical application of insulin in hyperkalemia. It is given to drive potassium into the cells along with glucose, quickly lowering the dangerous serum potassium levels and preventing cardiac arrest.", "D": "D) Hyperkalemia can be caused by many things other than high blood glucose. If a patient is not hyperglycemic, they must be given glucose along with insulin to prevent dangerous hypoglycemia."}}, {"id": 142, "category": ["Week 1 Questions Only"], "stem": "Which of the following sources of variation would explain why a person living in Denver (high altitude) might have a different \"normal\" red blood cell count than a person in New York City?", "options": ["Genetics", "Age", "Situational differences", "Laboratory conditions"], "correct": "C", "rationale": {"A": "A, B, D) While these are all sources of variation, the specific example of altitude falls under situational differences.", "B": "A, B, D) While these are all sources of variation, the specific example of altitude falls under situational differences.", "C": "The lecture uses the exact example of living at a high altitude (like Denver) as a \"situational difference\" that affects a physiological norm. The body adapts to the lower oxygen environment by increasing red blood cell production.", "D": "A, B, D) While these are all sources of variation, the specific example of altitude falls under situational differences."}}, {"id": 143, "category": ["Week 1 Questions Only"], "stem": "The lymphatic system plays a crucial role in fluid balance by:", "options": ["Producing plasma proteins to maintain oncotic pressure", "Draining excess interstitial fluid and returning it to the bloodstream", "Regulating the ADH-thirst mechanism", "Directly controlling capillary blood pressure"], "correct": "B", "rationale": {"A": "A) The liver produces most plasma proteins.", "B": "The lecture explains that lymphatic vessels are located near capillary beds and function to collect excess interstitial fluid that is not reabsorbed. This fluid (lymph) is then returned to the venous circulation, preventing the accumulation of fluid in the tissues (edema).", "C": "C, D) These are functions of hormonal and nervous systems, not the lymphatic system.", "D": "C, D) These are functions of hormonal and nervous systems, not the lymphatic system."}}, {"id": 144, "category": ["Week 1 Questions Only"], "stem": "A patient experiences an initial injury but has a period of no signs or symptoms while the disease process develops. This period is known as the:", "options": ["Acute period", "Prodromal period", "Recovery period", "Latent period"], "correct": "D", "rationale": {"A": "A) The acute period is the peak of severity.", "B": "B) The prodromal period is when the first signs/symptoms appear.", "C": "C) The recovery period is when the problem is resolving.", "D": "This is a direct definition from the lecture. The latent period is the time between the initial injury and the first appearance of signs and symptoms, during which pathogenesis is occurring \"underneath.\""}}, {"id": 145, "category": ["Week 1 Questions Only"], "stem": "Which two pressures that determine capillary bulk flow are most often the deciding factors in whether filtration or reabsorption occurs?", "options": ["Interstitial hydrostatic pressure and interstitial oncotic pressure", "Capillary blood pressure and capillary oncotic pressure", "Interstitial oncotic pressure and capillary oncotic pressure", "Capillary blood pressure and interstitial hydrostatic pressure"], "correct": "B", "rationale": {"A": "A, C, D) These combinations include the interstitial forces, which are generally less influential than the two primary capillary pressures in a non-inflammatory state.", "B": "The lecture highlights these two opposing forces\u2014the pushing force of blood pressure favoring filtration and the pulling force of plasma proteins favoring reabsorption\u2014as the two most important and often deciding factors in the direction of fluid movement.", "C": "A, C, D) These combinations include the interstitial forces, which are generally less influential than the two primary capillary pressures in a non-inflammatory state.", "D": "A, C, D) These combinations include the interstitial forces, which are generally less influential than the two primary capillary pressures in a non-inflammatory state."}}, {"id": 146, "category": ["Week 1 Questions Only"], "stem": "Beta-adrenergic stimulation by catecholamines, such as epinephrine, tends to cause:", "options": ["Potassium to move out of cells", "Potassium to move into cells", "An increase in renal potassium excretion", "A decrease in renal potassium excretion"], "correct": "B", "rationale": {"A": "A) Alpha-adrenergic stimulation causes potassium to move out of cells.", "B": "The lecture slide and discussion explicitly state that beta-adrenergic stimulation (e.g., by epinephrine) is a factor that causes potassium to shift into cells.", "C": "C, D) This describes a renal effect, whereas the question asks about the effect of catecholamine stimulation, which primarily causes cellular shifts.", "D": "C, D) This describes a renal effect, whereas the question asks about the effect of catecholamine stimulation, which primarily causes cellular shifts."}}, {"id": 147, "category": ["Week 1 Questions Only"], "stem": "A patient who is starving and malnourished is at risk for edema primarily due to:", "options": ["An inability to synthesize albumin, leading to decreased plasma oncotic pressure", "An increase in capillary blood pressure from stress", "The release of inflammatory mediators that increase capillary permeability", "A blockage of the lymphatic system from muscle wasting"], "correct": "A", "rationale": {"A": "The lecture explains that starvation/malnourishment prevents the liver from getting the necessary amino acids to produce albumin. The resulting hypoalbuminemia leads to decreased plasma oncotic pressure, reduced fluid reabsorption into capillaries, and thus edema.", "B": "B, C, D) While these can cause edema, the primary mechanism directly linked to starvation in the lecture is the failure of albumin synthesis.", "C": "B, C, D) While these can cause edema, the primary mechanism directly linked to starvation in the lecture is the failure of albumin synthesis.", "D": "B, C, D) While these can cause edema, the primary mechanism directly linked to starvation in the lecture is the failure of albumin synthesis."}}, {"id": 148, "category": ["Week 1 Questions Only"], "stem": "Pain is a unique clinical manifestation because it is:", "options": ["Only a sign that can be objectively measured", "A subjectively experienced symptom that can also have observable signs", "Neither a sign nor a symptom", "Always indicative of an infectious etiology"], "correct": "B", "rationale": {"A": "A) Pain itself cannot be objectively measured; its effects can. It is primarily a symptom.", "B": "The lecture identifies pain as a complex manifestation. While it is primarily a symptom (subjectively reported), it can also have observable signs, such as a grimace, clenched posture, or changes in vital signs, which a clinician can observe.", "C": "C) It is a classic example of both.", "D": "D) Pain can have countless etiologies, not just infectious ones."}}, {"id": 149, "category": ["Week 1 Questions Only"], "stem": "The term 'morphological adaptation' in the context of chronic disease refers to:", "options": ["The genetic mutation that initially causes the disease", "The body's successful attempt to completely heal the injury", "Changes in the size, shape, or structure of cells in response to chronic injury", "The normal, unchanged function of healthy cells"], "correct": "C", "rationale": {"A": "A) This is the etiology, not the adaptation.", "B": "B) This describes resolution, not the development of a chronic disease state.", "C": "The lecture identifies morphological changes and adaptations as a key step in pathogenesis, occurring in response to a chronic injury. These structural changes then lead to functional changes and the clinical manifestations of the disease.", "D": "D) This is the opposite of what happens; function becomes abnormal."}}, {"id": 150, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "According to the homeostatic feedback system model, what is the primary role of the effector?", "options": ["To monitor the controlled variable and detect deviations from the set point.", "To compare the sensor's information to the established set point.", "To bring about a compensatory response that restores the controlled variable.", "To provide predictive information about future changes in the core temperature."], "correct": "A", "rationale": {"A": "The effector (e.g., a muscle or gland) is the component of a feedback system that carries out the command from the control center to produce a response that corrects the deviation and brings the variable back to the set point.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 151, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Which characteristic distinguishes the nervous system from the endocrine system?", "options": ["The nervous system uses chemical messengers, while the endocrine system does not.", "The nervous system produces a slow but sustained response.", "The nervous system is a \"hardwired\" system with direct physical connections.", "The nervous system\u2019s chemical messengers travel long distances through the bloodstream."], "correct": "C", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "The nervous system relies on neurons that are physically connected to one another at synapses, creating a direct, wired network. The endocrine system is \"wireless,\" using hormones that travel through the blood.", "D": "This option is incorrect."}}, {"id": 152, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A signal is being carried from the spinal cord to the smooth muscle in the bladder. This signal is part of which division of the nervous system?", "options": ["Afferent division", "Somatic nervous system", "Autonomic nervous system", "Central nervous system"], "correct": "A", "rationale": {"A": "The autonomic nervous system is the efferent division that controls involuntary visceral functions, including the smooth muscle of the bladder.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 153, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "Myelination in the central nervous system is provided by which type of cell?", "options": ["Schwann cells", "Oligodendrocytes", "Interneurons", "Astrocytes"], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "Oligodendrocytes are the glial cells responsible for producing the myelin sheath around axons within the CNS (brain and spinal cord).", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 154, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the primary function of myelination?", "options": ["To provide nutrients to the axon.", "To slow down the action potential for more precise control.", "To store neurotransmitters for release at the axon terminal.", "To speed up the rate at which an electrical impulse travels down the axon."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "Myelin acts as an insulator, allowing the action potential to \"jump\" between the nodes of Ranvier (saltatory conduction), which dramatically increases the velocity of the signal."}}, {"id": 155, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "A neuron receives sensory information from the skin and transmits it toward the spinal cord. Its cell body is located in the peripheral nervous system. This neuron is best classified as:", "options": ["An efferent neuron", "An interneuron", "An afferent neuron", "A motor neuron"], "correct": "A", "rationale": {"A": "Afferent (sensory) neurons carry information from the periphery (like the skin) toward the CNS. Their cell bodies are typically located just outside the spinal cord in the PNS.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 156, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "What is the primary factor that establishes the resting membrane potential of a neuron?", "options": ["The equal distribution of all ions across the cell membrane.", "The high permeability of the membrane to sodium ions at rest.", "The action of voltage-gated channels being constantly open.", "The high permeability of the membrane to potassium ions through leak channels."], "correct": "D", "rationale": {"A": "This option is incorrect.", "B": "This option is incorrect.", "C": "This option is incorrect.", "D": "At rest, the neuronal membrane is far more permeable to K+ than to other ions due to the presence of potassium leak channels. The outward movement of positive K+ ions down their concentration gradient is the primary driver in establishing the negative resting membrane potential."}}, {"id": 157, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "The Nernst potential (equilibrium potential) for a specific ion is the membrane potential at which:", "options": ["The concentration gradient for that ion is zero.", "The electrostatic gradient is precisely balanced by the concentration gradient.", "The sodium-potassium pump is inactivated.", "All leak channels for that ion are closed."], "correct": "B", "rationale": {"A": "This option is incorrect.", "B": "The equilibrium potential is the point of balance where the chemical force (concentration gradient) pushing an ion out of the cell is equal and opposite to the electrical force (electrostatic gradient) pulling it back in, resulting in no net movement of the ion.", "C": "This option is incorrect.", "D": "This option is incorrect."}}, {"id": 158, "category": ["Week 2 NURS7001 Practice Exam Questions"], "stem": "An excitatory postsynaptic potential (EPSP) makes a neuron:", "options": ["More negative, moving it further from the threshold.", "Less negative, moving it closer to the threshold.", "Hyperpolarized, initiating an actio
